  description: >-
    <p>You can never be too prepared for the worst outcomes. You’re never
    without a few extra magazines and a back-up sidearm.</p><p>You may carry up
    to 5 reloads as standard, rather than 3; this may be increased by equipment
    as normal. In addition, you may spend a Wrath point to declare that you’ve
    still got a back-up gun, which you immediately produce from its hiding spot.
    This is an Autoch-pattern Bolt Pistol with a single reload, and it’s better
    not to ask where you were keeping it.</p>
