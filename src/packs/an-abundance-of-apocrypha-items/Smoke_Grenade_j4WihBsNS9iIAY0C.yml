  description: >-
    <p><span class="fontstyle0">Smoke grenades are not deadly; rather, they are
    canisters of chemicals which produce plumes of thick smoke which can be used
    to obscure line of sight or signal to distant allies. Most forms of smoke
    grenade contain nano-chaff particles which interfere with Preysense,
    thermoptics, and other forms of seeing through concealment, making them
    effective even against foes who might ignore ordinary
    smoke.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Smoke Grenades do not inflict damage. Rather, attempts to
    see, or make ranged attacks, through the smoke suffer +4 DN.</span> <br
