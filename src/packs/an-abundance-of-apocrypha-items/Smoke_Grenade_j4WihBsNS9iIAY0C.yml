      custom: true
      display: Gas
      description: >-
        A Gas weapon deploys clouds of aerosolised or gaseous chemical agents.
        To use a Gas weapon, make a Ballistic Skill test to target a specific
        location; if it hits, that is where the gas emerges, filling the blast
        area and affecting creatures within. The gas dissipates over time,
        reducing the Blast Rating by 2 at the end of each round. Strong winds
        may make the gas dissipate more quickly, at GM’s discretion. Characters
        wearing a rebreather or a void suit, or armour which includes such
        features, automatically succeed at any tests required to resist Gas
        weapon’s effects, as are creatures which do not need to breathe, such as
        unliving automata, NECRONS, or DAEMONS, or creatures impervious to
        chemical weapons like TYRANIDS.
