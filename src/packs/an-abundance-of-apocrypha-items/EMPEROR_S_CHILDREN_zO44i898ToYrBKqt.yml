system:
  description: >-
    <p>One of the nine Legions that betrayed the Emperor during the Horus
    Heresy, the Emperor&rsquo;s Children were once a shining example of what the
    Legiones Astartes could be. Driven to the pursuit of perfection in all of
    their endeavours, the Emperor&rsquo;s Children pushed themselves to the very
    limits of their abilities in the performance of their duties. During and
    after the Heresy, the Emperor&rsquo;s Children and their Primarch became
    creatures of excess and sensation, twisting their pursuit of perfection into
    a desire to experience ever-greater sensations, and no debauchery is beneath
    their appetites.</p>

    <p>Characters with the @Item[zO44i898ToYrBKqt]{EMPEROR'S CHILDREN} keyword
    must take @Item[SQEgHsRqEIlQqU6b]{SLAANESH} as their
    @Item[TXRdb9GJ55fjSODX]{[MARK OF CHAOS]} keyword.</p>

    <h5>In Pursuit of Perfection</h5>

    <p>Each Emperor&rsquo;s Children Space Marine seeks to perfect a single
    aspect of the arts of warfare. Select one of the following skills:
    Awareness, Ballistic Skill, Leadership, Pilot, Weapon Skill. You gain +Rank
    dice as a bonus to all uses of that skill.</p>

    <h5>Fear of Imperfection (Tradition)</h5>

    <p>The Emperor&rsquo;s Children cannot abide the imperfect and fear the
    notion that a flaw may mean perfection is unattainable. Whenever you suffer
    a complication on the skill chosen for Pursuit of Perfection, above, the GM
    gains 1 Ruin, in addition to any other results.</p>
