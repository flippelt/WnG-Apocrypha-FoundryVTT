  description: >-
    <p><span class="fontstyle0">These bionik legs conceal a mechanism of true
    Orky kunnin’. On command, the legs can extend a considerable distance,
    allowing their new owner to stride over tall obstacles or elevate himself to
    see over intervening terrain.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">This is a normal pair of Augmetic Legs, granting you +2
    Speed and +2m on any jump you perform. In addition, as a simple action, you
    may extend or retract the legs. When extended, the legs allow you to step
    over obstacles and gaps up to 2m tall or wide as part of your movement. In
    addition, when extended, your height is increased by 2m, which may allow you
    to see over tall obstacles (but may leave you exposed in turn).</span> <br
