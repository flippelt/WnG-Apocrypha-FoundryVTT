  description: >-
    <p>Sentient electricity crackles amid the brooding skies above as you call
    forth the elements to smite your foes. At your command, lightning arcs into
    the ranks of the enemy, leaving a trail of blackened corpses in its wake.
    The you target the nearest enemy within range with a psychic ranged attack,
    inflicting 1d3 Mortal Wounds. If the target is reduced to 0 Wounds by this,
    then the nearest enemy within 35m to the previous target also suffers 1d3
    Mortal Wounds. If they in turn are reduced to 0 Wounds, then the next
    nearest enemy within 35m to them is affected, and so on until an enemy
    suffers Mortal Wounds from this power but is not reduced to 0 Wounds or
    there are no enemies remaining within range.</p>
