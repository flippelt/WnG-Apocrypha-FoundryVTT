system:
  description: >-
    <p>Steely minded tenacity and the refusal to retreat are more than just
    character traits of those who serve Graia. Indeed, such qualities are
    hardwired into all who bear the forge world’s symbol.</p><p><strong>REFUSAL
    TO YIELD:</strong> When you make a Test while Dying, you heal 1 Wound for
    each Wrath Critical you roll. When you make a Test while under the effects
    of Fear, Terror or Pinning, a Wrath Critical causes you to recover from that
    condition immediately. However, you must spend a point of Glory to Fall
    Back.</p>
