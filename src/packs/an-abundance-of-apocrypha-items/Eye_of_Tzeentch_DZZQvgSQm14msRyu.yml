  description: >-
    <p><span class="fontstyle0">You bear a third (or subsequent) eye on your
    body or within your wargear. This eye sees glimpses of the future, allowing
    you to adjust your actions before your fate comes to
    pass.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">Each turn during combat, you may re-roll a
    number of d6 equal to your Rank. You may use these all at once or spread
    them across multiple rolls. Outside of combat, you may reroll Rank dice on
    any test. You also gain +2 bonus dice on all Psychic Mastery tests to use
    Divination psychic powers.</span> <br style=" font-style: normal;
