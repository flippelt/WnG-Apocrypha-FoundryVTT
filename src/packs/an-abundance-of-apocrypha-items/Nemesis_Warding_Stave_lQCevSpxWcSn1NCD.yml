system:
  quantity: 1
  rarity: very-rare
  description: >-
    <p>Unlike most of the Nemesis Force Weapons used by the Grey Knights, the
    Nemesis Warding Stave has abilities used in defensive situations. The
    wielder of the stave can channel his psychic might into the haft to activate
    the refractor fields within. The refractor fields, once activated, then
    project a force field around the wielder, softening any blows and thus
    increasing the chance for retaliation.</p>

    <p><strong>Special:</strong> Against melee attacks, a Nemesis Warding Stave
    also counts as a shield, providing an Armour Rating of 2, with the Force
    Shield and Shield traits.</p>
