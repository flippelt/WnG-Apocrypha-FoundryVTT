  description: >-
    <p>You snap open your Warp eye and trace the vital lines that bind a
    creature’s animating force to its mortal shell. By striking these places
    with utmost precision, you may inflict harm on your target’s very essence,
    and defeat foes that might otherwise seem impervious to harm. Select a
    single enemy you can see within range. If successful, until the end of your
    next turn, the next attack you make against that target inflicts an
    automatic Critical Hit.</p>
