  requirements: Leadership 2+
  description: >-
    <p>You’re accompanied by a loyal companion, a subordinate who will support
    you and follow your</p><p>direction.</p><p>Your companion is a single Troop
    level Threat, as described in Chapter 14 of the Wrath & Glory
    Core</p><p>Rulebook. You may use the stats presented in the core rulebook or
    another bestiary, or use the following</p><p>rules:</p><ul><li><p>Companion
    Attributes are equal to 1 + Double Rank.</p></li><li><p>Companion Skills are
    equal to 1 + Double Rank.</p></li><li><p>A companion’s Attributes and Skills
    cannot be higher than your own.</p><p></p></li></ul><p>Whenever you are hit
    by any form of attack, your companion may make a DN 5 Initiative Test as a
    Reflexive Action. If they succeed, the attack hits the companion instead of
    hitting you.</p><p>Slain companions may be replaced for free with a new one
    the next time you visit a major encampment or city.</p><p>Your companion may
    be an Elite Threat rather than a Troop Threat, but the cost of this Talent
    increases to</p><p>20xp.</p>
