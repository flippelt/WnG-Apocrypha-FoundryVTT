  description: >-
    <p>You share your warp-sight with your brethren, causing their eyes to glow
    with an ethereal light. So empowered, no foe can escape their omniscient
    gaze: the souls of their targets flare like beacons in the dark. If
    successful, select a number of allies within range equal to your Willpower.
    While this power remains, the affected allies may re-roll any failures on
    their ranged attacks and ignore any Defence bonuses from cover.</p>
