  description: >-
    <p>So long as you are able to Fly, you may Fall Back as a Simple action,
    rather than a Combat Action. In addition, when you take the Full Defence
    action, you immediately move twice your Flying Speed (instead of halving
    your Speed) away from the enemy and add +Rank bonus dice to the Initiative
    test to increase your Defence. Naturally, these abilities require that you
    be able to fly, and have room to do so.</p>
