  description: >-
    <p><span class="fontstyle0">A tradition said to date back to the Great
    Crusades, many in the Imperium maintain the practice of swearing an oath to
    the objectives of their mission. Such oaths are recorded upon parchment
    scrolls and affixed to armour, and they serve to focus the mind of the
    wearer upon their duty. They are sometimes mistaken for purity seals, a
    similar tradition that dates back as far.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">After a Respite, you may swear an Oath of Moment,
    pledging yourself to the completion of a specific objective. If you complete
    this objective, you gain 1 Wrath point. If you fail in your objective, the
    GM gains 1 Ruin. You may only have one Oath of Moment at a time.</span> <br
