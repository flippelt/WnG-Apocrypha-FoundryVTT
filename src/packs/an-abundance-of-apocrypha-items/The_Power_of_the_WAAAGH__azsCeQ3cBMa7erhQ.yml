  description: >-
    <p>You are a Psyker; you know the Smite psychic power. You know the WAAAGH
    discipline, and one power from that Discipline. When using psychic powers,
    you do not choose a Power Level; rather, you gain one additional Wrath die
    for every five Orks within 20 metres of you. You must roll these Wrath dice.
    Each 1 rolled on a Wrath die when using a Psychic Power inflicts one Mortal
    Wound on you instead of a roll on the Perils of the Warp table, and if you
    exceed your Max Wounds from this, you explode, dying instantly and
    inflicting 1d3+Tier Mortal Wounds on all Orks within 20 metres.</p>
