  description: >-
    <p><span class="fontstyle0">When this casket is opened and the activation
    words spoken, invisible spirits fly outwards towards the bearer’s prey.
    Before long, the Haemonculus’ foes find themselves covered in dozens of
    circular bites that manifest in flesh and armour alike. If enough of the
    bearer’s ethereal imps find their mark, they will strip their prey’s head
    clean of flesh, pull the skull free from the spine, and carry their grisly
    trophy back to their Haemonculus master whilst the brain inside writhes in
    abject horror.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Once a Casket of Flensing has been used, it cannot be
    used again until after your next Respite.</span> <br style=" font-style:
