  rarity: unique
  description: >-
    <p><span class="fontstyle0">A Ghosthelm is an Aeldari device worn by
    Asuryani Farseers. This helmet, fashioned in the typical Asuryani style,
    incorporates highly intricate, psychic circuitry crafted from crystal that
    can mask the presence of the wearer's soul in the
    Immaterium.</span></p><p></p><p><span class="fontstyle0">This is a crucial
    protection for potent psykers like the Aeldari, whose souls shine like
    blazing beacons in the Warp, drawing the attention of daemons and other
    hostile Warp entities.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Any </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">DAEMON </span><span class="fontstyle0">or other
    warp entity attempting to perceive, attack, or otherwise interact with a
    Farseer wearing a Ghosthelm suffers a +2DN penalty to any tests they
    attempt. In addition, the Farseer no longer rolls on the Perils of the Warp
    table; instead, they suffer [[/r 1d3]] Shock, +1 for each Wrath Complication
    after the first, when they suffer Wrath Complications when using a Psychic
    Power.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
