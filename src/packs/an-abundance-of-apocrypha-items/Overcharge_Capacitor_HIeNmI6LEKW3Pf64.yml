system:
  description: >-
    <p><span class="fontstyle0">This modification to a las weapon increases the
    energy of each shot, though at the cost of reduced reliability and a lowered
    refire rate. While sanctioned patterns of high output lasgun exist, most
    instances of overcharged las weapon are illegal modifications, which the
    Adeptus Mechanicus does not look kindly upon.</span></p><p></p><p><span
    class="fontstyle0">This modification may be applied to any
    <strong>las</strong> weapon which lacks the <strong>Heavy</strong>
    trait.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">+2 ED, weapon loses the Reliable trait and
    reduces Salvo by 1.</span> <br style=" font-style: normal; font-variant:
    normal; font-weight: normal; letter-spacing: normal; line-height: normal;
