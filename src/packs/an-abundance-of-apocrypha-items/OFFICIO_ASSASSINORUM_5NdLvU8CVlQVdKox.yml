system:
  description: >-
    <p><span class="fontstyle0">The extensive, even brutal regimen of training,
    surgery, chem-enhancement, and other arcane processes turns a human being
    into a living weapon of incomparable prowess. All </span><span
    class="fontstyle2">OFFICIO ASSASSINORUM </span><span
    class="fontstyle0">characters receive the Assassinorum Conditioning rule,
    below:</span></p><p></p><p><span class="fontstyle0">You add +Rank ED to all
    damage rolls, and you add +Double Rank to the damage value of your Unarmed
    Strikes. In addition, so long as you are not immobilised or Restrained, you
    may use Agility instead of Toughness when you roll Determination, and you
    may roll Determination against Mortal Wounds.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
