  rarity: uncommon
  description: >-
    <p><span class="fontstyle0">This device interfaces with the neural augmetics
    of the user, allowing them to generate specialised stimulants that banish
    fatigue, enhance muscle performance, and dull
    pain.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">You may activate or deactivate the
    Cyberstimms as a simple action, though they will immediately deactivate when
    you take a Respite or Regroup. While active, you add +Rank to your Speed
    when you Run or Charge, you increase your Determination by +Rank, and you
    recover [[/r 1d3]] Shock at the start of each turn. However, while they are
    active, you halve your Passive Awareness (round up) and add +2 DN to all
    Intellect and Fellowship based tests.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
