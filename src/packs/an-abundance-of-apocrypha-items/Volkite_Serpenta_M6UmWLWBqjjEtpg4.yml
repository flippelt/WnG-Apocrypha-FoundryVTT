    technology is pre-Imperial in origin and dates back to the Dark Age of
    Technology or the Age of Strife. These weapons possessed considerable
    killing power, surpassing most other armaments of their
    size.</span></p><p></p><p><span class="fontstyle0">The pistol variant of a
