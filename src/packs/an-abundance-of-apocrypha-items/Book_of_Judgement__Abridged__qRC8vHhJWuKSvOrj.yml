  description: >-
    <p><span class="fontstyle0">The Book of Judgement is the legal code of the
    Imperium, enforced by the Adeptus Arbites. It has been painstakingly
    collected over centuries and has long ago spread beyond the confines of a
    single literal volume as it embodies every decree ever passed by the High
    Lords of Terra. Its most ancient decrees are written upon parchments of
    human skin, inscribed in unknown tongues by nameless functionaries of a
    forgotten age.</span></p><p></p><p><span class="fontstyle0">Individual
    Arbitrators routinely carry around concise, abridged volumes. These are not
    binding legal texts, but serve as a symbol of the Arbitrator’s duty, and it
    is common to read passages from it during an arrest, interrogation, or when
    passing judgement.</span> <br style=" font-style: normal; font-variant:
    normal; font-weight: normal; letter-spacing: normal; line-height: normal;
    orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform:
    none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
