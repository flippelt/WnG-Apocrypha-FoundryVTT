system:
  description: >-
    <p>The Asuryani craftworld of Saim-Hann was one of the first craftworlds to
    abandon what became the Crone Worlds as the Fall of the Aeldari approached,
    heeding their Farseers' warnings. They are fierce warriors, who place upon
    honour a higher value than their sophisticated kin. They are hot-blooded,
    quick to battle, eager for satisfaction for perceived slights and hungry for
    the glory of victory.</p><p><strong>FURY OF THE WILD HUNT:</strong> You
    increase your Speed by +Rank when you Sprint or Charge, or when mounted on
    an AELDARI vehicle with the Hover trait.</p>
