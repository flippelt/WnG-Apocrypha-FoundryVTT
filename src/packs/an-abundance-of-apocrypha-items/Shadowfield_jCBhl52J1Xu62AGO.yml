  description: >-
    <p><span class="fontstyle0">The most powerful Dark Eldar often wreath
    themselves in a miasma of protective gloom. This is not merely a form of
    concealment, however: advanced force field generation is intermingled with
    the deceptive darkness. Few attacks can effectively strike the wearer of a
    Shadowfield, and those few that do seldom strike true. However, they are not
    infallible, and once they have failed, they leave their wearer
    defenceless.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">*8, Power Field</span></p><p></p><p><span
    class="fontstyle2"><strong>Near-Perfect Defence</strong>: </span><span
    class="fontstyle0">The wearer of a functioning Shadowfield may roll
    Determination without suffering Shock and rolls 9d6 when they roll
    Determination.</span></p><p></p><p><span
    class="fontstyle2"><strong>Overload</strong>: </span><span
    class="fontstyle0">If the wearer of a Shadowfield takes any damage, the
    field overloads and will provide no benefit until after the next
    Regroup.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
