  description: >-
    <p>As a Free Action at the start of combat, you may take on an indistinct,
    shimmering form, and cannot be seen or targeted by enemies or allies; you
    cannot take any actions other than movement in this form. At the start of
    any of your turns, you may reveal yourself, and you add +Rank bonus dice to
    any melee attack you make if you charge on the turn you reveal
    yourself.</p><p></p><p><strong>The Path of Damnation</strong>: Other Aeldari
    shun you, and you add +6 to the DN of all Interaction tests with other
    Aeldari outside of ritual circumstances or performances. All Aeldari – even
    allies – must pass a Fear test (DN 3) when they first meet you. However, you
    automatically succeed at all Conviction and Resolve tests.</p>
