  description: >-
    <p><span class="fontstyle0">This device, an offshoot of the holographic
    camouflage employed by Stealth Battlesuits, has been developed to serve the
    needs of the Water Caste, and can be used in a variety of
    ways.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">You may project a holographic decoy to any
    location you can see; the hologram immediately vanishes if line of sight to
    the projector is broken. It can take any appearance the user knows. While
    active, it will carry out simple pre-chosen actions—walking forwards,
    playing pre-recorded speech. The hologram has a Defence of 1 and is
    disrupted if it takes any damage. The user may use a Combat Action to give
    the hologram different instructions or control it directly.</span> <br
