  description: >-
    <p><span class="fontstyle0">The Harlequins are known to use carefully
    cultivated hallucinogenic gases alongside holographic lightshows and psychic
    manipulation in their performances. This extends to warfare as well as the
    stage, where these grenades release hissing clouds of mind-altering gases
    and glittering bursts of kaleidoscopic light, spreading dread and
    confusion.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Any creature caught in the blast of a Hallucinogen
    Grenade must pass a </span><span class="fontstyle3">Terror </span><span
    class="fontstyle0">test (TN 5). Further, if a creature suffers a
    complication on this test, then they also suffer 1d3 mortal wounds.</span>
