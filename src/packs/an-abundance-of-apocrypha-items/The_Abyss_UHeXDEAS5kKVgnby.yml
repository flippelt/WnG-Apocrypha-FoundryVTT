  description: >-
    <p>A shadowy whirlpool opens in the enemy’s midst, snatching away
    unfortunate warriors as it gathers terrifying momentum. Select a single
    point you can see within range; the power affects all enemies within 3m of
    that point. Roll a d6 for each enemy affected; for each Icon rolled, that
    enemy suffers 1d3 Mortal Wounds. Those who are slain vanish into darkness.
    Those in the area who suffer wounds but are not slain are Restrained. Those
    who suffered no wounds must pass a DN 3 Fear test, adding +1 to the DN for
    each creature they have seen slain. At the start of each of your subsequent
    turns, while this power is sustained, add +1 metre to the radius of the
    effect. You suffer 1 Shock each turn you sustain this power.</p>
