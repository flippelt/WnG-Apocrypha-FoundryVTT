  description: >-
    <p>While many Navigators simply focus on wreaking as much destruction as
    possible by revealing the Warp to their foes, some Navigators prefer to act
    with more subtlety, training themselves to cast projections of the true,
    hellish face of the Warp. Select an enemy you can see, and who can see you,
    within range. This is a Gaze Power. If the power is successful, the target
    immediately suffers 1d3+2 Shock and the Terror condition. After this power
    is used, you suffer 1d3+2 Shock.</p>
