  description: >-
    <p><span class="fontstyle0">Runes of Warding are special items used by Eldar
    Farseers. These tiny wraithbone runes allow the Farseer to divine when an
    enemy psyker is attempting to use his powers and then produce psychic
    interference strong enough to hinder them.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">As a Reflexive Action, when an enemy psyker attempts to
    use a psychic power within 18m, you may increase the DN of their Psychic
    Mastery test by +Double Rank.</span> <br style=" font-style: normal;
