  description: >-
    <p>A basic form of telekinesis, you can use your will to move inanimate
    objects around. You may lift and move any object you can see within range
    which weighs no more than your Willpower x5 kg. Lifted objects may be moved
    anywhere within range, but you cannot move an object fast enough to make an
    attack. Any objects still suspended when the power ends drop to the
    ground.</p>
