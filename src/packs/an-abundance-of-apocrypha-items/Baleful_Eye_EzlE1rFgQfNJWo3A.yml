  description: >-
    <p><span class="fontstyle0">A baleful eye is a legendary archaeotech bionic
    eye that incorporates a tiny las weapon, which sacrifices some of the normal
    abilities of a cybernetic vision implant for this device to be included.
    Each baleful eye has been passed from recipient to recipient across
    centuries or millennia, reclaimed by the Machine Cult whenever its owner
    dies. As might be imagined, it is very intimidating when used as a part of
    negotiations with primitive societies.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A character with a Baleful Eye is considered to have a
    Hot-Shot Laspistol within the eye. The weapon runs from an internal power
    source, and never runs out of ammunition, but this also means that ammo may
    not be spent on the weapon’s attacks.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
