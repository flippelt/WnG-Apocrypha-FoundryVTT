system:
  journal: ''
  backgrounds:
    origin:
      - name: Progena
        description: >-
          Your parents were stalwart servants of the Throne, and after their
          deaths, you were raised by the Schola Progenium, who identified your
          talents and groomed you to join the Navy.
        effect: Paw0OqcDTEcHXdGK
      - name: Prestige
        description: >-
          You’re the scion of a wealthy and powerful family, possibly nobility
          from your world, sent to one of the prestigious Naval Academies to
          attain a commission.
        effect: DPwmJZ493L31IXUo
      - name: Pressgang
        description: >-
          You were rounded up and dragged onto a ship to toil within its depths.
          You took every opportunity to rise above such ignoble beginnings,
          however.
        effect: prLCZw2QlQgvxIiR
    accomplishment:
      - name: Efficiency
        description: >-
          Your unit, work-gang, squadron, or department aboard ship have been
          commended for their performance during a crucial battle.
        effect: PSsbfIYXFoJQz7mJ
      - name: Elevation
        description: >-
          Whether through survival or success, you find yourself advancing up
          the rates or ranks of the Navy.
        effect: DPwmJZ493L31IXUo
      - name: Endurance
        description: >-
          After a hard-fought battle, you pressed on and did your duty when all
          you wanted to do was give in.
        effect: RfjaXD9aPKn4Kwcw
    goal:
      - name: Command
        description: >-
          You aspire to lead your own unit, squadron, or starship, or maybe even
          loftier levels of authority beyond that.
        effect: DPwmJZ493L31IXUo
      - name: Crusade
        description: >-
          You seek to lay low the enemies of the Imperium, cleaning the stars
          and skies of their vile presence.
        effect: prLCZw2QlQgvxIiR
      - name: Certainty
        description: >-
          You are stalwart in your faith in the God-Emperor, and seek only to
          serve Him on Terra to the best of your ability.
        effect: Paw0OqcDTEcHXdGK
  objectives:
    - >-
      Express confidence (or doubt) in the Navy’s dominance of the void or
      skies.
    - Apply Navy doctrine or tradition to the current situation
    - >-
      Compare the protection given by faith in the Emperor to the hull or
      shields of a voidship
    - >-
      Reminisce about your service on a previous ship or the events of a
      previous mission
    - Obey an order without question or doubt
    - Make a tactically sound plan to achieve an objective.
