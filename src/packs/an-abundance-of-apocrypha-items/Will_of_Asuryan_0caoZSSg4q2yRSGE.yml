  description: >-
    <p>Sensing an approaching crux of destiny, you summon the certainty and
    confidence of ancient days. Doubt and fear are washed away, and those nearby
    gain impervious resolve from this indomitable aura. All friendly characters
    with the AELDARI keyword within range will automatically pass all Resolve
    tests and are immune to fear, terror, and intimidation-based Interaction
    attacks until the start of the Farseer’s next turn. In addition, you may
    Deny the Witch as a Reflexive Action in response to an enemy psychic power
    used within 25m of you once before their next turn.</p>
