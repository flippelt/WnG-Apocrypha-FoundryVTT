  description: >-
    <p><span class="fontstyle0">Spur is a name given to several similar
    stimulants, which boost the nervous system, muscle reaction, and reflexes
    for a short time. Taking a dose of Spur adds +2 to the user’s Speed and
    Initiative for the next [[/r 2d6]] minutes. Once the drug’s effects end, the
    user must pass a Toughness test (DN 3) or become </span><span
    class="fontstyle2">Exhausted </span><span class="fontstyle0">for the next
    hour. A single purchase contains 3 doses.</span> <br style=" font-style:
