  description: >-
    <p>By tapping into the various breaches and cracks that exist in the real
    world, you are able to wrap yourself within tendrils of warp energy and use
    them to gird yourself against harm. While this power remains in effect, an
    enemy who wishes to target you with a ranged attack or move within 3m of you
    must pass a DN 3 Willpower test; if they fail, they forgo their turn as the
    power holds them at bay. Further, you may roll Determination against Mortal
    Wounds while this power remains in effect. The effect ends instantly when
    you make a ranged attack.</p>
