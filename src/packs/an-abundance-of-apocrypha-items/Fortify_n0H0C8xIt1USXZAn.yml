  description: >-
    <p>You envision a mighty citadel, ravaged by battle but under swift repair.
    As you do so, you let your powers wash over your battle-brothers, compelling
    their flesh to knit and their bones to set, just as your mental fortress is
    restored to its original magnificence. If this power is successful, select a
    single ally within range; they recover 1d3 Wounds, or twice that amount if
    they possess the IMPERIAL FISTS keyword. Once a creature has been affected
    by this power, they may not do so again until after their next Regroup.</p>
