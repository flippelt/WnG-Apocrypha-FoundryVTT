system:
  description: >-
    <p>Iyanden drifts through the stars of the eastern rim. Once, its halls were
    busy and vibrant with life, but no longer. Now, it is but a shadow of its
    former glory, a sombre and desolate vessel where the dead walk and the
    living dwindle. The Iyanden people have endured much, and suffered great
    tragedy, but they do not allow their despair to consume
    them.</p><p><strong>STOIC AND TENACIOUS</strong>: Your Resolve is increased
    by +Rank.</p>
