  description: >-
    <p><span class="fontstyle0">A Velocity Tracker is an advanced sensor suite
    that consists of sophisticated motion detecting and heatseeking sensor
    systems designed to track the movements of airborne targets such as enemy
    aircraft. With a Velocity Tracker system, the bearer can accurately bring
    his weapons to bear on otherwise hard-to-hit, high-flying. A Velocity
    Tracker is a Support System available to most forms of T'au
    Battlesuit.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Whenever you make a ranged attack against an enemy which
    is hovering, moved using a fly speed in its last turn, or which is a vehicle
    with the Flyer or Hover trait which is currently airborne, add +2 bonus dice
    to your attack.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
