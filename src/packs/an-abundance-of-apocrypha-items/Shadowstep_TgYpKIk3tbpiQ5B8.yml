  description: >-
    <p>The gloom of the battlefield coalesces into a dark passageway that allows
    those who use it to stalk amongst the shadows and reemerge where the foe
    least expects them. Select a single ally you can see within range. That ally
    immediately vanishes into the shadows. At the start of the ally’s next turn,
    they reappear, emerging from any other patch of shadows or darkness within
    100m of where they vanished, so long as that location is more than 9m from
    an enemy.</p>
