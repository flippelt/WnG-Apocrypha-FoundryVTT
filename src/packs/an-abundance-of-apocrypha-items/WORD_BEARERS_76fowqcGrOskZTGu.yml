system:
  description: >-
    <p>Long ago, they were devout servants of the Emperor, faithful in an age
    where faith was scorned. They brought the Emperor&rsquo;s light to many
    worlds, building great monuments to the Imperium and converting populations
    to the Imperial Truth. But, when the Emperor rebuked their worship, the Word
    Bearers turned to other, darker gods, and set in motion events that would
    tear the Imperium asunder. The Legion now consists of warbands of
    daemon-worshipping zealots, sorcerer-priests, and the possessed.</p>

    <h5>Profane Zeal</h5>

    <p>The Word Bearers march to war for the glory of the Dark Gods.</p>

    <p>You may reroll any failed Resolve test. In addition, you are immune to
    fear caused by creatures with the @UUID[Compendium.wng-core.items.Item.eeSvJvzZBjQvtZq0]{DAEMON}
    keyword.</p>

    <h5>The Will of the Gods (Tradition)</h5>

    <p>Word Bearers follow the will of the Chaos Gods, as interpreted through
    their prayers and visions, and through the guidance of their Apostles, and
    must strive to walk the path the Dark Gods set before them.</p>

    <p>You start each session with 1 Wrath Point instead of 2.</p>

