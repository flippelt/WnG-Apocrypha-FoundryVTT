  description: >-
    <p><span class="fontstyle0">A Neural Shredder is a vicious and shockingly
    effective weapon against living targets. Though short ranged, the weapon
    projects a cone of psionic disruption that tears apart a victims' neural
    pathways. Armour is no protection against his hideous attack, even the
    mightiest foes dropping to their knees, spasming violently as liquidised
    brain-matter froths from their eyes, ears, and mouths. This strange weapon's
    origin is unknown, although some speculate that it is but one of a range of
    psychic weapons developed by the Adeptus Astra
    Telepathica.</span></p><p><span class="fontstyle2"><strong>Special</strong>:
    </span><span class="fontstyle0">A Neural Shredder uses no ammo and never
    needs to reload. It just works. Nobody knows entirely how. The damage of a
    Neuro Disruptor is compared to the target’s Resolve, rather than Resilience,
    and each point of damage inflicted is a Mortal Wound instead of a normal
    wound. It has no effect against mindless creatures or inanimate
    objects.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
