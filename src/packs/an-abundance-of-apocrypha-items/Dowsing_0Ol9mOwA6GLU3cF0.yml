  description: >-
    <p>By focusing your mind you can single out an object or person somewhere in
    your immediate vicinity, pushing aside all other distractions until you can
    unerringly find it.</p><p>Select a single specific item or person you know
    (in the case of a person, having seen them or knowing what they look like,
    or knowing their name is required). If successful, and the item or person is
    within a number of kilometres equal to your Willpower attribute, you know
    the rough direction to the target. While you sustain this power, you may
    spend a Full Action to update the information received.</p><p>You receive
    bonus Exalted Icons on a successful use of this power based on your
    familiarity with the target: +2 if you’ve known the target for a long time,
    +1 if you have a piece of the target, +1 if the target is within 100m.</p>
