  description: >-
    <p><span class="fontstyle0">A smaller, more mobile form of shield, Astartes
    combat shields were another precursor to the Storm Shield, albeit one that
    still sees use. Their smaller design allows them to be mag-locked to the
    wielder’s vambrace while leaving their hand free to use equipment or another
    weapon—many warriors favour a pistol in their shield hand—and they do not
    significantly hinder the wielder’s movement. However, they also do not
    provide anywhere near as much protection as their larger
    counterparts.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
