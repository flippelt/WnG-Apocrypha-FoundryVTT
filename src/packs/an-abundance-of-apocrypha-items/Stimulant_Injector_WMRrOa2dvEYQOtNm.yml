  description: >-
    <p><span class="fontstyle0">A Stimulant Injector system consists of an
    advanced life support system fitted within a T'au Battlesuit and can flood
    the pilot's metabolic systems with life-sustaining stimulants and analgesic
    drugs should be become wounded so that he may continue to fight on at full
    effectiveness. A Stimulant Injector is a T'au Battlesuit Support System
    available to most forms of T'au Battlesuit.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">When you roll Determination, you may activate your
    stimulant injector to re-roll all failed dice on the roll, and ignore all
    Shock gained from that roll. Once this has been used, you cannot use it
    again until after you have Regrouped, as your body needs time to
    recover.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
