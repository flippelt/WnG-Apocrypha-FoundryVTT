  description: >-
    <p>When you take your turn, you may use a Simple Action to prepare for an
    ally within 6m of you. If you do so, you may Keep the Initiative to allow
    that ally to take a turn, without needing to spend Glory. This ability does
    not function if the chosen ally has already taken a turn, and it does not
    allow you to Keep the Initiative if you normally couldn’t. You may use this
    a number of times each scene equal to your Rank.</p>
