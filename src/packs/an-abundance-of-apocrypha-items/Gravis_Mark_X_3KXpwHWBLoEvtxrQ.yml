  description: >-
    <p><span class="fontstyle0">Mark X power armour comes in a number of
    varieties, as the underlying armour system is designed to be modular and
    customisable according to battlefield role. The heavier variant is known as
    Gravis armour, which incorporates additional cowling, and ablative armour
    layers to increase the wearer’s durability in battle, at the cost of reduced
    mobility.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">5; Bulk (1), Powered (4),
    Void</span></p><p></p><p><span
    class="fontstyle2"><strong>Reinforced</strong>: </span><span
