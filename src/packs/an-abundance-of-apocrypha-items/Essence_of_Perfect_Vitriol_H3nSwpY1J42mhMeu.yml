system:
  description: >-
    <p>Perfect Vitriol is the universal solvent, a corrosive agent capable of
    dissolving absolutely everything. No substance is proof against this
    liquid’s fury, and it must be stored in magnetic suspension because no
    material container exists that can hold it. Not to be stymied in their quest
    to weaponise everything in their grasp, the Drukhari cleverly use fields and
    other exotic distribution systems to imbue their blades and projectiles with
    the vapours produced by this substance without degrading their own equipment
    too quickly for it to be of use.</p><p>Effect: The target is left enfeebled
    and vulnerable. While poisoned, the target halves their Resilience, rounding
    up.</p>
