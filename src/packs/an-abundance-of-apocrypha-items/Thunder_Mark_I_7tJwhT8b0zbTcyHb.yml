  description: >-
    <p><span class="fontstyle0">Thunder armour was first worn by the Emperor’s
    Thunder Warriors during the reunification wars on Terra. Neither fully
    enclosed nor airtight, it cannot be considered true power armour, but paved
    the way for future designs. It featured a powered and heavily armoured torso
    that gave the wearer immense upperbody strength for grappling and subduing
    their foes. The power required to keep the suit working came from a
    backpack, a technological innovation that has been incorporated into every
    mark of power armour since. Its name was derived from the thunder and
    lightning symbol on the armour’s plastron, a common symbol of the Emperor’s
    reunification in that era. A handful of suits remain in Astartes armouries,
    as relics of the earliest days of the Imperium than as practical forms of
    armour.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">5; Bulky (1), Powered
    (4)</span></p><p></p><p><span class="fontstyle2"><strong>The Emperor’s
    Presence</strong>: </span><span class="fontstyle0">The few remaining suits
    of Thunder Armour are sacred relics of the Emperor’s reunification of Terra
    and the earliest days of the Great Crusades, and to falter while wearing it
    is to dishonour the heroes who came before you. Anyone wearing Mark I
    Thunder armour can withstand one additional Traumatic Injury before they
    die.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
