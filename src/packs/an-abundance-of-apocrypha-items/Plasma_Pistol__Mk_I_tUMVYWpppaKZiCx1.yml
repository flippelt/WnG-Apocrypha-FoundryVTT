  description: >-
    <p>These archaic models of plasma weapon were in common use by the Legiones
    Astartes during the Great Crusade and the early Horus Heresy. One a number
    of experimental forms of plasma weapon, this design emphasised lethality and
    destructive power at the expense of the user’s safety, with the weapon
    frequently overheating or losing magnetic containment during sustained use.
    As the Heresy wore on, these weapons fell out of use amongst the Loyalist
    forces, and the loyalist Mechanicum declared them Fabrus Excommunicata, and
    no longer blessed by the Machine God. However, the Traitor Legions continued
    to use these potent weapons, finding kinship with the savage and malevolent
    weapons’ spirits. In the 41st Millennium, these weapons are no longer
    produced by the Imperium, but they can still be found in the hands of
    Traitor Legionaries.</p>
