  requirements: SKITARII keyword
  description: >-
    <p>Though doctrina imperatives are normally initiated by a Tech-Priest
    overseeing the Skitarii in action, you have been equipped with protocols for
    independent action. You can engage an imperative which heightens visual
    acuity, fine motor control, and reflexes.<br>At the start of any of your
    turns, you may activate the Protector Imperative. This adds +Double Rank
    bonus dice to any ranged attacks you attempt during that turn but increases
    the DN of any melee attacks you attempt that turn by +3. At the end of a
    turn in which you activate the Protector Imperative, you suffer 1d3+2
    Shock.</p>
