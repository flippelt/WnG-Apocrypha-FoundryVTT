  description: >-
    <p><span class="fontstyle0">The advanced gravity-defying technology on the
    platforms allows the Eldar to move heavy weapons and other heavy equipment
    rapidly and effortlessly across the field of battle regardless of
    terrain.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">An Anti-Grav Platform has a Speed of 8 and will
    automatically attempt to stay within 3m of the operator. It floats about a
    metre above the ground and will ignore any obstacles or hindrances of that
    height or smaller. A Heavy weapon mounted on the platform always counts as
    Braced, and the operator may fire the weapon from up to 3m away, determining
    line of sight and line of fire from the weapon instead. The platform can be
    used to carry other heavy equipment, such as Serpent Shield
    generators.</span> <br style=" font-style: normal; font-variant: normal;
