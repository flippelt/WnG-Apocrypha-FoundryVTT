folder: AL59YG508FNku3U7
name: Navis Nobilite
type: faction
img: modules/wng-core/assets/icons/abilities/ability.webp
system:
  journal: ''
  backgrounds:
    origin:
      - name: Magisterial House
        description: >-
          You hail from an ancient House, which dates back to before the
          Unification of Terra. The power of your kin is felt across the
          Imperium.
        effect: DPwmJZ493L31IXUo
      - name: Nomadic House
        description: >-
          Your house has forsaken holdings on Terra or any other world to voyage
          amongst the stars, giving you a significant edge when it comes to the
          practicalities of navigating the Immaterium.
        effect: prLCZw2QlQgvxIiR
      - name: Shrouded House
        description: >-
          Your house has withdrawn from the wider galaxy, perhaps due to some
          ancient shame or loss that haunts them still. While not lacking in
          power or wealth, your House has needed to be resourceful to survive.
        effect: TQMq28sVZkzetxM6
    accomplishment:
      - name: A New Route Charted
        description: >-
          During your travels, you identified and charted a previouslyunknown
          stable passage through the Immaterium, earning wealth and prestige for
          your discovery
        effect: PSsbfIYXFoJQz7mJ
      - name: Emerged From A Storm
        description: >-
          You managed to safely guide a vessel from the clutches of a Warp
          Storm, a feat accomplished by few Navigators
        effect: Paw0OqcDTEcHXdGK
      - name: Warp Gleanings
        description: >-
          While in the Warp, you caught glimpses of weal or woe for your House,
          which may aid your kin in their future endeavours
        effect: RfjaXD9aPKn4Kwcw
    goal:
      - name: Lineage
        description: >-
          You aspire to carry on House and bloodline, bringing forth the next
          generation of Navigators.
        effect: Paw0OqcDTEcHXdGK
      - name: Fortune
        description: You desire to expand the wealth and resources of your House.
        effect: PSsbfIYXFoJQz7mJ
      - name: Power
        description: >-
          You desire to take your place amongst the rulers of your House,
          perhaps even becoming Novator, with your will felt wherever the light
          of the Astronomican reaches
        effect: DPwmJZ493L31IXUo
  objectives:
    - >-
      You unnerve or scare somebody because of your mutated form or the
      reputation of Navigators.
    - You use your proud lineage to secure something valuable or useful.
    - >-
      You spend time admiring the ship you serve upon and reminisce about
      previous voyages.
    - >-
      You compare some strange phenomenon to something you experienced while
      gazing into the Immaterium.
    - >-
      You recount a vision which you had while within the Warp to the current
      situation
    - >-
      You use the name and influence of your House to get your way or refuse a
      request.
