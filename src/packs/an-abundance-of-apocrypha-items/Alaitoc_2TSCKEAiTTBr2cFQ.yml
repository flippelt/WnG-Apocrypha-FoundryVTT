system:
  description: >-
    <p>Far out on the frontiers of the galaxy, on the edge of explored space in
    the Ultima Segmentum, lies the Alaitoc craftworld. The Alaitoc Asuryani are
    zealous in their guard against the touch of Slaanesh, even more so than is
    common amongst the other Craftworld Aeldari. As such, Alaitoc is strictly
    governed to prevent any emergence of the sadistic obsessions that the
    Aeldari are prone to as a species.</p><p><strong>PURITANICAL
    DISCIPLINE:</strong> Your Conviction is increased by +Rank.</p>
