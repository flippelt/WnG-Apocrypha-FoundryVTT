  requirements: Strength 5+
  description: >-
    <p>You can channel all your fury and all your concentration into well-placed
    blows which splinter armour and shatter bone. When making a melee attack,
    you may make a Mighty Strike, choosing to suffer Shock to increase the
    damage; each Shock you suffer adds +1ED to the attack’s damage; you may not
    suffer more Shock from one attack than your Tier. A Mighty Strike may not be
    combined with a multi-attack.</p>
