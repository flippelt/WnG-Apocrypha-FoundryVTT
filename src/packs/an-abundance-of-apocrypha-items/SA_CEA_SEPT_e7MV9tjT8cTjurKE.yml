system:
  description: >-
    <p>Sa’cea is a hot, densely populated world, once overrun by fearsome
    predators which the Fire caste’s warriors had to slay before the settlers
    could land. A highly militarised world, it contains a large population of
    Fire caste warriors, and its people are grim and highly-disciplined.</p><p>•
    <strong>All</strong> T’au from Sa’cea add +1 to their Resolve.</p><p>•
    <strong>Air</strong> caste T’au from Sa’cea hone their skills in the skies
    above dense cityscapes, where absolute precision is needed: they may re-roll
    any 1s rolled (even on a Wrath die) for Pilot tests.</p><p>•
    <strong>Earth</strong> caste T’au from Sa’cea are keenly observant, almost
    to a point of wariness, and add +2d to all Awareness tests.</p><p>•
    <strong>Fire</strong> caste T’au from Sa’cea have exceptional fire
    discipline: they may re-roll one die on any Ballistic Skill test they
    attempt</p>
