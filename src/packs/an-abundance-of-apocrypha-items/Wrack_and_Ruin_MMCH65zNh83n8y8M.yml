  description: >-
    <p>Reaching out with your mind, you sense every fault, hairline crack, and
    structural weakness in an enemy fortification, then build empyric resonance
    within them until the stronghold shakes itself apart. The power affects
    creatures in a Blast (6) that you can see within range. Roll 1d6 for each
    enemy in the blast who is in cover or in difficult terrain; on an Exalted
    Icon, they suffer a Mortal Wound and are Staggered. If the targets are
    within an enclosed structure, then instead roll 1d6 and each Icon inflicts
    1d3 Mortal Wounds and causes them to be Restrained.</p>
