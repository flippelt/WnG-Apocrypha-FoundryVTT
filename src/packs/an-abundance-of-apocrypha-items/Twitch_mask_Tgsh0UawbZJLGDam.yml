  description: >-
    <p><span class="fontstyle0">A complex network of micro-servos and subskin
    synthflesh dispensers, twitch-masks allow the user to adjust his facial
    features at will, altering shape and texture in a matter of moments. Rare
    and difficult to implant, they are nonetheless favoured by confidence
    tricksters and any others for whom being recognised is a
    liability.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">You add +2 dice on all Deception tests made to pass
    yourself off as another person. You may increase this bonus to +4 dice by
    suffering 1 Shock when you assume the disguise.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
