  description: >-
    <p><span class="fontstyle0">The appearance of the Adeptus Arbites strikes
    fear into the hearts of criminals and the lawless. Their armour is
    constructed from dense plasteel plates overlaying a synthetic polyplastic
    fibre weave produced by the Adeptus Mechanicus using methods they do not
    disclose to outsiders. The carapace armour is designed to be clipped
    together and worn over a light, breathable bodyglove, the armour carefully
    constructed and tailor-made to the proportions of the Arbitrator concerned.
    Given that the armour must be worn for hours at a time, often during periods
    of extreme physical exertion, it must be comfortable, and it succeeds
    surprisingly well on these fronts.</span></p><p></p><p><span
    class="fontstyle0">The helm is equipped with a micro-bead (or “vox-torc”)
    and is open at the mouth to allow easier verbal communication. The helm is
    capable of being sealed in seconds with a rebreather, which is magnetised to
    the belt when not in use.</span></p><p></p><p><span
    class="fontstyle2">Armour Rating: </span><span class="fontstyle0">4</span>
