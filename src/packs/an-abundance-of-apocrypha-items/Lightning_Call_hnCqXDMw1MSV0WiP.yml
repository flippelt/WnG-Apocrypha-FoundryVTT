  description: >-
    <p>Raising your arms to the roiling stormclouds overhead, you call down
    lightning strikes upon your foes. If this power is successfully used, the
    nearest enemy within range suffers a Damage 17 +3ED hit with the Agonizing
    trait. Then roll 1d6; on an Icon, the nearest enemy within 5m of the first
    target suffers 12 +2ED Damage with the Agonizing trait. Repeat that d6 roll
    until there are no targets remaining within range who have not been rolled
    for.</p>
