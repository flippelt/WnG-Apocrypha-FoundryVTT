  description: >-
    <p><span class="fontstyle0">Sometimes known as a shield of faith, a
    Pentagrammic Ward is a collection of psychoreactive symbols and patterns,
    inlaid and inscribed using sacred materials, which repels daemons. The
    Inquisition regards knowledge of Pentagrammic Wards as extremely sensitive,
    as heretics can use the same techniques to capture and bind
    daemons.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">*5; Power Field</span></p><p></p><p><span
    class="fontstyle2"><strong>Daemonbane</strong>: </span><span
    class="fontstyle0">Any creature with the </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">@UUID[Compendium.wng-core.items.Item.eeSvJvzZBjQvtZq0]{DAEMON} </span><span class="fontstyle0">keyword
    attempting to attack or interact with Pentagrammic Wards (or something
    warded with them) must take a </span><span class="fontstyle3">Terror
    </span><span class="fontstyle0">test (DN 5). Pentagrammic wards provide no
    protection— not even Armour Rating—against attacks from non-Daemons.</span>
