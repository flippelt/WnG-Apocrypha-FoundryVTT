    origin:
      - name: Asuryani
        description: >-
          You once walked the Paths of the Craftworlds, living a life of strict
          discipline.
        effect: xwpTm4W2Td4gyP0m
      - name: Drukhari
        description: >-
          Though no longer, you once preyed upon dread and pain to sustain
