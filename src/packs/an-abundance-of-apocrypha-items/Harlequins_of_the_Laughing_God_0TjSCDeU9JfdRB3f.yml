        effect: LNglOI16joMEA94l
      - name: Exodite
        description: You once sought salvation through hard labour and a return to nature.
        effect: PWhVppNjUxgqXdii
    accomplishment:
      - name: The Dance Withouth End
        description: >-
          You played a role within the tale of the Fall of the Aeldari and the
          birth of She Who Thirsts.
        effect: FeaOEvFM866OzdKF
      - name: The Black Library
        description: >-
          You waylaid those who would seek to exploit or defile the most sacred
          repository of knowledge.
        effect: 01LUsg65RqcRwwDW
      - name: The War in Heaven
        description: >-
          You have performed within the dance of the ancient birth of the
          Aeldari people, and their conflict with the Bloody-Handed God of War
        effect: qazyenblsBBJqp73
    goal:
      - name: Defy She Who Thirsts
        description: >-
          Your eventual purpose is to thwart the machinations of The Great Enemy
          at some pivotal moment.
        effect: FeaOEvFM866OzdKF
      - name: Enlightenment
        description: >-
          You are fated to bring vital knowledge to a specific being at a vital
          time.
        effect: PWhVppNjUxgqXdii
      - name: Reversal
        description: >-
          An ally falls, an enemy is triumphant, and you had a part in it… but
          everyone knows that such ill-fortune presages a resurgent victory.
        effect: xwpTm4W2Td4gyP0m
  objectives:
    - Speak about your purpose or agenda in a cryptic or poetic fashion
    - >-
      Compare your current situation to some event in the mythology or history
      of the Aeldari
    - >-
      Challenge a foe to battle with theatrical flourish, including addressing
      them by the name of a villain from Aeldari legend.
    - >-
      Pursue a course of action which seems strange or bizarre to others, purely
      because your role demands it
    - >-
      Show mercy to a foe, or act ruthlessly to an ally, because it is your role
      to do so.
    - Enter battle with laughter on your lips
