  description: >-
    <p>Electroleech Staves are used by some Electro-Priests. The powerful
    capacitors built into the length of each electroleech staff allow them to
    drink every iota of electric force from those they strike - be they living
    or machine. This bioelectric energy is siphoned into the user&rsquo;s
    Luminen capacitor, where it can charge their implants further.</p>

    <p><strong>Special:</strong> Only a character with a Luminen Capacitor may
    wield an Electroleech Staff &ndash; in the hands of anyone else, it counts
    as a normal staff. Each point of Shock inflicted by an Electroleech Staff
    adds 1 point of charge to the user&rsquo;s Luminen Capacitor</p>
