  description: >-
    <p><span class="fontstyle0">An extremely dangerous form of grenade, which
    inflict harm silently and invisibly: aside from the grenade itself, there is
    no sign of the lethal radiation. Rad weapons are rare in the Imperium, for
    they are often as lethal to their users as to their enemies. The Adeptus
    Mechanicus, whose augmented bodies are more resistant to the deadly effects,
    are amongst the few regular users.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Roll 3d3 to determine the size of the grenade’s blast
    after the attack is made. A character </span><span
    class="fontstyle3">Poisoned </span><span class="fontstyle0">by radiation
    suffers 1d3 Mortal Wounds at the start of each of their turns, as the
    radiation lingers in their body.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
