  description: >-
    <p><span class="fontstyle0">An Omni-visor is an advanced scanning tool used
    by the Brôkhyr engineers and artificers of the Leagues of Votann. While it
    was developed to provide aid with civil engineering tasks, it has been
    adapted by the Brôkhyr Thunderkyn as a weapon of war, allowing them to pick
    out the telltale signs of enemy units through dense
    terrain.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">This functions as Preysense Goggles, allowing you to
    ignore any penalties to Tests due to visual conditions. In addition, when
    you make a ranged attack, the target does not receive the benefits of Cover
    against the attack.</span> <br style=" font-style: normal; font-variant:
