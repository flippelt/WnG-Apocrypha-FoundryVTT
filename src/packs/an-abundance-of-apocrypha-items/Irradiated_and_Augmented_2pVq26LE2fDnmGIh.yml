  description: >-
    <p>You do not bleed (making you immune to Bleeding), and gain +Rank bonus
    dice to Determination rolls. In addition, any living creature without the
    ADEPTUS MECHANICUS keyword within 2 metres of you at the start of their turn
    must pass a DN 3 Toughness Test or suffer the Poisoned condition. This
    poison is radiation poisoning, inflicting 1 Mortal Wound and Rank Shock at
    the start of each of the Poisoned character’s turns.</p>
