  description: >-
    <p>You are an exceptionally potent psyker and can draw deeply from the Warp
    if you’re willing to risk the consequences.</p><p>When you attempt to use a
    psychic power at the Transcendent power level, you may set any of the Wrath
    dice to a 6 rather than rolling it. If you set any Wrath die in this way,
    you must roll on the Perils of the Warp table and add +10 to the Perils of
    the Warp roll for each Wrath die set to a 6.</p><p>You gain 2d3 Corruption
    points when you take this talent. You may not select the Alpha-level Psyker
    or Gamma-level Psyker talents.</p>
