  description: >-
    <p><span class="fontstyle0">The Phantasm Grenade Launcher is a deadly weapon
    utilized by wealthier Dark Eldar. Consisting of a specially modified
    backpack that can hurl disc-shaped grenades from twin tubes, the ammunition
    of Phantasm Grenade Launchers are canisters which contain a powerful nerve
    gas, capable of plunging the victim into a fit of horrific nightmares and
    delusions.</span></p><p><span class="fontstyle2"><strong>Special</strong>:
    </span><span class="fontstyle0">Any creature caught in the blast of a
    Phantasm Grenade must pass a </span><span class="fontstyle3">Terror
    </span><span class="fontstyle0">test (TN 5). Further, if a creature suffers
    a complication on this test, then they also suffer 1d3 mortal wounds.</span>
