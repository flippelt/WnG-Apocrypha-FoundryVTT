  description: >-
    <p><span class="fontstyle0">A warp-spawned fusion of muscle and powered
    steel, Fleshmetal forms a hideous exoskeleton to those followers of Chaos
    whose armour has long since fused with their body. In most cases, Fleshmetal
    was once power armour, but it has grown and mutated to the point where there
    is no clear distinction between the wearer’s flesh and the armour plate they
    once wore. Fleshmetal is not so much obtained as equipment as it is bestowed
    by the powers of the Warp.</span></p><p></p><p><span
    class="fontstyle2">Armour Rating: </span><span class="fontstyle0">6; Powered
    (4)</span></p><p></p><p><span class="fontstyle2"><strong>Hideous
    Symbiosis</strong>: </span><span class="fontstyle0">Fleshmetal armour cannot
    be removed. Whenever the wearer rolls Determination, each Exalted Icon
    causes them to recover 1 Wound.</span> <br style=" font-style: normal;
