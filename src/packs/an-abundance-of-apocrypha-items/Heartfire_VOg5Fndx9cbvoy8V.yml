system:
  description: >-
    <p>Heartfire is a substance produced by the razor-spined fungi that inhabit
    certain parts of the Dark City. This poison self-replicates within a
    victim’s body, polluting his blood with a kinetically unstable chemical that
    may ignite at any moment. Vigorous motion is often sufficient to set the
    poisoned blood off, consuming the victim with a fire within his own veins
    and arteries, burning up the oxygen in his
    blood.</p><p><strong>Effect</strong>: The target’s blood becomes volatile
    while Poisoned; whenever the character suffers damage, is knocked prone,
    runs, or sprints, they suffer 1d3 Mortal Wounds.</p>
