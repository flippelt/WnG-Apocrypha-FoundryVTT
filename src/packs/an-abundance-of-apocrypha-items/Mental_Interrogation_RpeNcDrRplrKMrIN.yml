  description: >-
    <p>You reach into the mind of an adversary, seeking their secrets. You
    select a single enemy you can see within range. If the power is successful,
    the target is Hindered while the power remains in effect. Each round the
    power remains in effect, you may ask the GM 1d3 questions, which the GM must
    answer based on the target’s surface thoughts and recent memories (anything
    within a number of days equal to their Intellect). The target then suffers
    Shock equal to the number of questions asked that round. You must use a Full
    Action each round to sustain this power.</p>
