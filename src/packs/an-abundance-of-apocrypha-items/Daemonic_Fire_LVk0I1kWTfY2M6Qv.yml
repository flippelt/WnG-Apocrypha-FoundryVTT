  description: >-
    <p><span class="fontstyle0">A gift granted to some servants of the Dark Gods
    is the ability to conjure warp-flame from thin air and hurl it at their
    enemies. Daemonic fire has the added advantage that it does not take the
    form of a weapon, and the bearer cannot be
    disarmed.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">When you make a Salvo attack with Daemonic Fire, suffer
    1d3 Shock instead of spending Ammo. When you first obtain Daemonic Fire, it
    becomes a permanent part of you, and you gain 1d3+1 Corruption
    points.</span> <br style=" font-style: normal; font-variant: normal;
