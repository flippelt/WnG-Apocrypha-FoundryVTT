  description: >-
    <p><span class="fontstyle0">The Web of Skulls is an ancient Aeldari weapon,
    consisting of three heavy crystalline skulls linked together by lengths of
    chain. The weapon is grasped at the point where the chains meet and spun
    quickly before being hurled at a target. Cunningly concealed antigrav
    technology accelerates and propels the weapon to its targets, often to
    strike several targets in a row before returning. It can also be used in
    melee in a manner like a flail.</span> </p><p><span
    class="fontstyle0"><strong>Special</strong>: </span><span
    class="fontstyle2">A Web of Skulls ignores up to 4 points of DN increase for
    making a Multi-Attack as part of a ranged attack, but it can Multi-Attack
    against a maximum of three targets, each of whom must be within 12m of at
    least one other target</span>.<br style=" font-style: normal; font-variant:
    normal; font-weight: normal; letter-spacing: normal; line-height: normal;
    orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform:
    none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
