  description: >-
    <p>You lash out with your mind at an enemy war machine to shred its armoured
    hull. The strips of razor-edged shrapnel turn from the vehicle’s iron flesh
    are hurled like daggers at a nearby foe. Select one enemy vehicle you can
    see within range. That vehicle suffers 1d6+1 Mortal Wounds. Then, for each
    Mortal Wound the vehicle suffered, select a single creature within 6m of the
    vehicle (no creature may be selected more than once for this), and roll 1d6:
    on an Icon, that creature suffers a Mortal Wound.</p>
