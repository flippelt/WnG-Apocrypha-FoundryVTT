system:
  quantity: 1
  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">With the outbreak of rebellion, supply lines
    fell into turmoil and it became difficult to repair and maintain the
    advanced Mk4 suits. Mk5 was created as a stopgap, a style with the
    flexibility to use new or old materials depending on availability. In many
    cases older, heavy power cabling was used, which created a weak point on the
    chest. The armour was reinforced with an extra skin plate fitted over the
    top using molecular bonding studs, thus giving “Heresy Armour” its
    distinctive appearance. After the Heresy, most examples of the armour were
    dismantled and used for spares—the Chapters preferring not to be reminded of
    those dark days. However, it is still commonplace among the hated Traitor
    Legions.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">5; Powered (3)</span></p><p></p><p><span
    class="fontstyle2"><strong>Rugged</strong>: </span><span
    class="fontstyle0">The tough, studded outer shell of Heresy armour was ideal
    for the brutal combat of the Heresy itself. The wearer of this armour may
    add +1 to their Determination.</span></p><p></p><p><span
    class="fontstyle2"><strong>Suspicious</strong>: </span><span
    class="fontstyle0">This armour remains common amongst the Traitor Legions
    and draws the incisive gaze of the Inquisition. The wearer adds +1DN to all
    non-hostile interaction tests with members of the Inquisition.</span> <br
    style=" font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
