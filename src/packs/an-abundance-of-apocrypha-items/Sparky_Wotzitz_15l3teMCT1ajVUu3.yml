    field generators are unpredictable and prone to failure, but when
    functioning properly they can withstand tremendous
    assaults.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">*3, Power Field</span></p><p></p><p><span
    class="fontstyle2"><strong>Unreliable</strong>: </span><span
    class="fontstyle0">Whenever you roll Determination when wearing Sparky
