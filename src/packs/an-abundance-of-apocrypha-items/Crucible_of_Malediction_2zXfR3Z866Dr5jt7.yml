    until death. When unleashed, their tormented spirits hurtle across the
    battlefield, unleashing a psychic cacophony that is bane to
    psykers.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">You may activate this as an Action. Each </span><span
