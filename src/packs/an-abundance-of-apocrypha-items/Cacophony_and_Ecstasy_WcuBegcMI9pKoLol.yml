  description: >-
    <p>You add +Double Rank bonus dice on Awareness and Insight tests that
    relate specifically to hearing, and you can pick out sounds, and variations
    in sounds that a normal human cannot. Further, you recover Rank Shock at the
    end of every turn, as you revel in the din of battle. However, if you reach
    Max Shock, you are Staggered as well as Exhausted, as you are overcome by
    sensation. </p><p>In addition, you gain 1d3x4 Corruption when you select
    this Archetype.</p>
