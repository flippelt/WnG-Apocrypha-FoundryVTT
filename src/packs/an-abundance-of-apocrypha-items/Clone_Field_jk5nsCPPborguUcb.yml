  description: >-
    <p><span class="fontstyle0">A form of defensive field used by powerful Dark
    Eldar, Clone Fields provide no physical protection, but deceive enemies by
    generating realistic holographic simulacra of the wearer which deceive
    attackers. Until the moment a shot or blade makes contact, it is impossible
    to know if an attack is at the intended target or merely a
    duplicate.</span></p><p></p><p><span class="fontstyle0">A Clone Field cannot
    be worn with </span><span class="fontstyle2">FORCE FIELD </span><span
    class="fontstyle0">armour, as energy fields disrupt the holographic
    decoys.</span></p><p></p><p><span class="fontstyle2"
    style="color:rgb(0,0,0);">Armour Rating: </span><span
    class="fontstyle0">0</span></p><p></p><p><span class="fontstyle2"
    style="color:rgb(0,0,0);"><strong>Deceptive Defence</strong>: </span><span
    class="fontstyle0">Whenever you are attacked while wearing a Clone Field,
    roll a d6. On an Icon, the attack is considered to have missed. This has no
    effect against Blasts or area effect attacks.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
