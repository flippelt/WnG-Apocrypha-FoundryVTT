  description: >-
    <p>At the start of the first round of combat, before any actions are taken,
    select a single enemy you can see or who you know for certain is present in
    the scene. They are your priority target. Against your priority target, you
    may re-roll up to Rank dice on all Awareness tests and attacks. </p><p>Once
    your priority target has been slain, you may select a new priority target as
