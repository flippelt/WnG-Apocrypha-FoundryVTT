  description: >-
    <p><span class="fontstyle0">A Neuro Disruptor is an elegant
    psychocrystalline weapon that fires beams of energy capable of burning away
    nervous tissue in an agonising instant. Armour offers no protection from
    these weapons, for it is simply bypassed altogether. Indeed, foes hit by a
    Neuro Disruptor show no outward sign of injury, except their sudden, violent
    convulsions as they tumble to the floor.</span></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">A Neuro Disruptor uses no ammunition and cannot run out
    of ammunition. It just works. Nobody knows entirely how. The damage of a
    Neuro Disruptor is compared to the target’s Resolve, rather than Resilience,
    and each point of damage inflicted is a Mortal Wound instead of a normal
    wound. It has no effect against mindless creatures or inanimate
    objects.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
