  description: >-
    <p>You mark your target’s spirit within the Immaterium, allowing you to
    track their movements and pick them out in any crowd. Select a single enemy
    you can see within range. While the power remains in effect, you gain +3
    bonus dice on all tests to locate or track the target. If you cannot
    perceive the target, you always know the general direction to them, so long
    as both you and they are in realspace, and this indicator grows stronger the
    closer you are to them. While the power remains in effect, you may use a
    Simple Action to confer your awareness to any allies within 6m of you,
    adding +2 dice to their Awareness tests and attacks against the target.</p>
