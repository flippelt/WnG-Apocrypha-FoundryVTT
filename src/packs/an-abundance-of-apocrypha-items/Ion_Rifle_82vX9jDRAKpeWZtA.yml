  description: >-
    <p><span class="fontstyle0">An Ion Rifle is an experimental T'au Ion Weapon
    designed for infantry use developed during the T'au Empire's Third Sphere
    Expansion. An Ion Rifle is similar in size to a T'au Rail Rifle, and it is a
    powerful weapon capable of engaging enemies at long ranges with high energy
    ion streams, vaporising flesh and metal with equal
    ease.</span></p><p></p><p><span class="fontstyle0">These high-energy
    particles are accelerated by an electromagnetic field and react explosively
    with the target because of direct transfer of energy at an atomic
    level.</span></p><p></p><p><span class="fontstyle0">Ion Rifles are normally
    issued to Pathfinders as special weapons, where their firepower boosts the
    team's combat capabilities by allowing them to vaporise heavy infantry and
    light vehicles alike. T'au Interceptor Drones are also armed with a set of
    twin-linked Ion Rifles as standard weapons, which they use in conjunction
    with their advanced targeting systems to blow incoming aircraft out of the
    sky</span>.</p>
