  quantity: 1
  rarity: rare
  description: >-
    <p><span class="fontstyle0">A neurally-linked datavault and pict-capture
    array is built into the recipient’s brain and eyes (which are normally
    replaced with augmetics), which records information on people or scenes
    viewed. These images can later be replayed, or the implant can apply data
    from previous recordings as an overlay onto the present view. It is a tool
    of remembrancers, chroniclers, and any who need detailed information close
    at hand.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The recipient always has a perfect visual record of
    everything they see, which may be transferred to other data storage if they
    have a way to connect to those devices (such as an interface port). Further,
    they gain a +1d bonus on any Investigation or Scholar tests based on
    information they have already witnessed and recorded.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
