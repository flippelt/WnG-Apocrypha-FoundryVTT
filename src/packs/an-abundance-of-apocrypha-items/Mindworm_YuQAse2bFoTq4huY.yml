  description: >-
    <p>You burrow your consciousness into the screaming victim’s brain, ripping
    free secrets in a spray of gore. If successfully manifested, the power
    inflicts 1 Mortal Wound and 1d3 Shock to the target, and you gain the answer
    to one question, in the form of memories, images, or other experiences from
    the target’s mind. In addition, if the target has not yet acted this round,
    they may not take a turn until after all other characters in the scene have
    acted; if they have acted this round, then they will act last during the
    next round instead.</p>
