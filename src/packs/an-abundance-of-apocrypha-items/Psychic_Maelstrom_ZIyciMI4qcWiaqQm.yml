  description: >-
    <p>You unleash the full might of your mind, summoning a roiling psychic
    tempest that envelops the enemy, lifting them from the ground and wrenching
    them about like a rag doll. This power affects enemies within a Blast (6)
    you can see within range. This blast must touch the nearest enemy you can
    see. Each enemy must pass a Strength test with a DN of 4, and failure means
    they are flung 1d3 metres in a random direction and knocked Prone, suffering
    Mortal Wounds equal to the distance they were thrown.</p>
