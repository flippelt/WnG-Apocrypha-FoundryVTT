  description: >-
    <p><span class="fontstyle0">Tankbusta Bombs are heavy magnetic discs size
    and shape of manhole covers. They are directional and are used when
    Stikkbombs simply aren't sufficient to destroy something. They are attached
    to the vehicles by magnetic clamps and detonated with deadly
    efficiency.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">A Tankbusta Bomb cannot be thrown or fired from a
    launcher. It must be planted with a Tech test against a vehicle within 1m,
    with a DN equal to the vehicle’s Defence. The bomb will detonate at the end
    of the current turn. After placing a Tankbusta Bomb, the character may move
    1d3+1 metres away from the bomb and fall </span><span
    class="fontstyle3">Prone </span><span class="fontstyle0">as they leap away
    before the bomb detonates.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
