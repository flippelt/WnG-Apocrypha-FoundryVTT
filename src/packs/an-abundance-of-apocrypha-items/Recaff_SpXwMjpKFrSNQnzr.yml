  rarity: common
  description: >-
    <p><span class="fontstyle0">Recaff is a popular hot beverage in the Imperium
    made from crushed and brewed plant matter. Its composition, preparation—and
    common name—can vary depending on the planet it is found, but most blends
    contain some form of mild stimulant such as caffeine or detoxified
    pharamoxine compounds. The stimulant effect is often sufficient to help the
    drinker wake up in the morning, or to keep them alert during a long
    night.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">A character who drinks a cup of recaff
    during a regroup recovers [[/r 1d3]] Shock and adds +1 bonus dice to any
    test to remain awake or resist the effects of fatigue or sleeplessness for
    the next [[/r 1d3]] hours. Each successive cup of recaff reduces the
    duration of the benefit by 1 hour, as sleep eventually catches up. A single
    purchase contains enough to make 10 cups.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
