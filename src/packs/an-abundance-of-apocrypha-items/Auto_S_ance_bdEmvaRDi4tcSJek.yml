  description: >-
    <p>You tune your psychic abilities to peer into the streams of time and
    space, to see events from past, present, and future. A hallmark of
    Astropaths, the auto-séance is a power by which a psyker opens up their mind
    and analyses the auras and psychic resonances around them. By doing this,
    they also augment and enhance the powers of another psyker and serve as a
    buffer against the worst dangers of the Immaterium. When you use this power,
    you assist another psyker, adding your ranks in Psychic Mastery as bonus
    dice to their next attempt to use a Divination power. In addition, should
    they suffer Perils of the Warp, you may both roll, and choose whichever
    result is lower</p>
