  description: >-
    <p><span class="fontstyle0">Mandiblasters are an Eldar weapon system in the
    form of pods built into either side of the helmets of Striking Scorpions.
    Known also as the </span><span class="fontstyle2">Scorpion's Sting
    </span><span class="fontstyle0">or the </span><span class="fontstyle2">Sting
    of the Scorpion</span><span class="fontstyle0">, Mandiblasters are activated
    by neural impulses to fire a hail of deadly metallic shards. These shards,
    while capable of cutting and lacerating flesh, are not particularly powerful
    alone; they act as a conductor to a follow-up intense laser burst. The laser
    flashes the slivers of metal into plasma, which can cause significant injury
    or death.</span></p><p></p><p><span
    class="fontstyle3"><strong>Effect</strong>: </span><span
    class="fontstyle0">When the wearer of a Mandiblaster Helm charges into
    combat, and at the start of each turn they are engaged in combat, roll 1d6.
    On an Icon, one enemy within 2m suffers [[/r 1d3]] Mortal Wounds.</span> <br
