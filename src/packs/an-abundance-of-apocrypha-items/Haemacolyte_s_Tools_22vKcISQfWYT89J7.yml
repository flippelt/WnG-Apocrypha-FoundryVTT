  description: >-
    <p><span class="fontstyle0">This collection of bizarre blades, needles,
    probes, and syringes are a hallmark of those who serve the Haemonculi
    Covens. They are tools of fleshcraft, and while they are used to keep people
    alive, they are used as often to torment people and extract useful
    secretions from their flesh. Nobody is happy to have their life saved by a
    Haemacolyte.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Functions as a Medikit. In addition, against a
    </span><span class="fontstyle3">Restrained </span><span
    class="fontstyle0">target, it may be used to make a Medicae Test (DN =
    target’s Toughness) to inflict [[/r 1d3]] Shock, +1 Shock per shifted
    Icon.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
