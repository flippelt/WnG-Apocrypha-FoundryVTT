system:
  quantity: 1
  rarity: common
  description: >-
    <p><span class="fontstyle0">Skinplants are sophisticated tattoos—very
    sophisticated. Molecular-scale crystalline circuitry is embedded between
    layers of skin, drawing miniscule amounts of power from the recipient’s body
    to create a tattoo that can light up, flash, or even display simple
    animations.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The character has an illuminated tattoo, with a design of
    their choosing. This may be permanently lit, or it may remain hidden until a
    specific trigger (pressure, contracting a muscle, or similar). These are
    often applied to demonstrate fervour or loyalty and add +1 dice to any
    Persuasion or Intimidation tests attempted (choose which skill is affected
    when you gain the Skinplant).</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
