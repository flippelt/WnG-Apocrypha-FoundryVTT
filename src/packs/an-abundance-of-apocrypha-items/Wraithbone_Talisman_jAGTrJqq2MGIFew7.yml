  description: >-
    <p><span class="fontstyle0">Wraithbone is a substance used in many forms of
    Aeldari technology. It is psychoreactive, and is found in many devices and
    objects which are intended to channel and direct the energies of the Warp.
    Many Eldar wear charms or talismen of wraithbone, often shaped into symbolic
    representations of their ancient gods or mythic figures, seeking clarity of
    thought, focus, or good fortune.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A character wearing a wraithbone talisman may draw upon
    the talisman as a Free Action to gain 1 Glory. Once a talisman has been used
    in this way, it cannot be used again until after the next Regroup.</span>
