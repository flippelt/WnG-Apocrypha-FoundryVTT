  quantity: 1
  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">The XV85 Enforcer Battlesuit is a larger and
    sleeker variant of the standard XV8 Crisis Battlesuit that provides better
    protection and joint movement for the pilot and can mount additional support
    systems or weapons due to its more powerful
    reactor.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">6, Powered (5)</span></p><p></p><p><span
    class="fontstyle2"><strong>Hardened Nanocrystalline Structure</strong>:
    </span><span class="fontstyle0">The wearer’s Toughness is increased by +5
    while they wear this suit. This increases the wearer’s Wounds and
    Determination accordingly. While within the suit, the wearer’s size is
    Large.</span></p><p></p><p><span class="fontstyle2"><strong>Jump
    Jets</strong>: </span><span class="fontstyle0">The armour is fitted with
    jump jets allowing for considerable mobility. The suit has a Speed of 8
    (Flying).</span></p><p></p><p><span
    class="fontstyle2"><strong>Armament</strong>: </span><span
    class="fontstyle0">This battlesuit may be equipped with up to four weapons.
    Any weapon slot may be replaced by a </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">SUPPORT SYSTEM</span><span
    class="fontstyle0">.</span> <br style=" font-style: normal; font-variant:
    normal; font-weight: normal; letter-spacing: normal; line-height: normal;
    orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform:
    none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
