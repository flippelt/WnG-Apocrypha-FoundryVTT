system:
  description: >-
    <p>Once the Luna Wolves, and later the Sons of Horus, the Black Legion are
    what remains of the legion that Horus commanded during the Heresy. The Luna
    Wolves were a proud force, that exemplified the best qualities of the
    Legiones Astartes, but when they came became the Sons of Horus, a darker
    character has overcome them, a spiteful savagery that has only grown deeper
    and darker since the Heresy ended. The survivors reforged themselves as the
    Black Legion, to expunge the stain of Horus&rsquo; defeat, and their hatred
    for the Imperium is greater than ever.</p>

    <h5>The Tip of the Spear</h5>

    <p>The Black Legion epitomise the Traitor Legions&rsquo; threat, swift,
    ruthless, and unyielding in their hateful fervour.</p>

    <p>You add +Rank bonus dice on all Ballistic Skill tests made with a ranged
    weapon at close range. You also gain +1 Resolve.</p>

    <h5>Bitter Pride (Tradition)&nbsp;</h5>

    <p>The Black Legion have little love for those outside their ranks.</p>

    <p>You suffer a +2DN penalty for Interaction tests involving anyone outside
    the Black Legion, unless those people are subordinate to the Black Legion
    character.</p>
