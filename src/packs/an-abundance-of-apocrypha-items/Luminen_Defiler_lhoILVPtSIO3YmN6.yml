  description: >-
    <p>You have found ways to alter and twist the energies of your Luminen
    Capacitor, imbuing it with the hellish light of Chaos and your own twisted
    spirit.<br>You gain +1 Corruption. When you use a charge from your Luminen
    Capacitor, you may suffer a Mortal Wound to corrupt the energy you unleash.
    If you are using this to power a machine, then the machine is also tainted
    and corrupted, and the GM will work with you to determine the effect. If you
    are using that corrupted power to make an attack (using the Luminen Blast or
    Luminen Shock talents, or any weapons which use your Luminen Capacitor),
    then the attack gains the Rad (2) trait.</p>
