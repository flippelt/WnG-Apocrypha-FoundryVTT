  description: >-
    <p>You erase your presence from the minds of others. This is more than mere
    invisibility: those affected by the power simply cannot perceive your
    presence. Their senses still work, but their minds will not acknowledge you.
    </p><p>While this power is in effect, the target cannot perceive you in any
    way, though they will still be able to see the results of your actions. If
    ever a target is confronted with evidence of your presence (such as being
    attacked by you, or seeing a door open because of you), they may attempt a
    Willpower test with a DN of 3 to try and shake off this power’s effects.</p>
