  description: >-
    <p>You will not allow so trivial a thing as a mortal wound interfere with
    delivering death to the enemies of the Imperium.<br>When you are Dying, you
    may continue to act normally, though you continue to suffer Traumatic Wounds
    and additional Wrath Dice as normal for a Dying character. If ever you roll
    a 6 on all your Wrath dice while Dying, you immediately regain 1 Wound.</p>
