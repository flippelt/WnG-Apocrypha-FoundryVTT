  description: >-
    <p><span class="fontstyle0">A Webber is an exotic, non-lethal weapon used to
    immobilise a target. It fires a fluid filled with a mass of filaments, which
    expands in the air to form a web of sticky, near-unbreakable material.
    Targets are quickly entangled in a painful embrace; if they attempt to
    struggle, the filaments constrict even more, further entrapping them. They
    are commonly employed by the Adeptus Arbites for riot suppression, crowd
    control, and capturing suspects alive. They would be more widespread, but
    the web chemical they use is often difficult to
    obtain.</span></p><p></p><p><span class="fontstyle0">Webber weapons are
    found in pistol and heavy weapon forms, the latter often mounted on Arbites
    combat vehicles such as Repressors.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Webbers do not inflict damage. Rather, any creature
    caught in the blast must pass an Athletics test or suffer the </span><span
    class="fontstyle3">Restrained </span><span class="fontstyle0">condition. The
    DN of the test and the rating of the Restrained condition are noted in the
    weapon’s entry.</span> </p>
