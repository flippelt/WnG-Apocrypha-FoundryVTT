  description: >-
    <p><span class="fontstyle0">A potent cocktail of aggression-enhancing combat
    drugs, commonly given to the mortal followers of the World Eaters Legion,
    these drugs contain a drop of warp-tainted blood from one of the World
    Eaters themselves, suffusing the entire cocktail with the fury of Angron’s
    bloody-handed sons.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A character may take a dose of Aggressor Stimms as a
    Simple Action. They immediately suffer 1 Mortal Wound and become
    </span><span class="fontstyle3">Frenzied</span><span class="fontstyle0">.
    Further, they will inflict +2ED on all melee attacks until the end of their
    next turn. A single purchase contains 8 doses.</span> <br style="
