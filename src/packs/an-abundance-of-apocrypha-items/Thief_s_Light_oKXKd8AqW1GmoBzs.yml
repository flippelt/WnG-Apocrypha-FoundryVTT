  description: >-
    <p><span class="fontstyle0">A simple skinplant with many unsavoury uses, the
    thief’s light is a simple luminescent patch on the palm of the hand, which
    is nearly imperceptible until activated. When triggered—usually by squeezing
    the hand shut for a few seconds—the patch glows with a soft yellow light,
    enough to illuminate objects within a few centimetres clearly enough to
    perform intricate tasks without producing large amounts of light that would
    give the user’s presence away. Like all skinplants, it draws power from the
    user’s own bioelectricity and body heat, and the design is simple, reliable,
    and common amongst ne’er-do-wells on countless
    worlds.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">At will, the user can generate a small amount of light
    from the palm of one hand.</span> <br style=" font-style: normal;
