  rarity: common
  description: >-
    <p>Carried by diplomats, assassins and other people who want a tiny,
    concealable weapon, the Holdout Laspistol&mdash;often known as the
    Las-Derringer, after an Ancient Terran weapon of similar size&mdash;is small
    enough to fit into the palm of the hand, and both light and thin enough to
    go almost unnoticed under clothing. Its principal drawbacks are a lack of
    effective range, and limited power, but this is of little concern for those
    who choose to wield them. Its tiny power cell cannot be easily removed,
    though the weapon can be recharged after it has expended its ammunition.</p>

    <p>CONCEALABLE: The weapon can easily be hidden, and cannot be detected on a
    character without a thorough search or an auspex scan (Awareness Test, DN
    4).</p>
