system:
  quantity: 1
  rarity: uncommon
  description: >-
    <p><span class="fontstyle0">Modified, high-output charge packs for lasguns
    and laspistols, favoured by snipers and elite shock troops in the Imperial
    Guard. These are like the charge packs used for Hot-shot las-weapons, hence
    the name, but they’re used instead in conventional lasguns. However, this
    increased intensity without the sturdier construction of hot-shot lasguns
    means that they burn out more quickly as well.</span></p><p></p><p><span
    class="fontstyle0">This ammo may only be used in a Lasgun, Laspistol,
    Duelling Laspistol, or Long Las.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The weapon gains +2ED, and the Careful, Brutal and
    Rending (2) traits, but it loses the Reliable trait and its Salvo rating is
    reduced to – for this shot.</span></p><p></p><p><span
    class="fontstyle2"><strong>Single Shot</strong>: </span><span
    class="fontstyle0">A Hot-shot Charge Pack is expended after a single shot.
    Using this ammunition expends that pack, and grants none of the normal
    benefits of a Salvo action.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
  value: 5
  keywords: IMPERIUM, ASTRA MILITARUM, SCUM
  effect: ''
  traits:
