  description: >-
    <p><span class="fontstyle0">The Needlespine Blaster combines a rapid-fire
    bolter component with a deadly needler that makes use of an enhanced
    synthetic venom. The preserve of Clave Adamus operatives, the Needlespine
    Blaster fires an intensified pulse-beam of las energy, through which darts
    of an exotic metallic alloy are projected at incredible speeds. In the
    trained hands of an Adamus Assassin this weapon can make a mockery of even
    the thickest armour, but to the uninitiated, its bulk and complexity make it
    all but unusable.</span></p><p></p><p><span class="fontstyle0">This
    functions as a combi-weapon (</span><span class="fontstyle2">Wrath & Glory
    rulebook</span><span class="fontstyle0">, page 227), fitted with a gene-grip
    bio-veritor.</span> <br style=" font-style: normal; font-variant: normal;
