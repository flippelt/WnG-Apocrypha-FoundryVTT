  description: >-
    <p><span class="fontstyle0">With the proper treatment of Wraithbone,
    Drukhari can create these alternatives to the standard-issue Splinter
    Crystal rounds for their basic weapons. These soulseeker splinters are
    shaved from crystals impregnated with tortured Wraithbone. When broken down
    by the gun to form projectiles, the souls trapped in the crystal, driven mad
    during the treatment process, seek to enact revenge on the first living
    thing they can find, and imparts so much force in this endeavour that it can
    change the trajectory of the round, even so much as to be able to curve
    around trees and bushes.</span></p><p></p><p><span class="fontstyle0">This
    ammo may only be used in </span><span
    class="fontstyle2"><strong>SPLINTER</strong> </span><span
    class="fontstyle0">weapons.</span></p><p></p><p><span class="fontstyle2"
    style="color:rgb(0,0,0);"><strong>Effect</strong>: </span><span
    class="fontstyle0">Targets do not receive the benefits of cover when
    attacked by a splinter weapon loaded with soulseeker splinters.</span> <br
