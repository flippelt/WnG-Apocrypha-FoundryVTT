  description: >-
    <p>You channel your powers into the ground around you to create a microcosm
    of Nocturne around your foes. The earth darkens and begins to split, before
    towering flames and boiling magma spew forth to burn the enemies of the
    Salamanders to cinders. The power affects all creatures in a Blast (10)
    within range. Affected targets suffer a hit with Damage 15 +4ED, adding your
    Willpower score to the base damage, with an AP of -3. Further anyone hit
    must pass an Agility test (DN 5) or be set On Fire.</p>
