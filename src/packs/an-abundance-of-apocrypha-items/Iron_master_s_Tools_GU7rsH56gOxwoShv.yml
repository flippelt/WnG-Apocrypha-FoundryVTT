  description: >-
    <p><span class="fontstyle0">Each Brôkhyr Ironmaster fashions their own
    tools, developing a distinct and individual assortment of devices throughout
    their careers. Some particularly traditional Ironmasters insist that the
    only real way to work is to travel light and make whatever tools you need
    on-site.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">You ignore DN penalties to build, repair, maintain, and
    sabotage Leagues of Votann technology. This also works on Imperial
    technology, due to the common STC origins of both cultures’ technologies.
    Furthermore, These tools may be used as a Medipack on any </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">ROBOT </span><span
    class="fontstyle0">character and heal an additional +Rank Wounds when used
    in this way.</span> <br style=" font-style: normal; font-variant: normal;
