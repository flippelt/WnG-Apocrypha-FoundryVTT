name: DAL'YTH SEPT
type: keyword
img: modules/wng-apocrypha/assets/images/factions/tau-white.png
system:
  description: >-
    <p>Dal’yth is a hub of trade and commerce for the T’au Empire, and it is
    home to countless merchant guilds, embassies, and markets. Many of the Water
    caste hail from this world, and even its warriors have a reputation for
    misdirection and subtle cunning.</p><p>• <strong>Air</strong> caste T’au
    from Dal’yth add +2 to the Defence of their vehicles when they perform
    Evasive Action.</p><p>• <strong>Earth</strong> caste T’au from Dal’yth carry
    devices which are cunningly wrought with hidden functions or secret
    countermeasures: double the range of the character’s Tech interaction
    attacks.</p><p>• <strong>Fire</strong> caste T’au from Dal’yth employ
    advanced camouflage systems to obscure their presence; if they do not move
    during their turn, they add +2 to their Defence (as if in cover) until the
    start of their next turn.</p><p>• <strong>Water</strong> caste T’au from
    Dal’yth add +2 to their Cunning, Deception, Insight, and Persuasion
    skills.</p>
