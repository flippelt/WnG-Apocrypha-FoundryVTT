  description: >-
    <p><span class="fontstyle0">These heavy, often improvised, explosive charges
    are a common way to inflict a lot of damage very quickly. The deadly radius
    of these charges is large enough that they should ideally be placed and
    detonated by timer or remote charge, as few warriors can hurl them far
    enough to avoid the blast entirely.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">A demolition charge cannot be used in a grenade launcher.
    In addition, they may be placed onto a vehicle or structure within 1m rather
    than thrown, requiring a Tech test with a DN equal to the vehicle’s Defence.
    Placed melta bombs do not detonate immediately and can be detonated as a
    simple action on any of the character’s subsequent turns.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
