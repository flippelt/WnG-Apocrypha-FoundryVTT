  description: >-
    <p>The foul mutant cannot bear to stand against he who has stood before the
    God-Emperor. Those who dare gaze upon him have their own imperfections
    reflected back upon them; only the most stalwart can stand against this.
    When using this technique, you open yourself up to the currents of the warp
    and act as a mirror, revealing to the viewer what he truly is. If this power
    is successful, any ABHUMAN or MUTANT character within range must take a DN 3
    Fear test. They suffer 1d3 Mortal Wounds at the start of their turn if
    within the power’s range while suffering from Fear.</p>
