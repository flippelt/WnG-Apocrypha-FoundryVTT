  description: >-
    <p><span class="fontstyle0">Artificer armour is not a pattern of armour, but
    a catchall term for individually crafted or carefully modified suits of
    power armour, often worn by the chapter’s heroes. The oldest of these suits
    were created for the Primarchs themselves, and many legendary Chapter
    Masters and Captains of the Adeptus Astartes wear artificer armour
    custom-engineered for them, with ornate representations of personal or
    Chapter heraldry and construction that is as much artwork as functional
    protection. The drawback to such unique craftsmanship is that each suit
    requires extensive attention to maintain, meaning that only senior officers
    (or Techmarines, who often wear less-ornate artificer armour of their own
    construction).</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">6; Powered (4)</span></p><p></p><p><span
