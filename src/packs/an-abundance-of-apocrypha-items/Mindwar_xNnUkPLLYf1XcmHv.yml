  description: >-
    <p>You reach out to attack the mind of an enemy in a desperate mental duel.
    Foes find their thoughts invaded by the crushing presence of their invader,
    whose ancient and inscrutable will triggers cascades of psychosomatic trauma
    and crushes the victim’s personality with terrifying ease. You make an
    opposed Willpower test against the target when the power is used, and at the
    start of each of your turns while the power is sustained. If you win an
    opposed test, then the target suffers 1d3 Mortal Wounds. If the target wins
    the opposed test, the power’s effects end immediately.</p>
