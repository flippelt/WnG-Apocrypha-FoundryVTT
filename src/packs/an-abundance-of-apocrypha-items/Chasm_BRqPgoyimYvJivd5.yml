  description: >-
    <p>You slam your palms together, and then pull them slowly apart. As you do,
    a wide chasm opens beneath the feet of your foes, and they tumble screaming
    into the darkness below In such a state, you are nigh-unstoppable. This
    power affects all creatures in a Blast (6) within range. The ground under
    the target area opens up, creating a sheer-walled pit with a depth equal to
    ten times your Willpower in metres. Any creature in the area, excluding
    those which can fly, may attempt an Agility test with a DN of 5 to scramble
    away; if they succeed, they move up to half their Speed away from the chasm.
    If they fail, they suffer falling damage as they plummet to the bottom. The
    pit remains once the power has been used. You suffer 1d3+2 Shock when you
    use this power, as it is draining to manifest.</p>
