  description: >-
    <p><span class="fontstyle0">Archaeotech systems of powerful gravimetric and
    magnetodynamic coils are implanted within the recipient’s lower body,
    allowing them to become unshackled from gravity’s grasp for short
    periods.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">When activated, the character gains a fly speed equal to
    their Willpower, but they may not Run or Sprint while flying. Each turn the
    character remains aloft, they suffer 1 Shock. The character may also use
    this implant to slow themselves when falling, suffering [[/r 1d3]] Shock, +1
    for every 10 meters fallen, instead of the normal falling damage.</span> <br
