  description: >-
    <p><span class="fontstyle0">A dark gate is a rune-etched tetrahedron that
    opens a portal to one of the forbidden zones of the Webway. Many impossible
    entities make their lairs in these sealed-off fragments, and an open portal
    is an irresistible lure. Moments after the dark gate is cast into the fray,
    a grasping tentacle, flickering pseudopod, or tendril of purest shadow
    flicks out to grab anyone it can catch within its
    grasp.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
