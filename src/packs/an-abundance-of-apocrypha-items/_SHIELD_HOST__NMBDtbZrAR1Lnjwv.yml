system:
  description: >-
    <p><span class="fontstyle0">Led by conclaves of Shield-Captains and boasting
    tens, sometimes hundreds of Custodians, Shield Hosts have the martial
    strength to crush enemy armies and bring entire star systems to heel. The
    gathering of such might is a momentous undertaking -- a Shield Host is only
    assembled to accomplish those tasks that no other Imperial force could be
    trusted with, and its warriors march to war with a singular and implacable
    determination to enact the Emperor's will.</span></p><p></p><p><span
    class="fontstyle0">Most Shield Hosts are temporary formations, but a few
    have remained in active service for many millennia, their functions
    persisting for countless generations.</span></p><p></p><p><span
    class="fontstyle0">All Custodes characters can select a single Shield Host
    to belong to, reflected by the </span><span class="fontstyle2">[SHIELD HOST]
    </span><span class="fontstyle0">keyword, which should be replaced with the
    name of the Shield Host the character belongs to. Those who do not belong to
    any specific Shield Host should select the Emperor’s Chosen host
    instead.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
