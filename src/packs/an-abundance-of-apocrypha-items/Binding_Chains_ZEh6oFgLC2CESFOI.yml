  description: >-
    <p><span class="fontstyle0">These heavy iron chains are inscribed with
    powerful hexagrammic wards designed to assist with the summoning,
    containment, and binding of daemons.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">When these chains are used to bind a living creature, any
    </span><span class="fontstyle2" style="color:rgb(112,0,0);">@UUID[Compendium.wng-core.items.Item.eeSvJvzZBjQvtZq0]{DAEMON}
    </span><span class="fontstyle0">summoned into or possessing that creature is
    </span><span class="fontstyle3">Restrained </span><span
    class="fontstyle0">and suffers +4DN on any Willpower tests to break free. If
    you wrap the chains around yourself, you gain +3 bonus dice on any Opposed
    Willpower test made against a </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">@UUID[Compendium.wng-core.items.Item.eeSvJvzZBjQvtZq0]{DAEMON} </span><span
