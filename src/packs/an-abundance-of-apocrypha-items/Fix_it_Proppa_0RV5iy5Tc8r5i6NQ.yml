  description: >-
    <p>You gain +Double Rank bonus dice on Tech tests to fix any weapon,
    vehicle, or other machine with the ORK keyword. In addition, during a
    regroup or respite, you may tinker with a weapon, vehicle, or other machine
    with the ORK keyword. If tinkering with a weapon, you may add your Rank from
    the weapon’s Range (add the same to all range categories), ED, Salvo rating,
    or any rated Trait the weapon already possesses. Other machines gain a bonus
    of the GM’s discretion. These bonuses last until the next respite, or until
    the machine suffers a complication, whichever comes first.</p>
