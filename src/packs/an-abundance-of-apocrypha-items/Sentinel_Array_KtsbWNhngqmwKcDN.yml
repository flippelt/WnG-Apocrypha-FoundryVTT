  description: >-
    <p><span class="fontstyle0">Connected to an Eversor’s mask is a
    sophisticated collection of augurs, auspexes, and microcogitators which
    always gather and process readings from the wearer’s surroundings. While
    short-ranged, this still provides the Eversor with a detailed 360° view of
    their immediate environment: they can see in all directions simultaneously,
    and thus foes cannot try to sneak away.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The Eversor may choose to make a ranged attack or a melee
    attack—at the assassin’s discretion—as a Reflexive Action whenever an enemy
    tries to move away while engaged, even if those enemies use the Fall Back
    option to do so.</span> <br style=" font-style: normal; font-variant:
