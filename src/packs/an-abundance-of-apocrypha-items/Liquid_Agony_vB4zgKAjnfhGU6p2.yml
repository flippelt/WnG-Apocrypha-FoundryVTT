system:
  description: >-
    <p><span class="fontstyle0">Popular amongst nobles of the Kabal of the
    Splintered Talon involved in realspace raids against particularly valuable
    targets and those fighting rivals at home alike, Liquid Agony is a potent
    neurotoxin that amplifies nerve conductivity to extreme levels, turning even
    the weight of clothing and the caress of the air into torturous sensations.
    Some Drukhari in the depths of Commorragh imbibe tiny quantities of Liquid
    Agony to heighten the sensations they experience, but overdoses are all too
    common and leave the wretched beings in a state of perpetual agony just long
    enough for a hungry soul to find the source of the screams and drink deep of
    the self-inflicted pain.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The target’s senses are overwhelmed with pain while
    </span><span class="fontstyle3">Poisoned</span><span class="fontstyle0">;
    the character suffers 1d3 Shock at the start of each of their turns, and
    doubles the amount of Shock they suffer from other sources</span>.</p>
