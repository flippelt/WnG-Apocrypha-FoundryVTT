  description: >-
    <p><span class="fontstyle0">Used extensively during the brutal tunnel
    fighting and boarding actions of the Great Crusade, boarding shields fell
    out of use after Storm Shields were developed to fight in those same
    conditions. Massive bulky shields fitted with a power field generator, these
    shields were designed to be used in close quarters firefights as much as in
    melee, with most designs having a cut-out where a bolter or other weapon can
    be placed without exposing the wielder. Some Chapters retain stores of these
    for unusual situations, but the dedicated Breacher Squads that used to wield
    them were phased out with the Codex Astartes.</span></p><p></p><p><span
