system:
  description: >-
    <p><span class="fontstyle0">This toxin creates terror in its victims, no
    more, no less. Though the exact composition of this poison is a jealously
    guarded secret of those Haemonculi Covens and Shaimeshi Toxin-Cults who have
    mastered it. By chemically influencing the “fight or flight” reaction, and
    then triggering it, an overwhelming sense of panic and dread afflicts the
    victim, without obvious cause or reason—something that is arguably more
    terrifying than being afraid of anything specific. In many cases, the
    horrified psyche tries to invent some fearful apparition to justify the
    terror, a feat of self-delusion that only serves to act as a beautiful
    accompaniment to the Dark Eldar feeding upon this unreasoning panic.
    Hard-won experience has taught the Dark Eldar that this poison does not have
    an effect on all of their foes— even the most concentrated dose does not
    influence a Space Marine in any way, and it seems to merely enrage
    Orks.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">The target is filled with dread while
    </span><span class="fontstyle3">Poisoned</span><span class="fontstyle0">;
    the character is under the effects of </span><span class="fontstyle3">Terror
    </span><span class="fontstyle0">while </span><span
    class="fontstyle3">Poisoned </span><span class="fontstyle0">and they cannot
    recover from </span><span class="fontstyle3">Terror </span><span
    class="fontstyle0">until after the </span><span class="fontstyle3">Poisoned
    </span><span class="fontstyle0">effect is ended. Ork characters become
    </span><span class="fontstyle3">Frenzied </span><span
    class="fontstyle0">instead, while Adeptus Astartes and Primaris Astartes
    characters are completely unaffected by this poison.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
