name: URANI-SURTR REGULATES
type: keyword
img: modules/wng-core/assets/ui/aquila-white.webp
system:
  description: >-
    <p><span class="fontstyle0">The Kindreds of the URSR have long held onto a
    swathe of heavily contested and enemy-ridden territories in the southern
    reaches of the Galactic Core. On one border they face the Necron Samnokh
    Dynasty, from the Shattered Stars the raiding Ork fleets of Bogg Da
    Freeboota King, and in its northernmost Gnawstar Cluster Tyranid
    infestations. Other Kindreds may have given grounds to these foes, but the
    URSR refuse to do so. Nor do they show any inclination to explain their
    apparent stubbornness to other Leagues, beyond asserting that their
    Ancestors would abandon them should they retreat. Some Grimnyr believe that
    the Urani-Surtr guard some secret of great import or are privy to knowledge
    whose burden they shoulder alone. Others suspect that they are bound by rash
    Grudges sworn by their fore-bearers against their encroaching foes, and they
    must see these through whatever end they meet. The most cynical claim that
    the Kindreds of the URSR are simply too stubborn to admit their holdings are
    not worth the effort of defence.</span></p><p></p><p><span
    class="fontstyle2"><strong>TO THE LAST</strong>: </span><span
    class="fontstyle0">You add +Rank to your Resolve, and you add +1 to your
    Determination.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
