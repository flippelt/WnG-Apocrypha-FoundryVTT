  description: >-
    <p><span class="fontstyle0">A Flip Belt or Inertia Pivot (known as
    </span><span class="fontstyle2">geirgilath </span><span
    class="fontstyle0">or a "belt of speed" in the Eldar language) is an item
    worn exclusively by the mysterious Eldar Harlequins. This device is a wonder
    of Eldar technology, a portable antigrav generator keyed to trigger upon the
    mental command of its wearer. So incredibly lightweight are Flip Belts that
    they do nothing to hamper their wearer's natural agility. Instead, they
    heighten it to the point that Harlequins can leap clean over all but the
    most towering obstacles, springing and bounding through rubble and wreckage
    with supernatural ease.</span></p><p></p><p><span
    class="fontstyle3"><strong>Effect</strong>: </span><span
    class="fontstyle0">A character wearing a Flip-Belt ignores the effects of
    difficult terrain, can ignore any obstacles less than 2m tall or wide during
    their movement, and may stand up from prone as a free action at any time
    without penalty. In addition, a Harlequin wearing a flip-belt determines
    jump distance using their Agility instead of their Strength, and they do not
    suffer falling damage unless unconscious.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
