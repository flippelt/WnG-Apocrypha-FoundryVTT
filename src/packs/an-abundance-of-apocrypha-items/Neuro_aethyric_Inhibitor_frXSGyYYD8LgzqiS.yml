  description: >-
    <p><span class="fontstyle0">Some psykers, while potent, are on the edge of
    being too unstable to be useful to the Imperium. While many of these are
    slain as a precaution, a few are implanted with inhibitors which serve to
    contain their power when it grows out of control. This does dampen some of
    the psyker’s innate power, but this is for their own
    good.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">Your Willpower is reduced by 1. When you
    suffer a Wrath Complication on a Psychic Mastery test, you may activate this
    implant: you immediately suffer 1 Mortal Wound. Then, when you roll on the
    Perils of the Warp table, roll [[/r 2d6]], and which ever die rolls lowest
    is the ‘tens’ die.</span> </p>
