  description: >-
    <p><span class="fontstyle0">Mounted over the shoulder of a Dire Avenger’s
    armour is an advanced targeting system which connects both to the warrior’s
    Avenger Shuriken Catapult and to the warrior’s warhelm. This multispectral
    rangefinder operates autonomously, identifying targets and distinguishing
    friend from foe, and feeding this information to warrior’s
    visor.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">A warrior wearing a Targeting Vane reduces
    range DN penalties by 2. In addition, if the warrior aims, they add an
    additional +1d bonus to the following ranged attack.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
