  description: >-
    <p>By examining the flow of the warp around you, you can anticipate near
    future actions and move outside the normal flow of events by choosing
    strands of reality and slipping between them. This power can be of great
    benefit, but it can also be extremely dangerous. If this power is
    successful, you may take a second turn at any point before the start of your
    next normal turn. After you use this power, you suffer 1d3 Shock. In
    addition, if you fail to use this power, you disappear from reality
    temporarily, reappearing at the end of your next turn.</p>
