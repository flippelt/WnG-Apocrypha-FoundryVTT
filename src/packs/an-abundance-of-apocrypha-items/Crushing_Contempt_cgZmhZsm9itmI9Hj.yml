  description: >-
    <p>Your glowering stare bores into the enemy, your manifest disdain and
    anger intensifying by the moment until they feel its weight as a physical
    force. It causes them to stagger and strain simply to keep from collapsing
    altogether. This targets all enemies in a Blast (6) within range and line of
    sight. Enemies affected suffer 1d3 Shock and must attempt a Resolve test
    with a DN of 5; if they fail, they are Prone and Staggered until the start
    of your next turn.</p>
