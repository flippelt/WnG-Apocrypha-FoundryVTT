  description: >-
    <p>You sever the connection between the Materium and the Immaterium. Daemons
    and warp entities will diminish and fade without their link to the warp, and
    others who draw upon the Immaterium will struggle to wield their powers. If
    successful, an area centred on you with a radius of your Willpower x 5m is
    temporarily sealed off from the Warp. This area remains fixed in place and
    does not move with you. DAEMONS suffer 1d3 Mortal Wounds at the start of
    each turn they begin within that area, and they cannot roll Determination
    while within the area. PSYKERS within the area can only use their powers at
    the Bound power level, and they add +2 DN to all Psychic Mastery tests.</p>
