  description: >-
    <p><span class="fontstyle0">The Scatter Laser, called a </span><span
    class="fontstyle2">sierbahn </span><span class="fontstyle0">in the Eldar
    language, is a heavy laser weapon commonly used by the Eldar. Originally
    created for use on War Walkers and Wraithlords, they are also used as a
    support weapon for Guardian squads, where it is mounted on a Grav Platform.
    The weapon is comprised of six separate laser chambers which can be fired
    simultaneously or in bursts, at either the same or different targets, and
    uses crystalline power cells to store energy. It is similar in some respects
    to the Imperium's Multi-laser, but far more refined and energy
    efficient</span>.</p>
