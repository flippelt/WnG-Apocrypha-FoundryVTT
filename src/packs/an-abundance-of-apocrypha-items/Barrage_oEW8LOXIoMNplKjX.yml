  description: >-
    <p><span class="fontstyle0">A particularly nasty stimm not used on a
    voluntary basis because of its horrendous side effects. It works by
    bombarding the user with a cocktail of chemicals that power muscle strength,
    pain resistance and sensory acuity, but at the same time these functions are
    slowly destroyed by the drugs.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Taking a dose of Barrage adds +3 to Strength, Toughness,
    and Agility for [[/r 1d3+2]] rounds (or minutes out of combat). After this
    effect ends, the character suffers [[/r 1d3]] Wounds, and is </span><span
    class="fontstyle3">Exhausted </span><span class="fontstyle0">until their
    next Regroup. A single purchase contains 3 doses.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
