  description: >-
    <p><span class="fontstyle0">Crafted exclusively by the Artisans of the Forge
    World of Deimos for the Grey Knights, these customised suits of Terminator
    Armour contain similar psychic protections as Aegis-pattern Power Armour.
    Grey Knights frequently take to battle in Terminator armour, as they require
    the protection when facing the mightiest and deadliest of daemonic
    foes.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">7; Cumbersome, Powered
    (5)</span></p><p></p><p><span class="fontstyle2"><strong>Aegis
    Terminatus</strong>: </span><span class="fontstyle0">The wearer may roll
    Determination against Mortal Wounds. Further, enemy psychic powers which
    target the wearer suffer +2DN. Finally, the wearer adds +Rank bonus dice
    when rolling Determination against any attack from a </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">DAEMON</span><span
    class="fontstyle0">.</span> </p>
