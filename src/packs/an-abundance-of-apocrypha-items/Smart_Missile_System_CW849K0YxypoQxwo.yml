  description: >-
    <p><span class="fontstyle0">A Smart Missile System is an advanced T'au
    weapon system that fires clusters of small missiles, each guided by a drone
    processor unit built into its warhead, intended for use against masses of
    enemy infantry, particularly those hiding in
    cover.</span></p><p></p><p><span class="fontstyle0">Upon their launch, the
    "Smart Missiles" will search for targets within sensor range before
    selecting and engaging one based on criteria previously detailed by the
    weapon's operator.</span></p><p></p><p><span class="fontstyle0">These
    targets do not have to be within line of sight of the operator, as once the
    target has been acquired, the missiles are able to effectively home in on
    it, manoeuvring their thrusters to propel them around any intervening
    terrain as they hunt the enemy down to an explosive conclusion.</span> <br
