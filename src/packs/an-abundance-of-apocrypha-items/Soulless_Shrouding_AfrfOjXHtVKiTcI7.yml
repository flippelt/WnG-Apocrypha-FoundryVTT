  cost: 30
  requirements: Pariah species, Willpower 7+
  description: >-
    <p>Your negative aura is such that mortal minds often simply refuse to
    perceive you.</p><p>Whenever you have a Stealth Score, it increases by
    +Rank. Further, if you would not have a Stealth Score at the start of your
    turn, you gain a Stealth Score equal to your Rank at the start of your
    turn.</p><p>Finally, if your Stealth Score is currently higher than a
    creature’s Willpower, they cannot perceive you at all—their minds refuse to
    acknowledge your presence.</p><p>This talent ceases to work if you are
    Exhausted or Wounded.</p>
