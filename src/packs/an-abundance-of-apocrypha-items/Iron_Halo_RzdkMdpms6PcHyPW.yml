  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">Normally mounted within a metal ring mounted on
    the wearer’s backpack, appearing like the halo it is named for, the Iron
    Halo is a forcefield generator commonly issued to Astartes officers,
    typically those of Captain (or equivalent) rank or higher. The field is
    quite potent, as it can draw directly from the power supply of the wearer’s
    armour.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">*4; Power Field</span></p><p></p><p><span
    class="fontstyle2"><strong>Symbol of Authority</strong>: </span><span
    class="fontstyle0">A character wearing an Iron Halo gains +Double Rank bonus
    dice on all Leadership tests to command characters with the </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">ADEPTUS ASTARTES </span><span
    class="fontstyle0">keyword.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
