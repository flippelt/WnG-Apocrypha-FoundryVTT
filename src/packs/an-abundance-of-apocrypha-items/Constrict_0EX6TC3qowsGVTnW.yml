  description: >-
    <p><span class="fontstyle0">With a word, thought, or gesture, you can
    command the flesh of your target to sharply contract. The target’s windpipe
    closes, choking them and cutting off their breath.</span></p><p></p><p><span
    class="fontstyle0">The target begins to suffocate (see p. 201) and will fall
    unconscious after a number of rounds equal to twice their Toughness
    (Astartes characters double this). Each round they must pass a DN 3
    Toughness test or suffer 1d3 Shock, falling unconscious when they reach
    maximum Shock.</span></p><p><span class="fontstyle0">Ending the power’s
    effect allows the target to breathe again.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
