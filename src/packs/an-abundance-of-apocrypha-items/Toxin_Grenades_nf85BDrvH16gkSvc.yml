  description: >-
    <p><span class="fontstyle0">A broad category of high-potency chemical
    weapons, toxin grenades are loaded with a frighteningly deadly cocktail of
    synthetic toxins and those harvested from Deathworld creatures such as the
    Catachan Devil and the Scarlet Lasher of Luther McIntyre IX. The resulting
    toxin is concentrated, aerosolised, and adapted to be absorbed into the body
    as quickly as possible. The result is a toxic cloud which kills extremely
    quickly and is lethal to almost everything. The Drukhari, who consider
    poisoning an art-form, are known to use similar devices called </span><span
    class="fontstyle2">Brathu-Shaimesh </span><span class="fontstyle0">(Kiss of
    the Poisoner), filled with the deadliest toxins their artisans can
    distill.</span></p><p></p><p><span
    class="fontstyle3"><strong>Special</strong>: </span><span
    class="fontstyle0">Toxin Grenades do not inflict damage normally. Rather,
    anyone in the area must pass a DN 7 Toughness test or suffer the
    </span><span class="fontstyle2">Poisoned 7 </span><span
    class="fontstyle0">condition. A creature </span><span
    class="fontstyle2">Poisoned </span><span class="fontstyle0">by a Toxin
    Grenade suffers 2d3 Mortal Wounds at the start of each of their
    turns.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
