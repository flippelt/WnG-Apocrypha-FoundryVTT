  description: >-
    <p>You form a bridge between your mind and the mind of your target. Through
    this connection, you pour the raw power of the Warp into the target’s mind,
    overwhelming them. This power can have a devastating effect upon you as well
    as upon the target. Target a single enemy you can see within range and make
    an opposed Willpower test against them: if you win, the target suffers 1d3+2
    Mortal Wounds. If you lose, however, you suffer 1d3+2 Corruption Points from
    the backlash.</p>
