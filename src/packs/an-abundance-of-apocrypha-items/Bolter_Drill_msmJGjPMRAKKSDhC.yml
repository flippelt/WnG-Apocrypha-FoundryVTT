  requirements: ' IMPERIAL FISTS keyword or CRIMSON FISTS keyword'
  description: >-
    <p>Your aim is guided by years, even decades, of marksmanship training, and
    you can unleash a<br>devastating fusillade of bolter fire.<br>When you make
    a successful attack with a weapon with the Bolt keyword, and you roll a 6 on
    your Wrath die, instead of inflicting a critical hit you may choose to spend
    1 ammo and make an additional attack with that weapon immediately, at the
    same target or another within 2+Rank metres of the initial target. This
    additional attack may not generate any further attacks.</p>
