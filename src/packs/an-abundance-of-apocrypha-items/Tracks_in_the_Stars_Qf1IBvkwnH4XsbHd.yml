  description: >-
    <p>When a ship travels through either realspace or the warp it leaves a
    faint trail, the lingering shadow of its warp drive. Using your third eye,
    you can follow this trail across the stars. If this power is successful, you
    can perceive and follow the trail of a ship through realspace, so long as
    the trail is no older than a number of weeks equal to your Intellect, though
    at GM’s discretion especially large vessels may have a trail that lasts
    longer.</p>
