system:
  description: >-
    <p><span class="fontstyle0">This weapon has been crafted with a blade of the
    rare and deadly Darkstar ore. This mineral has the strange property of being
    able to shut down the electrical and biological processes in anything it
    strikes.</span></p><p></p><p><span class="fontstyle0">Any melee weapon with
    the </span><span class="fontstyle2"><strong>BLADE</strong> </span><span
    class="fontstyle0">keyword may take this upgrade.</span></p><p></p><p><span
    class="fontstyle2" style="color:rgb(0,0,0);"><strong>Effect</strong>:
    </span><span class="fontstyle0">The weapon’s damage is increased by +2, and
    it gains +1ED and the Mortal (1) trait. Further, damage inflicted by a
    Darkstar weapon cannot be negated by rolling Determination.</span> <br
    style=" font-style: normal; font-variant: normal; font-weight: normal;
