  description: >-
    <p>Kin receive the @UUID[Compendium.wng-core.items.Item.vrdG89pRrXMvl2VZ]{ABHUMAN} keyword. In
    addition, each Kin may select a single Cloneskein Trait from the list
    below.</p><ul><li><p><strong>Thermographic Vision:</strong> You ignore
    penalties or DN increases on skill tests due to visual conditions, as if you
    were wearing Preysense Goggles.</p></li><li><p><strong>Heightened
    Reflexes:</strong> In combat, each round, if you have not yet acted, your
    side may Keep the Initiative without spending Glory, but only if you are the
    next character to act.</p></li><li><p><strong>Void-Hardened:</strong> You
    gain +2 bonus dice on all Toughness tests to resist the effects of
    suffocation, extreme heat and cold, and radiation.</p></li></ul>
