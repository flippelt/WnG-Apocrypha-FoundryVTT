  rarity: unique
  description: >-
    <p><span class="fontstyle0">An ancient and revered form of Tactical
    Dreadnought Armour, Cataphractii armour was the first form to be issued to
    Astartes Terminator squads, this armour is nigh-indestructible due to heavy
    adamantium plating and high-powered force field generators, but this came at
    the expense of mobility. Few of these suits remained in active service after
    the Horus Heresy—most Terminator squads used one of the other patterns of
    Tactical Dreadnought Armour—but a small number of them remain in Chapter
    armouries.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">8; Bulk (2), Cumbersome, Powered
    (5)</span></p><p></p><p><span class="fontstyle2"><strong>Cataphractii Field
    Generator</strong>: </span><span class="fontstyle0">The wearer may roll
    Determination against Mortal Wounds. In addition, the wearer adds +2 bonus
    dice when they roll Determination.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
