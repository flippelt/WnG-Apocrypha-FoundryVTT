  description: >-
    <p>You are a psyker; you have all the Universal psyker abilities, you know
    the Smite psychic power. You know the Maleficarum discipline, and receive
    one power from that Discipline, and you may select one other Psychic
    Discipline of your choice to learn powers from. </p><p>Further, when you use
    a psychic power, you may re-roll up to Tier dice on your Psychic Mastery
    test, but each dice you re-roll counts as an additional Wrath Complication.
    </p><p>In addition, you gain 1d3x2 Corruption when you select this
    Archetype.</p>
