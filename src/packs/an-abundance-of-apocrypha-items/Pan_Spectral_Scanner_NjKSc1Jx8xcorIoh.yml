  description: >-
    <p><span class="fontstyle0">A pan spectral scanner, also called a pan
    spectral array, is a powerful information-gathering and diagnostic tool
    available to the Kin of the Leagues of Votann. Pan spectral scanners exist
    in several different sizes, including Kin-portable or vehicle or
    installationmounted. The larger systems possess more range, power and
    diagnostic capability.</span></p><p></p><p><span class="fontstyle0">The
    Kin's pan spectral scanners are useful both in prospecting for strategic
    resources and combat. They can detect an incredible range of energy spectra
    not only through solid matter, but even across multidimensional wavelengths,
    such as Warp energy signatures, ensuring the Hernkyn are rarely surprised
    during their explorations by even the most cunning or esoterically empowered
    foes.</span></p><p></p><p><span class="fontstyle0">These scanners are
    equally unlikely to miss the presence of natural resources the Kin would
    prize. When such rich discoveries are made, Hernkyn mark the location using
    powerful claim-beacons, whose multispectral energy signatures are bounced
    back along networks of relay satellites all the way to League space. It is
    at such times that the Cthonian Mining Guilds rumble into action to begin
    exploiting the new resource deposits.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">This functions as an Auspex (page 236 of the </span><span
    class="fontstyle3">Wrath & Glory core rulebook</span><span
    class="fontstyle0">). In addition, the user increases their Passive
    Awareness by Double Rank.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
