  description: >-
    <p>Commonly wielded by elite Einhyr warriors, concussion hammers—sometimes
    also called mass hammers—are a reinforced haft topped with a head containing
    powerful “mass driver” technology that significantly increases the impact
    forces of the weapon’s strikes. The construction of the weapon allows it to
    deliver much heavier strikes than concussion gauntlets, but it takes a
    skilled combatant to control the weapon’s power and direct it properly: in
    the hands of the unskilled, a concussion hammer would be dangerously
    cumbersome.</p>
