  description: >-
    <p><span class="fontstyle0">A Heavy Rail Rifle is a potent weapon that makes
    use of the same technologies as the larger Railgun. However, the Heavy Rail
    Rifle is intended for use on a slightly smaller scale so that it can be
    mounted on Tau Battlesuits. Whilst the weapon’s range and damage is not as
    great as its larger cousin, it is still an impressive anti-tank weapon,
    renowned for its deadliness to enemy armour at extreme ranges. XV88
    Broadside Battlesuits are the only Tau unit that are armed with Heavy Rail
    Rifles.</span> <br style=" font-style: normal; font-variant: normal;
