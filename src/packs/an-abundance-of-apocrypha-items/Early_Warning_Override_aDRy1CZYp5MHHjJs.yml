  description: >-
    <p><span class="fontstyle0">An Early Warning Override is an advanced sensor
    suite that has been calibrated to detect the electronic signatures of
    teleport beams and orbital-entry jump systems. If such a signal is detected,
    the system jolts a T'au Battlesuit's weapons to lock-on status and firing
    before the target has a chance to react. This Support System is available to
    most forms of T'au Battlesuit.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">When you are Charged, you may use your Reflexive Action
    and spend 1 ammo to make a ranged attack against the enemy Charging you.
    This attack is resolved before the Charge begins. This is considered a Salvo
    option, so you must reload your weapon after this attack before you can fire
    it again.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
