  description: >-
    <p><span class="fontstyle0">These sophisticated forms of auspex provide a
    remarkable combination of visual and multi-spectral observation-and-analysis
    technologies, which gather every scrap of data from the wearer's
    surroundings.</span></p><p></p><p><span class="fontstyle0">With training,
    this flood of information allows the wearer to fight in an almost
    precognitive fashion, responding to situations far more swiftly than they
    would be able to unaided.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A </span><span class="fontstyle3">Divinator</span><span
    class="fontstyle0">-class Auspex functions like a normal Auspex in all
    regards. In addition, when an enemy within 15m moves, the wearer may spend
    one ammunition to make an immediate ranged attack as a Reflexive Action, at
    +4 DN, against that enemy. This is a Salvo action and requires that the
    wearer reloads afterwards.</span> <br style=" font-style: normal;
