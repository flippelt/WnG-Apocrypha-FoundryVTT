system:
  quantity: 1
  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">Holo-suits (</span><span
    class="fontstyle2">dathedi </span><span class="fontstyle0">in Eldar,
    translated as "between colours") are used by the Harlequins. Each contains a
    programmable holo-field which breaks up the outline of the wearer as they
    move. When the wearer of a holosuit moves, their form appears to shatter
    into a storm of light and colour, coalescing again when the wearer stops.
    When the wearer remains still for a few moments, the holosuit instead makes
    the wearer blend in with their surroundings. Regardless, a skilled wearer is
    extraordinarily difficult to strike.</span></p><p></p><p><span
    class="fontstyle3">Armour Rating: </span><span class="fontstyle0">*1, Agile,
    Power Field</span></p><p></p><p><span class="fontstyle3"><strong>Domino
    Field</strong>: </span><span class="fontstyle0">A Holo-Suit increases the
    wearer’s Defence based on how much they have moved. It grants +1 Defence if
    the wearer was stationary last turn. This increases to +2 if the wearer
    moved, +3 if the wearer Ran, or +4 if the wearer Sprinted.</span> <br
    style=" font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
