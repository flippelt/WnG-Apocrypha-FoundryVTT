  description: >-
    <p>Using this power and gazing into the void whilst aboard ship, you can
    learn things about space in the immediate vicinity of your vessel. This can
    reveal hidden dangers such as mines, void creatures, and concealed ships, as
    well as more mundane perils like asteroids and debris. If successful, while
    the power remains in effect, you can make Awareness tests to detect
    spaceborne objects within a distance of your Intellect x 10,000km, without
    the use of starship augurs.</p>
