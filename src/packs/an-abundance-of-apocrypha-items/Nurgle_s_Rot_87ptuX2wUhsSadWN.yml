  description: >-
    <p><span class="fontstyle0">The Plague Lord's most infamous accomplishment
    sets the benchmark for all his other creations. Despite millennia of effort,
    he has never bettered that disease which bears his name: Nurgle's Rot. You
    are a vector for this blessed malady, a carrier for this most virulent of
    pathogens.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Any living creature without the </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">NURGLE </span><span
    class="fontstyle0">keyword within 7m of you at the start of their turn must
    roll [[/r 1d6]]. If an Exalted Icon is rolled, they immediately suffer the
    </span><span class="fontstyle3">Poisoned (7) </span><span
    class="fontstyle0">condition. While </span><span class="fontstyle3">Poisoned
    </span><span class="fontstyle0">from Nurgle’s Rot, a creature suffers [[/r
    1d3]] Mortal Wounds at the start of each of their turns.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
