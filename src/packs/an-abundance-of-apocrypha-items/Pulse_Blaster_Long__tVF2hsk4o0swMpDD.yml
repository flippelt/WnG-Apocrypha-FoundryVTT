  description: >-
    <p><span class="fontstyle0">The Pulse Blaster, also known as a Pulse
    Shotgun, is a type of T'au Pulse Weapon. Commonly used by Fire Warrior
    Breacher Teams. Like the Human Shotgun in function, the Pulse Blaster is
    designed to deliver powerful close-range firepower. Though the T'au are
    historically disdainful of close-range warfare, the Pulse Blaster had to be
    developed due to T'au difficulties in urban combat on labyrinthine confined
    Imperial Hive Worlds.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
