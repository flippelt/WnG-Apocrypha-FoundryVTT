  description: >-
    <p><span class="fontstyle0">Champions of Slaanesh often partake of bizarre
    and horrific combat drugs, produced from renderings of sentient creatures
    and suffused with the power of the warp. These drugs are often dispensed
    from baroque injector rigs fused into the user’s
    armour.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">As a Simple Action, the user may administer a dose of
    these Combat Stimms, which have an effect which lasts until the start of
    their next turn. The user may select up to three effects from the following
    list, and then suffers Mortal Wounds equal to the number of effects
    chosen:</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p><ul><li><p><span
    class="fontstyle0">+2 dice on Athletics tests</span> </p></li><li><p><span
    class="fontstyle0">+2 dice on Weapon Skill tests</span>
    </p></li><li><p><span class="fontstyle0">Melee attacks inflict +2ED</span>
    </p></li><li><p><span class="fontstyle0">+2 Determination</span>
    </p></li><li><p><span class="fontstyle0">Ignore up to 2 points of DN penalty
    on a MultiAttack.</span> </p></li></ul>
