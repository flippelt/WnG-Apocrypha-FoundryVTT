  description: >-
    <p>You scry possible futures to foresee imminent danger, then aid your
    allies in avoiding it. The terrors of the warp recoil from your mind, while
    shots pass through thin air where Asuryani warriors stood a moment before.
    Select a number of allies equal to your Willpower within range. Until the
    start of your next turn, when they roll Determination, they roll a number of
    dice equal to your Intellect, and each Icon rolled negates a single Wound or
    Mortal Wound, rather than converting Wounds into Shock.</p>
