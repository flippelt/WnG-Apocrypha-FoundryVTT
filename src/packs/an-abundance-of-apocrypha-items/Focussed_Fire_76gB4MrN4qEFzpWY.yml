name: Focussed Fire
type: talent
img: modules/wng-core/assets/icons/talents/talent.webp
system:
  effect: ''
  cost: 30
  requirements: Dark Reaper aspect
  description: >-
    <p>You direct your attention—and your firepower—at a single foe, seeking to
    eliminate them utterly, regardless of other factors or distractions. You may
    nominate a single enemy—not a mob, but any individual threat—within 36m as a
    priority target as a free action at the start of your turn. Until the start
    of your next turn, any ranged attacks from you or members of your squad at
    that priority target may re-roll any dice which roll 1 on their skill test
    and on their damage roll. Further, the enemy may not use any Ruin abilities
    or other special abilities which would redirect the attack to another
    target.</p>
