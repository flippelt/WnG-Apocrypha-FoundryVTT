  description: >-
    <p>The Honour Staff borne by T&rsquo;au Ethereals is mainly used as a symbol
    of office, as ceremonial weapons, and in self-defence. While each weapon is
    custom-made, they all feature a broad blade fitted to a long, lightweight
    metallic staff.</p>

    <p>Ethereals use the blades primarily to settle disputes, engaging in
    lengthy, highly stylised duels that are more coordinated co-meditation than
    combat. The combatants dance and weave as if in a trance, their weapons
    flashing past one another scant millimetres and microseconds from causing
    terrible damage. Yet somehow, the dance is always bloodless, as if the
    Ethereals are in total union with one another. In truth, the combatants are
    engaged in a deeply spiritual duel, conducted at a level which none outside
    of their caste can discern.</p>
