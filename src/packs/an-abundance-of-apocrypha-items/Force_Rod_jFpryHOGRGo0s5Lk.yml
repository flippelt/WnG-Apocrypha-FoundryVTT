  description: >-
    <p>These stout crystalline rods are usable as weapons to a limited degree,
    but they are more useful as a way to store psychic energy for later
    use.</p><p><strong>Special</strong>: When the wielder of a Force Rod
    succeeds at using a psychic power, they may store Exalted Icons rolled on
    that Psychic Mastery test. These icons may be spent to gain additional dice
    on subsequent Psychic Mastery tests, or to purchase Potency options on
    psychic powers used later. The weapon may store a maximum of 6 Exalted
    Icons.</p>
