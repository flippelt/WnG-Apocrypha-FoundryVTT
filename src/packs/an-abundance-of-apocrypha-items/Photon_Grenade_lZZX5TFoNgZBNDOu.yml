  description: >-
    <p><span class="fontstyle0">A Photon Grenade is a type of T'au defensive
    grenade that all Fire Warriors and Pathfinders are equipped with as standard
    wargear. Photon Grenades are designed to be used in a situation where enemy
    forces advance too close to a T'au firing line.</span></p><p></p><p><span
    class="fontstyle0">A Photon Grenade can repel the attackers with an awesome
    pulse of multi-spectrum light and a deafening sonic burst to blind and
    disorient attackers, confusing them and slowing their charge so that the Tau
    infantry are able to respond with further volleys of lethal
    firepower.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Photon Grenades do not inflict damage. Rather, each enemy
    caught in the blast immediately suffers the </span><span
    class="fontstyle3">Blinded </span><span class="fontstyle0">and </span><span
    class="fontstyle3">Staggered </span><span class="fontstyle0">conditions
    until the end of their next turn.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
