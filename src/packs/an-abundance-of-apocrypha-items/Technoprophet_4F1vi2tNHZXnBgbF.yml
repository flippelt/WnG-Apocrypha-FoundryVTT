  description: >-
    <p>You may purchase psychic powers from the Divination discipline even
    though you are not a Psyker, and you know one power from that Discipline.
    Using these powers requires an Investigation test in place of a Psychic
    Mastery test, and you do not choose a power level. Use of these abilities is
    not considered a psychic power. A Complication that results from one of
    these abilities inflicts 1d3+1 Shock, due to logic errors and paradoxical
    outcomes.</p>
