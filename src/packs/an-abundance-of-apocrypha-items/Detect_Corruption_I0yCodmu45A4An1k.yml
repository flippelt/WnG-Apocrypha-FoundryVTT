  description: >-
    <p>Psykers, by their very nature, are attuned to the Warp. You can discern
    the telltail stain of corruption upon objects, places, and even people. When
    you use this ability, choose an object you can see within range. You detect
    whether or not the object has been in contact with the warp, affected by
    psychic powers, or other warp-related abilities within a number of hours
    equal to your Intellect.</p>
