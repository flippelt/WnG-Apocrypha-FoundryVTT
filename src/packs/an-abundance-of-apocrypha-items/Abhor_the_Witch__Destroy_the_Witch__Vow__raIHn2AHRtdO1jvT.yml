  description: >-
    <p>Your disdain for sorcery is palpable, repelling the vile arts of wyrd and
    witch.</p>

    <p>Once per battle, when an enemy @UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKER} is within
    your line of sight at the start of your turn, you may add +Double Rank to
    your Speed. In addition, you may reroll all ED which roll a 1 on melee
    attacks made against @UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKERS}.</p>

    <p>However, you add +2DN to all non-attack skill tests attempted while you
    can see a @UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKER}. You may only have one Vow
    talent.</p>

    <p>During downtime, you may replace this talent with any other
    @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.d3vDOtbmIhagzSuf]{BLACK TEMPLARS} talent marked as a Vow.</p>
