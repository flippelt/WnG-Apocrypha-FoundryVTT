  description: >-
    <p>You use your mastery of the warp to fog the minds of your enemies,
    clouding their senses so that your allies appear as nothing more than
    indistinct shadows. If successful, select a number of allies within range
    equal to your Willpower. While this power remains, enemies attempting to
    detect the selected allies add +2 to the DN of their Awareness tests and
    count their Passive Awareness as 0.</p>
