folder: ZMoR03HW5eXVf9E1
name: Power Through Pain
type: talent
img: modules/wng-core/assets/icons/talents/talent.webp
system:
  effect: ''
  cost: 20
  requirements: Drukhari species
  description: >-
    <p>Your soul slips away, little by little, and you replenish it by drinking
    deep of the anguish and despair of others.<br>You gain one Pain point
    whenever an enemy does one of the following within Willpower+Rank metres of
    you: a character suffers three or more Wounds from a single attack, you
    affect an enemy with an Intimidation interaction attack, a character fails a
    Resolve test, a character becomes
    @UUID[JournalEntry.0NDkZwUGfw0e3KAj]{Exhausted.}<br>You immediately recover
    +Rank Shock whenever you gain a Pain point. Further, you gain an increasing
    bonus for the number of Pain points you&rsquo;ve obtained, as described on
    the table below. You lose all accumulated Pain points upon taking a Regroup
    or Respite.</p>

    <p>&nbsp;</p>

    <table style="width: 100%; height: 119px;" border="1"><colgroup><col
    style="width: 17.7124%;"><col style="width: 82.2876%;"></colgroup>

    <tbody>

    <tr style="width: 100.072%; height: 17px; text-align: center;
    background-color: #734ea0; color: #dddddd;">

    <td style="height: 17px;">Pain Points</td>

    <td style="height: 17px;">Effect</td>

    </tr>

    <tr style="height: 17px;">

    <td style="height: 17px; text-align: center;">1</td>

    <td style="height: 17px; text-align: center;"><strong>Inured to
    Suffering:</strong> +1 Resilience</td>

    </tr>

    <tr style="height: 17px;">

    <td style="height: 17px; text-align: center;">2</td>

    <td style="height: 17px; text-align: center;"><strong>Eager to
    Flay:</strong> +Rank to Speed.</td>

    </tr>

    <tr style="height: 34px;">

    <td style="height: 34px; text-align: center;">3</td>

    <td style="height: 34px; text-align: center;"><strong>Flensing Fury:
    </strong>+Rank bonus dice to<br>Weapon Skill tests</td>

    </tr>

    <tr style="height: 17px;">

    <td style="height: 17px; text-align: center;">4</td>

    <td style="height: 17px; text-align: center;"><strong>Emboldened by
    Bloodshed:</strong> +Rank<br>Resilience</td>

    </tr>

    <tr style="height: 17px;">

    <td style="height: 17px; text-align: center;">5+</td>

    <td style="height: 17px; text-align: center;"><strong>Mantle of Agony:
    </strong>Your Resolve increases<br>by +Double Rank.</td>

    </tr>

    </tbody>

    </table>
  display: true
