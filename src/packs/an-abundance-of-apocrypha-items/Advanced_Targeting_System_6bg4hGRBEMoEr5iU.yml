  description: >-
    <p><span class="fontstyle0">An Advanced Targeting System is a T'au
    Battlesuit Support System available to most types of T'au Battlesuits, as
    well as a T'au vehicle support system. An Advanced Targeting System is a
    specialised target acquisition computer that identifies and picks out
    highpriority targets of value amid battle before plotting efficient fire
    plans to counter them. With this system, tactically important enemy figures
    such as squad leaders, special weapon wielders, and commanders can all be
    more effectively pinpointed as specific targets for
    elimination.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">When you make a ranged attack, each Exalted Icon you
    shift for Extra Damage adds +2ED rather than 1.</span> <br style="
