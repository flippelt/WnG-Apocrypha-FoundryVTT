  description: >-
    <p><span class="fontstyle0">Void armour is the standard-issue personal
    protection provided by the Leagues of Votann to its soldiers of the line.
    Void armour provides substantial personal protection to its wearer, a
    multilayer defence against atmospheric hazards and a full suite of built-in
    scanning and communications equipment.</span></p><p></p><p><span
    class="fontstyle0">Void armour is comprised of hardened, jointed segments
    that are hooked into the void suit always worn by its wearer beneath the
    armour. The armour is fashioned from magnaferrite weave, and often
    reinforced with adamantium and enhanced with microfield generators for
    greater protection from enemy ballistic and directed energy
    weapons.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
