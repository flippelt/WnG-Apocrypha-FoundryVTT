  description: >-
    <p>The Executioner is a large two-handed glaive, axe, or halberd, commonly
    used by Howling Banshee Exarchs, which can slice an opponent in half with a
    single blow. Despite their size, they are lightweight and extremely swift in
    the hands of their wielders, and their blades are often a blur as they move
    from impenetrable defence to unstoppable attack.
    </p><p><strong>Special:</strong> The Parry trait of an Executioner adds +2
    to the wielder’s Defence in melee, rather than +1.</p>
