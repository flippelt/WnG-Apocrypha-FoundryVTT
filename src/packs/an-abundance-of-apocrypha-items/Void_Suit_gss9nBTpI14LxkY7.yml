  description: >-
    <p><span class="fontstyle0">The most commonplace article of clothing worn by
    the Kin throughout the Leagues of Votann is the void suit, a Kin spacesuit,
    and it is an excellent example of the Kin's no-nonsense approach to
    technology.</span></p><p></p><p><span class="fontstyle0">Threaded with
    Bastium alloy reinforcement and fitted with a thermoregulatory,
    radiation-hardened underlayer, the void suit doubles as both rugged utility
    wear and -- when combined with a helmet -- a fully functional spacesuit. It
    is studded with connector relays that allow the coupling up of everything
    from exo-frames and pressure rigs, to reinforced Kin void
    armour.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">2, Void</span> <br style=" font-style:
