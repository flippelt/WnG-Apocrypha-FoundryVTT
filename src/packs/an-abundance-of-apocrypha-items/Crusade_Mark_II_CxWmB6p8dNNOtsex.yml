system:
  quantity: 1
  rarity: unique
  description: >-
    <p><span class="fontstyle0">Following the conquest of the Sol System, the
    Emperor re-equipped his Space Marine Legions with Crusade armour, the first
    iteration of true power armour. Environmentally sealed, it could protect the
    wearer from the very worst battlefield conditions, even in the depths of
    space. It featured articulated sections of hoop-shaped armour, both on the
    torso and legs, giving the Space Marine unparalleled mobility, and a more
    efficient power system to prevent overheating. Regarded by many as the most
    effective suit of power armour, it was notoriously difficult to maintain and
    dropped out of common use by the 41st Millennium.</span></p><p></p><p><span
    class="fontstyle2">Armour Rating: </span><span class="fontstyle0">5; Powered
    (4)</span></p><p></p><p><span class="fontstyle2"><strong>Revered</strong>:
    </span><span class="fontstyle0">The wearer of this armour gains +2d on all
    interaction tests made with other characters with the </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">ADEPTUS ASTARTES </span><span
    class="fontstyle0">keyword.</span></p><p></p><p><span
    class="fontstyle2"><strong>Troublesome Machine Spirit</strong>: </span><span
    class="fontstyle0">If Crusade armour is damaged in some way, the DN for any
    Tech tests to repair it increase by +2.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
