  description: >-
    <p><span class="fontstyle0">A Multiwave Comms Array is a radio-wave
    communications device similar to the Imperial vox used by the Leagues of
    Votann. It is able to broadcast and receive on multiple frequency carrier
    waves, in order to overcome any hindrance or interference that would block
    communications. This naturally takes considerable skill to operate, so these
    communications arrays are often carried by a dedicated operators called a
    Kinlynk, who maintain contact with, and coordinates actions between their
    immediate group and the rest of their Oathband.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">You can communicate with anyone within 100 kilometres
    that has a comm unit (a comms array, vox, or similar). In addition, when
    using this item, the maximum range of Tech interaction attacks is increased
    to your Intellect Attribute multiplied by Double Rank.</span> <br style="
