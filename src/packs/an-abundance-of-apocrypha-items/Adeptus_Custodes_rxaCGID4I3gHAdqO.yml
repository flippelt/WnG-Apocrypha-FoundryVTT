system:
  journal: ''
  backgrounds:
    origin:
      - name: Privilege
        description: >-
          You were selected from amongst the wealthy and powerful families of
          Holy Terra as a small child.
        effect: aEgEoxqPpHeZ3PgA
      - name: Prophesy
        description: >-
          Your place in the Custodian Guard was foretold and you were sough out
          as a child to ensure that your fate came to pass.
        effect: PZ0hSuY37OGKHXyV
      - name: Provenance
        description: >-
          During a Custodes action, you were noticed, and your potential
          discovered. You were taken away to join the Ten-Thousand.
        effect: Fiobl6FjFLUyawv5
    accomplishment:
      - name: Blood Games Veteran
        description: >-
          You have participated in many Blood Games, testing the defences of the
          Palace with your own skills to discover any flaw that remain.
        effect: Fiobl6FjFLUyawv5
      - name: Hetaeron Guard
        description: >-
          You spend years of even decades amongst the Companions, one of three
          hundred custodians guarding the Emperor personally, and have only
          stepped down because not even the strongest can bear such a burden
          indefinitely.
        effect: OwW5MVUQhY2JFCKB
      - name: Jailer of the Dark Cells
        description: >-
          You watched over the ancient prisons deep beneath the Imperial
          Palace,standing vigil over terrors that have been caged since before
          the Imperium. You may even have been charged to hunt down a creature
          destined for those cells.
        effect: hinLJLOsE3wb8Frv
    goal:
      - name: Vision
        description: >-
          You, or another of your order, had a dream-vision sent by the Emperor,
          revealing some specific objective or purpose that you must fulfil.
        effect: hinLJLOsE3wb8Frv
      - name: Threat Identified
        description: >-
          Your order's spies and agents have discovered an impending threat to
          the Throne, and you have been charged with eliminating that threat.
        effect: PZ0hSuY37OGKHXyV
      - name: Torchbearer
        description: >-
          You have been placed with the Indomitus Crusade, delivering the
          Primarch's Gift to distant Astartes Chapters and striking out at the
          darkness that fills the galaxy.
        effect: aEgEoxqPpHeZ3PgA
  objectives:
    - >-
      Utilise your awe-inspiring presence and status as the Emperor's guardian
      in a social situation 
    - Speak of the absolute nature of your duty to the Throne
    - >-
      Apply the wisdom of the Emperor or of ancient philosophy to the current
      situation
    - >-
      Dismiss the faith of a servant of the Imperium, or play along with their
      beliefs to inspire them
    - >-
      Express doubt as to the loyalty or spiritual fortitude of a servant of the
      Emperor
    - Comment on how secure or vulnerable a location is
