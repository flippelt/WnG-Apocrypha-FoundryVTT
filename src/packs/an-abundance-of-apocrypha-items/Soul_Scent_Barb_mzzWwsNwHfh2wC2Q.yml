  description: >-
    <p><span class="fontstyle0">These bizarre thorny devices can dig into the
    soul of your prey through the warp, allowing the bearer to track them with
    uncanny precision.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">After a Regroup, you may attune the barb to a single foe
    whose identity you know or who you have some physical artefact of (an item
    from their possession, or a piece of their body). You gain +3 bonus dice on
    all Awareness and Survival tests to detect or track them. Further, when you
    make a ranged attack against that target, you may re-roll any dice which
    roll a 1.</span> <br style=" font-style: normal; font-variant: normal;
