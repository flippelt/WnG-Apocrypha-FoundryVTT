  description: >-
    <p>With this power, you are able to create a small psychic beacon within the
    Empyrean that can only be seen with psychic senses. While the beacon remains
    in place, you can always determine how far away you away from the beacon.
    Anyone able to use Psyniscience is able to perceive your beacon, and it can
    be detected as far away as your Willpower x 5km in realspace, or your
    Willpower in light years in the Warp, subject to warp conditions. You cannot
    control who can perceive your beacon, however, and enemies may detect it as
    well.</p>
