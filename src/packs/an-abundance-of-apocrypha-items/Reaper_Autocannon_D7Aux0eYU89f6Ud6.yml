  description: >-
    <p><span class="fontstyle0">The Reaper Autocannon is a double-barrelled
    variant of the common Autocannon. Originally designed during the Great
    Crusade for use as a heavy support weapon for Legiones Astartes Terminators,
    the weapon features two barrels and is capable of a high rate of fire, but
    it requires the incredible strength to be carried as an infantry-portable
    weapon. The recoil of this weapon is too great for any but a warrior in
    Terminator armour to unleash it effectively. The weapon fell out of favour
    amongst Loyalist forces, who replaced it with the Assault Cannon, but
    Traitor Legionaries still employ Reaper Autocannons for fire
    support.</span></p><p></p><p><span class="fontstyle0">A Reaper Autocannon
    incorporates a bayonet.</span> <br style=" font-style: normal; font-variant:
