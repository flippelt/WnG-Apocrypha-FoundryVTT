  rarity: unique
  description: >-
    <p><span class="fontstyle0">Vindicare Assassins are often entrusted with
    TurboPenetrator rounds for dealing with heavily armoured targets, enemies in
    fortified bunkers, and enemies in armoured vehicles. These rounds contain a
    powerful explosive charge that propels a secondary sabot dart through even
    the toughest armour.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The weapon gains the Careful, Brutal, and Rending [4]
    traits, but its Salvo rating is reduced to – for this
    shot.</span></p><p></p><p><span class="fontstyle2"><strong>Single
    Shot:</strong> </span><span class="fontstyle0">A reload of Exitus special
    ammunition consists of a single round. Using this ammunition expends that
    round, and grants none of the normal benefits a Salvo action.</span> <br
    style=" font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
