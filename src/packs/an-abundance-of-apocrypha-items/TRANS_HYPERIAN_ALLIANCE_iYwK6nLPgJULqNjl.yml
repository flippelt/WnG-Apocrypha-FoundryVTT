name: TRANS-HYPERIAN ALLIANCE
type: keyword
img: modules/wng-core/assets/ui/aquila-white.webp
system:
  description: >-
    <p>Known as peerless explorers and adventurers, they seek out new warp
    routes, trade partners, and mysteries with a compulsive determination. While
    they control vast swathes of territory both within and without the Galactic
    Core, these holdings are far-flung and thinly spread. Many of their Kindreds
    dwell in isolated pockets or have their Hold aboard nomadic fleets. The
    League remains well connected despite this, for their lighter craft streak
    between scattered Kindreds for communication. Even its three Votann have
    adopted this void-faring existence and they are nestled deep within the
    Alliance's highly fortified spaceships. Ancient technologies ensure their
    Fanes stay updated with the coordinates of their Votann, the information
    scrambled so as to appear useless to outsiders.</p><p><strong>NOMADIC
    EXPLORERS:</strong> You increase your Passive Awareness by +Rank and add +1d
    to all Pilot skill tests.</p>
