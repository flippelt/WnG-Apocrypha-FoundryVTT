system:
  journal: ''
  backgrounds:
    origin:
      - name: Persecuted
        description: >-
          From a young age, you survived despite being regarded with dread and
          revulsion by all who met you. When hunting rumours of a witch, the
          Sisterhood found you instead.
        effect: nFRbWozOXnMJVJOz
      - name: Bloodline
        description: >-
          It is believed that you came from a bloodline engineered since the
          dawn of the Imperium to produce Pariahs for the Sisterhood.
        effect: btSheAcWGUbYRxMU
      - name: Happenstance
        description: >-
          Though frequently alone in life, you made something of yourself, until
          the extent of your powers were noticed.
        effect: 3vqpdL6BGn4eEjGu
    accomplishment:
      - name: Witch-Bane
        description: >-
          Your skills and powers proved instrumental in defeating a coven of
          witches or a powerful sorcerer
        effect: MbSa558yUd8TZOtT
      - name: Hunter
        description: >-
          You spent months, even years, tracking your quarry. You eventually
          triumphed, though it required all of your skill and cunning.
        effect: aen8xGeoAeMpBUAd
      - name: Anathema
        description: >-
          When all around you were overrun by daemons and the forces of the
          Ruinous Powers, you stood your ground, unaffected by the warp-spawned
          horror, and drove it back.
        effect: nbXdfwsjsWKObQrZ
    goal:
      - name: Reclaim
        description: >-
          You’ve been charged with retrieving old strongholds or technologies of
          the Silent Sisterhood, or seeking out new recruits to restore the
          order’s old numbers.
        effect: DgEHiDpOMxCPafGK
      - name: Vigilant
        description: >-
          You are part of a newly established Vigil, standing guard over a
          region of space to secure it from psychic or daemonic threats.
        effect: nbXdfwsjsWKObQrZ
      - name: Vigil Indomitus
        description: >-
          You were stationed upon one of the ships of the Indomitus Crusade,
          helping the crusaders return light to the darkness, facing some of the
          heaviest fighting.
        effect: btSheAcWGUbYRxMU
  objectives:
    - Wield your dread presence and fearsome reputation in a social situation
    - Demonstrate the superiority of your order’s traditions and techniques
    - Express gratitude for the Emperor’s wisdom and protection
    - >-
      Use your keen skills of observation to pass judgement upon an individual
      you’ve just met
    - Be confronted by hostility or fear because of your Pariah nature
    - Face communications difficulties because of your Vow of Tranquility.
