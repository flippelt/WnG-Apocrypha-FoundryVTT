system:
  quantity: 1
  rarity: unique
  description: >-
    <p><span class="fontstyle0">Iron armour was developed during the Great
    Crusade, not to replace Crusade armour, but to be used alongside it in close
    quarters boarding actions and tunnel fighting. A suit of modified Crusade
    armour, it featured additional armour panels on the greaves, forearms,
    thighs, chest and groin, plus larger shoulder pads and a more angular helm
    to deflect bullets away from the face. To compensate for the heavy front
    plates, Iron armour was not reinforced at the back, making it ideal for
    frontal assaults and battles in claustrophobic environments, but unsuitable
    for regular combat duties. It is now mainly worn as ceremonial
    armour.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">6; Bulky (1), Powered (4), Void
    </span></p><p></p><p><span class="fontstyle2"><strong>Revered</strong>:
    </span><span class="fontstyle0">The wearer of this armour gains +2d on all
    interaction tests made with other characters with the </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">ADEPTUS ASTARTES </span><span
    class="fontstyle0">keyword.</span></p><p></p><p><span
    class="fontstyle2"><strong>Vulnerable Rear</strong>: </span><span
    class="fontstyle0">Attacks from the rear reduce the Armour Rating by
    2.</span> <br style=" font-style: normal; font-variant: normal; font-weight:
    normal; letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
  value: 10
  keywords: HEAVY, POWERED, RELIC, IMPERIUM,ADEPTUS ASTARTES
  equipped: false
