    - name: void
      custom: true
      display: Void
      description: >-
        A number of types of armour listed in this section have the Void trait.
        A character with Void armour reduces the AP of incoming attacks by one
        step (i.e., from AP -1 to 0, or from AP -3 to -2). Void armour also
