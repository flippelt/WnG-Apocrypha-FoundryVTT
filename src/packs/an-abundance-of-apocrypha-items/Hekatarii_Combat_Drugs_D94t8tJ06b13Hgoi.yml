system:
  quantity: 6
  rarity: rare
  description: >-
    <p><span class="fontstyle0">Though they dramatically reduce the lifespan of
    any Aeldari that uses them, performance-enhancing combat drugs are commonly
    used in the gladiatorial arenas of the Hekatarii, as well as by Wyches
    entering real battle.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The user may administer a single dose as a free action,
    which will last for about an hour or until the character takes a Regroup
    (after which, withdrawal symptoms set in, and the character becomes
    </span><span class="fontstyle3">Exhausted </span><span
    class="fontstyle0">until they take a Respite). Anyone using these combat
    drugs must also make a Corruption test. Taking a second dose of any combat
    drug before a Respite inflicts [[/r 1d3]] Shock as well as the desired
    effect. The drug dispenser contains 6 doses, of whichever of the drugs below
    the user wishes.</span></p><ul><li><p><span
    class="fontstyle2"><strong>Adrenalight</strong></span><span
    class="fontstyle0">: While under the drug’s effect, whenever the character
    charges and makes a successful attack, they may spend a point of Glory to
    make a second attack.</span></p></li><li><p><span
    class="fontstyle2"><strong>Grave Lotus</strong></span><span
    class="fontstyle0">: While under the drug’s effect, the character’s Strength
    is increased by +3.</span></p></li><li><p><span
    class="fontstyle2"><strong>Hypex</strong>: </span><span
    class="fontstyle0">While under the drug’s effect, the character’s Speed is
    increased by +2.</span></p></li><li><p><span
    class="fontstyle2"><strong>Painbringer</strong>: </span><span
    class="fontstyle0">While under the drug’s effect, the character’s Resilience
    is increased by 2.</span></p></li><li><p><span
    class="fontstyle2"><strong>Serpentin</strong>: </span><span
    class="fontstyle0">While under the drug’s effect, the character adds +3d to
    all melee attacks.</span></p></li><li><p><span
    class="fontstyle2"><strong>Splintermind</strong></span><span
    class="fontstyle0">: While under the drug’s effect, the character adds +2d
    to all ranged attacks and their Resolve is increased by +2.</span> <br
    style=" font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p></li></ul>
