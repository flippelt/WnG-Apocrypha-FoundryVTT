  description: >-
    <p><span class="fontstyle0">The Aeldari Missile Launcher is commonly used by
    Asuryani and Anhrathe forces. Instead of the primitive launching-tubes
    favoured by the Imperium, they use complex chambered pods designed to
    contain several types of ammo, decreasing the need to reload. The ammunition
    held in its internal magazines is in fact so compact that they can fit
    scores of projectiles inside a single launcher. While portable, they are
    often mounted on Grav Platforms and Eldar vehicles. Sunburst missiles
    generate a high-energy pulse that blasts and sears infantry, while Starshot
    missiles produce a concentrated blast which can overcome armoured
    targets.</span> <br style=" font-style: normal; font-variant: normal;
