  description: >-
    <p><span class="fontstyle0">Having weapons blessed by a priest or other
    blessed servant of the Throne is a common enough practice in the Imperium,
    particularly amongst those going into battle against the unholy. Some
    weapons, however, are etched and engraved with devotional sigils, inlaid
    with blessed and purified materials, and anointed with holy oils, the blood
    of the martyred, or the tears of the sainted, remaking them as instruments
    of holy wrath.</span></p><p></p><p><span class="fontstyle0">This quality may
