  description: >-
    <p><span class="fontstyle0">Magnacles are pieces of equipment frequently
    used by the Adeptus Arbites. These are magnetised handclamps—a snap-open
    hoop constructed of hardened and tempered steel that seals around a
    suspect’s wrist and locks. They are designed to lock together, but they can
    also be locked onto any other magnetic surface: suspects mag-locked onto a
    transport vehicle, or bound to the table in an interrogation cell, or even
    locked to the armour of the Arbitrator escorting them are all common ways
    these devices are used.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Breaking free of magnacles’ magnetic lock requires a
    Strength test (DN 5)</span> <br style=" font-style: normal; font-variant:
    normal; font-weight: normal; letter-spacing: normal; line-height: normal;
    orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform:
