  description: >-
    <p><span class="fontstyle0">Virus grenades contain a genetically tailored
    virus, like the virus bombs used to perform Exterminatus, but on a much
    smaller scale; the “tactical” virus weapon, compared to the “strategic”
    Life-Eater weapons used to kill worlds. Only the most hardened and merciless
    warriors can deploy such weapons without hesitation, for there is always an
    element of risk. The servants of the Chaos God Nurgle are known to employ
    such weapons as well, especially the Death Guard Heretic Astartes, who were
    experts in using chemical and biological weapons long before they fell to
    Chaos.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Virus Grenades do not inflict damage normally. Rather,
    anyone in the area must pass a DN 7 Toughness test or suffer the
    </span><span class="fontstyle3">Poisoned 7 </span><span
    class="fontstyle0">condition. A creature </span><span
    class="fontstyle3">Poisoned </span><span class="fontstyle0">by a Virus
    Grenade suffers 3d3 Mortal Wounds at the start of each of their turns. When
    a creature dies from a Virus Grenade, it may infect others. Roll 7d6. The
    number of Icons rolled is the infection score, which replaces 7 as the Blast
    rating, the DN for the Toughness test, the </span><span
    class="fontstyle3">Poisoned X </span><span class="fontstyle0">rating, and
    the number of dice rolled for the next infection. When the infection score
    reaches 0, the virus has mutated into an inert strain and there is no
    further effect.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
