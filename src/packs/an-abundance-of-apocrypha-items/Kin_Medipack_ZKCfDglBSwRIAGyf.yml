  description: >-
    <p><span class="fontstyle0">These are similar to the medikits used by the
    Imperium, but specially-tailored to interact with the engineered biology and
    augmetic implants of Kin. Given the durability of Kin physiology, their
    ability to withstand and recover from damage is already considerable, and
    these medipacks contain tools designed to stimulate a Kin’s implants to
    promote natural recovery.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Functions as a Medikit (page 238 of the </span><span
    class="fontstyle3">Wrath & Glory core rulebook</span><span
    class="fontstyle0">). In addition, when the Medipack is used to Heal Wounds
    on a Kin character, this heals +Rank Wounds.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
