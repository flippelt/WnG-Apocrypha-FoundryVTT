system:
  description: >-
    <p>The Order of the Ebon Chalice is the oldest of the Orders Militant, and
    they strive to be exemplars, both martial and spiritual, to the followers of
    the God-Emperor. Their purity and nobility of spirit can see them perform
    miraculous acts of survival.</p>

    <p><strong>Daughter of the Emperor:</strong> When you roll Determination,
    you may spend 1 Faith. If you do so, negate all damage the attack would
    cause, including Mortal Wounds, but do not suffer any Shock.</p>
