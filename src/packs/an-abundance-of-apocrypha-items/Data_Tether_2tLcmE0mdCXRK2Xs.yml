  description: >-
    <p><span class="fontstyle0">This implant serves a similar function to a vox,
    allowing rapid communication over a distance. However, that is where the
    similarity ends: a data-tether transmits assorted data from the recipient’s
    mind, implants, and other wargear in a highly compressed binaric form,
    understandable only by the Skitarii legions and the Tech-Priests who command
    them.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">Characters with a data-tether may
    communicate silently to similarly-equipped characters within 1km,
    transmitting their thoughts, status, and sensory data through the implant to
    one another. A data-tether may be tuned to receive normal vox transmissions
    from non-Skitarii allies, though this is less efficient.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
