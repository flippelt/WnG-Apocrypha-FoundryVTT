system:
  quantity: 1
  rarity: unique
  description: >-
    <p>Amongst the most feared melee weapons produced by the Kin are those
    wrought from Darkstar ore. This strange material, found only in the fringes
    of the dead zones of the galactic core, generates a damping field which
    renders anything it touches inert, whether the electro-mechanical functions
    of a machine or the organic processes of living tissue. The mineral must be
    handled and shaped with great care and reverence, for the slightest mishap
    could be disastrous. Those few armed with Darkstar blades bear them with
    similar care, for a single cut can sap the life from a
    victim.</p><p><strong>Special</strong>: Damage inflicted by a DARKSTAR
    weapon cannot be negated by rolling Determination.</p>
