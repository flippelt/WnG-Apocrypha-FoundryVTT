    shields are strong enough to absorb a small number of lascannon
    shots.</span></p><p></p><p><span class="fontstyle0">Compact versions exist
    to protect VIPs such as Ethereals or Water Caste dignitaries, but these are
    rarer.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
