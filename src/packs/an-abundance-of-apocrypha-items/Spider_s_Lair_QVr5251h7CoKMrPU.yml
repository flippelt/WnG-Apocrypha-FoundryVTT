  effect: ''
  cost: 30
  requirements: Warp Spider aspect
  description: >-
    <p>You are deadly in dense terrain, weaving tangles of monofilament wire
    around their location to ensnare and eviscerate the unwary foes who stumble
    through the nearly-invisible wires. When the Exarch is in terrain which
    provides cover, or which counts as difficult terrain, you may spend 1 Glory
    as a Simple Action to trap that location. Characters other than the Exarch
    or their squad who enter that terrain must pass an Awareness Test with a DN
    of 5, or immediately suffer 1d3 Mortal Wounds and the Restrained condition.
    A trap created dissolves at the start of the Exarch’s next turn.</p>
