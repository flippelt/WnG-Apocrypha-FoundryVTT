  description: >-
    <p><span class="fontstyle0">A Teleport Crest is a technology that takes the
    form of a decorative personal void armour or exo-armour crest used by some
    senior military personnel of the Leagues of Votann that allows them to
    instantaneously teleport through the Immaterium for relatively short
    distances on the battlefield.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">This item must be mounted on a suit of </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">LEAGUES OF VOTANN
    </span><span class="fontstyle0">armour but it cannot be mounted if the
    armour already has another crest (such as a Weavefield Crest). A teleport
    crest may be used as a Combat Action for a short-range teleport: the wearer
    vanishes from the battlefield and reappears anywhere within 100m that is
    more than 9m from an enemy. Once used this way, it cannot be used again
    until it has been recharged. It can also be used in conjunction with
    teleportation holds and other larger forms of teleport technology.</span>
