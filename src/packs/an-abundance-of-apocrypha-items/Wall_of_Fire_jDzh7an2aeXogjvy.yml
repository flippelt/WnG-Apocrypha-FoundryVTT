  effect: ''
  cost: 25
  requirements: Fire Dragon aspect
  description: >-
    <p>You leave flaming ruin in your foes’ path, hindering their attempts to
    get close. When you are armed with a Dragon’s Breath Flamer or other FIRE
    weapon, you may spend 1 Glory as a Reflexive Action when an enemy declares a
    charge to create a momentary wall of flame within 8m, which is up to 5m
    wide. Any enemy who moves through this wall of flame immediately suffers
    1d3+1 Mortal Wounds and gains the On Fire condition.</p>
