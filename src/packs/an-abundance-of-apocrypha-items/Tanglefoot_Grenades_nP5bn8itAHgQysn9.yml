  description: >-
    <p><span class="fontstyle0">Another form of grenade developed by the Adeptus
    Mechanicus for use by elite Imperial forces—the Adeptus Custodes are the
    only forces who use them regularly—though there are rumours that the Aeldari
    Harlequins make use of similar devices to hinder and humiliate their foes.
    Each grenade contains a potent gravitic generator, like that found in
    anti-grav vehicles such as jetbikes. The grenade generates a short-lived,
    fluctuating field at just above ground level which seriously impairs
    movement.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Tanglefoot Grenades do not inflict damage. Rather, any
    creature caught in the blast must pass a DN 5 Athletics test or fall
    </span><span class="fontstyle3">Prone </span><span class="fontstyle0">and
    suffer the </span><span class="fontstyle3">Staggered </span><span
    class="fontstyle0">condition. The pilot of a vehicle (other than one with
    the </span><span class="fontstyle2" style="color:rgb(112,0,0);">HOVER
    </span><span class="fontstyle0">or </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">FLYER </span><span class="fontstyle0">keywords)
    affected must pass a DN 5 Pilot test or become </span><span
    class="fontstyle3">Restrained</span><span class="fontstyle0">. These
    conditions remain until the end of the affected target’s next
    turn</span>.<br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
