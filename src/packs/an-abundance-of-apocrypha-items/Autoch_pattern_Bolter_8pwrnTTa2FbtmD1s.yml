    distinct pattern of boltguns, bolt pistols, and combi-bolters.
    Autoch-pattern weapons are comparable to Imperial bolt weapons in most
    regards, but better made, constructed of superior materials, and have been
    refined over countless millennia of careful innovation. The greatest
