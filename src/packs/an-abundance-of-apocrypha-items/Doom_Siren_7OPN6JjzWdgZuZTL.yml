  description: >-
    <p><span class="fontstyle0">A doom siren is a close-quarters sonic weapon
    that is used by noise marines, along with vehicles and daemon engines that
    are dedicated to the service of Slaanesh, the chaos god of pleasure and
    excess. The doom siren is fitted to the chaos space marine's power armour
    with a complex arrangement of pipes and tubes around their helmets which can
    project short-ranged sonic attacks. These assaults are launched against
    opponents as they close with the noise marine during melee combat and are
    usually powerful enough to kill or at least temporarily stun their target,
    allowing the attacker to quickly finish the foe off while they are
    stunned.</span> <br style=" font-style: normal; font-variant: normal;
