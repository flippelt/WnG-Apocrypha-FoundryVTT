system:
  quantity: 1
  rarity: unique
  description: >-
    <p>Taking the form of a pair of wrist-mounted retractable spikes, these
    tools are primarily intended to facilitate universal access to the data
    coils of cogitator banks, allowing the Infocyte to surreptitiously syphon
    information or to interject damaging scrap-code into enemy systems.
    Secondarily, their shape allows them to be driven between armour plates and
    through the eye-slots of even heavily-armoured foes.
    </p><p><strong>Special</strong>: While wielding Sympatic Dataspikes, the
    user gains +4 bonus dice on all Tech tests to gain access to cogitators or
    similar devices.</p>
