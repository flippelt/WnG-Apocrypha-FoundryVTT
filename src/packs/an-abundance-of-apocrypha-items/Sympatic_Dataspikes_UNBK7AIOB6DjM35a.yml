    - name: paired
      custom: true
      display: Paired
      description: >-
        The weapon is designed to be used in a pair—two weapons of that type,
        one in each hand. When a character makes an attack while wielding both
        weapons in a pair, either count it as a Simultaneous Strike (as per the
        talent) or reduce the DN of a multiattack by 2. If you have the
        Signature Weapon talent, you may apply it to both weapons in a pair.
