  description: >-
    <p>You perceive a creature or object’s reflection in the Warp and learn
    things that may be hidden in the Materium. This power has a variety of
    applications. You select a single creature or object you can see. When you
    use this power, you immediately learn whether the target has the CHAOS
    keyword, is possessed, is a DAEMON in disguise, possesses any mutations, or
    is otherwise corrupted by the Warp. An NPC may spend 1 Ruin to attempt to
    resist this effect, making a DN 4 Conviction Test.</p>
