system:
  quantity: 1
  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">The XV86 Coldstar Battlesuit, or simply the
    XV86, is a rare mark of XV8 Crisis Battlesuit that carries many unique
    support and weapon systems. Designed for operation in a void environment,
    each XV86 is fitted with integrated interface
    armour.</span></p><p></p><p><span class="fontstyle0">XV86 Coldstar
    Battlesuits feature enhanced Jetpack designs which allow them to achieve
    something akin to true extended flight, and their armour is layered with
    super-insulating carbodine mesh and integral heatshielding so that they can
    handle the heat of atmospheric re-entry and the icy cold of the
    void.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">5, Powered (4)</span></p><p></p><p><span
    class="fontstyle2"><strong>Nanocrystalline Structure:</strong> </span><span
    class="fontstyle0">The wearer’s Toughness is increased by +4 while they wear
    this suit. This increases the wearer’s Wounds and Determination accordingly.
    While within the suit, the wearer’s size is Large.</span></p><p></p><p><span
    class="fontstyle2"><strong>Flight Jets:</strong> </span><span
    class="fontstyle0">The armour is fitted with jump jets allowing for
    considerable mobility. The suit has a Speed of 14
    (Flying).</span></p><p></p><p><span
    class="fontstyle2"><strong>Armament</strong>: </span><span
    class="fontstyle0">This battlesuit is fitted with a High output Burst Cannon
    (below) and may be equipped with up to three other weapons. The High output
    Burst Cannon may be replaced by another weapon, and any weapon slot may be
    replaced by a </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">SUPPORT SYSTEM</span><span
    class="fontstyle0">.</span> <br style=" font-style: normal; font-variant:
    normal; font-weight: normal; letter-spacing: normal; line-height: normal;
    orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform:
    none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
