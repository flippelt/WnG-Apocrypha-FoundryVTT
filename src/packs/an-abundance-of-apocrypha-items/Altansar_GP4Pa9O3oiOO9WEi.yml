system:
  description: >-
    <p>Altansar was caught in the Eye of Terror, and it was thought lost for
    millennia. Its symbol is a Broken Chain, referencing the escape of Kurnous
    and Isha from the dungeons of Khaine but also the shattering of the links
    that bound Vaul to his anvil. It has since returned but is now held in great
    suspicion by other Eldar, for how could any Eldar remain untouched by the
    predations of Chaos for so many millennia?</p><p><strong>GRIM
    SURVIVORS:</strong> Your Determination is increased by +Rank.</p>
