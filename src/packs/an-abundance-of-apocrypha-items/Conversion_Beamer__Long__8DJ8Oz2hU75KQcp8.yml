  description: >-
    <p><span class="fontstyle0">The Conversion Beamer, also called a Conversion
    Beam Projector, is an incredibly rare and deadly antimatterbased pre-Horus
    Heresy archaeotech weapon most likely developed during the Age of
    Technology. It fires a directed energy beam of antimatter particles which
    cause a matter-antimatter explosion in its target. It is a powerful,
    long-ranged weapon whose beam intensity actually becomes stronger the
    farther the range to its target, up to a terminal distance point where the
    beam finally begins to lose coherence.</span></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">At medium range, the weapon gains +2 ED, +2 Blast rating,
    and improves the AP to -2. At long range, the weapon gains +4 ED, +4 Blast
    rating, and improves the AP to -3.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
