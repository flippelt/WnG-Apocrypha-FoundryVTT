  description: >-
    <p>You summon an astral doppelgänger and unleash it upon the foe. This
    vengeful apparition carves a path through the enemy’s ranks, each kill
    spurring it on as it rips apart flesh in a blaze of psychic energy. The
    nearest enemy within range immediately takes damage as if struck by one of
    your melee weapons. Each time an enemy is slain by this power, you may hit
    another enemy within 5m. A single use of this power may inflict a number of
    hits equal to your Willpower.</p>
