  description: >-
    <p>A skilled Navigator can mark a point of calm in even the most tumultuous
    Warp storm. On a smaller scale, they can also find a stillness in the flows
    of the Immaterium, dampening psychic powers and even repelling the daemonic.
    You cause an area of calm Warp centred on you, with a radius equal to your
    Intellect in metres, which lasts until the start of your next turn. Psychic
    powers used by PSYKERS within that area, or targeted within that area,
    increase their DN by +2. DAEMONS must pass a DN 5 Resolve test if they
    attempt to enter the area; if they fail, they stop at the edge and are
    Staggered. When this power’s effect ends, you suffer 1d3+1 Shock.</p>
