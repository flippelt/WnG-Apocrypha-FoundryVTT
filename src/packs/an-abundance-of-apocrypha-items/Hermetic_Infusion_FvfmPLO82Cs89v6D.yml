  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">As another departure from the frailties of the
    flesh, this implant replaces human blood and blood processing organs with a
    more efficient biochemical serum and accompanying biomechanical organs.
    However, the greyish pallor of the recipient is often off-putting, and the
    lack of normal human anatomy makes the recipient somewhat more difficult to
    treat should they need a medicae.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">You gain +2 bonus dice on all Toughness tests to resist
    poisons, diseases, and radioactivity. In addition, you automatically recover
    Wounds equal to your Toughness each time you take a Respite. However, anyone
    attempting a Medicae test on you who lacks the </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">CULT MECHANICUS </span><span
    class="fontstyle0">keyword adds +2 to the test’s DN.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
