  description: >-
    <p>Transmogrifying energies erupt from your eyes, playing across the enemy’s
    ranks and reducing their proud warriors to mewling beasts. This power
    affects all enemies within a Blast (6) within range and line of sight.
    Affected enemies must pass a Toughness test with a DN of 5; if they fail,
    they are transformed into twisted, but harmless beasts while this power
    remains in effect. Transformed enemies retain their normal Defence,
    Resilience, Wounds, and Shock, but cannot take any actions of any kind, and
    they will transform back if they suffer any damage.</p>
