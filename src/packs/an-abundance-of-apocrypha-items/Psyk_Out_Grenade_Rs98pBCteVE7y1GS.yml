  description: >-
    <p><span class="fontstyle0">Psyk-out grenades are anti-psyker weapons. When
    they detonate, they release fine dust particles which are heavily
    impregnated with negative psychic energy. This dust is extremely rare; in
    all human space it can be obtained only as a by-product of the Emperor's
    metabolism, or from certain arcane processes rendering the corpses of Nulls.
    Using the material to create anti-psyker weapons is considered by many to be
    a great waste, and their issue is strictly controlled. Psyk-out weapons are
    nigh-useless against non-psychic targets. Against psychic creatures such as
    daemons and psykers, however, their effects are
    devastating.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">PSYKERS </span><span class="fontstyle0">and
    </span><span class="fontstyle2" style="color:rgb(112,0,0);">@UUID[Compendium.wng-core.items.Item.eeSvJvzZBjQvtZq0]{DAEMONS}
    </span><span class="fontstyle0">suffer 1 Mortal Wound for each Exalted Icon
    rolled on the grenades ED. Further, any psychic powers or effects in the
    blast radius are immediately ended, and any </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">@UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKER} </span><span class="fontstyle0">within
    the blast will automatically fail any Psychic Mastery test attempted until
    the end of their next turn.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
