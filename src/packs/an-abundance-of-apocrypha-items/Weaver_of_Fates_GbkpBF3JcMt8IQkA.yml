  description: >-
    <p>You trace the skeins of the future to see the fates of battle. Forewarned
    of imminent danger, warriors dodge bullets and blades with seemingly
    supernatural reflexes. Select a number of allies with the TZEENTCH keyword
    within range equal to your Willpower. Until the start of your next turn, the
    affected allies add +2 to their Resilience and may roll Determination
    against Mortal Wounds</p>
