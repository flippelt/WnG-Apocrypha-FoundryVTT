  description: >-
    <p><span class="fontstyle0">The Dark Reaper Range Finder is a specialized
    Eldar targeting system used by Dark Reapers. Composed of a complex array of
    sensory and range-finding equipment incorporated into the helms of their
    Aspect Armour and tied directly into their weapon, Dark Reapers can target
    their enemies swiftly and accurately thanks to this
    equipment.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The Reaper Rangefinder allows the wearer to see even in
    complete darkness or through fog with no penalty. In addition, when a Dark
    Reaper aims before making a ranged attack, they add +3d to their
    attack.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
