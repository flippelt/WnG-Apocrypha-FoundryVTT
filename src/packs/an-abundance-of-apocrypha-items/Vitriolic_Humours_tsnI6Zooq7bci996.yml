  quantity: 1
  rarity: rare
  description: >-
    <p><span class="fontstyle0">Your vital fluids have been made extremely
    efficient, allowing you to maintain full function even while injured. As a
    side effect of that, those same fluids are now extremely corrosive.
    Thankfully, you are immune to the corrosive effects of the ichor that now
    pumps through your veins.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">You no longer suffer any DN increase to tests while
    Wounded, and your Max Wounds and Max Shock are both increased by +1. In
    addition, whenever you suffer damage from a melee attack, roll a [[/r d6]];
    on an Icon, the attacker suffers a Mortal Wound from the corrosive ichor
    that spurts from the wound. This increases to [[/r d3]] Mortal Wounds if the
    damage inflicted the </span><span class="fontstyle3">Bleeding </span><span
    class="fontstyle0">condition. You are also immune to the </span><span
    class="fontstyle3">Poisoned </span><span class="fontstyle0">condition and
    disease.</span></p><p></p><p><span class="fontstyle0">As a result of this,
    getting any medical treatment is far more difficult and dangerous. Any
    Medicae Test made on you suffers a +2 DN penalty, and if a Complication
    occurs, you spray blood exactly as if injured.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
