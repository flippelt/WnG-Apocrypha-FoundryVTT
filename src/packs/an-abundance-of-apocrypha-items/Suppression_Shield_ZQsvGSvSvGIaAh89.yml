  description: >-
    <p><span class="fontstyle0">The suppression shield is a type of shock
    weapon. It is like a storm shield but replaces the power field generator
    with an electro-shock unit. It acts as both a weapon and protection. Its
    electricity is discharged into the first unfortunate individual the shield
    contacts squarely. It is used along with the shock maul by Adeptus Arbites
    shock troops for crowd and riot control.</span></p><p></p><p><span
    class="fontstyle2">Armour Rating: </span><span class="fontstyle0">2, Bulk
    (1), Shield</span></p><p></p><p><span
    class="fontstyle2"><strong>Discharge</strong>: </span><span
    class="fontstyle0">An enemy who fails a melee attack against someone
    wielding a suppression shield immediately suffers 1 Shock. Anyone suffering
    a complication on a melee attack against someone wielding a suppression
    shield suffers 1d3 Shock.</span> <br style=" font-style: normal;
