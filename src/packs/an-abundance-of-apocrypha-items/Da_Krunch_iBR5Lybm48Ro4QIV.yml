  description: >-
    <p>Green energies erupt from your eyes, ears, nose, and mouth, and coalesce
    into a roiling cloud above the enemy. That cloud then solidifies into the
    vast green foot of Gork (or Mork) himself, which commences to stamp down
    upon the foe. This power affects all enemies in a Blast (6) within range.
    Affected enemies take 1d3 Mortal Wounds and are knocked prone. Foes who were
    already prone become staggered as well. Then, roll a d6: on an Exalted Icon,
    repeat the power’s effects (repositioning the blast as desired) as the foot
    stamps down again.</p>
