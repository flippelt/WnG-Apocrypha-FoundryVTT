  rarity: rare
  description: >-
    <p><span class="fontstyle0">The Ork’s legs have been entirely replaced with
    a single wheel, normally salvaged from a Bike or a smaller Trukk. Complex
    ‘spinny gubbinz’ allow the Ork to maintain balance upon this
    seemingly-precarious wheel, and the Ork will find that he can move much
    faster than before… so long as he doesn’t run into any
    obstacles.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Your Speed is doubled. However, you can no longer climb
    ladders or stairs, and you can no longer jump without the aid of a ramp.
    Whenever you attempt to Run, Charge, or Sprint through Difficult Terrain,
    you must pass an Athletics test (DN 5) or suffer [[/r 1d3]] Mortal Wounds as
    you crash.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
