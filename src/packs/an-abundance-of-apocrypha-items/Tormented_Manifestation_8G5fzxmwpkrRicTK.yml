  requirements: Human species, PSYKER keyword
  description: >-
    <p>Your powers are a curse, resulting in continual agony.</p><p>Select a
    single psychic discipline. You may purchase powers from that discipline at
    half their normal cost, rounded up. Whenever you attempt to use a psychic
    power from that discipline, you suffer Shock equal to the power’s DN. You
    may reduce the Shock suffered by twice your Rank but suffer one of the
    following conditions instead:
    @UUID[JournalEntry.XsuX7aOz9hoNlntI]{Bleeding},
    @UUID[JournalEntry.vnjBRz2DsNuGlaNs]{Blinded},
    @UUID[JournalEntry.GgSWH9U694ojtUcN]{Fear},
    @UUID[JournalEntry.d0nSM7VoOWaFXXmv]{On Fire},
    @UUID[JournalEntry.BPgzsg94UgmFsrTK]{Poisoned (3)},
    @UUID[JournalEntry.CXoXx6h9FoFqp013]{Staggered}.</p>
