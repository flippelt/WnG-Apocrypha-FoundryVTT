    - name: sustained
      custom: true
      display: Sustained
      description: >-
        The weapon is well-suited for delivering attack after attack. For each
        Exalted Icon rolled when you make an attack with this weapon, you may
        roll one additional attack die. These additional dice cannot themselves
        generate additional dice.
    - name: tearing
      custom: true
      display: Tearing
      description: >-
        The weapon rips and tears at their enemies, inflicting horrific wounds.
        When you roll for damage with this weapon, you may re-roll any number of
        ED.
    - name: paired
      custom: true
      display: Paired
      description: >-
        The weapon is designed to be used in a pair—two weapons of that type,
        one in each hand. When a character makes an attack while wielding both
        weapons in a pair, either count it as a Simultaneous Strike (as per the
        talent) or reduce the DN of a multi-attack by 2. If you have the
        Signature Weapon talent, you may apply it to both weapons in a pair.
