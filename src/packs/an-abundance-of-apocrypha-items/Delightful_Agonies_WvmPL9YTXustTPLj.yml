  description: >-
    <p>Those whose minds are touched by the Sorcerer’s caress are wracked by
    waves of exquisite pain, and the real injuries of battle are trivial by
    comparison. Select a number of allies with the SLAANESH keyword within range
    equal to your Willpower. Until the start of your next turn, the affected
    allies may roll Determination against Mortal Wounds, and do not suffer any
    Shock when they roll Determination—each Icon rolled simply negates a Wound
    or Mortal Wound.</p>
