  description: >-
    <p>By using your eye to filter small secrets from the near future, you can
    choose to make slight adjustments to his actions to avoid harm and
    manipulate the course of events. Choosing to dig too deeply into the future
    for secrets may leave you vulnerable to the Warp’s deceptions, however. If
    the power is successful, you may draw three secrets from the future. At any
    point before the end of your next turn, you may spend each secret to select
    a single d6 that has just been rolled—by any character—and change the result
    to any number. However, each die which you change to a 6 allows the GM to
    change a single d6 roll to a 1 later in the same scene. Similarly, each die
    which you change to a 1 allows the GM to change a single d6 roll to a 6
    later in the scene.</p>
