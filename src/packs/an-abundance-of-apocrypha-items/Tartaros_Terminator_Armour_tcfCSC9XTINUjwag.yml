  description: >-
    <p><span class="fontstyle0">Developed during the Great Crusade alongside
    Mark IV Power Armour, Tartaros-pattern Tactical Dreadnought Armour trades
    some of the resilience of Cataphractiipattern armour for greater mobility.
    Providing comparable protection to the more common Indomitus-pattern armour
    (the standard Terminator Armour on page 303 of the </span><span
    class="fontstyle2">Wrath & Glory </span><span class="fontstyle0">core
    rulebook), Tartaros is easier to move in. However, the technical and
    resource requirements to make each suit were prohibitive, and they were
    never produced in large numbers. After the Heresy, only a few of these suits
    remain in active service.</span></p><p></p><p><span
    class="fontstyle3">Armour Rating: </span><span class="fontstyle0">7; Bulk
    (1), Powered (5)</span></p><p></p><p><span
