  description: >-
    <p><span class="fontstyle0">Combat Armour is the standard armour worn by Tau
    Fire Warriors on the battlefield. Constructed in two layers, the outer face
    is hard and ultra-dense nanocrystalline metal veneer bounded to an inner
    layer of high-performance, thermo-set, molecular
    polythene.</span></p><p></p><p><span class="fontstyle0">The distinctive
    domed T'au helmet of a Combat Armour set includes many systems, ranging from
    communication equipment, night vision sensors, targeting and ranger-finder
    information, visual relay systems, and access to the main command
    network.</span></p><p></p><p><span class="fontstyle0">Standard Fire Warrior
    Combat Armour usually also features an elongated and thickened left shoulder
    plate, which acts as an additional protective shield when the Fire Warrior
    is kneeling to fire a weapon more accurately and exposing his left shoulder
    to retaliatory fire.</span></p><p></p><p><span class="fontstyle2">Armour
