  description: >-
    <p>The unflinching eye of a Navigator locks a creature in place with a gaze
    that pierces flesh and bone to see the immaterial essence of all things.
    Choose a target you can see within range. If you succeed, the target is
    Warp-locked. While Warp-locked, the target adds +4 to the DN of any psychic
    power they attempt. If the target is a DAEMON, then they also may not roll
    Determination against any damage inflicted against them. Each round this
    power is sustained, you suffer 1d3 Shock.</p>
