system:
  description: >-
    <p>An ancient Chapter, founded in secret at the Emperor&rsquo;s bidding
    during the Horus Heresy, the Grey Knights exist to combat the threat of the
    daemonic, and to this end they serve as the Chamber Militant of the Ordo
    Malleus. Few even know that the Grey Knights exist, for witnesses to their
    actions are mind-wiped or executed to ensure that the secret is not
    revealed. Every Grey Knight is a psyker, trained and conditioned to wield
    their mental powers to ward themselves from corruption and drive back the
    daemons they battle. Due to their unique geneseed and secretive nature, the
    Grey Knights do not count any Primaris Marines amongst their number.</p>

    <h4>Daemonbane</h4>

    <p>You have been taught the secrets of daemon-kind to best understand how to
    end them.</p>

    <p>When attacking a creature with the &nbsp;@Item[eeSvJvzZBjQvtZq0]{DAEMON}
    keyword in melee combat, you add +Rank ED to the attack&rsquo;s damage. You
    also add +Rank to your Conviction.</p>

    <h4>Secretive (Tradition)</h4>

    <p>Grey Knights do not trust outsiders, and their nature cannot be permitted
    to be known to any outside the chapter. You suffer a +2DN penalty for
    Interaction tests involving anyone who lacks the Grey Knights or Inquisition
    keywords.</p>
