  description: >-
    <p><span class="fontstyle0">Champions of Nurgle are frequently accompanied
    by gaggles of chattering Nurglings eager to frolic within the death and
    decay the Champion spreads. Some of these Nurglings seem to appear from the
    dank corners of the world, while others squeeze themselves loose from the
    Champion’s filth-ridden flesh, growing to fullsize in moments after falling
    to the ground… but they just as easily get lost, or are crushed
    underfoot.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">You are constantly accompanied by a mob of Nurglings.
    This mob consists of [[/r 2d6]] Nurglings: the number is rolled at the start
    of your turn. These Nurglings will take an action on your turn, and will
    attempt to remain as close to you as possible, and they will attack anyone
    who attacks you, but they will not listen to your commands.</span> <br
