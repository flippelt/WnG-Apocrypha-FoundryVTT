  description: >-
    <p>The Sisters of the Order of the Sacred Rose are renowned for their calm
    and implacable resolve in battle. Even in the face of overwhelming odds, the
    heirs of Saint Arabella stand unyielding.</p>

    <p><strong>Devout Serenity:</strong> You increase your Resolve by +Rank.
    Further, if you ever roll a 6 on your Wrath die when making a Resolve test,
    you gain 1 Faith.</p>
