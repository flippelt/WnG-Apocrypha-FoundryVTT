  description: >-
    <p>You scourge the mind of your foe, dragging out every memory that makes
    them who they are and reducing them to hollow shells of what they once were.
    You must win at an opposed Willpower test against the target; if the power
    is successful, the target counts all their skills as having a rating of 0
    for as long as the power remains in effect (for Threats, all skills use the
    Default score -2). This power is somewhat taxing to maintain, so you suffer
    1 Shock for each round it is sustained.</p>
