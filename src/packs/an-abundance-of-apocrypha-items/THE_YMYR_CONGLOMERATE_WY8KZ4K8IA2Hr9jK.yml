name: THE YMYR CONGLOMERATE
type: keyword
img: modules/wng-core/assets/ui/aquila-white.webp
system:
  description: >-
    <p><span class="fontstyle0">Considered an "elite" League, a Kindred's entry
    into the Ymyr Conglomerate is dependent upon them proving exceptional skill
    in craftsmanship and a territory that yields a suitably high bounty of
    resources. There is no stigma attached to a Kindred effectively buying its
    way in like this - for the Kin are ever pragmatic. Its Brôkhyrs are thus of
    unparalleled skill and oversee great wealth to fuel their forges. In
    exchange for sizable exports of raw materials, these resource-rich Kindreds
    are rewarded with weapons, wargear, and vessels forged by their skilled
    allies.</span></p><p></p><p><span class="fontstyle2"><strong>ELITE
    ARTISANS</strong>: </span><span class="fontstyle0">You add +Rank to Tech
    skill tests and add +1 to the AR of any armour you wear.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
