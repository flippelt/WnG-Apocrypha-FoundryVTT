  description: >-
    <p><span class="fontstyle0">These bullets are finely engineered to fragment
    into a bundle of razor-sharp flechettes in flight, inflicting numerous nasty
    lacerations instead of single gunshot wounds. They’re often favoured by
    gunslingers and bounty hunters who can afford them, to even the odds against
    numerous foes.</span></p><p></p><p><span class="fontstyle0">These rounds may
    be used by weapons with the </span><span
    class="fontstyle2"><strong>PROJECTILE</strong> </span><span
    class="fontstyle0">keyword. Weapons with the Heavy keyword may not use this
    ammunition.</span></p><p></p><p><span class="fontstyle2"
    style="color:rgb(0,0,0);"><strong>Effect</strong>: </span><span
    class="fontstyle0">The weapon gains Spread and may re-roll up to 2 dice when
    making an attack while spending one or more Reloads.</span> <br style="
