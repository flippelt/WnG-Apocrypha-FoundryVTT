  description: >-
    <p>Extending your hand, you compel the enemy’s equipment to betray them.
    Grenades spontaneously detonate, weapons backfire, and power cells overheat
    in a deadly fashion. If this power is successful, select a single piece of
    wargear or weapon you can see in range. Until the start of your next turn,
    any roll of 1, 2, or 3 on the Wrath die when attempting to use that device
    is a Complication, and the complication is always the most catastrophic
    failure, inflicting 1d3 Mortal Wounds on the user. If the device is a
    grenade or other explosive, the device instead detonates immediately.</p>
