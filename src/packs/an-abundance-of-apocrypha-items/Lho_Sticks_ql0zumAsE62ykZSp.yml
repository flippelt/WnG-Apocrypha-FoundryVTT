  description: >-
    <p><span class="fontstyle0">Lho-sticks are common with Imperial Guard
    troopers, menial workers, and others with tiring, stressful work. Each stick
    is a rolled paper tube filled with a scented, mildly-narcotic (and
    addictive) substance, which is ignited, and the resulting smoke is inhaled.
    These come in varying sizes, and the substance within is normally made from
    a variety of different plants depending on where in the galaxy they were
    made. Like most luxuries, they vary immensely in quality between those used
    by the wealthy and those used by everyone else.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A character who smokes lho-sticks during a Regroup
    recovers [[/r 1d3+1]] Shock, as the narcotic substance and familiar habit
    eases their stress and calms them. A single pack of lho-sticks (or the
    materials to roll one’s own), contains 10 doses.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
