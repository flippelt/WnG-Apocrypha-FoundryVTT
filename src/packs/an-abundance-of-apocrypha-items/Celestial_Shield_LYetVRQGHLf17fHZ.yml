  description: >-
    <p><span class="fontstyle0">A Celestial Shield is a psychically-activated
    force field technology that is sometimes used by Asuryani Guardians as an
    emergency personal defence. Once activated, the psychic shield allows the
    user to withstand attacks for a short time that would otherwise have slain
    or badly injured them at a key moment during the
    battle.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">You may activate this item as a Reflexive Action when you
    are the target of a ranged attack. Your Resilience and Determination
    increases by +2 against ranged attacks until the start of your next turn.
    Further, while the field is in effect, you may roll Determination against
    Mortal Wounds.</span> <br style=" font-style: normal; font-variant: normal;
