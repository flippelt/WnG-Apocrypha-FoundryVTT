  description: >-
    <p><span class="fontstyle0">The Banner of Rage contains the bound souls of
    the most bloodthirsty of Khorne’s servants. It radiates palpable waves of
    anger and bloodlust which beat upon the minds of those nearby, driving them
    into a killing frenzy.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">KHORNE DAEMONS </span><span
    class="fontstyle0">within 8m of this banner may re-roll any 1s when rolling
    Determination. Further, you may unleash the banner’s power as a Combat
    Action. When the banner is unleashed, all </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">CHAOS </span><span class="fontstyle0">allies
    within 8m immediately become </span><span
    class="fontstyle3">Frenzied</span><span class="fontstyle0">. Once you have
    unleashed the banner’s power, it may not be unleashed again until after your
    next Regroup.</span> <br style=" font-style: normal; font-variant: normal;
