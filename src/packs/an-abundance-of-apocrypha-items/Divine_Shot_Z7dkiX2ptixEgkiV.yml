  description: >-
    <p>Using this power enables you to make nearly impossible ranged shots,
    allowing you to strike virtually any target you can perceive. You
    concentrate on a single firearm or other projectile weapon in your
    possession, and the ammunition it carries, before casting your psychic gaze
    into the Warp to search down the near-infinite paths of the
    future.</p><p>When you use this power, choose a single ranged weapon you’re
    carrying, which has ammunition. You fire a single shot from this weapon
    against a single target—no multitargets allowed—which hits instantly if the
    power is successfully used, at any distance up to the weapon’s normal
    maximum range.</p>
