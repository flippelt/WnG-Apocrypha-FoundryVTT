  quantity: 1
  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">The Psychic Hood is an arcane device utilised by
    Space Marine Librarians to amplify the wearer's psychic powers and protect
    against an assault by enemy psykers. Most importantly, a Psychic Hood
    renders the wearer more able to counter the effects that other psykers have
    on the Warp nearby. Distinguished by the trademark metal hood that rises
    from the backplate of a Librarian's Power Armour, a Psychic Hood uses a set
    of interwoven, intricately aligned crystals to nullify an opponent's psychic
    attacks.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A character wearing a psychic hood may attempt to Deny
    the Witch as a Reflexive Action in response to an enemy </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">@UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKER} </span><span
    class="fontstyle0">using a power, though they may not use a psychic power
    during their following turn. Further, they may add +Double Rank bonus dice
    on their Psychic Mastery test to use Deny the Witch.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
