system:
  description: >-
    <p><span class="fontstyle0">The weapon’s psycho-crystalline conduits have
    been enhanced to allow it to store psychic energy for later use. Not all
    weapons can be adapted as easily to this, as the modifications are
    fragile.</span></p><p></p><p><span class="fontstyle0">Any melee weapon with
    the </span><span class="fontstyle2"><strong>FORCE</strong> </span><span
    class="fontstyle0">keyword may take this upgrade.</span></p><p></p><p><span
    class="fontstyle2" style="color:rgb(0,0,0);"><strong>Effect</strong>:
    </span><span class="fontstyle0">When the wielder of this weapon succeeds at
    using a psychic power, they may store Exalted Icons rolled on that Psychic
    Mastery test. These icons may be spent to gain additional dice on subsequent
    Psychic Mastery tests, or to purchase Potency options on psychic powers used
    later. The weapon may store a maximum of 3 Exalted Icons.</span> <br style="
