  description: >-
    <p><span class="fontstyle0">Eldar Farseers often carry the spirit stone of a
    venerated predecessor or long-dead ancestor. These stones can be a source of
    wisdom and guidance during times of strife, and a source of power in times
    of desperation.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">When you attempt to use a psychic power, you may draw
    upon the power of the soul within the stone. This grants one of two effects:
    either you gain +Double Rank bonus dice on a single Psychic Mastery test, or
    you may use the psychic power as a Simple Action. Once used, the stone’s
    inhabiting soul goes dormant until the next Respite.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
