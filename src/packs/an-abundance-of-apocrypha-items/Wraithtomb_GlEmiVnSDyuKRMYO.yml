  description: >-
    <p>You conjure and weave a tangle of wraithvines, psychic constructs that
    take the form of thorny tendrils which enwrap themselves around the target.
    Though they will not remain coherent without wraithbone or psychocrystal to
    make the structure tangible, the vines are solid enough for the moment. This
    power targets a single creature, vehicle, or structure within range. If a
    creature or vehicle, the target is restrained and hindered (3) while the
    power remains in effect. If a structure is the target, then the wraithvines
    wrap themselves around and into the structure in a manner determined by the
    Bonesinger and the GM: it may seal over or force open doors, ensnare and
    shut down automated defences, create a climbable surface, or something
    similar.</p>
