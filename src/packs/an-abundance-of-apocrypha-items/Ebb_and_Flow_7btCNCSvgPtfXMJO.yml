  description: >-
    <p>Time can flow in a strange manner when travelling through the Immaterium,
    and over the years many Navigators have learned to move with the temporal
    unpredictability of the Immaterium that underlies reality. By unleashing a
    vision which strips away the flimsy façade of linear time from an attacker’s
    eyes, you can shatter their ability to react to the changing battlefield.
    Select a single enemy you can see within range. If you succeed, the target
    suffers the Hindered (2) and Vulnerable (2) conditions and cannot attempt
    Reflexive Actions while the power remains in effect.</p>
