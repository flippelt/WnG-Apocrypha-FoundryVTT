system:
  description: >-
    <p>While their duties are much the same as any Sisters Famulous, the Order
    of the Holy Seal secretly monitor their charges for deviancy and heresy,
    ensuring that the highest positions of power do not fall to
    corruption<strong>.</strong></p><p><strong>Inescapable Scrutiny:</strong>
    When you succeed at an Insight test, you may spend 1 Faith point to discern
    some inner truth or secret shame of the target. Ask the GM one question
    about the target.</p>
