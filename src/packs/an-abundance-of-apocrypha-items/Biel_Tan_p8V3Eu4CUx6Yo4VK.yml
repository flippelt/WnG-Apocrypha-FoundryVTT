  description: >-
    <p>Biel-Tan is renowned for the strong warrior ideals of its people. For the
    Asuryani of Biel-Tan, the Way of the Warrior, the life-stage that
    encompasses the Aspect Warriors, is considered the first step upon the
    Asuryani Path. Upon reaching physical maturity a Biel-Tan Asuryani becomes
    an Aspect Warrior, and only once they have fulfilled this role can they
    continue along the other roles of the Asuryani Path.</p><p><strong>PROWESS
    OF THE BLADEWIND:</strong> Select either ranged attacks or melee attacks.
    You may re-roll up to Rank dice on the chosen type of attack.</p>
