  description: >-
    <p>The Accatran pattern Mark IV Lasgun is a lightweight, compact weapon
    ideal for use by Drop Troop units, such as the Elysians, who are commonly
    equipped with these weapons. The length is reduced thanks to the
    &lsquo;bullpup&rsquo; design, where the power pack is inserted into the
    shoulder stock, behind the handle. To conserve ammunition and reduce
    wastage, the weapon&rsquo;s refire rate is reduced, removing the capacity
    for automatic fire. It uses a high-charge capacitor, to improve stopping
    power during the initial stages of a firefight.</p>
