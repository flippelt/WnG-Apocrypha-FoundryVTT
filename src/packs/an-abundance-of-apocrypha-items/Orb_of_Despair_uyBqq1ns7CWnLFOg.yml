  description: >-
    <p><span class="fontstyle0">This heavy black sphere has sat within the
    oubliettes of the Haemonculi for millennia, absorbing the pain and horror of
    the damned souls trapped within. When hurled at the ground it sends out
    shockwaves of negative emotional energy that plunge those nearby into the
    deepest, darkest anguish.</span></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Any creature caught in the blast of an Orb of Despair
    must pass a </span><span class="fontstyle3">Terror </span><span
    class="fontstyle0">test (TN 6). Any creature who fails additionally suffers
    1d3+2 Shock.</span> <br style=" font-style: normal; font-variant: normal;
