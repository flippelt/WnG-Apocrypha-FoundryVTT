  description: >-
    <p>The Neuro-Gauntlet is a specialised weapon only used by the Eversor
    Assassins of the Imperium of Man's Officio Assassinorum. The weapon is a
    glove or gauntlet comprised of a hyper-alloy glove whose fingers end in
    sharp hypodermic needles that inject a potent neurotoxin into the Assassin's
    victim. When the glove strikes an opponent, the needles immediately inject
    their toxin into the person's bloodstream. The lethal effect is almost
    instantaneous and causes a horrifically painful death as the victim is
    completely paralyzed while his organ systems shut down one by one.</p>

    <p><strong>Special:</strong> While Poisoned by a Neuro-Gauntlet, a character
    is Restrained and suffers 1d3 Mortal Wounds at the beginning of each of
    their turns.</p>
