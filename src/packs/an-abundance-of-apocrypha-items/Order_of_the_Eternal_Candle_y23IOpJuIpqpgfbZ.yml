system:
  description: >-
    <p>Each human life is a candle in the darkness, and the Imperium is the
    luminance of all those lives joined with the Emperor’s infinite light. The
    Order of the Eternal Candle seek to keep those candles being snuffed
    out.</p><p><strong>Healing Light:</strong> When you succeed at a Medicae
    test to heal wounds or stabilise a dying character, or when you heal Wounds
    during a Regroup, you may spend 1 Faith to heal an additional +Double Rank
    Wounds.</p>
