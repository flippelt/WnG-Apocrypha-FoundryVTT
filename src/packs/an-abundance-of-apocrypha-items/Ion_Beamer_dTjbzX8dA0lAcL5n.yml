  description: >-
    <p><span class="fontstyle0">An Ion Beamer is a large and powerful,
    long-range, vehicle-mounted directed energy Ion Weapon used by the military
    forces of the Leagues of Votann. Ion Weapons typically are capable of
    engaging enemies at long range with high-energy streams of ionised subatomic
    particles, vaporising flesh and metal with equal ease. These high-energy
    ions containing an electric charge are accelerated by an electromagnetic
    field and react explosively with the target as a result of the direct
    transfer of energy at an atomic level. These mid-range weapons fire a
    coherent beam of ionised particles, scything through enemy ranks with brutal
    efficiency.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
