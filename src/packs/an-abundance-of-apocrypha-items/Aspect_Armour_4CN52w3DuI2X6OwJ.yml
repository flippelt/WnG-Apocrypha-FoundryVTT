  description: >-
    <p><span class="fontstyle0">Aspect Armour is manufactured by the Eldar for
    use by their specialist Aspect Warriors. They use psychic engineering to
    construct a psycho-sensitive material which reacts instantly to movement by
    the wearer and moulds and reshapes itself to provide a tight fit, making it
    ideal for combat. It stiffens on impact much like Mesh Armour although it
    also includes further rigid plating, and force field generators to reinforce
    it further.</span></p><p></p><p><span class="fontstyle0">Several Aspect
    Shrines use a heavier version, but even this is lightweight and flexible
    compared to similar armour worn by other species. Aspect Armour contains
    technology equivalent to a vox-bead and a
    rebreather.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">4, Agile, Power
    Field</span></p><p></p><p><span
    class="fontstyle2"><strong>Variants</strong>: </span><span
    class="fontstyle0">Heavy Aspect Armour has an Armour Rating of 5, the Bulk
    (1) trait, and the </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">HEAVY </span><span
    class="fontstyle0">keyword.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
