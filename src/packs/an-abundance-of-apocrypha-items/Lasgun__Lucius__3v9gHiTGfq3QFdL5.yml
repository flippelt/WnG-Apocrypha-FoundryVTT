name: Lasgun (Lucius)
type: weapon
img: modules/wng-core/assets/icons/weapons/lasgun.webp
system:
  quantity: 1
  rarity: common
  description: >-
    <p>These weapons were made famous by the siege regiments of Krieg, who have
    vast stockpiles of this pattern of Lasgun. It draws a much larger charge
    from its powerpack than most lasguns, which results in a much more potent
    shot, but increases component wear due to heating, and means an individual
    will use up the charge from a power pack much faster. The extra stresses
    placed on the weapon force it to have a slower rate of fire, allowing the
    barrel and capacitors to cool before firing, to prevent undue damage to the
    weapon. This cooling is sped up by the addition of additional heatsink rings
    around the base of the barrel, but the weapon itself is still limited to
    semi-automatic fire. This is amply compensated for by the increased hitting
    power.</p>
