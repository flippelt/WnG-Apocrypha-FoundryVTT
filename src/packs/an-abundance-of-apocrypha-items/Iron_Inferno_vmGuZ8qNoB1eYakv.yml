  description: >-
    <p>You send your mind questing outwards to locate seams of metal, the iron
    spars of girders and foundations, and any other metalling mass you can
    sense. Then, with a furious mental blast, you superheat them all to trigger
    a pyrometallic explosion. If this power is successful, select a single point
    within range that you can see; roll 1d6 for each creature or vehicle within
    6m of that point; on an Icon, that creature suffers 1 Mortal Wound and the
    On Fire condition.</p>
