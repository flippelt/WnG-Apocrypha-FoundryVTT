  description: >-
    <p><strong>Activation</strong>: Five Minutes</p><p></p><p>There are many
    myths about the “third eye” into the soul, their origins supposedly harking
    from Ancient Terra. The Navis Nobilite know that such stories are not wholly
    myth, and they understand that it is entirely possible to discover hidden
    knowledge through particular forms of introspective meditation. If this
    power is successful, you immediately recover 1d3+2 Shock, and add +2 bonus
    dice to the first Investigation or Scholar test you attempt during the
    power’s duration. You may use this power as part of a Regroup. Once you have
    used this power, you may not use it again until after you have taken a
    Respite.</p>
