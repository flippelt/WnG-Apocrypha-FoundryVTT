  description: >-
    <p><span class="fontstyle0">These armoured suits straddle the line between
    armour and vehicle, encasing an armoured Sister of Battle in an additional
    shell which mimics her motions in battle. Only the most skilled and trusted
    Celestians are entrusted with these suits, for their machine spirits are not
    easily tamed, but they can weather the heaviest firepower and do battle with
    the most fearsome of enemies.</span></p><p></p><p><span class="fontstyle0">A
    Paragon Warsuit may only be worn by a character wearing Sororitas Power
    Armour.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">7, Powered (5)</span></p><p></p><p><span
    class="fontstyle2"><strong>Warsuit</strong>: </span><span
    class="fontstyle0">The wearer’s Toughness is increased by +4 while they wear
    this suit. This increases the wearer’s Wounds and Determination
    accordingly.</span></p><p></p><p><span
    class="fontstyle2"><strong>Armament</strong>: </span><span
    class="fontstyle0">The suit is equipped with either a twin Storm Bolter, or
    a Paragon Grenade Launcher. One arm mounts a Heavy Bolter, Multi-Melta, or
    Heavy Flamer, while the other mounts a Paragon War Blade or Paragon
    Mace.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
