system:
  description: >-
    <p>When the armies of Stygies VIII march to war, they do so beneath stealth
    screen projectors and target-befouling apparatus. That the Tech-Priests of
    this forge world deny owning such technology only reinforces their
    untrustworthy reputation.</p><p><strong>SHROUD PROTOCOLS:</strong> You add
    +Rank bonus dice to Stealth Tests and gain an additional +1 to Defence
    against ranged attacks from more than 12 metres away.</p>
