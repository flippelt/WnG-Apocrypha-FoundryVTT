  description: >-
    <p><span class="fontstyle0">A potent weapon, the Rail Rifle makes use of the
    same technologies as the larger Railgun and Heavy Rail Rifle, albeit on a
    smaller scale so that it is infantry portable. Possessed of an impressively
    long range and ability to deal great damage, the Rail Rifle's true strength
    lies in its armour penetration capabilities. The Rail Rifle's hypersonic
    projectile can punch through the heaviest personal armour with ease. As a
    dedicated elite infantry killer, enemy units that manage to survive a Rail
    Rifle fusillade often find themselves pinned down, unable to do anything in
    the face of such deadly fire. The Rail Rifle also proves effective when used
    against light vehicles. Rail Rifles have only recently been authorised for
    issue to frontline Tau units, having completed an extensive field-testing
    phase</span>.</p>
