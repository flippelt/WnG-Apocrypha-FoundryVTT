  description: >-
    <p><span class="fontstyle0">Using the most advanced warp technology
    available to the Aeldari, a phase field allows the wearer to shift into the
    veil between realspace and the Webway, ‘phasing’ in and out of
    reality.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">You may activate the field when you move. When you do so,
    you have a Speed of 10, but your movement can take you to any point within
    your movement distance: you vanish and reappear at your destination, without
    regard for intervening terrain. The only obstacles you cannot pass are Void
    Shields and other warp-based barriers. You suffer 1 Shock at the end of any
    turn in which you used the Phase Field.</span> <br style=" font-style:
