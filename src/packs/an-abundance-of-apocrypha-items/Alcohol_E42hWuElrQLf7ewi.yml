system:
  quantity: 6
  rarity: common
  description: >-
    <p><span class="fontstyle0">Most intelligent species have developed some
    form or other of alcoholic drink, and most cultures have devised countless
    methods of creating beverages that include alcohol in some form, from crude
    rotgut distilled in engine machinery (itself an offence to the Machine
    Spirit), to carefully aged and precisely flavoured concoctions reserved for
    only the most powerful and most deserving. Consuming alcohol tends to loosen
    inhibitions and provide “liquid courage”, but overconsumption can lead to
    other problems. From human amasec, to Aeldari dreamwine, to Ork fungus brew,
    and the Bru of the Leagues of Votann, alcoholic beverages are found across
    the galaxy.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A single purchase contains 6 doses. A character gains +1
    Resolve for the next hour after drinking. A character who takes a number of
    doses exceeding their Toughness within one day gains +2 Resolve instead, but
    also suffers +1DN on all other activities, and will suffer [[/r 1d3]] Shock
    when they awaken after their next sleep. Excessive drinking may lead to
    other sideeffects, such as nausea, poor decision-making, and/or
    unconsciousness.</span> <br style=" font-style: normal; font-variant:
    normal; font-weight: normal; letter-spacing: normal; line-height: normal;
    orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform:
    none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
