  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">Aegis Armour is a specialized form of Astartes
    Power Armour worn by members of the Grey Knights chapter. Worked into their
    Armour, each Aegis Suit contains a lattice of psycho-conductive filaments
    and protective amulets, layered hexagrammic wards, and is inscribed with
    anti-daemonic prayers. Aegis Armour allows Grey Knights to better combat
    Warp Entities and Rogue Psykers by protecting them from psychic attack. The
    technology incorporated into The Aegis represents the most potent
    anti-psychic defences in the Imperium of Man.</span></p><p></p><p><span
    class="fontstyle2">Armour Rating: </span><span class="fontstyle0">5; Powered
    (3)</span></p><p></p><p><span class="fontstyle2"><strong>The Aegis</strong>:
    </span><span class="fontstyle0">Enemy psychic powers which target the wearer
    suffer +2DN. In addition, the wearer adds +Rank bonus dice when rolling
    Determination against attacks from a </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">@UUID[Compendium.wng-core.items.Item.eeSvJvzZBjQvtZq0]{DAEMON}</span><span class="fontstyle0">.</span>
    </p>
