  description: >-
    <p>You implant your foes with the psychosomatic suggestion that your weapon
    is irresistibly sharp, striking them down with the psychic feedback of their
    own warped perceptions. While this power remains in effect, you add half
    your Willpower to the base damage of all melee attacks you make (if you’re
    already wielding a Force Weapon, add your entire Willpower score instead,
    replacing both this effect and the benefit from the Force Weapon trait). In
    addition, if your Willpower is higher than that of your target, then the AP
    of your weapon is improved to -4.</p>
