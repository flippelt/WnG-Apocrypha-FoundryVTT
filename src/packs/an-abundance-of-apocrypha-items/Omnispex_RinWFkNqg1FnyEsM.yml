  description: >-
    <p><span class="fontstyle0">An omnispex is a form of auspex that carries a
    Raptorclass machine spirit that can read heat emissions, data signatures,
    and other biological electromagnetic waveform emissions even at extreme
    range. Should it be kept focussed for an extended period, an omnispex will
    determine the weak points of those it scrutinises and pass them on to its
    master.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">An omnispex functions as an auspex (page 236 of the
    </span><span class="fontstyle3">Wrath & Glory </span><span
    class="fontstyle0">core rulebook). In addition, if the recipient aims at an
    enemy, then they ignore any Defence bonuses from cover on their next ranged
    attack. If the recipient is equipped with a data-tether, they may share this
    bonus with any allies equipped with data-tethers within 10m.</span> <br
