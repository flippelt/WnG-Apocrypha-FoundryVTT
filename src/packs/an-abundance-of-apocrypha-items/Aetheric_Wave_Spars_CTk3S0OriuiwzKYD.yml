  description: >-
    <p><span class="fontstyle0">Grafted to the spine and affixed by thick cables
    to heavy metal vambraces, these metre-long poles are designed to gather and
    conduct psychic energy, allowing a psyker to channel more aggressively.
    Implants of this sort have been extensively tested by the Adeptus Astra
    Telepathica, but it has been found that the power they provide is
    dangerously unstable, and they are banned by order of the
    Inquisition.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">When you roll a Wrath Critical on a Psychic Mastery test,
    you may roll one additional Wrath Die immediately (these extra dice cannot
    themselves generate extra dice).</span> <br style=" font-style: normal;
