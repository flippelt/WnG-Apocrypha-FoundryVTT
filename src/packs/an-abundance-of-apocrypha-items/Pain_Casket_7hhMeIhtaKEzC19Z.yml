  description: >-
    <p><span class="fontstyle0">These psychoreactive devices, made of tortured
    wraithbone, draw in the pain and dread felt by those nearby, and can be
    drawn out by any who need it.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Add one Pain point to the Casket whenever an enemy does
    one of the following within 12 metres: a character suffers three or more
    Wounds from a single attack, you affect an enemy with an Intimidation
    interaction attack, a character fails a Resolve test, a character becomes
    Exhausted. Drukhari within 6 metres of the Casket may, as a Simple Action,
    draw a Pain point from the Casket to either recover [[/r 1d3]] Shock or to
    count towards the </span><span class="fontstyle3">Power Through Pain
    </span><span class="fontstyle0">talent.</span> <br style=" font-style:
