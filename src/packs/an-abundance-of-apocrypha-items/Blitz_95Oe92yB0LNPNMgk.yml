  description: >-
    <p>At the start of one of your turns, you may choose to initiate a Blitz.
    When you do so, your Speed is doubled, and you ignore Double Rank DN
    increases on Multi-Attacks until the end of your turn. Once you have done
    this, you cannot do so again until after your next
    Regroup.</p><p></p><p><strong>The Path of Damnation</strong>: Other Aeldari
    shun you, and you add +6 to the DN of all Interaction tests with other
    Aeldari outside of ritual circumstances or performances. All Aeldari – even
    allies – must pass a Fear test (DN 3) when they first meet you. However, you
    automatically succeed at all Conviction and Resolve tests.</p>
