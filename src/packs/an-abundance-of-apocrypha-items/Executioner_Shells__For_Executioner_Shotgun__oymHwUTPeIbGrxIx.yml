  description: >-
    <p><span class="fontstyle0">Executioner shells are used by the Adeptus
    Arbites. They contain a tiny machine spirit that allows them to home in on
    their target. However, it takes a moment for them to acquire their target
    and so are more accurate at longer ranges.</span></p><p></p><p><span
    class="fontstyle0">These shells may be used with a shotgun or combat
    shotgun.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Weapon loses Spread, but gains +1ED. A shotgun using
    Executioner shells reverses the normal modifiers for firing at Short or Long
    range.</span> <br style=" font-style: normal; font-variant: normal;
