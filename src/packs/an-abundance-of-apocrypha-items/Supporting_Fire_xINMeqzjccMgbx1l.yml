  description: >-
    <p>You are always ready to deliver punishing fire against those who stray
    too close to your allies.<br>When an enemy uses the Charge action to charge
    an ally you can see within 12m of you, you may spend 1 ammo to make a ranged
    attack as a Reflexive action. This ranged attack is resolved before their
    Charge action is completed, and the enemy&rsquo;s Defence is increased by
    +2. This is considered a Salvo attack, and thus the weapon must be reloaded
    after the attack.</p>
