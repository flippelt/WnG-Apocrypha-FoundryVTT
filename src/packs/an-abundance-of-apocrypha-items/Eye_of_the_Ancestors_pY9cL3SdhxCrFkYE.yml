  description: >-
    <p>As a Free Action at the start of each of your turns, you may spend 1
    Glory to Judge a single enemy you can see. You may also Judge an enemy for
    free as a Reflexive Action if they kill a LEAGUES OF VOTANN ally. You may
    have a maximum number of enemies Judged equal to twice your Rank. Whenever a
    Judged enemy is slain or leaves the scene, they are no longer Judged, and
    you may choose to remove the Judged state from an enemy when you Judge a new
    enemy. </p><p>When a LEAGUES OF VOTANN ally makes an attack against a Judged
    enemy, for each Exalted Icon shifted for damage, add +2ED rather than
    +1ED.</p>
