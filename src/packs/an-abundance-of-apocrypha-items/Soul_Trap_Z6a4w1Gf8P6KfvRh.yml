  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">Though soul-traps vary in size and appearance,
    from folding pyramidal prisms to jewelled skulls engraved with vampiric
    runes, they all have one function—to capture the soul of a powerful foe
    within its confines and empower the bearer with the stolen
    energies.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Whenever you slay an Adversary Threat or Monstrous
    Creature, you may attempt a Willpower test with a DN equal to the enemy’s
    Willpower. If you succeed, the enemy’s essence is drawn into the soul-trap,
    and the stolen power doubles your Strength attribute until your next
    Regroup.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
