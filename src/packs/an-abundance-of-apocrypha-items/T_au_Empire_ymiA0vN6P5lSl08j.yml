system:
  journal: ''
  backgrounds:
    origin:
      - name: First-Sphere Sept
        description: >-
          You hail from one of the original Septs settled by the T’au, or
          possibly from the T’au homeworld itself.
        effect: xFVGcI9JfMvTbtMr
      - name: Second-Sphere Sept
        description: >-
          : Your ancestors braved the unknown to colonise a Sept during the
          second-sphere expansion phase.
        effect: 1fdQ9mBWNxWFcu1Q
      - name: Third-Sphere Sept
        description: >-
          Your forebears faced extreme resistance to settle a Sept during the
          third-sphere expansion phase.
        effect: Is1Kg6jOZeTNDyCT
    accomplishment:
      - name: Discovery
        description: >-
          You aided in finding, securing, or creating something valuable to the
          ongoing expansion of the T’au Empire.
        effect: gbLibaio5kzsC19R
      - name: Protection
        description: >-
          You helped to protect some territory, resource, or other vital asset
          from being lost to outsiders
        effect: 1fdQ9mBWNxWFcu1Q
      - name: Sacrifice
        description: >-
          You willingly gave of yourself in the name of the Greater Good,
          suffering some form of loss or injury for the betterment of the T’au
          Empire.
        effect: 65yvDqLlXMbTG3zb
    goal:
      - name: Advancement
        description: >-
          You know that you will be able to further the tau’va if you can gain
          power and status within the Empire.
        effect: xFVGcI9JfMvTbtMr
      - name: Duty
        description: >-
          You will do whatever the Ethereals will to ensure the T’au Empire
          grows and prospers and all are brought within the protection of the
          Greater Good.
        effect: Q8rIulFDVkEHJEXT
      - name: Supremacy
        description: >-
          The galaxy is full of misguided species who need to be shown the error
          of their ways, and you will do your part to show them.
        effect: 1fdQ9mBWNxWFcu1Q
  objectives:
    - When you seek to apply the wisdom of the Ethereals to a situation.
    - >-
      Extol the virtues of the Greater Good to someone who does not belong to
      the T’au Empire
    - >-
      Reminisce about the wonders and glories of your home Sept and other worlds
      within the T’au Empire
    - Describe a previous triumph or achievement of the T’au Empire
    - >-
      Reflect on your bond with your team-mates (especially if you Ta’lissera
      bonded)
    - >-
      Ponder the differences or similarities between the Castes, or between the
      T’au and another species
