  description: >-
    <p><span class="fontstyle0">A Cyclic Ion Blaster is an experimental T'au XV8
    Crisis Battlesuit Ion Weapon system developed during the T'au Empire’s Third
    Sphere Expansion. The Cyclic Ion Blaster was developed using Ion Weapon
    technology acquired as part of a fruitful alliance between the Syrr’Tok
    Brotherhood of the Demiurg and the Water Caste of the Dal’yth
    Sept.</span></p><p></p><p><span class="fontstyle0">Current T'au Ion Weapon
    designs also allow for the weapons to be overcharged by exposing the
    reactive </span><span class="fontstyle2">Mor’tonium </span><span
    class="fontstyle0">power source to the environment, though this also exposes
    the user to the dangerous ionising radiation emitted by the </span><span
    class="fontstyle2">Mor’tonium</span><span class="fontstyle0">. Overcharging
    a Cyclic Ion Blaster allows it to generate an explosive blast with increased
    damage compared to its normal fire mode.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
