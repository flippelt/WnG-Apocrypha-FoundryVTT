  description: >-
    <p><span class="fontstyle0">The XV15 Stealthsuit is the smallest of all the
    various Tau Battlesuit variants and is designed for use in operations
    requiring a high degree of stealth. Fire Warriors serving in a Stealth Team
    specialise in covert operations such as infiltration, sabotage,
    reconnaissance, and ambush. Stealth Teams are the Fire Caste's special
    operations units. They are the "lone wolves" of the Tau military, typically
    operating independently of their Hunter Cadre. Suddenly appearing, as if
    stepping out from nowhere, a Stealth Team unleashes a hail of gunfire to
    cripple or eliminate their selected targets. Theirs is a secretive way of
    war, as they infiltrate enemy lines, seeking vulnerable targets to destroy.
    To pass unseen into enemy territory, Stealth Teams use light-bending
    disruption technology embedded in their sleek Battlesuits to camouflage
    themselves. Additional cloaking fields deaden sound and shield them from
    heat-detecting sensors, allowing them to penetrate deep into hostile regions
    before launching precisely timed ambushes.</span></p><p></p><p><span
    class="fontstyle2">Armour Rating: </span><span class="fontstyle0">5, Powered
    (2)</span></p><p></p><p><span class="fontstyle2"><strong>Stealth
    Field</strong>: </span><span class="fontstyle0">When active, the Stealth
    Field increases the wearer’s Defence by +2 and increases the DN to observe
    or detect the wearer by +2.</span></p><p></p><p><span
    class="fontstyle2"><strong>Jump Jets</strong>: </span><span
    class="fontstyle0">The armour is fitted with jump jets allowing for
    considerable mobility. The suit has a Speed of 8 (Flying). As a Stealth
    Battlesuit, moving using this flight speed does not affect the wearer’s
    Stealth Score.</span></p><p></p><p><span
    class="fontstyle2"><strong>Armament</strong>: </span><span
    class="fontstyle0">This battlesuit is armed with a single Burst Cannon,
    modified to grant it the Silent trait. They cannot take a </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">SUPPORT SYSTEM</span><span
    class="fontstyle0">.</span> <br style=" font-style: normal; font-variant:
    normal; font-weight: normal; letter-spacing: normal; line-height: normal;
    orphans: 2; text-align: -webkit-auto; text-indent: 0px; text-transform:
    none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
