system:
  quantity: 1
  rarity: unique
  description: >-
    <p><span class="fontstyle0">In the millennia between the Horus Heresy and
    the Indomitus Crusade, only one new mark of armour was developed, a clear
    demonstration of how much progress and innovation have stagnated. “Errant”
    armour is a development on the Mk7 design, addressing some of the flaws and
    weak points of that type. It adds extra plating on the torso to further
    protect the energy cabling, and a high gorget, or collar, covering the weak
    point at the neck join (the only drawback is that older helmets are not
    easily compatible). It has had limited deployment thus far, so tends to be
    reserved for veteran Space Marines as a sign of
    rank.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">6; Powered (3)</span></p><p></p><p><span
    class="fontstyle2"><strong>Sign of Authority</strong>: </span><span
    class="fontstyle0">The wearer adds +Rank to Leadership tests to command or
    rally other characters with the </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">ADEPTUS ASTARTES </span><span
    class="fontstyle0">keyword.</span></p><p></p><p><span
    class="fontstyle2"><strong>The Benefits of Advancement</strong>:
    </span><span class="fontstyle0">A Space Marine character may replace their
    power armour with armour of this mark when they take an ascension package,
    as their advancement demonstrates their worthiness for this scarce and
    potent armour.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
