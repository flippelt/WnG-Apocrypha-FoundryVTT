system:
  description: "<p>A much-diminished successor of the Blood Angels, the Flesh Tearers are especially afflicted by the curse of the Black Rage, making them particularly brutal in battle. Their savagery is so notorious that few other servants of the Imperium will call upon their aid unless there is no other recourse, for more than once the Flesh Tearers have been gripped with madness and turned on their allies. In the Era Indomitus, an influx of Primaris Marines, less susceptible to the Red Thirst, may help bring redemption to the Chapter, or it may only prolong their slow decline.</p><h4>Fury Within</h4><p>You are possessed of a bloodthirsty recklessness. When properly directed, this murderous ferocity makes you unstoppable.</p><p>You may re-roll Double Rank dice once per melee attack Test. In addition, if you shift one or more Icons on a melee attack, improve the AP of your attack by 1 (i.e., from -1 to -2).</p><h4>The Red Thirst (Gene-Seed)\_</h4><p>Your fury comes from a deep destructive impulse within your body and soul, an insatiable bloodlust that resists all attempts to deny it.</p><p>Whenever you are in melee combat and see blood, you must make a DN 4 Willpower Test. If you fail, you are @UUID[JournalEntry.46nFfrraenk9Z8IE]{Frenzied}.</p>"
