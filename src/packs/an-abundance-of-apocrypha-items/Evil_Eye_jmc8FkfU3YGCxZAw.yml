  description: >-
    <p>On many worlds, three-eyed mutants who can peer into your soul are
    thought of as bogey-men to scare children into obedience and people whisper
    that they are a tainted breed that can curse good, Emperor-fearing citizens
    with a glance. These legends contain a seed of truth, for techniques exist
    which cause their victims to attract malign entities to plague their mind
    and soul. Select a single enemy you can see within range. While this power
    remains in effect, the target is Hindered and suffers a Complication on any
    Wrath die which rolls 1, 2, or 3. This power lasts until the duration
    expires, or until the target creature spends 1 Wrath (or the GM spends 1
    Ruin if the target is an NPC). You may not have more than one foe cursed by
    this power at any time.</p>
