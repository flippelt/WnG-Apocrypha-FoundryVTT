  description: >-
    <p><span class="fontstyle0">Though prohibited across much of the Imperium,
    obscura is a widely abused narcotic at all levels of society, smuggled from
    world to world by criminals, hedonist cults, and others. It produces a
    pleasant dream-like state which lasts a few hours, but then turns into a
    deep depression once it wears off unless another dose is taken. It is highly
    addictive and has been known to be smoked and injected directly into the
    bloodstream.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A character who takes obscura is essentially unconscious
    for [[/r 1d3+3]] hours, though they are still (just about) capable of
    walking slowly and talking incoherently in this narcotic stupor. Once the
    drug’s effects end, the character becomes </span><span
    class="fontstyle3">exhausted </span><span class="fontstyle0">for twice as
    many hours as the drug’s effects lasted, which can be alleviated by taking
    another dose of obscura. A single purchase contains one dose.</span> <br
