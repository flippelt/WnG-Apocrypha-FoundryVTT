  description: >-
    <p><span class="fontstyle0">A Banshee Mask is a war helm worn by the Howling
    Banshees Eldar Aspect Warriors in battle. A standard Howling Banshees Aspect
    Warrior's Banshee Mask is tall in profile, with long flowing hair spilling
    from the top of it like a lion's mane.</span></p><p></p><p><span
    class="fontstyle0">Their distinctive design contains psychosonic amplifiers
    that magnify the keening battle screams of their wearers into
    mind-destroying shockwaves. This inflicts severe damage to the central
    nervous system of an Eldar warrior's foe, inspiring a feeling of mortal
    terror and causing momentary paralysis. By custom, it is this helmet that
    marks the Howling Banshee Aspect Warriors as the protectors and avengers of
    their Craftworld.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">When a Howling Banshee charges, all enemies within 3m of
    the Banshee’s target are paralysed by the war-cry; they cannot perform any
    Reflexive Actions and suffer the </span><span class="fontstyle3">Hindered 2
    </span><span class="fontstyle0">and </span><span
    class="fontstyle3">Vulnerable 2 </span><span class="fontstyle0">conditions.
    All the effects wear off at the end of the affected characters’ next
    turn.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
