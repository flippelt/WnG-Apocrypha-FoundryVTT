  rarity: common
  description: >-
    <p><span class="fontstyle0">Commonly given to Penal Legionnaires, Halo
    creates a compliant state suitable for combat prisoner indoctrination. Users
    can be better readied and even made enthusiastic to meet their coming fate
    on the battlefield. Other heavily stressed troopers use it to forcibly
    induce a calmer frame of mind.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Taking a dose of Halo adds +2 to the user’s Resolve but
    reduces the character’s Passive Awareness by 1 and adds +2 DN to all
    Awareness tests. This lasts for [[/r 2d6]] hours. A single purchase contains
    3 doses.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
