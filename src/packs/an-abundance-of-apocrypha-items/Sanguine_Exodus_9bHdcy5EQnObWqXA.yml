system:
  description: >-
    <p><span class="fontstyle0">This toxin causes the victim to begin
    exsanguinating rapidly, their blood pouring from every wound and orifice as
    if seeking to escape the body. Sanguine Exodus in part on the saliva of rare
    Xenos Haemovores common to a number of Death Worlds the Drukhari raid, and
    it has become popular amongst many Wyches as it allows them to kill with
    even greater elegance and conservation of motion.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The target bleeds profusely while </span><span
    class="fontstyle3">Poisoned </span><span class="fontstyle0">and suffers the
    </span><span class="fontstyle3">Bleeding </span><span
    class="fontstyle0">condition while the </span><span
    class="fontstyle3">Poisoned </span><span class="fontstyle0">effect lasts.
    Any attempts to remove the </span><span class="fontstyle3">Bleeding
    </span><span class="fontstyle0">condition fail while the </span><span
    class="fontstyle3">Poisoned </span><span class="fontstyle0">effect
    remains.</span> <br style=" font-style: normal; font-variant: normal;
