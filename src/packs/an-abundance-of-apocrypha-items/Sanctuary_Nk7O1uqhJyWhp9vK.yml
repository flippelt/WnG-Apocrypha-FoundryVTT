  description: >-
    <p>Chanting words of warding, you create a zone of light around you that can
    protect you from harm and repel daemonic creatures. You, and all allies
    within range, add +1 to your Determination, may roll Determination against
    Mortal Wounds, and do not suffer Shock when rolling Determination, until the
    start of your next turn. Further, creatures with the DAEMON keyword treat
    the area within range of you as difficult terrain until the start of your
    next turn.</p>
