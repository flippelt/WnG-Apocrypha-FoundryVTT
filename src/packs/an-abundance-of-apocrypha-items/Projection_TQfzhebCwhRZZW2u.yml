  description: >-
    <p>You send your disembodied mind and spirit, allowing you to touch other
    minds from a great distance away. While this power remains in effect, you
    leave your physical body, and can travel thousands of kilometres in an
    instant. In this form, you cannot physically affect anything, and you are
    undetectable to anyone except people you choose… though characters with the
    PSYKER or DAEMON keywords may be able to sense and affect you. You can
    communicate freely with anyone you know well who is in the same solar
    system. </p><p>While in this form, you are completely unaware of your
    physical body, which is unconscious. Every minute you sustain this power,
    you suffer 1 Shock.</p>
