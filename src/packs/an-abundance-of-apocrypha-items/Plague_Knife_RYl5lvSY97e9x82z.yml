  description: >-
    <p>A Plague Knife is a long-bladed, dagger-like weapon wielded by Plague
    Marines and other devotees of the Chaos God Nurgle. It possesses the
    capability of "blessing" anyone it touches with the daemonic infection known
    as Nurgle's Rot. These long, pitted knives are encrusted and dripping with
    the most virulent of toxins, viruses, and other pathogens. Their wielders
    believe that they have been directly blessed by the Plague God himself, for
    the rot the weapons spread is so powerful that it can lay low even the most
    monstrous or powerful of enemies in seconds.</p>
