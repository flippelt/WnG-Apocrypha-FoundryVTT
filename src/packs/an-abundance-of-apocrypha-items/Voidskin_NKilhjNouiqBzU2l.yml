  description: >-
    <p><span class="fontstyle0">Subdermal skin tissue is treated with flakweave
    and chemical toughening agents, such that the recipient can tolerate
    exposure to the void for longer before illeffects occur. Synthetic
    chem-glands also help minimise tissue and pressure damage to internal
    tissues and absorb radiation.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">The character gains a +3d bonus on all tests to resist
    the effects of exposure to hard vacuum, extreme cold, and radiation.</span>
