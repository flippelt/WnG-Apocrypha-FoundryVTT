  description: >-
    <p>At your command, warp energy flows in streamers from thin air and winds
    itself around your allies, glowing like forge-hot steel. The flowing
    Psysteel coats the armour of nearby vehicles or else wraps fellow warriors
    in a second skin capable of turning aside bullet and blade alike. Select a
    number of visible allies within range equal to your Willpower, or a single
    allied vehicle you can see within range. The target adds +2 to Resilience
    while this power remains in effect.</p>
