  description: >-
    <p><span class="fontstyle0">It is not only the T’au who are inspired by the
    presence of the Ethereals. As surely as a world’s moons govern the tides of
    its oceans, so are even the strangest alien auxiliaries given fresh heart by
    such a serene presence.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">If this Prayer is successful, then while the Prayer
    remains in effect, a single group of non-T’au allies with the </span><span
    class="fontstyle2" style="color:rgb(112,0,0);">T’AU EMPIRE </span><span
    class="fontstyle0">keyword, numbering no more than your Willpower score, may
    add +Rank ED to the damage their attacks inflict.</span> <br style="
