  description: >-
    <p><span class="fontstyle0">All Harlequins wear a highly ornamented mask
    called an </span><span class="fontstyle2">Agaith </span><span
    class="fontstyle0">(“false face”, in one Aeldari language), which present a
    gruesome visage. During a performance, these masks display patterns,
    colours, and features to support the Harlequin's role, but in battle, they
    take on a darker purpose. Each mask is highly psychoreactive, responding not
    only to the thoughts of the wearer, but showing a different visage to all
    who look upon it, and in battle, this always displays some aspect of the
    viewer’s worst fears. Some players within a masque have stranger masks
    still, such as the skull visage of the Death Jester, the mirrored face of
    the Shadowseer, or the death-masks of Troupe Leaders, which depict the dying
    moments of the wearer’s past victims.</span></p><p></p><p><span
    class="fontstyle3"><strong>Effect</strong>: </span><span
    class="fontstyle0">The wearer of an </span><span class="fontstyle2">Agaith
    </span><span class="fontstyle0">causes </span><span class="fontstyle2">Fear
    </span><span class="fontstyle0">(DN 3 +Rank).</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
