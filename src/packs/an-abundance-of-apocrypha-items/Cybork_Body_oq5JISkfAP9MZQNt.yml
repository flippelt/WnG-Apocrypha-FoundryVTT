system:
  quantity: 1
  rarity: rare
  description: >-
    <p><span class="fontstyle0">Sometimes Orks get critically injured in battle
    but survive to fight again later after an extensive rebuild that turns them
    in as much as a machine as an Ork - a Cybork. The Cybork Body is effectively
    a complete rebuild of the Orks body using crude cybernetics and bionic
    implants. Often made with built in armour plates and weaponry, this makes
    Orks extremely tough and able to shrug off hits that other fleshy Orks would
    be downed by. These bionics can range from crude and simple to extremely
    complex and overbuilt.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Your Resilience and Determination are both increased by
    +2.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
