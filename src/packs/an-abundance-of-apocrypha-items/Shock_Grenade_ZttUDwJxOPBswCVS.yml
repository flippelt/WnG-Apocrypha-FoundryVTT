  description: >-
    <p><span class="fontstyle0">Carried by Primaris Reivers, shock grenades
    detonate in bursts of sound and light carefully tuned to overwhelm the
    senses and send the target reeling. They are normally used just before a
    squad of Reivers begins their assault – one Reiver will hurl a grenade in to
    signal an assault, and the others will take aim or prepare to
    charge.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Shock Grenades do not inflict damage. Rather, to use a
    Shock Grenade, make a Ballistic Skill test as an Interaction Attack against
    your targets’ Resolve (make one test and compare it individually to the
    Resolve of each enemy in the blast). This inflicts the normal results from
    an Interaction Attack on each affected target, and all targets must either
    be </span><span class="fontstyle3">hindered </span><span
    class="fontstyle0">or </span><span class="fontstyle3">vulnerable</span><span
    class="fontstyle0">—you can’t mix and match.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
