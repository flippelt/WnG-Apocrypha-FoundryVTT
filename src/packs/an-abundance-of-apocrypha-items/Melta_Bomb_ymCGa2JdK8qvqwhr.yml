  description: >-
    <p><span class="fontstyle0">A Melta Bomb is a type of explosive device that
    makes use of nuclear fusion based Melta Weapons technology and is employed
    by both Imperial and Aeldari military forces. Typical examples have
    dimensions analogous to that of a large Imperial or Aeldari grenade but can
    be manufactured larger with a resulting increase in explosive force. When
    activated, a Melta Bomb explodes with an intense blast of thermal energy,
    literally "melting" the target away.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">Any target within a Melta Bomb’s blast counts as within
    close range for the purposes of the Melta trait. Melta Bombs cannot be used
    in a grenade launcher. In addition, they may be placed onto a vehicle or
    structure within 1m rather than thrown, requiring a Tech test with a DN
    equal to the vehicle’s Defence. Placed melta bombs do not detonate
    immediately and can be detonated as a simple action on any of the
    character’s subsequent turns.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
