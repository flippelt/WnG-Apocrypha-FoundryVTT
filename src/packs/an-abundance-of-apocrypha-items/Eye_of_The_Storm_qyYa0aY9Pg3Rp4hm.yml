  description: >-
    <p>Summoning a hurricane, you become the heart of a screaming cyclone.
    Wherever you stride, the enemy are plucked from their feet and dashed to
    ruin by its elemental fury. When you use this power, and at the start of
    each turn you sustain it, all enemies within range must attempt a DN 4
    Athletics test, adding +2 DN if they are flying. Failure means that the
    creature is knocked Prone and hurled 3d6 metres in a random direction; if
    they impact any solid object in this random move, determine damage as if
    they had fallen.</p>
