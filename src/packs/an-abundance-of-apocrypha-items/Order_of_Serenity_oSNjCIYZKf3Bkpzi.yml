system:
  description: >-
    <p>The Sisters of Serenity are a grim order, well-known for the solemn
    deliverance and quiet mercy they offer those who cannot be saved. Yet, to
    the living, they also represent the serene endurance of hardship and
    suffering, and their patients often seek to emulate their example rather
    than be offered their mercy.</p><p><strong>Serene Endurance:</strong> When
    you succeed at a Medicae test to recover a patient’s Shock, recover +Rank
    shock. Your own Maximum Shock is increased by +Rank.</p>
