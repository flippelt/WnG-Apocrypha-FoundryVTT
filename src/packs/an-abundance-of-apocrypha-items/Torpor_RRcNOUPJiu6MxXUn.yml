  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">Long-used by the League of Blackships to control
    their ‘cargo’, Torpor is a chemical cocktail of neural inhibitors and
    narcotics designed to render the subject docile and dampen their psychic
    talents. The Holy Ordos maintain their own supplies of Torpor to control
    prisoners.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A single dose of Torpor lasts for a number of hours equal
    to 10 minus the subject’s Toughness, during which time the subject counts as
    </span><span class="fontstyle3">Exhausted </span><span
    class="fontstyle0">and </span><span class="fontstyle3">Staggered</span><span
    class="fontstyle0">. Further, </span><span class="fontstyle2"
    style="color:rgb(112,0,0);">PSYKERS </span><span class="fontstyle0">under
    the effects of Torpor count their Psychic Mastery rank as 4 less than normal
    while under the drug’s effects.</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
