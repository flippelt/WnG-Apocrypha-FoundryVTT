  description: >-
    <p><span class="fontstyle0">A common drug distributed by the Departmento
    Munitorum and other organisations to those likely to face chemical warfare,
    poisonous environments, or similar dangers, this drug can negate the effects
    of most dangerous toxins and poisons if administered
    quickly.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A dose of de-tox immediately ends the effects of any
    poison or drug currently in the user’s system. However, the effects of this
    rapid cleansing are debilitating, and the recipient may not take any action
    during their next turn and are </span><span class="fontstyle3">Exhausted
    </span><span class="fontstyle0">until their next Regroup. A single purchase
    contains 3 doses.</span> <br style=" font-style: normal; font-variant:
