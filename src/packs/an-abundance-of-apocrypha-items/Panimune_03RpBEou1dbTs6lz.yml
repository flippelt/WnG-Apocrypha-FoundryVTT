  description: >-
    <p><span class="fontstyle0">This highly potent medicinal compound serves to
    greatly enhance resistance to most forms of toxins, contaminants,
    microorganisms, and infection for several hours, though repeated use can
    have dangerous side effects.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">A dose of Panimune provides +3 bonus dice on all
    Toughness tests to resist poisons, diseases, and other environmental effects
    for [[/r 1d3+2]] hours. After the dose expires, the user is </span><span
    class="fontstyle3">Exhausted </span><span class="fontstyle0">until their
    next Regroup. A new dose before the next Regroup will negate the
    </span><span class="fontstyle3">Exhausted </span><span
    class="fontstyle0">condition, but it will also inflict [[/r 1d3]] Shock, +1
    for each subsequent dose.</span> </p>
