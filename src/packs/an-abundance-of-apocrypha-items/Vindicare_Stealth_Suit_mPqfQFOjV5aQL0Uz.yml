name: Vindicare Stealth Suit
type: armour
img: modules/wng-core/assets/icons/armour/armour.webp
system:
  quantity: 1
  rarity: unique
  description: >-
    <p>The Stealth Suit worn by Vindicare assassins combines cameleoline layers
    with the normal synskin bodyglove worn by other Imperial Assassins. Combined
    with their training, these suits mean that a Vindicare is almost impossible
    to detect.</p>

    <p>The photoreactive mimic-fibres in the suit blur&rsquo;s the
    wearer&rsquo;s outline, granting a +2d bonus to Stealth tests and a +2 bonus
    to Defence when in shadow or in cover.</p>
