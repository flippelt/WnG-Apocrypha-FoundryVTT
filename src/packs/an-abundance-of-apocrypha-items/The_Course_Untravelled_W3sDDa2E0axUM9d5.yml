  description: >-
    <p>Time is not an arrow that flies straight and true, but rather a tangled
    web of moments and possibilities. This technique allows you to walk this
    web, stepping fractionally from one moment to another, altering your
    position in the physical world as you step between infinitesimally different
    timelines, no matter the cost to yourself. If this power is successful, you
    instantly move to any point within twice your Intellect in metres, so long
    as you could have reached that location naturally. You then immediately
    suffer 1d3+3 Shock due to the strain on your body.</p>
