  description: >-
    <p><span class="fontstyle0">The Laser Lance is an Eldar laser weapon, the
    signature weapon of the Shining Spears Aspect Warriors as well as the
    Exodite Dragon Knights. The laser lance fires a highly focused laser beam to
    deliver an intense blast of energy, discharged either at short range or upon
    physical contact with the enemy. This makes the weapon ideal for the
    devastating charges employed by Shining Spears and Dragon Knights, but the
    weapon is far less potent after the charge has concluded.</span></p><p><span
    class="fontstyle0"><strong>Special</strong>: </span><span
    class="fontstyle2">When a character wielding a laser lance attacks while
    mounted (upon a moving vehicle or charging creature), the weapon’s damage
    rating becomes 14, though it is not modified by the user’s Strength.</span>
