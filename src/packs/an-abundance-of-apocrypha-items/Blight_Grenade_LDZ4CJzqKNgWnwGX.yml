  description: >-
    <p><span class="fontstyle0">Also known as a Death’s-Head of Nurgle, Blight
    Grenades are explosive devices bloated and swollen with pathogens used by
    Plague Marines. When they explode the resulting shrapnel carries deadly
    toxins and contagions that can penetrate cracks in armour, cause flesh to
    boil and slough away, and fill the air with blinding spores, all the while
    keeping the victim alive until the very end. Some versions of Blight
    Grenades resemble maggot-filled shrunken heads, while others are made from
    the actual heads of slain enemies.</span> <br style=" font-style: normal;
