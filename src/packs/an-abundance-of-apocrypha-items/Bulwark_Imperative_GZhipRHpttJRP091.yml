  requirements: SKITARII keyword
  description: >-
    <p>Though doctrina imperatives are normally initiated by a Tech-Priest
    overseeing the Skitarii in action, you have been equipped with protocols for
    independent action. You can engage an imperative which enhances your
    mobility for short periods.</p>

    <p>At the start of any of your turns, you may activate the Aggressor
    Imperative. This adds +Rank to your Speed but reduces your Resilience by 2.
    At the end of a turn in which you activate the Agressor Imperative, you
    suffer 1d3+2 Shock.</p>
