  description: >-
    <p>Some Incubi sects—and often the Klaivex champions— favour the Demiklaive
    over the traditional Klaive. Each Demiklaive is a pair of powered blades
    which can be wielded separately or fitted together to strike as a single
    weapon. Masters of the form can switch between the two methods in moments.
    </p><p><strong>Special</strong>: A pair of Demiklaives use the profile
    listed above, but can be fitted into a single weapon, using the normal
    Klaive profile, with a Simple Action.</p>
