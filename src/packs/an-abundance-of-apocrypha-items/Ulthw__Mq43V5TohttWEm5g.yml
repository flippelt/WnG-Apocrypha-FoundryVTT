system:
  description: >-
    <p>During the Fall of the Aeldari, the lamentable event that heralded the
    birth of the Dark Prince Slaanesh, Ulthwé was caught in the pull of the Eye
    of Terror. Here it has remained for millennia, trapped, where the Immaterium
    intersects with realspace. They must remain vigilant, and their psychic
    instincts have been honed by proximity to the Eye of Terror and the peril it
    presents.</p><p><strong>FORESIGHT OF THE DAMNED:</strong> You increase your
    Passive Perception by +Rank.</p>
