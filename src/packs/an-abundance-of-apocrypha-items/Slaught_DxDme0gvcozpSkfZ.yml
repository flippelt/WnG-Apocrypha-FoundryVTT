  description: >-
    <p><span class="fontstyle0">Short for “onslaught”, this drug amplifies
    awareness and reaction time, speeding up the user but taking a nasty toll in
    the process.</span></p><p></p><p><span
    class="fontstyle2"><strong>Effect</strong>: </span><span
    class="fontstyle0">Taking a dose of slaught adds +3 to the user’s Agility
    and Initiative for the next [[/r 3d6]] rounds (or minutes, out of combat).
    Once the drug’s effects end, the user must pass a Toughness test (DN 3) or
    add +2 to the DN of all Agility and Initiative-based tests for the next [[/r
    1d3+2]] hours. A single purchase contains 3 doses.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
