  quantity: 1
  rarity: very-rare
  description: >-
    <p>A Harlequin's Kiss is one of the more horrifying close combat weapons
    employed by the Aeldari and is used only by Harlequins. The most iconic
    weapon that the masques carry to war, the Harlequin's Kiss is horrifically
    lethal. This weapon consists of a sharpened tube containing a tightly coiled
    retractable monofilament wire. When activated, usually by a forward punching
    motion, the wire is violently released. If the wire penetrates its victim,
    it instantly uncoils and lashes around violently, liquefying bones and
    internal organs, and causing immediate death in a spectacular and bloody
    fashion. The wire then retracts back into the Kiss for another use.</p>
