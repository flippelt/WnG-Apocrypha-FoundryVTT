  description: >-
    <p>When you make an All-Out Attack, you may add up to +Rank additional Wrath
    dice to your dice pool, in addition to the normal Wrath die. If any of these
    Wrath dice are 6s, then you score a Critical hit. That Critical Hit
    increases in effect as if a Glory point had been spent, for each Wrath die
    after the first which rolls a 6. </p><p>In addition, you gain 1d3x4
    Corruption when you select this Archetype.</p>
