  description: >-
    <p><span class="fontstyle0">A Conversion Beamer is an esoteric weapon that
    is both difficult to construct and highly complex to use, needing skilled
    calibration to operate as well as a dedicated and plentiful power source.
    The Imperium has used conversion beam weapons in a limited fashion since the
    Great Crusades, often mounted on dreadnoughts or titans, with
    infantry-portable versions being extremely rare and difficult to
    manufacture.</span></p><p></p><p><span
    class="fontstyle2"><strong>Special</strong>: </span><span
    class="fontstyle0">This weapon increases its damage by +2 ED at Medium
    range, and by +4 ED at Long range.</span> <br style=" font-style: normal;
