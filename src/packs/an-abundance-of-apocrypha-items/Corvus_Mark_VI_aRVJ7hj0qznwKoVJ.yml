  quantity: 1
  rarity: very-rare
  description: >-
    <p><span class="fontstyle0">The Mk6 “Corvus Suit” also saw much action
    during the Horus Heresy. It featured dual technology circuits that allowed
    the replacement of rare or sophisticated parts with common or basic
    alternatives. It also included failsafes such as duplicate power cabling.
    The left shoulder pad, which always took the brunt of enemy fire, retained
    the studded Mk5 construction to be easily
    replaced.</span></p><p></p><p><span class="fontstyle2">Armour Rating:
    </span><span class="fontstyle0">5; Powered (3)</span></p><p></p><p><span
    class="fontstyle2"><strong>Nimble</strong>: </span><span
    class="fontstyle0">Corvus armour is favoured by assault specialists, who
    find the light weight and smooth movement well-suited to their work. The
    wearer gains +1 Speed.</span></p><p></p><p><span
    class="fontstyle2"><strong>Light Construction</strong>: </span><span
    class="fontstyle0">The lighter materials used in making Corvus armour are
    not as durable as those used in later marks. Any called shot against Corvus
    armour counts the attack’s AP as 1 better.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
