  description: >-
    <p><span class="fontstyle0">Swooping Hawk Wings are specialized Eldar jump
    packs used exclusively by the Swooping Hawk Aspect Warriors. Composed of
    vibrating feather plates, these wings combine an anti-gravity lifter with
    jet propulsion motors to give the Swooping Hawks their impressive flight
    speed and manoeuvrability. In addition, the large wings allow the user to
    glide for long distances, and provide added lift for an increased flight
    ceiling, while the vibrating feathers emit a distinctive shrieking
    sound.</span></p><p></p><p><span class="fontstyle2"><strong>Effect</strong>:
    </span><span class="fontstyle0">A warrior wearing Swooping Hawk Wings gains
    the ability to fly, and a flying speed equal to twice their normal movement
    speed.</span> <br style=" font-style: normal; font-variant: normal;
