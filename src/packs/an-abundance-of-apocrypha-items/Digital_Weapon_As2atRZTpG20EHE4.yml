system:
  description: >-
    <p><span class="fontstyle0">Sophisticated, miniaturised weapons concealed
    within ornate rings or other jewellery, digital weapons are prized by the
    rich and powerful, and those seeking the most concealable
    armament.</span></p><p></p><p><span class="fontstyle0">Any </span><span
    class="fontstyle2"><strong>LAS</strong></span><span class="fontstyle0">,
    </span><span class="fontstyle2"><strong>MELTA</strong></span><span
    class="fontstyle0">, </span><span
    class="fontstyle2"><strong>FIRE</strong></span><span class="fontstyle0">, or
    </span><span class="fontstyle2"><strong>NEEDLE</strong> </span><span
    class="fontstyle0">weapon with the <strong>Pistol</strong> trait may be
    upgraded to a Digital Weapon.</span></p><p></p><p><span class="fontstyle2"
    style="color:rgb(0,0,0);"><strong>Effect</strong>: </span><span
    class="fontstyle0">The weapon’s ranges are halved, the weapon has only 1
    reload, and it can only be reloaded during a Regroup. A character wearing
    multiple Digital Weapons may fire up to three as part of a
    Multi-Action.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
