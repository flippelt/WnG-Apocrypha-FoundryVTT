  description: >-
    <p><span class="fontstyle0">The most common example of Darklight Weaponry is
    the Dark Lance. Similar in construction to the Bright Lance of their Eldar
    cousin's forces, a Dark Lance is redesigned to allow for the use of
    Darklight ammunition. It's commonly found mounted on Raiders and Ravagers,
    although Kabalite Warriors are seen carrying them across the battlefield as
    well. The device uses magnetic containment and stabilization fields to
    prevent the Darklight from damaging the weapon or its user. The Darklight is
    accelerated very rapidly down the barrel by these same containment fields.
    Upon striking its target, it reacts violently, tearing through armor
    regardless of thickness or composition, and in the event of the Dark Lances
    use on infantry, it's incredibly rare that any sign of the unfortunate
    target is left whatsoever</span>.</p>
