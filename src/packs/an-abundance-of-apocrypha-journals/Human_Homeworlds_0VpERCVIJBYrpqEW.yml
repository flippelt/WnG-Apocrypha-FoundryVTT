pages:
  - name: Human Homeworlds
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: "<p>This section provides several additional options for human characters, providing varying abilities for the assortment of different types of homeworld found across the Imperium. Any Human character may select one of these options to reflect the world of their birth and how that world has influenced their outlook and abilities. Each option contains one or more special abilities, as well as recommendations for thematic increases to their Attributes and Skills to reflect their homeworld; consider buying at least one extra rank in one each of the Attribute and Skill recommendations.</p>\n<hr />\n<h3><strong>Death World</strong></h3>\n<p>Born to harsh, savage worlds, which are hostile to human life. To survive in such places creates people as fierce and unforgiving as the worlds that raised them, and many of the mightiest defenders of the Imperium hail from worlds where existence is a daily struggle for survival.</p>\n<table style=\"height:162px;width:100%\" border=\"1\">\n<tbody>\n<tr style=\"height:106px\">\n<td style=\"width:27.8383%;text-align:center;height:106px\">\n<p><strong>Abilities</strong></p>\n</td>\n<td style=\"width:72.1617%;text-align:center;height:106px\">\n<p><strong>Bitter Suvirvor:</strong> The character clings onto life and is well-versed in eluding death’s grasp. The character adds +1 to Determination.</p>\n<p><strong>Not One of Us:</strong>\_Deathworlders don’t easily trust those who haven’t endured the same kind of hostile environments. They suffer +1DN to all Interaction tests with those who aren’t Deathworlders.</p>\n</td>\n</tr>\n<tr style=\"height:25px\">\n<td style=\"width:27.8383%;text-align:center;height:25px\">\n<p><strong>Attributes</strong></p>\n</td>\n<td style=\"width:72.1617%;text-align:center;height:25px\">\n<p>Strength, Toughness</p>\n</td>\n</tr>\n<tr style=\"height:31px\">\n<td style=\"width:27.8383%;text-align:center;height:31px\">\n<p><strong>Skills</strong></p>\n</td>\n<td style=\"width:72.1617%;text-align:center;height:31px\">\n<p>Stealth, Survival</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p>\_</p>\n<hr />\n<h3><strong>Hive World</strong></h3>\n<p>Towering, overcrowded megacities dominating polluted worlds, even the smallest hive city is home to billions of souls. These people toil in obscurity, slaving away for their entire lives in vast manufactories, or battling for survival in breadline riots or territorial skirmishes. For most, the only hope of seeing open sky is to leave their homes and fight for the Imperium.</p>\n<table style=\"width:100%;height:184px\" border=\"1\">\n<tbody>\n<tr style=\"height:157px\">\n<td style=\"width:27.9462%;height:157px;text-align:center\"><strong>Abilities</strong></td>\n<td style=\"width:72.0538%;height:157px;text-align:center\">\n<p><strong>Caves of Steel:</strong> The character has been surrounded by technology, some of which may be centuries or millennia old, for their entire lives. The character gains +1d to Tech tests.</p>\n<p><strong>Hivebound:</strong> Hivers are unaccustomed to the ways of wild, untamed places. Even the wilderness of underhive levels and abandoned habs is still built around artificial structures. Hiveworlders suffer +1DN on all Survival tests made when not in an urban or manufactured environment.</p>\n</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:27.9462%;height:17px;text-align:center\">\n<p><strong>Attributes</strong></p>\n</td>\n<td style=\"width:72.0538%;height:17px;text-align:center\">Agility, Initiative</td>\n</tr>\n<tr style=\"height:10px\">\n<td style=\"width:27.9462%;height:10px;text-align:center\">\n<p><strong>Skills</strong></p>\n</td>\n<td style=\"width:72.0538%;height:10px;text-align:center\">Cunning, Tech</td>\n</tr>\n</tbody>\n</table>\n<p>\_</p>\n<hr />\n<h3><strong>Voidborn</strong></h3>\n<p>Born and raised in the darkness between the stars, the voidborn are a strange breed. Accustomed to the peculiar life aboard city-sized voidships and vast orbital stations, they are often seen as warp-touched, and the weird, insular customs of life in space often set them apart from planetborn people.</p>\n<table style=\"width:100%;height:186px\" border=\"1\">\n<tbody>\n<tr style=\"height:157px\">\n<td style=\"width:28.4199%;text-align:center;height:157px\"><strong>Abilities</strong></td>\n<td style=\"width:71.5801%;text-align:center;height:157px\">\n<p><strong>Voidwise:</strong> The character is accustomed to the vagaries of life aboard ship or station and is well versed in protective rites and emergency doctrines. The character gains +1d on all tests to resist radiation and ignores all penalties to action caused by low or zero-gravity environments.</p>\n<p><strong>Ill-Omened:</strong> Voidborn are considered strange and inauspicious by others, who look for even the slightest sign of ill-fortune. When attempting an interaction test with a non-Voidborn, two dice are treated as Wrath dice, rather than one, and the character is unable to score criticals on these tests.</p>\n</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:28.4199%;text-align:center;height:17px\">\n<p><strong>Attributes</strong></p>\n</td>\n<td style=\"width:71.5801%;text-align:center;height:17px\">Initiative, Willpower</td>\n</tr>\n<tr style=\"height:12px\">\n<td style=\"width:28.4199%;text-align:center;height:12px\">\n<p><strong>Skills</strong></p>\n</td>\n<td style=\"width:71.5801%;text-align:center;height:12px\">Pilot, Tech</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3><strong>Forge World</strong></h3>\n<p>You hail from a domain of the Adeptus Mechanicus and were raised invoking psalms to the Omnissiah rather than prayers to the God-Emperor. You are a cog within a grand machine that contains trillions of souls, honed to serve your specific purpose.</p>\n<table style=\"width:100%;height:51px\" border=\"1\">\n<tbody>\n<tr style=\"height:17px\">\n<td style=\"width:28.414%;text-align:center;height:17px\"><strong>Abilities</strong></td>\n<td style=\"width:71.586%;text-align:center;height:17px\">\n<p><strong>Ave Omnissiah:</strong> The character has memorised countless operation litanies and maintenance hymnals, giving them an innate familiarity with machines and the Cult Mechanicus. They receive +1d on all Tech tests and Scholar tests relating to the Adeptus Mechanicus.</p>\n<p><strong>Stranger to the Church:</strong> Forgeworlders are unfamiliar with the ways of the Ministorum and the Imperial Creed and suffer +2DN on all Scholar tests relating to the Imperial Creed. The character may not take any archetypes with the @Item[TleOqKjYft44AGSQ]{ADEPTUS MINISTORUM} keyword.</p>\n</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:28.414%;text-align:center;height:17px\">\n<p><strong>Attributes</strong></p>\n</td>\n<td style=\"width:71.586%;text-align:center;height:17px\">Strength, Intelligence</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:28.414%;text-align:center;height:17px\">\n<p><strong>Skills</strong></p>\n</td>\n<td style=\"width:71.586%;text-align:center;height:17px\">Scholar, Tech</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3><strong>Schola Progenium</strong></h3>\n<p>You were an orphaned child of a notable servant of the Imperium, raised in one of the Schola Progenium abbeys scattered across the galaxy. Under the tutelage of Drill-Abbots and other stern teachers, young Progena are honed into devout, highly capable servants of Him-on-Terra. Many of the most renowned figures in Imperial history are former Progena, recruited into positions of status and power.</p>\n<table style=\"width:100%\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"width:28.801%;text-align:center\"><strong>Abilities</strong></td>\n<td style=\"width:71.199%;text-align:center\">\n<p><strong>Schola Education:</strong> The character was groomed from a young age to be an example to others. You gain +1d on any two of the following skills, chosen during character creation: Insight, Intimidation, Leadership, Scholar.</p>\n<p><strong>Cloistered Upbringing:</strong> Progena have little patience for, or understanding of, the dregs of society. The character suffers +2DN on all non-hostile Interaction tests made when dealing with characters who have the @Item[qb0rybF2RrcWP7e9]{SCUM} keyword.\_</p>\n</td>\n</tr>\n<tr>\n<td style=\"width:28.801%;text-align:center\">\n<p><strong>Attributes</strong></p>\n</td>\n<td style=\"width:71.199%;text-align:center\">Toughness, Willpower</td>\n</tr>\n<tr>\n<td style=\"width:28.801%;text-align:center\">\n<p><strong>Skills</strong></p>\n</td>\n<td style=\"width:71.199%;text-align:center\">Athletics, Leadership</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3><strong>Shrine World</strong></h3>\n<p>You were raised on a world which exists to exalt the God-Emperor. You were raised amidst faith and fury, exposed to lore of saints and martyrs and the Emperor’s righteousness at every moment of every day.</p>\n<table style=\"width:100%;height:219px\" border=\"1\">\n<tbody>\n<tr style=\"height:157px\">\n<td style=\"width:28.801%;text-align:center;height:157px\"><strong>Abilities</strong></td>\n<td style=\"width:71.199%;text-align:center;height:157px\">\n<p><strong>The Scorn of the Devout:</strong> The character is filled with holy hatred and fury. They receive +1 to Resolve and Conviction, and +1d on all Weapon Skill tests made to attack enemies with the Heretic keyword.</p>\n<p><strong>Abhor the Unhallowed:</strong> The character is filled with an instinctive revulsion for the unholy or unclean. They suffer +1DN on all Scholar or Tech tests relating to items or characters with the @Item[kZUQtnE0gqH81t98]{HERETIC} or @Item[TujuT6TkhTSvZJLF]{CHAOS} keywords, or with any keyword belonging to a Xenos species.\_</p>\n</td>\n</tr>\n<tr style=\"height:31px\">\n<td style=\"width:28.801%;text-align:center;height:31px\">\n<p><strong>Attributes</strong></p>\n</td>\n<td style=\"width:71.199%;text-align:center;height:31px\">Willpower, Fellowship</td>\n</tr>\n<tr style=\"height:31px\">\n<td style=\"width:28.801%;text-align:center;height:31px\">\n<p><strong>Skills</strong></p>\n</td>\n<td style=\"width:71.199%;text-align:center;height:31px\">Insight, Scholar</td>\n</tr>\n</tbody>\n</table>"
