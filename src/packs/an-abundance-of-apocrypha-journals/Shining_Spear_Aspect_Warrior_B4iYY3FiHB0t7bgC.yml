    text:
      format: 1
      content: '<p>“The wind whipping across your face as your blades whip across the throats of the foe. It makes the blood sing.” —Hrythar Dreamweave, Wild Rider of Saim-Hann You are the Spear of Khaine, striking as lightning, and slaying with a single blow. Atop the swiftest of steeds—a jetbike—you swoop down upon your prey and pierce their hearts with your mighty lance.</p><p>Yet even a small unit of Shining Spears can turn the tide of a protracted battle, for their legendary charges hit home with the force of a thunderbolt. Few enemies can withstand such a devastating charge.</p><p>The Shining Spears are one of the rarest and most specialised of the Aeldari Aspect Warriors. The Shining Spears possess a bright and clear virtue that marks each one out as a warrior hero and a champion of the Aeldari race. Aeldari mythology is replete with examples of noble heroes at one with their steed and in the Shining Spears, the glories of legend are made manifest once more.</p><p>Shining Spears ride sleek, gleaming Aeldari Jetbikes to war, their vehicles'' anti-gravitic motors allowing them to skim over even the roughest terrain at a breakneck pace. Each Aspect Warrior is so in tune with their Jetbike that they can execute complex, high-speed aerial manoeuvres with a single gesture.</p><p>In battle, they fight as the Spear of Kaela Mensha Khaine, the invincible weapon of the Aeldari God of War that struck like lightning and killed any foe with a single blow. Shining Spears can be distinguished from all of the other Aeldari Warrior Aspects for they are the only Aspect Warriors to make use of anti-gravity Jetbikes. The Shining Spears Aspect also have only a tiny presence on a few Craftworlds, including the major ones such as Ulthwé, but are regarded as an elite force, glittering exemplars of the warrior way. Shining Spear squads are relatively small, just three to five warriors, a number which sometimes includes an Exarch to lead them.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>SHINING SPEAR ASPECT WARRIOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Aeldari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">141</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">ASURYANI</a>, <a class="keyword">[CRAFTWORLD]</a>, <a class="keyword">ASPECT WARRIOR</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Toughness 5, Willpower 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Pilot 5, Tech 2, Weapon Skill 5</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.ch0jHsFTwF26kjjl]{Ride the Wind}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.KXn7FgD0ly6vLiOK]{Heavy Aspect Armour}, @UUID[Item.Gt00PqgOKOeilIxS]{Laser Lance (Ranged)}, @UUID[Item.s62o2qaBS0mhQ8Lf]{Laser Lance (Melee)}, @UUID[Item.9dmUd6Bmw9B3UDSp]{Laser Lance (Melee Mounted)}, Aeldari Jetbike (Church of Steel, p. 92), @UUID[Item.aIEl2xpESvkqyVEG]{Spirit Stone}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 3, Ballistic Skill 4, Pilot 5, Psychic Mastery 2, Scholar 2, Tech 3, Weapon Skill 6</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">—</td></tr></tbody></table>'
