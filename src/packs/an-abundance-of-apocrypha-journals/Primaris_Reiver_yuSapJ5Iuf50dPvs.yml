      content: '<p>“There is nothing quite so pleasing as a foe who is oblivious to their doom. Except the look on their faces when you deliver it to them.” —Reiver Sergeant Torres, Crimson Fists You strike at foes who did not suspect your approach, eluding their defences with stealth and overwhelming them with shock and terror, before vanishing back into the shadows.</p><p>fury of debilitating shock grenades, and compact bolt carbines, heavy bolt pistols, and combat knives for the actual killing.</p><p>Reivers are infiltration, shock assault, and terror specialists, creeping up upon an enemy before unleashing a brutal and terrifying attack. A Reiver assault is an abrupt cacophony of bolter fire, grenade detonations, and vox-amplified battle-cries, which ends as suddenly as it begins, leaving any survivors stunned into inaction as the Reivers withdraw to find new prey. The Reivers’ armament is perfectly suited to this end. Their armour is a stripped-down variant which allows for greater mobility, while being modified for completely silent running; a modification adopted from Raven Guard armourers. Their skull-mask helms also broadcast and enhance the roars and battle cries of the wearer, amplifying them in such a way as to inspire fear and panic. They pair this with grav-chutes that allow them to descend silently into position, and grapnel guns that allow them to scale obstacles like buildings easily. These are then accompanied by the sound and</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>PRIMARIS REIVER (APOCRYPHA VERSION)</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Primaris Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">228</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTARTES</a>, <a class="keyword">PRIMARIS</a>, <a class="keyword">[CHAPTER]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 4, Initiative 4, Willpower 3, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 4, Stealth 3, Weapon Skill 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.TkhVxXLnx8S0Iwzg]{Terror Troops}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.AQRPnnosXrnefqtq]{Phobos Mark X}, @UUID[Compendium.wng-core.items.Item.piwPtkisOSeJ47HV]{Heavy Bolt Pistol}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.2eu25R7GAPL43DdU]{Bolt Carbine}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.4QVBQYWXXLyvFWkj]{Astartes Combat Knife}, @UUID[Compendium.wng-core.items.Item.1oDvFKX7fVW8ic2R]{Grav-Chute}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.OzWEDMYuT5UnEUWj]{Grapple Gun}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.ZttUDwJxOPBswCVS]{Shock Grenade}, @UUID[Compendium.wng-core.items.Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Compendium.wng-core.items.Item.SJ8UaYHEMtF71W1M]{Krak Grenade}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background