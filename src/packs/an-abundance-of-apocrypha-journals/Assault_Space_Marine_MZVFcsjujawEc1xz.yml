      content: '<p>“And of the Assault Marine so do I decree: He shall descend upon the perfidious foe as an Angel of Judgment from on high. Let the jump pack be his wings, and the roar of its engines a hymn of retribution. Let the chainsword be his sceptre of decree, its harsh voice singing joyfully with each and every blow. With it shall the Assault Marine bring bloody retribution to the heretic, the traitor, and all alien aggressors who trespass on the Emperor''s domain. So will the Assault Marine be the hunter of warlords and the slayer of kings. His armour shall run slick with the life-blood of the vanquished, and all shall honour his name.” —Roboute Guilliman, quoted in the Apocrypha of Skaros You plunge from the skies upon wings of flame to strike at the heart of the enemy. Your swift, decisive, and brutal strikes can send an enemy line into disarray, creating openings for your brethren as you wet your blade. Assault Marines are those Space Marines equipped with weapons for melee and close quarters combat, fighting as part of an Assault Squad. These warriors excel at close quarters fighting and are equipped with powerful jump packs that allow them to leap forwards across the battlefield, closing the distance quickly and descending upon their foes at high speed and with incredible force. Assault Marines normally form the vanguard of a Space Marine attack, striking hard and fast against weak points in the enemy formation. Infantry are torn apart by blade and pistol, while krak grenades and other demolition devices are used to break open enemy armour and fortifications. Assault Marines are ever in danger of being outflanked and overwhelmed every time they range ahead of their brothers. Thus, even while they butcher their foes in melee, they must remain aware of the situation around them, ready to withdraw and redeploy to avoid being stranded in in a sea of foes. In addition to being melee shock troops, Assault Marines are taught to operate the Chapter’s fast attack vehicles, such as Bikes and Land Speeders. In these roles, they still range ahead of the army to strike at the enemy’s weak points, but the methods are quite different.</p><p>Page 137</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>ASSAULT SPACE MARINE</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Adeptus Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">270</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTARTES</a>, <a class="keyword">[CHAPTER]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 5, Initiative 5, Willpower 3, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 3, Pilot 4, Scholar 1, Stealth 3, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.3hKSHl3RK1SCaLOX]{Hammer of Wrath}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.7Bp1rDIfKEB2MB9N]{Aquila Mk VII}, @UUID[Compendium.wng-core.items.Item.7b2xcPWBB7up65PM]{Bolt Pistol}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.cl2SkggR4PWY2pxi]{Astartes Chainsword}, @UUID[Compendium.wng-core.items.Item.fYcfZQb8Um0jf6mK]{Jump Pack}, @UUID[Compendium.wng-core.items.Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Compendium.wng-core.items.Item.SJ8UaYHEMtF71W1M]{Krak Grenade}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:whi