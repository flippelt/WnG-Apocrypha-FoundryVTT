      content: '<p>"Red in cog and claw"</p><p>–Common Skitarii Exhortation You have had the weakness of flesh cast away to hone your body into a living weapon in the Omnissiah’s arsenal. Now, little can stop you from cutting a bloody swathe through the enemy ranks.</p><p>Sicarian Ruststalkers also called "shivs", a reference to a way they repeatedly plunge their transonic weapons into their enemies, visible only as a blur of blue and arcing sprays of scarlet blood.</p><p>Initially used to hunt down rogue servitors and dispatch them efficiently, the Sicarian Ruststalkers proved so effective at the art of killing that they were repurposed as front-line, physics-manipulating commandos. Their Transonic Weapons hum and resonate with sickening efficiency, passing through the strongest armour as if it simply didn''t exist, though the effect of the damage often takes several seconds to manifest. These highly trained and augmented squads known as Killclades are led by Princeps.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>SICARIAN RUSTSTALKER (APOCRYPHA VERSION)</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center"></td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">94</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS MECHANICUS</a>, <a class="keyword">[FORGE WORLD]</a>, <a class="keyword">SKITARII</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 4, Toughness 3, Initiative 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Stealth 2, Tech 2, Weapon Skill 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.vXSKEOBtTwrOUfr7]{More Machine Than Man}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.68cnGbtiItQrzq4V]{Sicarian Battle Armour}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.agHxUqfS5UAbnkeD]{Transonic Razor}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.3fbY6ZnCrVIJghaM]{Chordclaw}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.PlYOJ6FrqoBHINOM]{Transonic Blade}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.PlYOJ6FrqoBHINOM]{Transonic Blade}, @UUID[Compendium.wng-core.items.Item.2kbNhfot4D9tQU1O]{Augmetic Arm}, @UUID[Compendium.wng-core.items.Item.2kbNhfot4D9tQU1O]{Augmetic Arm}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.2tLcmE0mdCXRK2Xs]{Data-Tether}, @UUID[Compendium.wng-core.items.Item.U768rngg15fmZYNA]{Augmetic Legs}, @UUID[Compendium.wng-core.items.Item.tvECN1cFLZoS6z8O]{Augmetic Viscera}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">5</td><td style="tex