      content: '<p>“This is very simple. We don''t want your lives, your coin, or that junk you call technology. We want your world. We want the riches you didn''t even realise you had, and that you definitely don''t deserve. Leave while you have the chance. Or don''t. Either way, we''re coming to claim what''s ours.” —Ultimatum delivered by the Cthonian ‘Gauntlet’ Consortium. Gene-wrought and cyber-augmented to endure the harshest of mines, you are a powerful figure, and equally adept at sundering enemy armour as shattering rock. Fearless in the cause of locating, securing, and harvesting resources for their race, the Cthonian Mining Guild think nothing of braving environments so extreme that even other Kin would balk at the hazard. This bloody-minded approach extends to not only physical hazards such as the fringes of blackholes or Space Hulks but also to living dangers such as predatory alien races and hostile empires. Many Guild surveyors think nothing of assessing assets of other civilizations such as plasma storage plants, Promethium stockpiles, ore barges, and industrial infrastructure. They are viewed no differently than naturally occurring resources. In such instances, trade is often attempted as the first recourse, but if these measures fail, they will promptly turn to war.</p><p>plagued nebulae, explosive asteroids, and fathomless ocean depths. To do this, however, the Beserks eschew the high-tech STC weapons wielded by the rest of the Kin and instead use robust mining equipment, such as Heavy Plasma Axes, Concussion Gauntlets, and Concussion Mauls. However, they can also be sent into battle, and when this occurs, these tools become weapons that can penetrate heavy armor or xenos carapaces just as easily as stubborn rock and stone. In addition, the Beserks'' modifications ensure these courageous warriors can keep fighting through life-ordeath situations.</p><p>Not all miners join the Cthonian Guild. There are hundreds of unaffiliated asteroid mines and voidharvesting rigs scattered across League space. However, a large majority of Kin miners do choose to acquire Guild accreditation for firmly pragmatic reasons, for the Cthonians are rich enough to operate their own fleets of ships that allow them to better lay claim to resources. Most Kin who join the Cthonians are already adapted for hardiness, possessing Cloneskeins that imbue them with benefits such as hyper-dense bone structures, extreme radiation, and the ability to perceive esoteric energy spectra. Added to this are willingly submitted surgeries that further reinforce them with benefits for their trade, such as reinforced skull-plates, advantageous bionics, and artificial organs that allow them to survive in the most extreme environments. Indeed, there is a cheerful rivalry amongst the Cthonians as to who is the most heavily adapted, with the hardiest being nicknamed "luggers". The cybernetic upgrades to the Chthonians'' bodies and the cyberstimms that flood their systems allow the Beserks to better extract precious minerals from radPage 142</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>CTHONIAN BERSERK (IRONKIN)</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Ironkin</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">150</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">LEAGUES OF VOTANN</a>, <a class="keyword">CTHONIAN</a>, <a class="keyword">[LEAGUE]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Willpower 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 2, Ballistic Skill 1, Tech 3, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.Yqv6wim5JjLYuvDQ]{Hardened Augmetics}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.PukCPImfpTuGIocD]{Heavy Plasma Axe}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.xFkHGhoHHz5yisGZ]{Concussion Maul}, three augmetic enhancements, @UUID[Compendium.wng-core.items.Item.JqeKArmZ4gqZl8u3]{Cardioproxy}, @UUID[Compendium.wng-core.items.Item.UEhKDQO8DRg9XvTz]{Sinew Armature}, @UUID[Compendium.wng-core.items.Item.QeaTH0lTS41PH9ow]{Subdermal Armour}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.oacjwfN8D3ilUdtQ]{Cyberstimms}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">5</td><td style="text-align:center">3</td><td style="text-align:center">3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 3, Awareness 2, Ballistic Skill 1, Intimidation 2, Survival 1, Tech 3, Weapon Skill 5</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.3uI0Gw1jMR7J0GG6]{Brutalist}, @UUID[Compendium.wng-core.items.Item.HYuKXdU1r5yNyRU1]{Die Hard}, @UUID[Compendium.wng-core.items.Item.Kid68id9VMPSX5vT]{Frenzy}</td></tr></tbody></table>'
