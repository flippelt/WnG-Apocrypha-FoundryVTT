      content: '<p>“You people do well at war because you treat it as a religion. We do well because we treat it as a business. It is just a matter of outlook.” Hargr Brônd, Kahl of the Gruben Kinhost You’re a proud, dependable warrior, trained in martial traditions of Kin and Hold. You do not yield while a fellow warrior continues to fight, and you do not despair when facing the enemy because your kin stand by your side. These clone warriors form the core of the Kinhosts, and unlike Space Marines, they are not bred solely for war. These soldiers are a citizen militia drawn from the populace of the Holds and disregard gender, occupation, or social role. While warriors, they also live fulfilling lives outside of war. However, while they often have side trades outside of war, Hearthkyn are nonetheless well-trained and equipped for war and drill themselves as much as the elite warriors of many other races. They boast excellent discipline and prodigious martial skill, for a Hearthkyn cannot join a band until they are able to pass a rigorous series of tests. Moreover, Hearthkyn Warriors are often engineered with particular cloneskeins that allow them to specialize in combat such heightened senses, improved stamina, and night vision. Others augment their bodies for battle with mechanical limbs and synthetic organs. Despite being technically classified as militia, no Hearthkyn is treated as expendable, and field medics are common amongst their ranks. Strong bonds of loyalty bind the individual Hearthkyn together and ensure comradeship of one squad to the next.</p><p>Page 84</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>HEARTHKYN WARRIOR (IRONKIN)</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">1</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Ironkin</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">72</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">LEAGUES OF VOTANN</a>, <a class="keyword">[LEAGUE]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 4, Toughness 4, Willpower 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 1, Ballistic Skill 2, Tech 1, Weapon Skill 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.S44eZgTuZVuiG3Py]{Stalwart Comrade}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.8pwrnTTa2FbtmD1s]{Autoch-pattern Bolter}, @UUID[Item.KECo9Zodq9P1uS2L]{Ion Blaster}, @UUID[Item.Fm1l84PyK4e6vQIg]{Autoch-pattern Bolt Pistol}, @UUID[Item.FZEUGRe0ZUJZC0LW]{Void Armour}, @UUID[Item.fcHEFpLvFTdxBGpt]{Gravitic Concussion Grenades}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:le