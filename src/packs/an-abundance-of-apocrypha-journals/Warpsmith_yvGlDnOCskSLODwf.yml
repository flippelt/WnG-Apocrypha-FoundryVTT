      content: '<p>“The Machine God is dead. Long live the Machine God.” Warpsmith Arkturian, via station-wide Vox broadcast You seek to subjugate both technology and the malefic power of the Warp, fusing the two into the mighty weapons and other devices that fill your dreams. A Warpsmith is a fallen Chaos Space Marine Techmarine who now serves the Ruinous Powers through the creation of daemonic war engines. As the master of the soul forges to be found within the Eye of Terror, it is by their hands that the Daemon Engines such as the Maulerfiend and the Forgefiend come to life, an unholy union of daemon and machine, ready to fight alongside the armies of Chaos. Though each Warpsmith is an expert in battlefield repair and siege craft, his true calling lies in the soul forges of the Warp, especially those in the Eye of Terror. There, the spirits of captured Imperial machines are driven to madness as their physical forms are rebuilt into bestial and terrifying new shapes. Daemons are thrust into the cogs of giant, mechanoid birthfactories that crank out red-hot engines of destruction from their cabled wombs.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>WARPSMITH</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Adeptus Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">218</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">CHAOS</a>, <a class="keyword">[MARK OF CHAOS]</a>, <a class="keyword">HERETIC ASTARTES</a>, <a class="keyword">[LEGION]</a>, <a class="keyword">DARK MECHANICUM</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 4, Toughness 4, Agility 4, Initiative 4, Willpower 3, Intellect 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 3, Scholar 2, Stealth 3, Tech 3, Weapon Skill 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.MpePdx3gej2EnDGr]{Daemon-Smith}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.aj4W4PqpEFZiPTdU]{Fleshmetal}, @UUID[Compendium.wng-core.items.Item.7b2xcPWBB7up65PM]{Bolt Pistol}, @UUID[Compendium.wng-core.items.Item.1tQITdKEHUU2XjD6]{Power Axe}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.4QVBQYWXXLyvFWkj]{Astartes Combat Knife}, @UUID[Compendium.wng-core.items.Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Compendium.wng-core.items.Item.SJ8UaYHEMtF71W1M]{Krak Grenade}, @UUID[Compendium.wng-core.items.Item.oCFca0vTYRuxndzP]{Mechadendrite}, choice of two augmetics</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">5</td><td style="text-align:center">6</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">3</td><td style="text-align:center">5</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 3, Awareness 3, Ballistic Skill 4, Scholar 3, Stealth 3, Tech 4, Weapon Skill 4</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.sOuOMmWohMfOEFJv]{Augmetic}, @UUID[Compendium.wng-core.items.Item.kj8Jm2JKxELokK4X]{Let The Galaxy Burn}, @UUID[Compendium.wng-core.items.Item.MgRO6y7ytpHs03RT]{The Flesh is Weak}</td></tr></tbody></table>'
