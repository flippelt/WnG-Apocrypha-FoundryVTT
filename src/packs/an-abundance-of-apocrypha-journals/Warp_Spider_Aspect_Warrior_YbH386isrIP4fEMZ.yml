      content: '<p>"The enemy thinks themselves secure, their position unassailable from any direction. They would be correct, if our methods of approach were as limited as their understanding." — Sercamtrill, The Web of Blades, Warp Spider Exarch You are a silent hunter, a predator stalking prey upon battlefields across the galaxy. When you strike, it is against foes who did not suspect you were there. The Warp Spiders are one of the types of Aspect Warriors, Aeldari who represent a facet of their war god Kaela Mensha Khaine. Taking their name from the same creatures who protect the Infinity Circuits of their Craftworlds, Warp Spiders epitomise aggressive defence and make use of their teleportation devices to attack the enemy suddenly and disappear before they can retaliate. Warp Spiders are deadly warriors who model their weaponry and armour on those of the warp spiders, which swarm and destroy any intruding psychic presence within the Wraithbone skeleton of their Craftworld. The signature piece of equipment used by Warp Spiders is the Warp Spider Jump Generator, a compact device housed within the armoured backpack of their Aspect Armour which allows for short journeys through the Warp. Using this warp-generator Warp Spiders can unexpectedly materialize right next to their foes and fire their ritual weapon, the Death Spinner, which easily slices through flesh and bone.</p><p>warriors, the Warp Spiders'' unique teleportation abilities negates this disadvantage. The colouration of this armour is traditionally some variation on red and black, and it is warded to allow for safer travel through the Warp, which provides some protection against psychic powers. Of all the Aspect Shrines the Warp Spiders are considered the bravest simply for their normal method of operation. Even traveling a short distance through the Warp is a tremendous risk, with not just their lives but their very souls on the line. Despite this they are also regarded as strange and terrifying, the furthest removed from the normal Aeldari mindset of all the Aspect Shrines. Warp Spiders also tend to have a bleak outlook on life, and rarely mix with warriors from other Aspect Shrines.</p><p>Warp Spider armour is much bulkier compared to those worn by most other Shrines, making them more heavily armoured but slower. While this would be more constricting for the movements of other Aeldari</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>WARP SPIDER ASPECT WARRIOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Aeldari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">108</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">ASURYANI</a>, <a class="keyword">[CRAFTWORLD]</a>, <a class="keyword">ASPECT WARRIOR</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Agility 4, Initiative 3, Willpower 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 3, Ballistic Skill 4, Tech 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.Kf9piUA335eEwiXU]{Flickerjump}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.KXn7FgD0ly6vLiOK]{Heavy Aspect Armour}, @UUID[Item.rWAfo1C0PTCR0XgL]{Deathspinner}, @UUID[Item.DvIoHpvBEvAJwUhm]{Warp Spider Jump Generator}, @UUID[Item.3X5FaaFcfNmaEod4]{Mono Knife}, @UUID[Item.aIEl2xpESvkqyVEG]{Spirit Stone}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-col