      content: <p>“Poison a man and he won’t even know he’s been murdered.” Drakan Vangorich, Grand Master of Assassins, M.32 The death you deliver is carefully cultivated, tailored to your specific quarry and designed so that you can slay them without them ever realising you have struck. Like the other temples of the Officio Assassinorum, the Venenum Temple was originally the Venenum Clade, created some time during the Great Crusade in the late 30th Millennium. The clade was created at the behest of Malcador the Sigillite, the Regent of Terra, who was secretly the Grand Master of Assassins, and the Venenum Clade's first Director Primus, who was known only as Siress Venenum. The Venenum Clade was established in a secret location on Terra at the direction of the Grand Master of Assassins and was tasked like all of the other Assassin clades with killing those who opposed the formation of the Imperium of Man and the will of the Emperor of Mankind. The Venenum Temple is located in a secret complex known as the Orchard, comprised of an ancient house that was thousands of years old. This house was surrounded by a verdant tropical jungle that contained thousands of specimens of flora and fauna used to concoct the various exotic poisons used by Venenum operatives. Venenum Assassins are trained exclusively in the use of exotic poisons and subtlety in carrying out their mission requirements. Through their apprenticeship they learn to manufacture killing philtres from the basest of components, which allowed them to terminate their targets and leave no metabolic trace of the toxin.</p><p>Page 206</p>
