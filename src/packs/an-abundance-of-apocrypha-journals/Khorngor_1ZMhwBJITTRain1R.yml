      content: >-
        <blockquote><p>Stamp and trample! Gore and crush!</p><p
        style="text-align:right"><em>—— Unknown
        Khorngor</em></p></blockquote><p><strong>You embrace your rage. You give
        in to the bloodlust that thunders in your head and your heart like the
        beating of a war drum</strong></p><p>Beastmen devoted to the Chaos God
        Khorne, Khorngor are bloodthirsty monstrosities even by the standards of
        their bestial kind. Khorngor tend to have ruddy flesh and dark fur, and
        many find that their features mutate to become more canine or ursine.
        They are often herded into battle by Khornate warbands as cannon fodder,
        driven into a berserker rage by the scent of spilled blood.</p><table
        style="width:98.9228%;height:239px" border="1"><tbody><tr
