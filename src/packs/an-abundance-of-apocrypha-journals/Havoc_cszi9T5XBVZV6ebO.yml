      content: '<p>“Impurity shall be our armour. Hate shall be our weapon. Immortality shall be our reward”. Unknown With a mighty cannon in your grasp, you bring destruction to your enemies and anyone else who gets in your way. Nothing delights you as much as the death you can unleash. Havocs are the Chaos counterparts the Space Marine Devastators, heavy weapon specialists who are trained to annihilate the foe at range. Squads of Havocs provide devastating anti-infantry and anti-armour firepower, dominating large swathes of the battlefield with volley after punishing volley. Such is the bloodpounding thrill of pouring heavy fire into the enemy ranks that many Havocs become obsessed by the power their weapons afford them. They see themselves as gods of the battlefield, blasting the insect vermin of the enemy into oblivion with each twitch of the finger.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>HAVOC</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Adeptus Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">270</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">CHAOS</a>, <a class="keyword">[MARK OF CHAOS]</a>, <a class="keyword">HERETIC ASTARTES</a>, <a class="keyword">[LEGION]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 5, Initiative 5, Willpower 3, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 5, Cunning 1, Stealth 3, Tech 1, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.bAMEhWgMIhZ3tQQf]{Addicted to Destruction}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.7Bp1rDIfKEB2MB9N]{Aquila Mk VII}, @UUID[Item.7b2xcPWBB7up65PM]{Bolt Pistol}, @UUID[Item.4QVBQYWXXLyvFWkj]{Astartes Combat Knife}, @UUID[Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Item.SJ8UaYHEMtF71W1M]{Krak Grenade}, @UUID[Item.Dh1HhVnPaURjpgTR]{Ammo Backpack}, @UUID[Item.9DfD3HEoGmpIWLoC]{Autocannon}, @UUID[Item.ut6nsTPR0xL4mfET]{Heavy Bolter}, @UUID[Item.Ir3TL7qFOrdSzgJs]{Missile Launcher}, @UUID[Item.FHwIBN0uKcGPMnxn]{Frag Missile}, @UUID[Item.YOwhm6xcXXT7BxDO]{Krak Missile}, @UUID[Item.x1Ouy4jFDseOnm26]{Lascannon}, @UUID[Item.ikCrVCNix6HpW1QY]{Reaper Chaincannon}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">—</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.2aRTpVsPagGLd2Fz]{Hail of Fire}, @UUID[Item.kj8Jm