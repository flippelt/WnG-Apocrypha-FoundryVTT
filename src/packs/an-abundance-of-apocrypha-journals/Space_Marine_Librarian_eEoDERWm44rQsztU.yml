      content: '<p>"I can pulp your flesh and snap your bones in less than a second and without so much as lifting a finger. What is the power of technology compared to that?" Vel’Cona, Chief Librarian of the Salamanders You are a warrior-sage of the Adeptus Astartes, a student of the art of warfare, the histories of your Chapter, and the mysteries of the Warp. Your mind is as much as weapon as your body, and you wield it in defence of your Brothers and the Imperium. Librarians are the psykers of the Space Marines who survive an Adeptus Astartes Chapter''s rigorous</p><p>screening and training to bend the powers of the Warp to their will for the benefit of their fellow BattleBrothers and in service to the Emperor of Mankind. Beyond their psychic duties, the Librarians of the Astartes are also expected to record the great deeds of their Chapter and maintain the Chapter''s storehouse of ancient lore, the functions for which they are named.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>SPACE MARINE LIBRARIAN (APOCRYPHA VERSION)</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Adeptus Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">367</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTARTES</a>, <a class="keyword">[CHAPTER]</a>, <a class="keyword">PSYKER</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 5, Initiative 5, Willpower 6, Intellect 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 3, Leadership 1, Psychic Mastery 4, Scholar 3, Stealth 3, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.1yhDwAyqcV4xNYkC]{Psyker}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.7Bp1rDIfKEB2MB9N]{Aquila Mk VII}, @UUID[Compendium.wng-core.items.Item.7b2xcPWBB7up65PM]{Bolt Pistol}, @UUID[Compendium.wng-core.items.Item.9vfkaU0vc61t7hKO]{Force Stave}, @UUID[Compendium.wng-core.items.Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Compendium.wng-core.items.Item.SJ8UaYHEMtF71W1M]{Krak Grenade}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.v1EY9Y15U2RSvKR8]{Psychic Hood}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">—</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">—</td></tr></tb