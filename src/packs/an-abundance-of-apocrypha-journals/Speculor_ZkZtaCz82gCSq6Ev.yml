      content: '<p>“A suspicious mind is a healthy mind”. –Imperial proverb You are employed by the Inquisition to observe or even infiltrate organisations in order to root out corruption and heresy. Few know your real name, or real goals, but you are a hidden island of loyalty and dedication surrounded by the gravest of sinners. Inquisitors often require covert operatives to aid in their investigations. These agents are often dubbed Speculor, surveillant, intuspex, agent obscuras, infiltraitor, or countless other code-names, euphemisms, and alternate terms, but whatever they are called, they serve a similar purpose. Their purpose is to go unremarked, operating in the shadows, gathering evidence and performing covert actions to undermine heretical groups. Even the least of them is highly-trained and extremely skilled and provided with access to advanced technology to achieve their objectives. Some are even subjected to neurological reprogramming, creating fake personas overlaid atop the operative’s true nature, or even inserting betrayal conditioning into the depths of a captured traitor’s mind. A Speculor may work alone in the field, but they tend to have access to other agents to pass on intelligence gathered and receive clandestine orders. Most of the time, they blend in with the populace, retaining their anonymity while they gather information. When called upon to insert themselves into a location or organisation, they are skilled manipulators using a combination of social engineering, charm, wit, and more obscure techniques such as cryognosis and logomancy—arcane methods of gleaning facts from the slightest details of a conversation. There are very few methods a Speculor will not employ to achieve their goals, and the remit they receive from their masters is extremely broad.</p><p>Page 131</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>SPECULOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">100</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">INQUISITION</a>, <a class="keyword">[ORDO]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 3, Intellect 3, Fellowship 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Cunning 2, Deception 4, Insight 3, Intimidation 2, Persuasion 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.dUglqAzIZxkAqqY9]{False Guise}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: Up to one weapon with a Value of your Tier +3 or lower, and a rarity of Rare or lower, @UUID[Compendium.wng-core.items.Item.alCEdr91k6ttGBw9]{Bodyglove}, @UUID[Compendium.wng-core.items.Item.vZp4dj9eXhFcVwOB]{Disguise (Clothing)}, @UUID[Compendium.wng-core.items.Item.vZp4dj9eXhFcVwOB]{Disguise (Clothing)}, @UUID[Compendium.wng-core.items.Item.vZp4dj9eXhFcVwOB]{Disguise (Clothing)}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text