      content: <p>“There is no place for traitors to hide from us. Let them go to ground. Let them surround themselves with throngs of baying Warpspawn or high fortress walls. It makes no difference. Our scopes will seek them out and we shall deliver unto them the Emperor's Justice." —Varrus, Ultramarines Eliminator You move silently behind the enemy lines, seeking a vantage from where you can deliver the killing shot to your target. Nothing can get between you and your target. These fire support Primaris Marines haunt the shadows of the battlefield, seeking out high-value targets and bringing them down with pinpoint volleys of bolt rounds. Eliminator Squads utilize a version of the Mark X Phobos Armour, allowing them to operate with maximum stealth. These warriors serve as dedicated marksmen and fire support specialists that haunt the shadows of the battlefield seeking out targets of opportunity and bringing them down from a range. Their primary armament is the Mark III Shrike Pattern Bolt Sniper Rifle, though they sometimes carry the powerful Las Fusils for dealing with harder targets.</p><p>thermoscopic vision to precision auspex scans that can penetrate several feet of solid matter. Once locked on to, there is nowhere for an Eliminator's prey to hide. Each member of the squad carries spare magazines filled with special ammunition, tailored for every eventually. Hyperfrag rounds detonate in a shower of shrapnel, Executioner rounds are sophisticated selfguided missiles slaved to a miniaturized cogitator that can seek their target from behind cover, while mortis rounds spew self-replicating mutagenic toxins into the flesh of a target.</p><p>The optical sights of this weapon can be tailored for any situation, from</p>
