      content: '<p>"We are the hawks of mighty Kurnous. We are the blade that strikes swift and true. We soar upon the winds of war and pierce our prey with talons of flame. Through mastery of the skies do we win mastery of the ground, and thus mastery of all." —Battle Mantra of the Crimson Hunters You embody Khaine’s aspect of the devastating blow that leaves the foe reeling, vulnerable to successive strikes. Few can stand before your skill, but fewer can endure the carnage that follows in your wake. The Crimson Hunters are an unusual Warrior Aspect, for their signature wargear is not a blade or gun, but instead a sleek aerial fighter that represents the pinnacle of Aeldari aeronautics. These formidable aircraft, known as Nightshade Interceptors, are just as much a part of the Crimson Hunter''s wargear as the Howling Banshees'' power sword or the Dire Avengers'' Shuriken Catapult. Their lethality, however, is measured on a different scale altogether. Their Aspect Temples are not buildings or landscapes, but tunnel-linked collections of transparent atriums that float around the periphery of their craftworlds like archipelagos at the edge of a vast landmass. It is within these realms of captive sky that the Crimson Hunters duel, their weapons of choice the Bright Lances and Pulse Lasers gracing each interceptor''s curving fuselage. During the breakneck battles that take place in these shrines, the weapons of the Crimson Hunters are set to illuminate rather than to pierce, for the Nightshade Interceptor has been designed specifically to hunt down and destroy aircraft of any kind—even those of the Drukhari. A single beam of light can be the difference between victory and defeat, though it is said that the reflexes of a Crimson Hunter are so preternaturally sharp that they can evade even these.</p><p>Page 141</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>CRIMSON HUNTER ASPECT WARRIOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Aeldari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">160</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">ASURYANI</a>, <a class="keyword">[CRAFTWORLD]</a>, <a class="keyword">ASPECT WARRIOR</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Agility 5, Initiative 5, Willpower 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 3, Ballistic Skill 5, Pilot 5, Psychic Mastery 2, Tech 1</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.nt9zd1trj3ise2ZS]{Skyhunter}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.4CN52w3DuI2X6OwJ]{Aspect Armour}, Nightshade Interceptor (Church of Steel, p. 95), @UUID[Compendium.wng-core.items.Item.ueTuXr4xkzevIL4X]{Shuriken Pistol}, @UUID[Compendium.wng-core.items.Item.3X5FaaFcfNmaEod4]{Mono Knife}, @UUID[Compendium.wng-core.items.Item.aIEl2xpESvkqyVEG]{Spirit Stone}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">6</td><td style="text-align:center">6</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 4, Ballistic Skill 5, Pilot 6, Psychic Mastery 4, Scholar 3, Tech 2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.qyMPDR7eiJDJzMfW]{Gunnery Crew}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.i2iaIBRjeULHMMHD]{Combat Driving}, @UUID[Compendium.wng-core.items.Item.s6OMveAvTlOrsUsO]{Deadshot}</td></tr></tbody></table>'
