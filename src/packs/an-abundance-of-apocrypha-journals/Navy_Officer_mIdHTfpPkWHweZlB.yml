      content: '<p>“You are expected at all times and in all situations to conduct yourself in a manner appropriate to, and mindful of, the great duties and traditions of the Emperor''s Most Glorious and Honourable Navy.” –Opening Line of the Imperial Navy Articles of War Whether a scion of nobility or stalwart Progena, you are a commissioned officer of the Imperial Navy, trained to command others, and follow orders in turn, during the clamour of void warfare. Commissioned officers represent the highest ranks of the Imperial Navy''s personnel and their commissions usually can only be granted by the battlefleet Administratum. In some Segmentae Majoris, a certain number of officers are generated by the "commissions" issued to planetary governors and Schola Progenium worlds each standard year to fulfil.</p><p>A good portion of midshipmen join the Imperial Navy through a more informal system of patronage. It is not uncommon for an Imperial Navy captain to take on a noble''s son or daughter as a midshipman at their family''s request. This may be a favour to an old friend, or a means to repay an ancestral debt. However, even in this case, most noble children find the Navy a harsh and uncompromising environment, where most must excel on their merits, or likely perish.</p><p>Each commission is for a single child of "good character" to attend Port Wrath, there to become a midshipman in the Imperial Navy. Commissions issued to planetary governors are commonly sold to noble families or bestowed in a politically expedient fashion to reward a trusted noble or remove a troublesome sibling. A career in the Imperial Navy is viewed as a glorious, honourable and very probably fatal enterprise by noble houses, but a sacrifice that enhances the family''s prestige immeasurably.</p><p>IMPERIAL NAVY OFFICER</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>NAVY OFFICER</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">48</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">NAVIS IMPERIALIS</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Initiative 3, Willpower 3, Fellowship 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Leadership 2, Pilot 1, Weapon Skill 1</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.iB5pcaPjo1cojg4K]{Voice of Authority}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.vZp4dj9eXhFcVwOB]{Navis Officer''s Uniform (Clothing)}, @UUID[Compendium.wng-core.items.Item.Gkvz8V1xP8wrBBk8]{Mesh Armour}, @UUID[Compendium.wng-core.items.Item.STrmO2xhRZgClDSR]{Laspistol}, @UUID[Compendium.wng-core.items.Item.Fci6DIK0kgrASqGV]{Hand Cannon}, @UUID[Compendium.wng-core.items.Item.rgcz2ZC60MEM8mao]{Chainsword}, @UUID[Compendium.wng-core.items.Item.4LJKqbl1WR6Qcxd8]{Vox-Bead}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">5</td><td style="text-align:center">3</td><td style="text-align:center">3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 2, Ballistic Skill 2, Leadership 4, Persuasion 3, Pilot 2, Scholar 2, Tech 1, Weapon Skill 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.afi4wNVeT0Pmcs37]{Devotees}, @UUID[Compendium.wng-core.items.Item.iiqjZLMe2IxQMth5]{Noble Peer}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.h3cX58IYSA7DiKnI]{Overwatch}</td></tr></tbody></table>'
