      content: '<p>"Psykers are necessary for the Imperium to exist. But that necessity does not require trust. They are a vulnerability the Enemy will seek to exploit, and thus we guard them from threats both without and within." —Rem Tholus, Black Sentinel You have been chosen to stand watch over the facilities, ships, and other actions of the Adeptus Astra Telepathica, securing them against intruders and delivering the Emperor’s judgement should they succumb to their accursed powers. The Black Sentinels are an armed force of the Adeptus Astra Telepathica, having been active since the Great Crusade and Horus Heresy. In those ancient days, they supplemented the elite warriors of the Sisters of Silence, and in the millennia since they have stood guard over the psyker tithe, Astropathic choirs, and any other places where sanctioned psykers are gathered. Black Sentinels provide security for Astropaths and their facilities across the Sol System and beyond. They are also entrusted with the task of eliminating compromised Psykers, prowling across the gantries and corridors of the Telepathica headquarters on Terra and similar locations, forever poised for the first twitch or spasm of possession. Well-trained and heavilyarmed, they are dressed in black armor protected with psychic wards, and wear masks that resemble snarling beasts.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>BLACK SENTINEL</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">80</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTRA TELEPATHICA</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Toughness 3, Agility 2, Initiative 3, Willpower 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 3, Ballistic Skill 3, Intimidation 2, Weapon Skill 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.Sv1przQQYmW5EYHd]{Witch-Guard}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.fPgdC7ur85iRGKgh]{Lasgun}, @UUID[Compendium.wng-core.items.Item.wSJOv4Sre6LbqbBF]{Shock Maul}, @UUID[Compendium.wng-core.items.Item.fLx8DzWDgWDZIMSK]{Flak Armour}, Hexagrammic Wards, clothing (uniform), blanket, grooming kit, @UUID[Compendium.wng-core.items.Item.vsjZCbjBNivbeUhk]{Ration Packs}, @UUID[Compendium.wng-core.items.Item.vsjZCbjBNivbeUhk]{Ration Packs}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">2</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 4, Ballistic Skill 4, Insight 1, Intimidation 2, Scholar 1, Survival 3, Weapon Skill 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.CVEfjd9hx4XWLuPM]{Dirty Fighter}, @UUID[Compendium.wng-core.items.Item.5HchXpu60DlodyV8]{Disturbing Voice}, @UUID[Compendium.wng-core.items.Item.Cr4n0fqlBRqeY0yY]{Ever Vigilant}</td></tr></tbody></table>'
