      content: '<p>“Cast down the idols! Destroy the temples! Slay the priests! Show these fools that they worship nothing more than a rotting corpse!” Dark Apostle Harzhan of the Word Bearers You preach and exalt the glories of the Ruinous Powers, the malign and mighty daemon-gods who empower you to wage a perpetual war against the corpse-Emperor and his piteous Imperium. Dark Apostles make up the priesthood of the Dark Gods within the Traitor Legions. Just as the Chaplains of the Loyalist Space Marines uphold the creeds of their Chapters, the Dark Apostles devote their lives to the propagation of the unholy word, actively spreading the worship of Chaos across the galaxy. Their efforts do not go unrewarded -- Dark Apostles are surrounded by daemonic auras of protection that shimmer and writhe as they chant their blasphemous prayers. The Dark Apostles preach that, compared to the blood and thunder of their own faith, the falsehoods of the Ecclesiarchy are but cobweb-thin tissues of superstition. These are more than idle words—most Dark Apostles can act as direct conduits through which the Ruinous Powers can speak to mortal men. Dark Apostles may purchase Prayers to the Dark Gods, found later in this manuscript.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>DARK APOSTLE</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Adeptus Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">222</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">CHAOS</a>, <a class="keyword">[MARK OF CHAOS]</a>, <a class="keyword">HERETIC ASTARTES</a>, <a class="keyword">[LEGION]</a>, <a class="keyword">PRIEST</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 4, Toughness 4, Agility 4, Initiative 4, Willpower 4, Intellect 3, Fellowship 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 3, Persuasion 2, Scholar 2, Stealth 3, Weapon Skill 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.aB72KE3o0yKiBHL2]{Accursed Demagogue}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.7Bp1rDIfKEB2MB9N]{Aquila Mk VII}, @UUID[Item.7b2xcPWBB7up65PM]{Bolt Pistol}, @UUID[Item.OkOB1AyaC18tDpQS]{Accursed Crozius}, @UUID[Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Item.SJ8UaYHEMtF71W1M]{Krak Grenade}, @UUID[Item.psFMznVE4ZiQLywb]{Sigil of Corruption}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">4</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 3, Awareness 4, Ballistic Skill 3, Intimidation 2, Leadership 1, Persuasion 5,