    text:
      format: 1
      content: >-
        <blockquote><p>It is not enough to serve the Emperor, or even to love
        Him. You must give to Him all that you had, all you have, and all you
        shall ever have. You must give yourself over utterly and entirely to His
        divine will and become a vessel of that will. Only then is your
        sacrifice fitting.</p><p style="text-align:right"><em>—— From the Rule
        of the Sororitas</em></p></blockquote><p><strong>You are a recent
        recruit to the Adepta Sororitas. Your training under the Drill Abbots of
        the Schola Progenium was intense, and now you hone your skills and test
        your faith against the horrors of the galaxy, before you are judged
        ready to be assigned to an Order of the Adepta
        Sororitas.</strong></p><p>Most recruits into the Adepta Sororitas are
        drawn from the Schola Progenium, having been identified by the Drill
        Abbots and Abbesses of those Imperial orphanages as suitable candidates
        from an early age.</p><p>A few may be transferred from outside
        organisations, in particular the ranks of the servants of the
        Inquisition, although this is relatively unusual and only undertaken
        following lengthy consideration.</p><p>Having been identified as a
        candidate for membership, the individual is shipped to one of the two
        primary convents on Terra or Ophelia VII, where she will be subjected to
        a lengthy and arduous regime of testing as a novice intended to gauge
        her suitability to join the Sisterhood and to identify which of the
        Orders she would be most suited to.</p><p>Regardless of which Order she
        will eventually join, all novices undergo extensive instruction in the
        traditions of the Adepta Sororitas, and most receive at least a modicum
        of military instruction.</p><p>Once a novice is judged worthy to join
        the Sisterhood, swear her vows to the Emperor and has completed her
        basic training, the candidates are gathered in the great hall of the
        convent before the canonesses and palatines of the Orders to which they
        will be assigned.</p><p>Once she is assigned to her Order, the sister
        will begin a period of even more rigorous training and indoctrination,
        which, it is said, will never end until she sits in death at the right
        hand of the Emperor.</p><table style="width:98.9228%;height:239px"
