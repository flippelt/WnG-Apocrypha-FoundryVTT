      content: '<p>"We are shaped by Fate, just as we shape it." —Dathedron Maerathil, Asuryani Bonesinger You are a psychic artisan, shaping and sculpting the structures, tools, and other technology which your people rely upon for survival. A Bonesinger serves as a psychic engineer and craftsman for the Craftworld Aeldari, the Asuryani. The Bonesingers are the builders and maintainers of all Aeldari weapons, tools and even the Craftworlds themselves. These powerful xenos psykers are gifted in the arts of construction using the solidified power of the Warp. They use their telepathic ability to summon or psychically generate the solidified substance of the Immaterium the Aeldari call Wraithbone, which they construct into buildings or tools and use to repair the vehicles, weapons and armour of the Asuryani. Like all of their kind, the Bonesingers are following one of the many Asuryani Paths that determines their current focus and purpose in life. The Bonesinger''s Path, the Path of Shaping, is closely related to both the Path of the Artisan and the Path of the Seer. During their time on the Path of Shaping, the Bonesinger is tasked with the construction and maintenance of Craftworld structures, weapons and machinery, serving as psychic architects, engineers, and sculptors. They do this through the psychosonic manipulation of Wraithbone and other psychoreactive crystals, using sound, music, and mental energies to shape and mould these substances into various items. While Wraithbone naturally repairs itself, and grows over time, the process can be accelerated and guided by the psychic abilities of a Bonesinger.</p><p>Page 106</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>BONESINGER</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Aeldari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">72</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">ASURYANI</a>, <a class="keyword">[CRAFTWORLD]</a>, <a class="keyword">PSYKER</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Agility 3, Willpower 4, Intellect 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Psychic Mastery 2, Tech 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.0HAo5IXcsRHZeKSV]{Path of the Shaper}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.Uw7TmKSZfG0PFiKu]{Rune Armour}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.NRKvIJ5ySZ5pSK9t]{Psytronome Shaper}, A set of wraithbone runes, @UUID[Compendium.wng-core.items.Item.ZpcMcMduGreD2T02]{Bonesinger Shard}, @UUID[Compendium.wng-core.items.Item.aIEl2xpESvkqyVEG]{Spirit Stone}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">3