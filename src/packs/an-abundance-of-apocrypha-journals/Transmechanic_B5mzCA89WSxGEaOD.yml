      content: '<p>The Omnissiah Knows All, Comprehends All —The Eighth Universal Law of the Cult Mechanicus You are attuned to wavelengths and signals that flesh cannot discern. You can hear and speak the transmissions of machines, pulling knowledge from the air on a whim. Transmechanics are those Tech-priests who specialize in the repair, operation, and maintenance of the Imperium''s various forms of communications technology. Their implants and conditioning permit them to perceive and transmit vox signals, tightbeam las-casts, holopulses, and a variety of other electromagnetic transmission media, and they have a deep understanding of the technologies which produce and receive these signals.</p><p>What is less well-known is the degree to which a Transmechanic can interact with these signals: even the least adept Transmechanic is a master of linguistics and ciphers, able to decipher almost any signal, and able to analyse and even manipulate the signals they decipher.</p><p>For this reason, they’re invaluable as communications technicians aboard Imperial Navy vessels and amongst Imperial Guard forces, as well as working alongside the Adeptus Arbites and Inquisition when intercepting seditious or heretical communications is vital.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>TRANSMECHANIC</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">48</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS MECHANICUS</a>, <a class="keyword">[FORGE WORLD]</a>, <a class="keyword">CULT MECHANICUS</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 2, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Investigation 2, Scholar 3, Tech 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.4f3h3h4cG37bVOSZ]{Vox Communion}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.ao9aV67Lzcvi03KR]{Auger Array (Auspex)}, @UUID[Item.XNNfHCcsg3WpGKzt]{Enhanced Data-Tether}, any two augmetics, @UUID[Item.Gkvz8V1xP8wrBBk8]{Mesh Armour}, @UUID[Item.STrmO2xhRZgClDSR]{Laspistol}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">1</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">5</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 2, Deception 2, Insight 2, Investigation 3, Scholar 5, Tech 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.sOuOMmWohMfOEFJv]{Augmetic}, @UUID[Item.VLWzaaUTYv6c3X2A]{Conversational Cogit