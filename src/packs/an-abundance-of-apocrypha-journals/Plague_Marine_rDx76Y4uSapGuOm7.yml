      content: '<p>" Sickness, disease, plague and pox, suffering and the slow, living rot. Such wondrous gifts does Nurgle seek to bestow upon the unworthy human cattle of the Imperium. We are merely the vectors by which his virulent beneficence may be spread to the undeserving masses." — Urgloth Rotheart, Plague Champion of the Death Guard You bear the Plaguefather’s gifts, and you seek to spread them to all those you encounter. And if that generosity is spurned, yours is the fury and wrath that shall be offered instead. Plague Marines are those Chaos Space Marines who have wholly dedicated their lives and souls to the service of the Chaos God Nurgle.</p><p>carcasses, making them all but immune to the pain or discomfort caused by battle wounds. The blessed reek of corruption, the sight of freshly suppurating flesh and the blossoming gore of an infected wound -- these are things to be grateful for.</p><p>Within their corpulent and disgusting Power Armour their bodies are bloated with disease, swollen with corruption and rank with decay even as they no longer are capable of feeling pain, the greatest mutational "gift" given to them by the Plague Lord. The Plague Marines prefer short-ranged firefights, where they can truly appreciate the festering carnage they inflict upon their enemies, even as they laugh off the bolts and las-blasts directed back at them. Their decaying brains are inured to the agony of the bodily corruption that runs rampant in their diseased</p><p>NURGLE PLAGUE MARINE</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>PLAGUE MARINE</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Adeptus Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">320</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">CHAOS</a>, <a class="keyword">NURGLE</a>, <a class="keyword">HERETIC ASTARTES</a>, <a class="keyword">[LEGION]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 6, Agility 4, Initiative 5, Willpower 5, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 5, Intimidation 3, Leadership 1, Stealth 3, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.3dtZyTw2kFsveCs1]{Disgustingly Resilient}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.7Bp1rDIfKEB2MB9N]{Aquila Mk VII}, @UUID[Item.I7yC0O7DawbOznUf]{Boltgun}, @UUID[Item.7b2xcPWBB7up65PM]{Bolt Pistol}, @UUID[Item.RYl5lvSY97e9x82z]{Plague Knife}, @UUID[Item.LDZ4CJzqKNgWnwGX]{Blight Grenade}, @UUID[Item.SJ8UaYHEMtF71W1M]{Krak Grenade}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">—</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.HYuKXdU1r5yNyRU1]{Die Hard}, @UUID[Item.YOJXISADzQlwp1Lc]{Fear}, @UUID[Item.5iNJHYKgdbVqNRwo]{Feel No Pain}</td></tr></tbody></table>'
