pages:
  - name: The T'au
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: "<p>The T’au—also known as the Tau in older Imperial records—are a relatively recent humanoid Xenos species native to a world in the Eastern Fringe of the galaxy. They are an intelligent and technologically advanced species with an emergent colonial empire that has spread across several adjacent sectors of space over the past centuries, using a mixture of conquest and diplomacy to expand their influence and territory.</p>\n<p>T’au society is divided into several functional castes, each of which is responsible for a single aspect of society. These castes are reinforced through strict eugenic breeding programs, maintaining each caste as a physiologically distinct subspecies.</p>\n<p>The T’au believe in the concept of the <em>Tau’va</em>, a philosophy of all individuals working together to the collective betterment of all, placing the wellbeing of their society above their individual needs or desires.</p>\n<p>T’au player characters will belong to one of five Castes, each of which are suited to different roles within society. In game terms, each Caste is a different species; a <em>Shas</em> T’au cannot choose an archetype for <em>Fio</em> T’au, and vice versa.</p>\n<h5>T'au Names</h5>\n<p>T'au names are tied closely with their lives within the empire. A T'au's full name always starts with their caste and their rank, followed by the sept (planetary system) of their birth, followed by their personal name, which is often determined/extended by their notable actions or achievements in life. In common speech, they may be referred to by a nickname or by their rank and one of their personal names, rather than speaking the full name each time: the rebel Shas’O Vior’la Shovah Kais Mont’yr was also known as O’Shovah, or Commander Farsight.</p>\n<p>A T’au character at Tier 1 will only have their caste, rank, and maybe a single personal name. At Tier 2, they will have gained their first personal name, if they didn’t have it before. At Tier 3 or 4, a T’au will likely have received their second personal name. T’au with three or more personal names are likely to be Tier 5 or higher.</p>\n<h3>Playing a Tau</h3>\n<h4>Fire Caste T'au</h4>\n<p>Members of the Fire Caste—the <em>Shas</em>—are the warriors of the Tau Empire, and as such are most often seen on the field of battle. They have been bred to be the strongest and most aggressive Tau, and weak strains are quickly weeded out. These traits come from the Fire Caste's origin on the plains of T'au, where they were hunters and warriors. Fire Warriors, as soldiers of the Fire Caste are known, spend their entire lifetimes in battle or preparing for it, constantly honing their tactics, and working to improve their skills. The strongest of the strong are those Tau from the world of Vior'la, who have slightly greater muscle mass because of the stronger gravity of that planet. The Fire Caste guided by the Code of Fire—a doctrine of loyalty, martial arts and merciless war tempered by wisdom</p>\n<p><strong>XP Cost:</strong> 4</p>\n<p><strong>Speed:</strong> 6</p>\n<p><strong>Skills:</strong> Ballistic Skill 1, Tech 1</p>\n<p><strong>For the Greater Good (Shas):</strong> When you assist an ally using Awareness, Ballistic Skill, or Stealth, you may halve the number of dice you would add and add that many Icons to the test you are assisting.</p>\n<p><strong>Dull Soul:</strong> You cannot gain the @UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKER} keyword under any circumstances.</p>\n<h4>Earth Caste T'au</h4>\n<p>The Earth caste—the <em>Fio</em>—provides for the manufacturing, agricultural, industrial, artisans, and engineering needs of the Tau Empire. By far the largest caste in sheer numbers, it is they who erect dwellings, provide food, and produce new technology. Members of the Earth Caste are often described as plain and dour, possessing a rather stoic outlook on life in general. They were originally the first Tau to build cities and practice agriculture.\_</p>\n<p><strong>XP Cost:</strong> 14</p>\n<p><strong>Speed:</strong> 5</p>\n<p><strong>Attributes:</strong> Intellect 3</p>\n<p><strong>Skills:</strong> Scholar 1, Tech 1</p>\n<p><strong>For the Greater Good (Fio):</strong> When you assist an ally using Medicae, Scholar, or Tech, you may halve the number of dice you would add and add that many Icons to the test you are assisting</p>\n<p><strong>Dull Soul:</strong>\_You cannot gain the @UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKER} keyword under any circumstances.</p>\n<h4>Air Caste T'au</h4>\n<p>The Air Caste—the <em>Kor</em>—is charged with holding the Tau Empire together through the Kor'vattra, the Tau Empire's merchant and war-fleet in addition to operating Tau Orbitals and Fortress Stations. Formerly functioning as messengers, these days they are the Tau Navy and are sometimes called the \"Invisible Caste\", for they rarely if ever set foot upon planets. Living in Orbital Cities, Tau of the Air Caste are the tallest and most slender of all Tau, with long, skinny limbs and hollow bones developed due to lives lived mostly in low- and zero-gravity ships and space stations. In the past, before the time of the Mont'au, the Tau that originally became the Air Caste had membranes stretching between their limbs, allowing them to glide on air currents. Tau pilots tend to be superior pilots compared to their human counterparts because they have a better depth perception and higher G-tolerance, but they lack battle-experience compared to the best Imperial fighter-pilots.\_</p>\n<p><strong>XP Cost:</strong> 14</p>\n<p><strong>Speed:</strong> 7</p>\n<p><strong>Attributes:</strong> Agility 3</p>\n<p><strong>Skills:</strong> Awareness 1, Pilot 1</p>\n<p><strong>For the Greater Good (Kor):</strong> When you assist an ally using Awareness, Pilot, or Tech, you may halve the number of dice you would add and add that many Icons to the test you are assisting. Grav-Adapted: You ignore all DN increases for high, low, or zero-gravity, and you gain a Flying Speed equal to your normal Speed when in zero gravity.</p>\n<p><strong>Dull Soul:</strong>\_You cannot gain the @UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKER} keyword under any circumstances.</p>\n<h4>Water Caste T'au</h4>\n<p>The Water Caste—the <em>Por</em>—serve the Tau Empire as traders, merchants, public servants, bureaucrats, administrators, diplomats, and ambassadors. They interact with other races when such affairs are not handled by the Fire Caste, and often act as administrators of Tau worlds in the absence of an Ethereal governor. Like water, Water Caste bureaucrats fluidly move between other Castes and alien races incorporated within the Empire to make sure that it flows smoothly. The Water Caste are known for their great linguistic, diplomatic, and negotiation skills. Members of the Water Caste are often the ones who initiate first contact with new species encountered by the Empire, skilfully negotiating their union with the Tau. The members of the Water Caste has a gift for linguistics that has become more and more developed over time, so they able to learn alien languages with ease and show a remarkable ability to emulate and pick up subtlest of communication features.</p>\n<p><strong>XP Cost:</strong> 14</p>\n<p><strong>Speed:</strong> 6</p>\n<p><strong>Attributes:</strong> Fellowship 3</p>\n<p><strong>Skills:</strong> Insight 1, Persuasion 1</p>\n<p><strong>For the Greater Good (Por)</strong>: When you assist an ally using Cunning, Deception, or Persuasion, you may halve the number of dice you would add and add that many Icons to the test you are assisting. Polyglot: You know additional languages equal to your Scholar rank. When you encounter an unfamiliar language, you gain +Double Rank on Scholar tests to learn or translate that language.</p>\n<p><strong>Dull Soul:</strong>\_You cannot gain the @UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKER} keyword under any circumstances.</p>\n<h4>Ethereal Caste T'au</h4>\n<p>The Ethereal Caste—the <em>Aun</em>—are the leaders of T’au society, serving as some mixture of philosopher-kings and spiritual leaders. Their arrival started the unification process between the various Tau tribes and coincided with the implementation of the concept of the Greater Good. They first appeared during a siege between the Tau of the plains (later known as the Fire Caste) and the Tau of the city of Fio'taun (later known as the Earth Caste). The Ethereals brought the two sides together to negotiate and convinced them to follow the Greater Good. Their power over the Tau is such that an Ethereal could tell a Tau to die and that Tau would do so quickly and gladly.</p>\n<p>As the leaders of the Tau, the Ethereals are enigmatic and studious, yet unfaltering in their authority and their drive to further the Greater Good. They are mystics and philosophers, possessed of knowledge and wisdom not shared by their more practical subjects. As such they had some part to play in the Tau rapid development, and to this day guide their species in its dynamic expansion, or the castes revert to the savagery that once threatened to destroy them.</p>\n<p><strong>XP Cost:</strong> 40</p>\n<p><strong>Speed:</strong> 6</p>\n<p><strong>Attributes:</strong> Agility 3, Willpower 3</p>\n<p><strong>Skills:</strong> Leadership 2, Scholar 3, Weapon Skill 1</p>\n<p><strong>Ethereal Presence:</strong> @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.F7FRdD4PlRSmS3xN]{T'AU} characters within 12m always add bonus dice equal to twice the Ethereal’s Rank to their Resolve and Conviction tests. @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.F7FRdD4PlRSmS3xN]{T'AU} characters cannot willingly harm an Ethereal, and must pass a DN 5 Resolve test or become Pinned if their actions allow an Ethereal to be harmed.</p>\n<p><strong>Dull Soul:</strong>\_You cannot gain the @UUID[Compendium.wng-core.items.Item.JVz6FoVEc7p1DJUj]{PSYKER} keyword under any circumstances.</p>\n<h5>Additional Details</h5>\n<p><strong>Age:</strong> T’au live slightly shorter lives than baseline humans, aging to maturity by around 8 Tau’cyr (a T’au unit of time, roughly equal to a year). And rarely living for longer than 40 or 50 Tau’cyr, though some valuable T’au leaders and experts are interred in stasis pods or receive experimental treatments or implants to extend their lives, and Ethereals appear to live somewhat longer than other T’au. If you’re randomly rolling for a T'au character’s age, roll 1d6+6, and then add an additional d6 for each Tier.</p>\n<p><strong>Colouration:</strong> T’au have skin in various shades of bluegrey—some more grey, some more blue. Their eyes tend to be large dark orbs, with little distinct colouration. Their hair tends to be carefully maintained, normally shaven except for a single scalplock, and tend to be various shades of red, brown, or black, though turning grey or white with age.</p>\n<p><strong>Height:</strong> T’au height varies significantly by caste. Air Caste T’au are the tallest, at 7’ +2d6”. Fire, Water, and Ethereal Caste T’au are all similar in height, averaging 4’ + 5d6”, slightly shorter than a human. Earth Caste T’au are especially short and broad, averaging 4’ + 4d6”.</p>\n<p><strong>Languages:</strong> The T’au speak their own language, typically referred to as “T’au” by the Imperium. This language is well-known to Imperial xenolinguists, as the T’au Water Caste are quite free with translation guides to aid interactions (though those same T’au diplomats also speak Imperial Gothic extremely well). This agglutinative language—a language where new words are built by combining existing words—is extremely adaptable to the rapid growth of the T’au Empire, and new concepts are added or developed regularly. Each Caste has their own highly developed dialects replete with distinctive jargon and specialised colloquialisms. The Earth Caste are also fluent in the complex octal machine-languages of their Drone assistants.</p>"
