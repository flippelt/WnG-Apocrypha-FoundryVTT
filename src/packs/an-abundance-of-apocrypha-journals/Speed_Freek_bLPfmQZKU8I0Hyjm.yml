      content: '<p>"We’s stomped ’umies, we’s blown up stuff and we’s driven our trakks from one end of da world to da uvva. We’s gonna come back next year!” — Bugsplatta Defnik of the Red Wheelz Speed Freeks You’re not like most Orks. You don’t just crave the din of battle and the joys of a good scrap. You want to go fast too. The faster the better. In fact, every moment you’re not going fast seems like an eternity. Atop a Warbike, or in a trukk or other fast-moving vehicle, you can hurtle at breakneck speeds, stopping only to tinker with your mount. Orks possess an inherent need to go fast. There is something about speed that fulfils some deep need in the Orkish temperament, just like the thunder of guns, the clank of tracks or the din of battle. They like to feel the wind whipping into their faces and to hear the throaty roar of supercharged engines. It is hardly surprising that bikes and buggies of all kinds are popular with the Orks. These up-gunned vehicles may not be as sturdy as those used by the Imperium, but they are cheap, can pack a massive amount of firepower and, most important of all, they can achieve truly suicidal speeds.</p><p>thick of the fighting before their ground-pounding comrades. Due to the large number of vehicles in each Speed Freek warband, they often have several of the Oddboyz known as Mekboyz amongst their number to keep the Battlewagons and other vehicles and aircraft running smoothly. Sometimes it is even a Mekboy who leads the warband as a Big Mek. The obsession with speed can affect any Ork -- so it is possible to find Orks from different clanz in a Speed Freek force. Of all the known major Ork clanz the Evil Sunz have the most Speed Freeks.</p><p>Some Orks become addicted to the sensation of speed and join the Speed Freeks, the name for those Greenskins who belong to the Ork Kult of Speed, a Kult whose members rarely if ever get out from behind the handlebars or steering wheels of their light vehicles. These grinning, green-skinned lunatics roar into battle ahead on exhaust-belching jalopies and crude but effective flying machines, intent on getting into the</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>SPEED FREEK</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Ork</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">58</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">ORK</a>, <a class="keyword">[CLAN]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Toughness 3, Agility 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Intimidation 3, Pilot 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.BD048ZUcnpV1CjWJ]{Fasta! FASTA!}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.jyZ8n21b8puAf41z]{Slugga}, @UUID[Item.zCg3aku6t9knvNIe]{Choppa}, @UUID[Item.YArm2VCihbVlLurI]{Ork Flak}, Ork Warbike (Church of Steel)</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 1, Ballistic Skill 1, Intimidation 3, Pilot 3, Tech 2, Weapon Skill 2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.651cA7z9A5SIPC4r]{Bullet Hell}, @UUID[Item.i2iaIBRjeULHMMHD]{Combat Driving}, @UUID[Item.P9uTwYByV17eTfzf]{More Dakka!}</td></tr></tbody></table>'
