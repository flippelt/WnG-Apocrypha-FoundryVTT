      content: '<p>“What you do not understand is that I am the future of humanity, while you fools are its distant past. Let me show you mankind’s destiny.” – Kataria Skol, Scrying-Wyrd of Blasted Station</p><p>You eluded the Black Ships of the Imperium, and have developed your powers, free of the shackles and torments of your oppressors. In the darkness, you have heard voices whispering to you, offering you paths to power the likes of which the lap-dogs of the Emperor could not imagine… and you are intrigued. In the Imperium of Man, the Adeptus Astra Telepathica oversees the recruitment and training of psykers for use throughout the Adeptus Terra (and the Imperium as a whole). The Adeptus deliberately ensures these sanctioned psykers are unquestioningly loyal and meticulously trained, as well as both hidebound by nature and inflexible in their approach to the powers they wield. This is no error on the part of the Imperium, instead it is a deliberate defence cultivated by the psykers’ tutors. The souls of humans burn in the warp and those of psykers more brightly than most. The entities of that alien realm are drawn to those souls like moths to flames, eager to devour and consume them. However, a dullard’s mind is far less appetising to a Daemon and likely to be passed over in favour for sweeter meats.</p><p>whose powers have only just awakened, or those who have simply slipped through the cracks of the Imperium’s monstrous bureaucracy. There are even those psykers who are entirely black-hearted and dangerous individuals, and even those who willingly embrace the seductive power of the Dark Gods of the Warp. Collectively, the Imperium knows these individuals as rogue psykers</p><p>However, there are those psykers who have not been trained by the Adeptus Astra Telepathica. These may be quick-witted and self-taught wyrds whose instincts and intuition have been honed by a lifestyle spent as a fugitive from the Black Ships and Inquisition who gather their brethren for deliverance unto the Adeptus Astra Telepathica. Alternatively, they may be feral mystics and shamans on backwater planets with no inkling of the source of their power, individuals</p><p>Page 125</p><p>CULT WITCH</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>ROGUE PSYKER</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">32</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">HERETIC</a>, <a class="keyword">CHAOS</a>, <a class="keyword">[MARK OF CHAOS]</a>, <a class="keyword">PSYKER</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Psychic Mastery 1</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.igfLBHaWrGwo4u5n]{Witchcraft}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: Staff, @UUID[Item.mhAqXwKpEtjcXznj]{Aura of Dark Glory}, @UUID[Item.vZp4dj9eXhFcVwOB]{Ragged Robes (Clothing)}, @UUID[Item.hm72b4pxq5EzPYSu]{Psychic Focus}, @UUID[Item.2gY4DbBLU5UCWmNH]{Spook}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">1</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">6</td><td style="text-align:center">2</td><td style="text-align:center">3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 1, Psychic Mastery 3, Scholar 1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.6gF6E0j3JMCMUZ3O]{Battle-Psyker}</td></tr></tbody></table>'
