      content: "<blockquote><p>Ours is to be an empire of worlds, not merely of castes or nations, or races or peoples. To simply control the worlds which we claim as our own will not be enough – we must control the paths between them also, or be divided, and so fail</p><p style=\"text-align:right\"><em>—— The Air Caste Petition ahead of the Tau’n Campaign</em></p></blockquote><p><strong>You are a pilot of the T’au Empire, a member of the Air Caste. You seldom set foot upon the worlds of the Empire, but without you, the Empire would unravel, disconnected\_</strong></p><p>The Air Caste is charged with holding the Tau Empire together through the Kor'vattra, the Tau Empire's merchant and war-fleet in addition to operating Tau Orbitals and Fortress Stations. Formerly functioning as messengers, these days they are the Tau Navy and are sometimes called the \"Invisible Caste\", for they rarely if ever set foot upon planets. Living in Orbital Cities, Tau of the Air Caste are the tallest and most slender of all Tau, with long, skinny limbs and hollow bones developed due to lives lived mostly in low- and zerogravity ships and space stations. \_</p><p>Messengers are the most common of Air Caste T’au, operating light aircraft and serving as crew aboard the voidships of the Kor’vattra, the T’au fleet. Many train for the opportunities to take on more significant tasks for the Empire, such as operating combat aircraft, piloting escort ships, and eventually receiving command of their own ship or squadron.\_</p><div class=\"journal-image centered\"><img src=\"modules/wng-apocrypha/assets/images/archetypes/TauAirCastePilotandDrone.webp\" width=\"350\" height=\"439\" /></div><table style=\"width:98.9228%;height:234px\" border=\"1\"><tbody><tr class=\"table-header\" style=\"background-color:#846404;height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\">AIR CASTE MESSENGER</td></tr><tr style=\"height:16px\"><td style=\"background-color:#846404;color:white;text-align:center;width:26.5674%;height:16px\" colspan=\"2\">TIER</td><td style=\"width:8.3%;height:16px;text-align:center\">1</td><td style=\"background-color:#846404;color:white;width:16.2617%;height:16px;text-align:center\" colspan=\"2\">SPECIES</td><td style=\"width:11.7268%;height:16px;text-align:center\">Kor T'au</td><td style=\"background-color:#846404;color:white;width:11.6223%;height:16px;text-align:center\">XP Cost</td><td style=\"width:18.2509%;height:16px;text-align:center\">20</td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>KEYWORDS</strong>: <a class=\"keyword\">T'AU EMPIRE</a>, <a class=\"keyword\">AIR CASTE</a>, <a class=\"keyword\">[SEPT]</a></td></tr><tr style=\"height:16px;background-color:rgba(0, 0, 0, .2)\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>ATTRIBUTE</strong>: Agility 3</td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>SKILLS</strong>:\_Awareness 1, Pilot 2</td></tr><tr style=\"height:16px;background-color:rgba(0, 0, 0, .2)\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><p><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.6ZG6OyaEHP64CA3D]{At Home in the Skies}</p></td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>WARGEAR</strong>: T’au Flight Suit, Pulse Pistol, Rebreather</td></tr><tr style=\"height:16px\"><td class=\"table-header\" style=\"width:51.1291%;height:16px;background-color:#846404;text-align:left\" colspan=\"5\"><strong>SUGGESTED ATTRIBUTES</strong></td><td style=\"background-color:#846404;color:white;text-align:center;width:23.3491%;height:16px\" colspan=\"2\">XP Cost</td><td style=\"width:18.2509%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)\">32</td></tr><tr style=\"font-variant:small-caps;height:16px\"><td style=\"background-color:#846404;color:white;width:14.0674%;height:16px\">ATTRITBUTE</td><td style=\"width:12.5%;height:16px;text-align:center\">S</td><td style=\"width:8.3%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)\">T</td><td style=\"width:5.17241%;height:16px;text-align:center\">A</td><td style=\"width:11.0893%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)\">I</td><td style=\"width:11.7268%;height:16px;text-align:center\">Wil</td><td style=\"width:11.6223%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)\">Int</td><td style=\"width:18.2509%;height:16px;text-align:center\">Fel</td></tr><tr style=\"height:16px\"><td style=\"background-color:#846404;color:white;width:14.0674%;height:16px\">RATING</td><td style=\"width:12.5%;height:16px;text-align:center\">1</td><td style=\"width:8.3%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)\">2</td><td style=\"width:5.17241%;height:16px;text-align:center\">4</td><td style=\"width:11.0893%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)\">3</td><td style=\"width:11.7268%;height:16px;text-align:center\">2</td><td style=\"width:11.6223%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)\">2</td><td style=\"width:18.2509%;height:16px;text-align:center\">1</td></tr><tr style=\"height:16px\"><td class=\"table-header\" style=\"background-color:#846404;width:51.1291%;height:16px;text-align:left\" colspan=\"5\"><strong>SUGGESTED SKILLS</strong></td><td style=\"background-color:#846404;color:white;text-align:center;width:23.3491%;height:16px\" colspan=\"2\">XP Cost</td><td style=\"width:18.2509%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)\">18</td></tr><tr style=\"height:16px\"><td style=\"height:16px;width:92.7291%\" colspan=\"8\">Awareness 2, Ballistic Skill 1, Pilot 3, Tech 2</td></tr><tr style=\"height:16px\"><td class=\"table-header\" style=\"background-color:#846404;width:92.7291%;height:16px\" colspan=\"8\">SUGGESTED TALENTS</td></tr><tr style=\"height:16px\"><td style=\"height:16px;width:92.7291%\" colspan=\"8\">@UUID[Item.i3EZKnYXNdsGu2dP