      content: "<p>The origins of the Dark Eldar can be found in the Fall of the Eldar, the great cataclysm that nearly destroyed the entire Eldar race. It was an event so terrible that not only did it kill trillions of Eldar, but it breached the gap between real space and the Warp, and gave birth to Slaanesh, a Chaos God.</p>\n<p>Life on the Eldar Worlds was idyllic, with fantastically sophisticated machines to take care of all labour and manufacturing required, leaving the Eldar free to indulge in other, more aesthetic pursuits. With all menial work taken care of for them, the Eldar became indolent and decadent. They began to explore more and more the arts of pleasure, delving ever deeper into hedonism. This descent into decadence spanned millennia. Tradition and order disintegrated, as they limited the pursuit of pleasure. Sects called Pleasure Cults were formed, dedicated to achieving the highest levels of hedonistic sensation, and their ceremonies and practices became ever wilder, eventually devolving into violence and sacrifice of their own kind. Some Eldar hated what their race had become and left the homeworlds, leaving the Pleasure Cults to their madness. Building realms and outposts within the Webway to act as ports for inter-galactic travel, the city of Commorragh was founded. Isolated within the Webway, Commorragh itself soon became a bastion for pleasure cults and increasingly depraved acts.</p>\n<p>Meanwhile, something terrible was stirring in the Warp. The millennia of Eldar hedonism had made a massive impact in the psychic realm of Chaos. Within the warp the decadent Eldar civilisation was giving shape to a Power of Chaos, which grew and grew over thousands of years, getting stronger and more defined until suddenly it sparked into an intelligence - a shatteringly huge and malign intelligence, with an immense and bottomless thirst for Eldar souls. This was the birth of Slaanesh. The process lasted for thousands of years, corresponding to mankind's Age of Strife, although when Slaanesh finally came into being, the results with the universe were apocalyptic and sudden. An almighty psychic shockwave scythed across the galaxy. The souls of almost every Eldar were stripped from them in an instant and devoured by the new-born Chaos god. There were few survivors. Most were driven mad, their minds trapped half in the real world and half in the swirling insanity of the Warp. A great Warp rift was created, encompassing the entire Aeldari empire and creating the Eye of Terror.</p>\n<p>The denizens of Commorragh, however, were tucked away safely in the Webway, protected from Slaanesh and its thirst. Though much of the Webway was in ruin, they had endured and, unlike their Craftworld counterparts, remained unrepentant. Though they discovered Slaanesh was still slowly claiming their souls, the denizens of Commorragh soon discovered that by absorbing the pain and torments of another's soul they could rejuvenate themselves and cheat death. Assuming they could feed regularly, the Eldar of the Webway had become physically immune to the passage of time. Soon the Eldar of the Webway began raiding Realspace in search of captives and slaves to rejuvenate themselves with. So it was that the Dark Eldar were born, a race of sadistic murderers who feed upon the anguish of others to prevent the death of their immortal souls.</p>\n<blockquote class=\"sidebar\">\n<h3><em>THE <a class=\"keyword\">[KABAL]</a> KEYWORD</em></h3>\n<p>The Kabals are massive political entities, part noble house, part pirate warband, part economic power, and not dissimilar in structure to the criminal syndicates found on many Imperial worlds.</p>\n<p>If you have the <a class=\"keyword\">KABALITE</a> keyword, you will also have the <a class=\"keyword\">[KABAL]</a> Keyword, which is replaced with the name of the Kabal you are a member of.</p>\n<p><em><a class=\"keyword\">THE BLACK HEART</a></em></p>\n<p><em><a class=\"keyword\">THE POISONED TONGUE</a></em></p>\n<p><em><a class=\"keyword\">THE FLAYED SKULL</a></em></p>\n<p><em><a class=\"keyword\">THE OBSIDIAN ROSE</a></em></p>\n</blockquote>\n<blockquote class=\"sidebar\">\n<h3><em>THE <a class=\"keyword\">[CULT]</a> KEYWORD</em></h3>\n<p>Each Wych Cult is collective of gladiatorial fighters known as Wyches, or Hekatarii, whose battles entertain the masses of the Dark City, and whose skills can be hired by raiding parties when the price is right</p>\n<p>If you have the <a class=\"keyword\">WYCH</a> keyword, you will also have the <a class=\"keyword\">[CULT]</a> Keyword, which is replaced with the name of the Cult you are a member of.</p>\n<p><em><a class=\"keyword\">THE CULT OF STRIFE</a></em></p>\n<p><em><a class=\"keyword\">THE CURSED BLADE</a></em></p>\n<p><em><a class=\"keyword\">THE RED GRIEF</a></em></p>\n</blockquote>\n<blockquote class=\"sidebar\">\n<h3><em>THE <a class=\"keyword\">[COVEN]</a> KEYWORD</em></h3>\n<p>The Haemonculi band together for mutual benefit, collaborating on research and experimentation, and providing services to the rest of the Dark City. These groups of Haemonculi and their followers are known as Covens.</p>\n<p>The <a class=\"keyword\">[COVEN]</a> Keyword is replaced with the name of the Haemonculus Coven you belong to.</p>\n<p><em><a class=\"keyword\">THE PROPHETS OF FLESH</a></em></p>\n<p><em><a class=\"keyword\">THE DARK CREED</a></em></p>\n<p><em><a class=\"keyword\">THE COVEN OF TWELVE</a></em></p>\n</blockquote>\n<table style=\"width:99.1477%;height:985px\" border=\"1\">\n<tbody>\n<tr style=\"height:17px\">\n<td style=\"width:100.072%;height:17px;text-align:center;background-color:#734ea0;color:#dddddd\" colspan=\"3\">DRUKHARI ARCHETYPES</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px\">Tier</td>\n<td style=\"width:64.6033%;height:17px\">Archetype</td>\n<td style=\"width:22.9595%;height:17px\">Description</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;text-align:center;height:51px\">1</td>\n<td style=\"width:64.6033%;height:51px\">Kabalite Warrior</td>\n<td style=\"width:22.9595%;height:51px\">Deadly, murderous raiders, who excel at bringing pain.</td>\n</tr>\n<tr style=\"height:84px\">\n<td style=\"width:12.509%;text-align:center;height:84px\">1</td>\n<td style=\"width:64.6033%;height:84px\">Wych</td>\n<td style=\"width:22.9595%;height:84px\">Graceful, ruthless gladiators, for whom war is sport.</td>\n</tr>\n<tr style=\"height:68px\">\n<td style=\"width:12.509%;text-align:center;height:68px\">3</td>\n<td style=\"width:64.6033%;height:68px\">Incubus</td>\n<td style=\"width:22.9595%;height:68px\">Masters of the deadly strike, with no regard for anything but killing</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:100.072%;height:17px;text-align:center;background-color:#734ea0;color:#dddddd\" colspan=\"3\">DRUKHARI BACKGROUNDS</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.6033%;height:17px\">Origin</td>\n<td style=\"width:22.9595%;height:17px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:68px\">\n<td style=\"width:12.509%;height:68px;text-align:center\">1</td>\n<td style=\"width:64.6033%;height:68px\"><strong>Trueborn:</strong> You were born naturally, to one of the powerful families of the Dark City whose resources allowed them to raise a child in the traditional manner. You are a scion of the powerful, raised from childhood to dominate and terrorise.</td>\n<td style=\"width:22.9595%;height:68px;text-align:right\">Influence</td>\n</tr>\n<tr style=\"height:68px\">\n<td style=\"width:12.509%;text-align:center;height:68px\">2</td>\n<td style=\"width:64.6033%;height:68px\"><strong>Halfborn:\_</strong>You were born from an artificial gestation tube, quickly and efficiently, like the majority of Drukhari. To thrive in the slums and lower tiers of the Dark City, you had to be ruthless and ambitious.</td>\n<td style=\"width:22.9595%;text-align:right;height:68px\">Determination</td>\n</tr>\n<tr style=\"height:68px\">\n<td style=\"width:12.509%;text-align:center;height:68px\">3</td>\n<td style=\"width:64.6033%;height:68px\"><strong>Wrought:\_</strong> You know not from whence you came, only that you awoke upon a Haemonculus’ table fully formed and thirsting for the agony of others. Your mysterious, possibly unnatural origin may disquiet some, but you are what you have made of yourself.</td>\n<td style=\"width:22.9595%;text-align:right;height:68px\">Max Shock</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.6033%;height:17px\">Accomplishment</td>\n<td style=\"width:22.9595%;height:17px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;height:34px;text-align:center\">1</td>\n<td style=\"width:64.6033%;height:34px\"><strong>Raider:</strong> You were part of a victorious real-space raid, and the souls you dragged back, and the recorded hologhosts of your kills have earned you prestige, glory, and status.</td>\n<td style=\"width:22.9595%;height:34px;text-align:right\">Wealth</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;height:51px;text-align:center\">2</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Triumph: </strong>You set foot within the arena, and you emerged victorious. The hard-fought victory came with many scars, the ache of which still reminds you of the fury of the battle.\_</td>\n<td style=\"width:22.9595%;height:51px;text-align:right\">Max Wounds</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;text-align:center;height:51px\">3</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Usurper: </strong>You attained your status through guile and skill, undermining and then eliminating a former superior and assuming their position. You know that others seek to recreate your ascension and take what you have won, but you will not make it easy for them…</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Determination</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.6033%;height:17px\">Goal</td>\n<td style=\"width:22.9595%;height:17px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;height:51px;text-align:center\">1</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Dominion:</strong> You seek to rise to the highest levels of Drukhari society, by any means necessary. Nothing short of final death or ultimate dominion will see your ambition sated.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Resolve</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;height:51px;text-align:center\">2</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Terror:\_</strong>Out there, in realspace, there is a place which awaits your malicious attentions, which has not learned to dread your kind. You will find them, and you will feast upon their anguish.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Determination</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;height:51px;text-align:center\">3</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Satiety: </strong>The thirst that gnaws away at your soul, at once part of you and external to you, is a perpetual weight upon your existence. You will slake that thirst, or escape it.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Conviction</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:100.072%;text-align:center;height:17px;background-color:#734ea0;color:#dddddd\" colspan=\"3\">DRUKHARI OBJECTIVES</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;text-align:center;height:17px\">[[/r d6]]</td>\n<td style=\"width:87.5628%;height:17px\" colspan=\"2\">Objective\_</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">1</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Revel in the pain or distress of another creature</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">2</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Be scornful or dismissive of the taboos of other Aeldari, or another species</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;text-align:center;height:34px\">3</td>\n<td style=\"height:34px;width:87.5628%\" colspan=\"2\">Coerce or threaten another creature into doing what you want</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;text-align:center;height:34px\">4</td>\n<td style=\"height:34px;width:87.5628%\" colspan=\"2\">Apply your cruelty and cunning to trick or ambush a foe</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;text-align:center;height:34px\">5</td>\n<td style=\"height:34px;width:87.5628%\" colspan=\"2\">Explain a number of the different ways you could hurt or kill someone</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">6</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Gain in status or influence through murder or intimidation</td>\n</tr>\n</tbody>\n</table>"
