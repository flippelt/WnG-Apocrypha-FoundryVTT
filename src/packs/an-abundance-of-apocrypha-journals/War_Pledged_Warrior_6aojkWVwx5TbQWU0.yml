    text:
      format: 1
      content: >-
        <blockquote><p>You people do well at war because you treat it as a
        religion. We do well because we treat it as a business. It is just a
        matter of outlook.</p><p style="text-align:right"><em>—— Hargir
        Brondsson, Jarl of the Gruben
        Stronghold</em></p></blockquote><p><strong>You’re a proud, dependable
        warrior, trained in martial traditions of the Squats. You do not yield
        while a fellow warrior continues to fight, and you do not despair when
        facing the enemy because your kin stand by your side.</strong></p><p>The
        primary military force of a Squat Stronghold was known as the
        War-Pledged, a translation of the original Squat term, Kazakbarazi,
        though some Imperial linguists have translated it as “Brotherhood” or
        “Hearthkyn”. Each Squat is obliged to enter service once they have
        raised at least two children to maturity, ensuring that military service
        does not threaten the continuity of the hold, and this service lasts for
        at least three decades. Upon returning home after their service, a Squat
        takes up a place within their family’s interests. Even after leaving
        service, however, the bonds formed in a War-Pledged Company last for
        generations, with each warrior forming a link in a chain that binds
        Strongholds together.</p><p>Companies of War-Pledged were often hired
        out as mercenary companies or expeditionary forces to further the goals
        of their Stronghold – for skill at arms is simply one more commodity
        that can be traded – and it was these ranging forces that most often
        survived the cataclysm, when the rift opened and swallowed the
        Homeworlds. These forces are now scattered and isolated, often searching
        for other survivors or seeking vengeance on the enemies of their
        people.</p><p>Squat warriors gained a reputation for their fondness for
        guns, and even before the cataclysm, no Squat away from home would
        travel without at least one sidearm, typically a large-calibre pistol of
        some kind.</p><table style="width:98.9228%;height:239px"
