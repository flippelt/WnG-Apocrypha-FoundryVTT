      content: '<p>“"Only in Death does Duty End.” First Maxim of the Legio Custodes You are one of the Ten Thousand, the Emperor’s Custodian Guard, charged with the most sacred of duties: protecting Terra, the Imperial Palace, and the Emperor within. But protection takes many forms, and you may find yourself taking the battle to the enemy in the Emperor’s defence. A Custodian is a member of the Adeptus Custodes, the valiant transhuman bodyguard and praetorians of the Emperor of Mankind, which is based in the Imperial Palace complex on Terra. The Adeptus Custodes are the Emperor''s vengeance made manifest. They defend the Master of Mankind with singular determination and breath-taking skill, and whether their vigil requires them to stand immovable before the gates of the Imperial Palace or storm into battle on a distant alien world, they do their duty without a moment''s hesitation. Custodian Guard are steadfast in defence and unstoppable on the attack. Such squads do not have formal memberships, and Custodians may swap from one squad to another before each new campaign, or even each new battle. With their individualistic fighting styles, the Custodian Guard do not fight as one in the way that a conventional squad of soldiers would -- it is enough for them to know that they fight shoulder to shoulder with respected comrades, and that their fellows will watch their backs when the enemy press close.</p><p>Page 197</p>'
