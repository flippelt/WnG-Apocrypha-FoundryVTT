      content: <p>“Only when you have soared through the morning skies on wings of flame can you understand the Hawk. Only when you have fallen screaming upon those who know they are already dead can you understand the Banshee. Only when you have annihilated those who would oppose you can you truly understand the power of the Dragon. And only one who has travelled but ultimately turned away from each of these paths can understand the Autarch.” —Anthrillien Morningchild, Autarch of Yme-Loc You have walked numerous paths, and with each you gained greater insight into how each aspect of your people’s culture serves the whole. With your keen mind, you can bring the disparate talents of your kin together and combine them to achieve victory. An Autarch is one of those few Asuryani who have mastered many Paths over the centuries, including one or more facets of the Path of the Warrior. They possess a consummate understanding of the art of war and serve as the supreme commanders, strategists and generals of an Asuryani craftworld's warhost.</p><p>excels, for they are consummate warriors as well, and often spearhead assaults, fighting an enemy army's leader in personal combat or contemptuously destroying war machines with ease. Autarchs are considered integral parts of Asuryani culture due to their versatility and ability to lead the Asuryani on the myriad paths of life and death.</p><p>This Path, known as the Path of Command or Path of the Leader, is pursued by highly skilled individuals who believe martial excellence can be achieved by gaining a wider perspective of battle that allows the Eldar warhost to achieve victory in the most efficient and lethal way possible. Autarchs do not limit themselves to the single-minded specifications required of a single Path like most Asuryani. The Autarch possesses an unparalleled strategic ability which far outshines an Exarch's obsession with only a singular facet of war. This enables an Autarch to lead a craftworld warhost that operates in perfect unison, with each component of the Asuryani war machine functioning in perfect synchronicity. It is not only at the aspect of command that an Autarch</p>
