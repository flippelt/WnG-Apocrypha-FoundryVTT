      content: '<p>“Exitus Acta Probat; The outcome justifies the deed.” Dictatus Vindicare With single, perfect shots, you have quelled rebellions, ended wars, and put down uprisings. The Vindicare Assassins specialise in vengeance and revenge killings. They make use of a specially designed, long-range Sniper Rifle called the Exitus Rifle. The Vindicare Assassin brings inglorious death to the Emperor''s enemies with a sniper''s bullet. Vindicare Assassins have been known to wait in a position for as long as two weeks before taking a shot. Many rebellions and cults have been ended with one, perfect shot from a Vindicare''s rifle.</p><p>Support Weapons crews in quick succession. Eventually, the Aeldari called in their scouts to clear the tower, but when they entered it, they found it full of grenade traps ready to meet them.</p><p>The Vindicare Temple teaches the assassin the art of patience and the perfection of marksmanship. These stoic assassins are conditioned by their temple to be unflinchingly loyal to the Imperium, often being trained to limit their vocabulary only to words that are useful for their profession, cutting off all emotional attachments to other humans so that they will never hesitate to eliminate any target. The intense training of a Vindicare Assassin enables them to pick out a single target even amongst roving hordes of enemies on the battlefield. In one celebrated (but carefully concealed) engagement, a massed Aeldari assault in the Lammas Campaign was halted by a lone Vindicator Assassin hiding in a ruined tower. The Aeldari advance in the face of this tower was stalled again and again by a hail of deadly sniper fire which slew Exarchs, Warlocks, and</p><p>Page 207</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>VINDICARE ASSASSIN</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">5</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">320</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">OFFICIO ASSASSINORUM</a>, <a class="keyword">TEMPLUM VINDICARE</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 5, Initiative 5, Willpower 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 6, Scholar 1, Stealth 4, Survival 2, Tech 2, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.lriLD6wScDrDDtR0]{Perfect Shot}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.ylgObOcgkQr4aRij]{Exitus Longrifle}, @UUID[Item.1KzLvfhNYDnrBDcR]{Exitus Pistol}, @UUID[Item.TfV2t0cUwiE1Uigr]{Exitus Hellfire Rounds}, @UUID[Item.MKbTqmFXjb0qannH]{Exitus Shield-breaker Rounds}, @UUID[Item.pPus40cp8ayL2tmo]{Exitus Turbo-Penetrator Rounds}, @UUID[Item.mPqfQFOjV5aQL0Uz]{Vindicare Stealth Suit}, @UUID[Item.ju2V5XfrCo6z0Fii]{Vindicare Spy Mask}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">6</td><td style="text-align:center">6</td><td style="text-align:center">6</td><td style="text-align:center">5</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 4, Awareness 4, Ballistic Skill 7, Scholar 1, Stealth 5, Survival 4, Tech 3, Weapon Skill 5</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.s6OMveAvTlOrsUsO]{Deadshot}, @UUID[Item.gM1zenlhkmIMBA5C]{Eliminator}, @UUID[Item.GJUeAkAPhh5uYtlP]{Silent}</td></tr></tbody></table>'
