      content: "<blockquote><p>Damn it, I’m a doctor, not a hive ganger!</p><p style=\"text-align:right\"><em>—— Leonid “Sawbones” M’koi</em></p></blockquote><p><strong>For your sins, you patch up the gangers, guns-for-hire, ne’er-do-wells and anyone else too poor or too far on the wrong side of the law to visit a licensed medicae.\_</strong></p><p>While institutions like the Officio Medicae and the Orders Hospitaller of the Adepta Sororitas tend to the health of planetary populations, armies, and similar, there are always those who fall through the cracks: those who live their lives in places the Imperium does not reach, or who deliberately seek to avoid Imperial attention.\_</p><p>In such places, a skilled ‘doc’ is often well-respected within their communities and the places they travel, simply because their skills are rare and valuable also often means that they can go about their business free from harassment by local gangs, criminal factions, and similar: nobody wants to be cut off from medical aid.</p><table style=\"width:98.9228%;height:239px\" border=\"1\"><tbody><tr class=\"table-header\" style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\">BACK-ALLEY DOC</td></tr><tr style=\"height:16px\"><td style=\"background-color:#484745;color:white;text-align:center;width:26.5674%;height:16px\" colspan=\"2\">TIER</td><td style=\"width:8.3%;height:16px;text-align:center\">1</td><td style=\"background-color:#484745;color:white;width:16.2617%;height:16px;text-align:center\" colspan=\"2\">SPECIES</td><td style=\"width:11.7268%;height:16px;text-align:center\">Human</td><td style=\"background-color:#484745;color:white;width:11.6223%;height:16px;text-align:center\">XP Cost</td><td style=\"width:18.2509%;height:16px;text-align:center\">14</td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>KEYWORDS</strong>: <a class=\"keyword\">SCUM</a>, <a class=\"keyword\">[ANY]</a></td></tr><tr style=\"height:16px;background-color:rgba(0, 0, 0, .2)\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>ATTRIBUTE</strong>: Intellect 3</td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>SKILLS</strong>: Cunning 1, Medicae 1</td></tr><tr style=\"height:16px;background-color:rgba(0, 0, 0, .2)\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.wl9f1QLuHc5jNocU]{Improvised Healing}</td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>WARGEAR</strong>: A @UUID[Compendium.wng-core.items.Item.3X5FaaFcfNmaEod4]{Mono Knife}, @UUID[Compendium.wng-core.items.Item.BpQ1EYnjQP61Edvp]{Stubber} or @UUID[Compendium.wng-core.items.Item.STrmO2xhRZgClDSR]{Laspistol}, common clothing, @UUID[Compendium.wng-core.items.Item.mSS6bpYoQb4KilrW]{Medikit} and 3 uses of @UUID[Compendium.wng-core.items.Item.513qP2VR5xzozMSY]{Stimm}</td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;background-color:rgba(0, 0, 0, 0.2);height:16px\" colspan=\"8\"><strong>INFLUENCE</strong>: +1</td></tr><tr style=\"height:16px\"><td class=\"table-header\" style=\"width:51.1291%;height:16px;text-align:left\" colspan=\"5\"><strong>SUGGESTED ATTRIBUTES</strong></td><td style=\"background-color:#484745;color:white;text-align:center;width:23.3491%;height:16px\" colspan=\"2\">XP Cost</td><td style=\"width:18.2509%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)\">40</td></tr><tr style=\"font-variant:small-caps;height:16px\"><td style=\"background-color:#484745;color:white;width:14.0674%;height:16px\">ATTRITBUTE</td><td style=\"width:12.5%;height:16px;text-align:center\">S</td><td style=\"width:8.3%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)\">T</td><td style=\"width:5.17241%;height:16px;text-align:center\">A</td><td style=\"width:11.0893%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)\">I</td><td style=\"width:11.7268%;height:16px;text-align:center\">Wil</td><td style=\"width:11.6223%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)\">Int</td><td style=\"width:18.2509%;height:16px;text-align:center\">Fel</td></tr><tr style=\"height:16px\"><td style=\"background-color:#484745;color:white;width:14.0674%;height:16px\">RATING</td><td style=\"width:12.5%;height:16px;text-align:center\">2</td><td style=\"width:8.3%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)\">3</td><td style=\"width:5.17241%;height:16px;text-align:center\">2</td><td style=\"width:11.0893%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)\">2</td><td style=\"width:11.7268%;height:16px;text-align:center\">2</td><td style=\"width:11.6223%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)\">3</td><td style=\"width:18.2509%;height:16px;text-align:center\">2</td></tr><tr style=\"height:16px\"><td class=\"table-header\" style=\"width:51.1291%;height:16px;text-align:left\" colspan=\"5\"><strong>SUGGESTED SKILLS</strong></td><td style=\"background-color:#484745;color:white;text-align:center;width:23.3491%;height:16px\" colspan=\"2\">XP Cost</td><td style=\"width:18.2509%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)\">26</td></tr><tr style=\"height:16px\"><td style=\"height:16px;width:92.7291%\" colspan=\"8\">Awareness 1, Cunning 2, Insight 1, Medicae 3, Persuasion 1, Scholar 1, Survival 1, Tech 1</td></tr><tr style=\"height:16px\"><td class=\"table-header\" style=\"width:92.7291%;height:16px\" colspan=\"8\">SUGGESTED TALENTS</td></tr><tr style=\"height:16px\"><td style=\"height:15px;width:92.7291%\" colspan=\"8\">@UUID[Compendium.wng-core.items.Item.VcmG1mBiqXlqruCw]{Deductive}, @UUID[Compendium.wng-core.items.Item.fIy3evnEKxFiNV4j]{Gallows Humour}, @UUID[Compendium.wng-core.items.Item.0sjaRWKLl28HwIpN]{Scum Savvy}</td></tr></tbody></table>"
