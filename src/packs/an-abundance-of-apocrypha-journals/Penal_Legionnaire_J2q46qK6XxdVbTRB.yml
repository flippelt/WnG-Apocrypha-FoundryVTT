      content: '<p>“You''ve just been volunteered for the Last Chancers. For your crimes against the Emperor and humanity you will spend your life in this, the XIII Penal Legion, until such time as you receive the Emperor''s Absolution from the Colonel or the Emperor himself. And of course, the only way you can receive the Emperor''s personal absolution is when you''re dead...” —Sergeant Green, XIII Penal Legion, “The Last Chancers” Convicted of a crime and sentenced to deportation to a Penal Colony, you have since been rounded up to give your life for the Emperor in battle. You still face a life sentence, but it is likely to be much shorter. Because there are many capital crimes in the Imperium, convicted criminals are abundant. For ''petty'' crimes that do not warrant immediate execution or servitorisation, miscreants in the Imperium are sometimes shipped to a nearby Penal World, performing hard labour, serving as test subjects, or being gathered to fight in Penal Legions. The Penal Legions are not self-sufficient armies but are instead attached to other regiments and armies in battle and are useful where greater numbers are necessary to win the day. They are considered expendable, as the Penal Legionnaires’ lives are already forfeit. They are often used to test enemy defences. New ‘recruits’ have their heads shaved and tattooed with unit insignia, and explosive collars are put around their necks. The collars are a disciplinary device rather than a means of turning the troops into human bombs; the blast is directed inwards, killing only the wearer. The collars are controlled by personnel accompanying the force and are detonated only to restore discipline. As well as the collars, Penal troops are sometimes equipped with frenzon dispensers. Troops sentenced to the Penal Legions serve for life. Most die in their very first battle, herded into the enemy gunfire and dying by the hundreds. A few, often hardened killers even before their sentencing, somehow beat these merciless odds and survive</p><p>Page 89</p><p>through numerous battles. In extremely rare cases a penitent might be granted the Emperor''s forgiveness in a way other than dying in battle, by performing some incredible act of battlefield valour. These redeemed men then enter the Imperial Guard as regular Guardsmen.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>PENAL LEGIONNAIRE</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">1</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">8</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ASTRA MILITARUM</a>, <a class="keyword">[REGIMENT]</a>, <a class="keyword">MILITARUM AUXILIA</a>, <a class="keyword">SCUM</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: —</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Ballistic Skill 2, Cunning 1</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.qnMUyGVXtMMvaoNu]{Death Sentence}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.fLx8DzWDgWDZIMSK]{Flak Armour}, @UUID[Item.fPgdC7ur85iRGKgh]{Lasgun}, 1d3 + 1 knifes, @UUID[Item.mOWPCO1mNXNKsGNa]{Munitorum-Issue Mess Kit}, Blanket, @UUID[Item.vsjZCbjBNivbeUhk]{Ration Packs}, @UUID[Item.fFBqCsrC9TyLoSjE]{Frenzon}, @UUID[Item.L6Of4gjve0yOYi9u]{Explosive Collar}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">1</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 1, Ballistic Skill 2, Cunning 2, Survival 2, Weapon Skill 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.3uI0Gw1jMR7J0GG6]{Brutalist}, @UUID[Item.jlrOP1uvd0x0VRiK]{Death Or Glory!}, @UUID[Item.fIy3evnEKxFiNV4j]{Gallows Humour}</td></tr></tbody></table>'
