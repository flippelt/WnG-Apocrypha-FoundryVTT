      content: >-
        <blockquote><p>Nobody is innocent, there are merely varying levels of
        guilt.</p></blockquote><p><strong>A law enforcement officer, sworn to
        uphold the rule of your world’s Imperial Commander. This
        might.</strong></p><p>Many worlds have their own cadres of Enforcers,
        local law enforcement agencies provided by the Imperial Commander to
        enforce their will and the common law of their world. Unlike the mighty
        Arbitrators, most Enforcers, or whatever other local title they use,
        hold little loyalty to the law itself or to the tradition of service
        (although there are notable exceptions to this).</p><p>These native
        Enforcers often mimic the Arbites in appearance and armament, but their
        local ties and often less rigorous standards mean that they are far more
        susceptible to corruption. The objectives of local Enforcers and
        Imperial Arbitrators often overlap, and the two groups work in
        conjunction when it is mutually beneficial. However, there are also
        occasions when they come into direct conflict</p><p>For their local
        knowledge and useful skills, Enforcers deemed trustworthy are often
        deputised by the Adeptus Arbites or the Inquisition.</p><table
