      content: >-
        <blockquote><p>The void is wealth. The void is freedom. I reject the
        tightly-bound chords of the Path. I reject the pettiness of Commorite
        politics. I reject the plain frugality of the Exodites. I reject the
        masks of the clown and mime. I most certainly reject death. The stars
        belonged to my ancestors. Thus they belong to me. Thus, I go where I
        will, take what I will, and kill whom I will.</p><p
        style="text-align:right"><em>——Lady Hale’drithea of the Black
        Suns</em></p></blockquote><p><strong>You are a piratical raider, living
        a life of adventure and freedom amongst the stars your ancestors once
        claimed. Whatever walk of life you belonged to before, you are a reaver
        of the void now.</strong></p><p>Corsairs, known as Anhrathe in the Eldar
        tongue, are those Eldar who seek freedom above all else. They are
        thrill-seekers, pursuing adventure, glory, and riches above all else,
        eschewing the discipline of the Asuryani Path, or the depravity of the
        Drukhari, or any other of the distinct fragments that Aeldari society
        has fragmented into.</p><p>Corsairs hail from all parts of Aeldari
        society. Outcasts from the Craftworlds, Drukhari from Commorragh,
        Exodites from the edges of the galaxy, and more besides. Some sought the
        Corsair life for freedom, others were exiled and found it by necessity,
        while others succumbed to nihilism and have embraced selfindulgence over
        the futile struggle against oblivion.</p><p>Corsairs garb themselves
        outlandishly, showing off the spoils of their raids in ostentatious
        displays of finery, yet for all their excess, they are agile and
        creative warriors, often with centuries of experience and subtle psychic
        abilities to call upon.</p><p>The Craftworlds often hold the Anhrathe at
        arm’s length, content to employ them as privateers, but illat-ease with
        way the Corsairs’ reckless freedom clash with Asuryani discipline.
        Similarly, some Anhrathe maintain trade and political relationships with
        Drukhari Kabals, even joining them on realspace raids, but are always
        wary of the insatiable hunger for agony the Drukhari
        possess.</p><p><em>This Archetype has been designed to work with
        characters of either Aeldari or Drukhari species.</em></p><table
