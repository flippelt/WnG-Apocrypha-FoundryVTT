      content: <p>“Objective in sight. I count 13 hostiles. Aevar, prepare to deploy smoke. The rest of you, preysight and mark targets. On my mark…" —Incursor Sergeant Kasovar Septyn, Raven Guard You fight deep behind enemy lines, often for extended periods, undermining enemy infrastructure, sabotaging communications, and attacking other opportune targets.</p><p>Known as Helix Adepts, these warriors receive additional training from the Apothecarion, and stand ready to ascend to the rank of full Primaris Apothecary should a tragic loss occur.</p><p>Clad in Mark X Phobos Armour, Infiltrators are responsible for disrupting enemy communications and sabotaging targets of opportunity. Their back-mounted Omni-Scramblers intercept signals across a broad spectrum, scrambling frequencies and shutting down enemy communications. When the time comes for the Infiltrators to fight directly, they emerge from their hiding places under cover of smoke grenades and cut down their foes with disciplined volleys from their marksman Bolt Carbines.</p><p>PRIMARIS VANGUARD INCURSOR</p><p>Infiltrators are drilled extensively in survival and selfsufficiency techniques due to the long lengths of time they spend behind enemy lines. Some squads have their own medicae specialists to perform the sacred duty of recovering the gene-seed of fallen brothers.</p>
