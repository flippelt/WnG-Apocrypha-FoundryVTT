pages:
  - name: Custodian
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <p>Where one thinks of the gene-forged warriors of the Imperium, one
        might imagine the Adeptus Astartes and their new Primaris Astartes
        brethren, and the demigod Primarchs who came before them. But they are
        far from the only warriors the Emperor created. The Emperor’s personal
        retinue, the Custodian Guard, were the result of refined gene-sculpting
        and alchemical engineering long before the Primarchs were created, and
        their design was perfected even then.</p>

        <p>Each Custodian is a unique creation. Each of them towers above even
        the Astartes and are said to have been almost as large as the Primarchs
        themselves, and their physical power and martial prowess exceed that of
        nearly any individual Space Marine. Yet they are not only enhanced on
        the physical level: their minds are as carefully wrought as their
        bodies.</p>

        <p>Each Custodian has a mighty intellect, with keen senses and an
        enhanced ability to process and understand information. Each is as much
        a scholar and a philosopher as a warrior, entrusted with secrets of the
        universe that the Emperor shared with few others, and engineered to be
        purely devoted to their duty to the Master of Mankind. They are
        profoundly vigilant, maintaining a perfect awareness of any threat to
        the Emperor, and they continually seek to refine their knowledge, hone
        their skills, and master themselves even more fully so that they do not
        fail in their duty again.</p>

        <h5><strong>Custodian Names</strong></h5>

        <p>The Custodes have an unusual relationship with names. Their original,
        true names, the ones which they bore at birth, are secret, recorded
        nowhere. Instead, each Custodian answers to a name of their choosing,
        often some moniker of note from Terran history or legend. Each accepts
        additional names throughout their lives, etched microscopically within
        their armour as a testament to their accomplishments; the mightiest
        Custodians may have dozens, even hundreds of names. Examples
        include:</p>

        <p>Tybalus, Aetheus, Dalat, Kariyan, Basillaeus, Tristraen, Erasmian,
        Heracal, Tauramacchis, Nurthias, Hasturias, Artoris, Nathadian, Io,
        Harkhas, Constantin, Eratorius, Archimallus.</p>

        <h3><strong>Playing a Custodian</strong></h3>

        <p>If you wish to play a Custodian character, use the following species
        entry.</p>

        <p><strong>XP Cost:</strong> 330</p>

        <p><strong>Attributes:</strong> Agility 5, Fellowship 3, Initiative 5,
        Intellect 3, Strength 6, Toughness 6, Willpower 3</p>

        <p><strong>Skills:</strong> Athletics 4, Awareness 5, Ballistic Skill 4,
        Insight 3, Scholar 2, Stealth 3, Weapon Skill 4</p>

        <p><strong>Speed:</strong> 7</p>

        <p><strong>Aegis of the Emperor:</strong> A Custodian may roll
        Determination against Mortal Wounds. Indomitable, Incorruptible: You add
        +2 to your Resolve, and you automatically succeed on all Corruption
        Tests. Your Maximum Wounds are increased by +4.</p>

        <p><strong>Solitary:</strong> A Custodian maintains a unique pool of
        Glory. They may save up to 3 points of Glory, and they cannot save
        points into the group pool nor can they spend Glory generated by anyone
        else.</p>

        <p><strong>Despised by the Unholy:</strong> If a Custodian is present in
        a game, the GM’s starting and maximum Ruin are increased by 1.</p>

        <h5><strong>Additional Details </strong></h5>

        <p><strong>Age:</strong> Custodes are functionally immortal and will
        persist for centuries or millennia if not slain through extreme
        violence. If you’re randomly rolling for a Custodian character’s age,
        roll 4d6 x 5, and then multiply the total by the game’s Tier.</p>

        <p><strong>Colouration:</strong> As transhumans, Custodians possess a
        similar range and variety of skin pigments, hair colours, and eye
        colours to baseline humans.</p>

        <p><strong>Height:</strong> Custodians typically stand taller than the
        Astartes and are close in height to the Primarchs of old. If you’re
        randomly rolling a Custodian character’s height, roll 8’ +2d6”.</p>

        <p><strong>Languages:</strong> The Custodians speak Low Gothic and High
        Gothic and are often fluent in numerous obscure historical human
        languages, as well as other forms of communication, including the
        Thoughtmark and Battlemark sign languages used by the Silent Sisterhood,
        and Astartes battle-sign.</p>
