      content: '<p>"To defeat the Daemon, you must hate the Daemon. To hate the Daemon, you must know the Daemon. To know the Daemon is to know madness." — Banisher Proverb Yours is a solemn burden. When most of the Priesthood speak of The Enemy as a figurative, spiritual peril, you know the truth. You have seen the truth of the daemon, and you have learned to combat it as best you can. With the purity of your hate and your scorn, you drive the daemon out, banishing them to the hells from whence they came. In the eternal battle against Chaos, faith and knowledge are weapons. Few servants of the Throne wield these weapons with greater solemnity than the Banisher. Whether stalking the darkest halls of a hive city''s Librarium in search of omens or enacting the Rites of Dispossession on the fields of battle, daemonic lore is vitally important to these rare and specialised priests. Banishers, also known as Exorcists and Black Priests, are those who have learned to combine their faith and their zeal with forbidden knowledge in order to combat daemons. Such knowledge is normally a deathsentence to know—if the knowledge itself does not inflict madness and corruption, the Inquisition routinely purges those who know things they should not—but many in the Ordo Malleus find Banishers to be invaluable assets, sponsoring orders of Banishers within the Ecclesiarchy across the Imperium. Though most Banishers are chosen at a young age to be trained by the Ecclesiarchy, not all Banishers are trained by the Ministorum. On many Feudal Worlds or Feral Worlds, the wise steel themselves to study that which dwells in the dark, seeking wisdom to help them vanquish Warp-spawned entities. While these elders are not usually steeped in the doctrines of the Ecclesiarchy, they are no less devout believers in the Imperial Creed and can be quite useful in rooting out long-forgotten omens and ancient secrets in Imperial archives. Many Inquisitors have also been known to train Banishers to combat specific daemons.</p><p>Page 103</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>BANISHER</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">50</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS MINISTORUM</a>, <a class="keyword">PRIEST</a>, <a class="keyword">INQUISITION</a>, <a class="keyword">[ORDO]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 4, Fellowship 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Intimidation 3, Persuasion 3, Scholar 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.U3jyFFquO728rt3m]{Litany of Purity}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.telJRS8B2dxA7ILp]{Flamer}, @UUID[Item.wTb88ILg6JQZ5l7H]{Blessed Promethium}, one melee weapon of up to Value 7 and a rarity of up to Rare, with the Sanctified upgrade, @UUID[Item.jnVZtGvELjLaLy9a]{Sanctified}, @UUID[Item.hTdCHo9SWzaZPxXh]{Rosarius}, @UUID[Item.drUoIw7l4vPyI9Zm]{Knife}, @UUID[Item.vZp4dj9eXhFcVwOB]{Ministorum Robes (Clothing)}, @UUID[Item.jJVaniinuX8Hjh08]{Symbol of Authority}, @UUID[Item.ykJiMSVm8muqdrHp]{Missionary Kit}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="backgr