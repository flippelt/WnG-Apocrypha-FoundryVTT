      content: '<p>“You get more with a kind word and an Excruciator than with just a kind word.” --Inquisitor Malden You are a student of anatomy and biology, turning your skills both to healing the servants of the Throne, and to studying the methods and forms of the enemy. Chirurgeons are medical and anatomical specialists from a variety of organisations within the Imperium, such as in Astra Militarum field hospitals, or the Officio Medicae. The Officio Medicae is the office of the Administratum that deals with public health and medical-related issues in the Imperium, operating medical facilities throughout the Galaxy—often in conjunction with the Orders Hospitaller of the Adepta Sororitas—and monitoring the spread and containment of disease on many Imperial worlds.</p><p>In some cases, under careful watch for corruption, they even learn the intricacies of Xenos anatomy and genetics, and the ways that the mutating influence of Chaos can affect human biology.</p><p>Some particularly talented Chirurgeons serve in the retinues of Inquisitors, specialising not only in the art of healing but also the art of repentance, interrogation, and the yielding of information through torture. Knowing the intricacies of human anatomy, they know the exact amount of punishment they can inflict on their subjects before it expires. They can inflict the maximum amount of pain for the least amount of effort, and then nurse their subject''s shattered body back to health to begin the process again.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>CHIRURGEON</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">99</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">INQUISITION</a>, <a class="keyword">[ORDO]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 3, Intellect 5</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 2, Investigation 2, Medicae 5, Scholar 3, Tech 2, Weapon Skill 1</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.wPpQP9z6rsuUuQux]{Morbid Expertise}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.3X5FaaFcfNmaEod4]{Mono Knife}, @UUID[Compendium.wng-core.items.Item.8Ms9swxyPUJJeh7C]{Needle Pistol}, @UUID[Compendium.wng-core.items.Item.alCEdr91k6ttGBw9]{Bodyglove}, @UUID[Compendium.wng-core.items.Item.eVKhnZo0ekm7DobY]{Diagnostor}, @UUID[Compendium.wng-core.items.Item.zAGF6bxtsk4sbyao]{Chirurgeon’s Tools}, @UUID[Compendium.wng-core.items.Item.513qP2VR5xzozMSY]{Stimm}, @UUID[Compendium.wng-core.items.Item.513qP2VR5xzozMSY]{Stimm}, @UUID[Compendium.wng-core.items.Item.513qP2VR5xzozMSY]{Stimm}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align: