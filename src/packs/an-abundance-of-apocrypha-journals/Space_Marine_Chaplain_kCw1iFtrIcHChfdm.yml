      content: '<p>"We fight to protect the spiritual and physical heart of our Chapter. That, surely, is worth shedding blood." Chaplain Braknum, of the Raven Guard, in defence of the Altmorr Massacre You are a priest and spiritual leader for your Chapter’s cult, tending to the spiritual wellbeing of your battlebrothers and urging them to glory. Each Chapter has its own unique cult, which is often thousands of years old. As these cults often predate the rise of the Ecclesiarchy, the Chapter cults are not simply facets of the common Imperial Cult. While the Ecclesiarchy and its followers worship the Emperor of Mankind as a deity, most Chapter cults regard him as merely their master and forebear, though with scarcely less reverence. The chapter''s own Primarch is also a major part of the Chapter''s specific cult, revered as much as the Emperor.</p><p>A formal sign of entente between the Ecclesiarchy and the Space Marines is the Rosarius, a holy symbol, taking the form of a necklace, amulet or brooch which often displays the Imperial Eagle or the Crux Terminatus, or other shapes to suit the particular devotional qualities of the Chapter concerned. Gifted to Space Marine Chaplains by the Ecclesiarchy, this blessing represents the brotherhood of the Imperial Faith and formally marks the continuance of religious concord between the two groups. In practice, though, the link between the organisations remains rather tenuous. Chaplains may purchase Litanies of Devotion, found later in this manuscript.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>SPACE MARINE CHAPLAIN (APOCRYPHA VERSION)</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">1</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Adeptus Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">312</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTARTES</a>, <a class="keyword">[CHAPTER]</a>, <a class="keyword">PRIEST</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 5, Initiative 5, Willpower 4, Intellect 3, Fellowship 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 3, Intimidation 2, Leadership 1, Persuasion 4, Scholar 2, Stealth 3, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.fK8sd404ST5UmcAO]{Spiritual Leader}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.7Bp1rDIfKEB2MB9N]{Aquila Mk VII}, @UUID[Compendium.wng-core.items.Item.7b2xcPWBB7up65PM]{Bolt Pistol}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.61bitSrtHLdkg1nv]{Crozius Arcanum}, @UUID[Compendium.wng-core.items.Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Compendium.wng-core.items.Item.SJ8UaYHEMtF71W1M]{Krak Grenade}, @UUID[Compendium.wng-core.items.Item.hTdCHo9SWzaZPxXh]{Rosarius}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="