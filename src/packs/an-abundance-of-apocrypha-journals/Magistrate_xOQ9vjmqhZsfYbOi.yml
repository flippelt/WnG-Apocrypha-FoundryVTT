      content: '<p>“Claims of innocence mean nothing; they serve only to prove a foolish lack of caution.” — Judge Traggat, Selected Sayings, Vol. III, Chapter IV You are a servant of the Lex Imperialis, sworn to uphold the letter of the Law at all times, and in all places. You pass Judgement in the Emperor’s Name upon those who would undermine the Imperium.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>MAGISTRATE</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">70</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ARBITES</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 3, Intellect 3, Fellowship 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Insight 2, Intimidation 2, Investigation 2, Scholar 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.NdfDYDXpGoXTHCop]{Cast Judgement}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.Ru3JSdSw8LOCd3z8]{Flak Coat}, @UUID[Item.BpQ1EYnjQP61Edvp]{Stubber}, @UUID[Item.YpCzpRX37328Md1h]{Auto-Quill}, @UUID[Item.9406td13uMAaKNmc]{Data-Slate}, @UUID[Item.qRC8vHhJWuKSvOrj]{Book of Judgement (Abridged)}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:cente