      content: '<p>"The creatures of realspace are so possessive of their flesh, hiding it from their peers and betters beneath skin and armour. The same is true of their bones, which they are quick to mend when broken. How tedious an existence they must lead, bound to one form forever. That is, of course, until I find them, and introduce them to a life of ever-changing torment." —Exen Bal''reyn, Wrack of the Coven of Twelve You are a servant of a Haemonculus, a willing subject of your master’s experiments and a gleeful assistant in their craft. You have transcended the limitations you were born with, and you aspire someday to become something far greater. Every ruler needs obedient servants, and Wracks are literally fashioned for the task. Known in some circles as "Haemacolytes," each Wrack''s sole duty is to dutifully serve their master, whether at the slab or upon the battlefield. To this end they are physically modified to better perform their gory duties. Within the Wrack''s surgically enhanced frame lies a shocking strength, and in combat they lay about themselves with a variety of sickled blades, corrosive whips, stun-rods and silvered hooks. Because Haemonculi tend towards megalomania or even delusions of godhood, they surround themselves with supplicants and minions to enact their orders. In fact, most Haemonculi prefer not to sully themselves with physical labour of any kind and consider themselves somehow polluted if they have to exert themselves in any way. Instead, the dirty work of each Haemonculus is performed by his Wracks. Most Wracks hope to one day transcend their previous lives entirely—a Wrack will endure almost any degradation in the hope that they may eventually ascend to the ranks of the Coven lords. A typical scene in the oubliettes and laboratories of the Haemonculi is a single figure looming over a partially dissected victim whilst hunched Wracks scrabble to enact every disturbing command.</p><p>Page 96</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>WRACK</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">1</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Drukhari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">48</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">[COVEN]</a>, <a class="keyword">DRUKHARI</a>, <a class="keyword">HAEMACOLYTE</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 4, Toughness 3, Agility 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Intimidation 2, Medicae 2, Weapon Skill 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.OnNghEtbDMwo4gIb]{Insensible to Pain}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.jwhZEz55iwDJQeNa]{Gnarlskin}, @UUID[Item.EVbXne3acZaVegdV]{Wrack Blades}, @UUID[Item.22vKcISQfWYT89J7]{Haemacolyte’s Tools}, Any one Augmetic with the DRUKHARI keyword and a rarity of up to Rare</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Deception 1, Insight 1, Intimidation 2, Weapon Skill 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.6RTgC3gWnsqYdLm5]{Power Through Pain}, @UUID[Item.26UYjRZ4VBoL1EyC]{Blood Must Flow!}, @UUID[Item.kpAn3XZjjS07M0Zi]{Furious Charge}</td></tr></tbody></table>'
