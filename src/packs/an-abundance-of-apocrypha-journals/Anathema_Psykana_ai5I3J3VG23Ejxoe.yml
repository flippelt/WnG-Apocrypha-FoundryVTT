  - name: Anathema Psykana
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: "<p>The Sisters of Silence are an all-female order of Imperial Witch Hunters tasked with hunting down rogue psykers and other psychic threats across the galaxy.</p>\n<p>The Silent Sisterhood was most active during the time of the Great Crusade in the late 30th and early 31st Millennia. In the wake of the Horus Heresy, they vanished almost entirely from the Imperium, and the order was wrongfully believed to have been disbanded.</p>\n<p>Yet the Sisters of Silence have recently returned to prominence in the Imperium of Man following the birth of the Great Rift and the start of the Era Indomitus.</p>\n<p>The Sisters of Silence's original purpose was to hunt and kill rogue human psykers whose activities presented a terrible danger to the people of the newborn Imperium of Man and to oversee the tithe of psykers from every Imperial world to Terra</p>\n<p>Each one of the warriors of this order are psychic Nulls, a soulless being who inspires dread wherever they walk. The Sisters of Silence's primary base of operations was the Somnus Citadel on Luna, the moon of Terra, which was maintained by the ancient Selenite Cults of gene-engineers who had long governed that world</p>\n<p>As Guilliman's Indomitus Crusade took shape and the first fleets were mustered, bands of Silent Sisters converged on Terra from every direction. Each isolated group had met different challenges through the generations, diverging to overcome them as necessity dictated. The tactics, characters, and traditions of each group were far removed from each other, but their collective sense of duty was undimmed.</p>\n<p>The hosts of Silent Sisters upon Terra eventually numbered near three thousand, and Guilliman declared them the Vigil Indomitus. They would be the first in a spreading network of vigils throughout the Imperium, each granted the explicit authority to carry out their ancient duties. The Vigil Indomitus divided into cadres, with each joining the battle groups of the Indomitus Crusade fleets.</p>\n<p>There had once been a large population of Sisters of Silence during the Great Crusade and the Horus Heresy. Though numerous enough to play a role in the War of the Beast a thousand standard years after the end of the Heresy, by the late 41st Millennium they had dwindled almost to extinction. The militant orders of the Emperor's day had been disbanded, diminished, or lost to war.</p>\n<p>The last surviving few were scattered around the Imperium, most reduced to a handful of members. They had fought on, here and there, but their glory days were a myth at best. They were unremembered by the people they had died to protect.</p>\n<p>But after thousands of standard years of obscurity, when Guilliman returned, the Sisters of Silence came back willingly into the light, not because of who he was, but because of what he was. To them, the Primarch was a Living Saint.</p>\n<p>No longer centralised within the vast spire-convents of Luna, the Sisterhood has recently re-established a presence in every Segmentum, forming many new orders and offshoots. Some are charged with specific duties -- such as infiltrating the hyperspatial tunnels of the Webway to stymie the plans of psychic xenos races, recovering Pariahs from enemy forces that seek to use them for their own gain, or neutralizing spectral attacks in strategically vital locations.</p>\n<p>Others have carte blanche to pursue their own agendas, provided they culminate in the destruction of the Archenemy's forces. If there is any quality these genetic deviants share in abundance, it is self-reliance.</p>\n<blockquote class=\"sidebar\">\n<h3>Vow of Tranquility</h3>\n<p>Each Sister swears an oath of silence known as the Vow of Tranquility upon being nominated for Sisterhood; before this, when they are novices, they are allowed to converse normally. Amongst their other duties novices sometimes act as interpreters between senior Sisters and other agents of the Imperium.</p>\n<p>Thoughtmark is one of the symbolic sign languages employed by the Silent Sisterhood. Full of delicate gestures of finger and thumb, it served to convey concepts of great subtlety or intricate nature.</p>\n<p>Battlemark was the command sign language used by the Sisters to communicate on the battlefield. The gestures used to communicate in Battlemark were large, sharp motions that enabled a person to convey their thoughts in line of sight and can be seen at extreme ranges.</p>\n<p>The Silent Sisterhood maintained fluency in numerous other forms of gestural and non-verbal linguistic communication such as voidsys and graph-binarc for conversing with other military forces of the Imperium directly when the need arose. They once maintained familiarity with Astartes Battle-Sign, but that was millennia ago.</p>\n</blockquote>\n<table style=\"width:99.1477%;height:1018px\" border=\"1\">\n<tbody>\n<tr style=\"height:17.7875px\">\n<td style=\"width:99.9446%;height:17.7875px;text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\">ANATHEMA PSYKANA ARCHETYPES</td>\n</tr>\n<tr style=\"height:17.7875px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.4931%;height:17.7875px\">Tier</td>\n<td style=\"width:64.5212%;height:17.7875px\">Archetype</td>\n<td style=\"width:22.9303%;height:17.7875px\">Description</td>\n</tr>\n<tr style=\"height:70.4px\">\n<td style=\"width:12.4931%;text-align:center;height:70.4px\">3</td>\n<td style=\"width:64.5212%;height:70.4px\">\_Sisters of Silence Null-Maiden</td>\n<td style=\"width:22.9303%;height:70.4px\">A pariah trained and honed as a deadly hunter of witches.</td>\n</tr>\n<tr style=\"height:86.9125px\">\n<td style=\"width:12.4931%;height:86.9125px;text-align:center\">4</td>\n<td style=\"width:64.5212%;height:86.9125px\">\_Sisters of Silence Oblivion Knight</td>\n<td style=\"width:22.9303%;height:86.9125px\">Elite warriors of the Silent Sisterhood, hunting the mightiest of witches and daemonic foes.</td>\n</tr>\n<tr style=\"height:32.225px\">\n<td style=\"width:99.9446%;height:32.225px;text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\">\n<p>ANATHEMA PSYKANA BACKGROUNDS</p>\n</td>\n</tr>\n<tr style=\"height:17.7875px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.4931%;height:17.7875px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.5212%;height:17.7875px\">Origin</td>\n<td style=\"width:22.9303%;height:17.7875px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:52.8625px\">\n<td style=\"width:12.4931%;height:52.8625px;text-align:center\">1</td>\n<td style=\"width:64.5212%;height:52.8625px\"><strong>Persecuted:\_</strong> From a young age, you survived despite being regarded with dread and revulsion by all who met you. When hunting rumours of a witch, the Sisterhood found you instead.</td>\n<td style=\"width:22.9303%;height:52.8625px;text-align:right\">Determination</td>\n</tr>\n<tr style=\"height:87.9375px\">\n<td style=\"width:12.4931%;height:87.9375px;text-align:center\">2</td>\n<td style=\"width:64.5212%;height:87.9375px\"><strong>Bloodline:</strong>\_It is believed that you came from a bloodline engineered since the dawn of the Imperium to produce Pariahs for the Sisterhood</td>\n<td style=\"width:22.9303%;height:87.9375px;text-align:right\">Max Wounds</td>\n</tr>\n<tr style=\"height:70.4px\">\n<td style=\"width:12.4931%;height:70.4px;text-align:center\">3</td>\n<td style=\"width:64.5212%;height:70.4px\"><strong>Happenstance: </strong>Though frequently alone in life, you made something of yourself, until the extent of your powers were noticed.</td>\n<td style=\"width:22.9303%;height:70.4px;text-align:right\">Max Shock</td>\n</tr>\n<tr style=\"height:17.7875px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.4931%;height:17.7875px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.5212%;height:17.7875px\">Accomplishment</td>\n<td style=\"width:22.9303%;height:17.7875px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:52.8625px\">\n<td style=\"width:12.4931%;height:52.8625px;text-align:center\">1</td>\n<td style=\"width:64.5212%;height:52.8625px\"><strong>Witch-Bane:</strong> Your skills and powers proved instrumental in defeating a coven of witches or a powerful sorcerer.</td>\n<td style=\"width:22.9303%;text-align:right;height:52.8625px\">Conviction</td>\n</tr>\n<tr style=\"height:77.475px\">\n<td style=\"width:12.4931%;height:77.475px;text-align:center\">2</td>\n<td style=\"width:64.5212%;height:77.475px\"><strong>Hunter:</strong> You spent months, even years, tracking your quarry. You eventually triumphed, though it required all of your skill and cunning</td>\n<td style=\"width:22.9303%;text-align:right;height:77.475px\">Passsive Awaraness</td>\n</tr>\n<tr style=\"height:70.4px\">\n<td style=\"width:12.4931%;height:70.4px;text-align:center\">3</td>\n<td style=\"width:64.5212%;height:70.4px\"><strong>Anathema:</strong>When all around you were overrun by daemons and the forces of the Ruinous Powers, you stood your ground, unaffected by the warp-spawned horror, and drove it back.</td>\n<td style=\"width:22.9303%;text-align:right;height:70.4px\">Resolve</td>\n</tr>\n<tr style=\"height:17.7875px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.4931%;text-align:center;height:17.7875px\">[[/r d3]]</td>\n<td style=\"width:64.5212%;height:17.7875px\">Goal</td>\n<td style=\"width:22.9303%;text-align:right;height:17.7875px\">Gain +1</td>\n</tr>\n<tr style=\"height:61.8625px\">\n<td style=\"width:12.4931%;text-align:center;height:61.8625px\">1</td>\n<td style=\"width:64.5212%;height:61.8625px\"><strong>Reclaim:</strong> You’ve been charged with retrieving old strongholds or technologies of the Silent Sisterhood, or seeking out new recruits to restore the order’s old numbers</td>\n<td style=\"width:22.9303%;text-align:right;height:61.8625px\">Wealth</td>\n</tr>\n<tr style=\"height:52.8625px\">\n<td style=\"width:12.4931%;text-align:center;height:52.8625px\">2</td>\n<td style=\"width:64.5212%;height:52.8625px\"><strong>Vigilant:</strong>You are part of a newly established Vigil, standing guard over a region of space to secure it from psychic or daemonic threats.</td>\n<td style=\"width:22.9303%;text-align:right;height:52.8625px\">Resolve</td>\n</tr>\n<tr style=\"height:52.8625px\">\n<td style=\"width:12.4931%;text-align:center;height:52.8625px\">3</td>\n<td style=\"width:64.5212%;height:52.8625px\"><strong>Vigil Indomitus:</strong> You were stationed upon one of the ships of the Indomitus Crusade, helping the crusaders return light to the darkness, facing some of the heaviest fighting.</td>\n<td style=\"width:22.9303%;text-align:right;height:52.8625px\">Max Wounds</td>\n</tr>\n<tr style=\"height:17.7875px;background-color:#484746;color:#dddddd\">\n<td style=\"width:99.9446%;text-align:center;height:17.7875px;background-color:#752322;color:#dddddd\" colspan=\"3\">ANATHEMA PSYKANA OBJECTIVES</td>\n</tr>\n<tr style=\"height:17.7875px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.4931%;text-align:center;height:17.7875px\">[[/r d6]]</td>\n<td style=\"width:87.4516%;height:17.7875px\" colspan=\"2\">Objective\_</td>\n</tr>\n<tr style=\"height:17.7875px\">\n<td style=\"width:12.4931%;text-align:center;height:17.7875px\">1</td>\n<td style=\"height:17.7875px;width:87.4516%\" colspan=\"2\">\_Wield your dread presence and fearsome reputation in a social situation</td>\n</tr>\n<tr style=\"height:17.7875px\">\n<td style=\"width:12.4931%;text-align:center;height:17.7875px\">2</td>\n<td style=\"height:17.7875px;width:87.4516%\" colspan=\"2\">\_Demonstrate the superiority of your order’s traditions and techniques</td>\n</tr>\n<tr style=\"height:35.325px\">\n<td style=\"width:12.4931%;text-align:center;height:35.325px\">3</td>\n<td style=\"height:35.325px;width:87.4516%\" colspan=\"2\">\_Express gratitude for the Emperor’s wisdom and protection</td>\n</tr>\n<tr style=\"height:17.7875px\">\n<td style=\"width:12.4931%;text-align:center;height:17.7875px\">4</td>\n<td style=\"height:17.7875px;width:87.4516%\" colspan=\"2\">\_Use your keen skills of observation to pass judgement upon an individual you’ve just met</td>\n</tr>\n<tr style=\"height:17.7875px\">\n<td style=\"width:12.4931%;text-align:center;height:17.7875px\">5</td>\n<td style=\"height:17.7875px;width:87.4516%\" colspan=\"2\">\_Be confronted by hostility or fear because of your Pariah nature</td>\n</tr>\n<tr style=\"height:17.95px\">\n<td style=\"width:12.4931%;text-align:center;height:17.95px\">6</td>\n<td style=\"height:17.95px;width:87.4516%\" colspan=\"2\">\_Face communications difficulties because of your Vow of Tranquility.\_</td>\n</tr>\n</tbody>\n</table>"
