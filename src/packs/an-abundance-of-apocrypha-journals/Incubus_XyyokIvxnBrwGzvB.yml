    text:
      format: 1
      content: '<p>“The blade that I wield is an extension of myself, as I am an extension of my blade. We both thirst for blood. We both seek only murder. Only in death do we find purpose in life.” —Klaivex Khyrassos, the Brotherhood of the Void You are the killing strike, the decapitating blow. You are the edge of the blade, the momentum of the swing. You do not tarnish your prowess with mercy, nor impair yourself with thoughts of honour. The Incubi are an order of faceless warriors, masters in the use of the long-bladed weapon known as the Klaive. Everything about a fully armoured Incubus conveys menace. His armour is spiked and segmented from top to toe, and his ornate helm is framed by a pair of great razored horns that lend him an almost daemonic aspect. Incubi possess a sinuous and sinister grace, and each of their movements sings with their barely suppressed potential for violence. Their every waking moment is dedicated to the absolute perfection of their craft—that of killing as frequently and as cruelly as possible with their ritual weapon.</p><p>Commorragh. Some believe Arhra to be Drazhar, the Master of Blades, the greatest of the Drukhari Incubi. The Incubi do not swear allegiance to any specific Kabal or Wych Cult, as servants of Khaela Mensha Khaine, their loyalty is first and foremost to their war-shrine, an aspect in which they are eerily similar to the Craftworld Aeldari Aspect Warriors. There are dozens of Incubi shrines dotted throughout the Dark City, from towering pinnacles of black crystal to labyrinthine networks of brazier-lit caverns. While the smallest of these shrines may play host to no more than a handful of Incubi— taking the form of a central shrine surrounded by the trophy-hung cells of the Incubi who train there—the larger shrines are rather more spectacular.</p><p>In this way the Incubi echo the Aspect Warriors of their Craftworld kin, supplanting purity of purpose with twisted obsession, and icy calm with channelled hate. It is believed that the very first Incubus was the first Phoenix Lord of the Striking Scorpions Aspect Warriors, Arhra, the "Father of Scorpions," now usually referred to as the "Fallen Phoenix," who fell to the service of Slaanesh by walking the Path of Damnation and joined the Drukhari. Arhra became the first Hierarch of the Incubi and created the first Incubus Shrine in the Dark City of</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>INCUBUS</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Drukhari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">102</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">DRUKHARI</a>, <a class="keyword">INCUBUS</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Agility 4, Willpower 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 2, Intimidation 2, Weapon Skill 5</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.kBdsY99CG85TsLo8]{Lethal Precision}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.jFmaqDyaQGaw5wC3]{Incubus Warsuit}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.nrsumOyZTZUPnwLA]{Klaive}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T