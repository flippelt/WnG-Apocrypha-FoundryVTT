      content: '<p>“The past decays, no matter how hard you work to preserve it. It is time for the Imperium to look forward again.” — Roboute Guilliman, Lord Commander of the Imperium, to Fabian Guelphrain, Historitor You were selected by the Imperial Regent, by the Emperor’s Avenging Son, to sift through the fragmented history of the Imperium, attempting to piece together some understanding of the truth. Such a grand purpose comes with a measure of the Primarch’s own authority. Chosen by the Primarch Roboute Guilliman himself, Historitors are scholars and researchers charged with cataloguing and preserving the history of the Imperium, as well as investigating and uncovering any historical events or artifacts that may hold significance for the current day. Historitors are highly educated and trained in a variety of disciplines, including archaeology, history, linguistics, and psychology. They often work alongside Imperial Guard units and other Imperial organizations in their missions to uncover lost knowledge and artifacts.</p><p>who view them as impractical and wasteful, or even heretical for the way they challenge long-established orthodoxy. In particular, they are known to run afoul of agents of the Inquisition and the Administratum, whose efforts concealed the history the Historitors seek to uncover. Despite this, they continue to play a crucial role in recovering knowledge of the Imperium’s past, and their work is essential to the Primarch. In their work, Historitors often encounter dangerous and unknown artifacts, relics of long-forgotten civilizations, and other threats to the stability of the Imperium. Despite these dangers, they remain dedicated to their work and the preservation of the Imperium''s history and culture. While scholars first and foremost, they are often trained and equipped to face dangerous situations and may often be accompanied by an entourage of assistants and bodyguards.</p><p>Despite their importance to the Imperium, Historitors are not well-regarded by many within the Imperium,</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>HISTORITOR-INVESTIGATUS</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">70</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">LOGOS HISTORICA VERITA</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 3, Intellect 3, Fellowship 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 2, Investigation 2, Persuasion 2, Scholar 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.fNXi6ZZgbR0hENy1]{Intensive Research}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.Gkvz8V1xP8wrBBk8]{Mesh Armour}, @UUID[Compendium.wng-core.items.Item.YpCzpRX37328Md1h]{Auto-Quill}, @UUID[Compendium.wng-core.items.Item.9406td13uMAaKNmc]{Data-Slate}, Melee weapon with a Value of 5 or less, and a rarity of Rare or better, Ranged weapon with a Value of 5 or less, and a rarity of Rare or better</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color