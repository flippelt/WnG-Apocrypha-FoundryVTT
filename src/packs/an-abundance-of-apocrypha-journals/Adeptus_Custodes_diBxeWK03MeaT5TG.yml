pages:
  - name: Adeptus Custodes
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: "<p>The Adeptus Custodes, known as the Legio Custodes during the Great Crusade and Horus Heresy eras, is the Imperial Adepta responsible for protecting the Imperial Palace and the physical body of the Emperor of Mankind, as well as serving as His most important emissaries, His companions, and the keepers of His many secrets.</p>\n<p>The Custodes are an elite cadre of genetically engineered transhuman warriors who are even more potent in combat than the Adeptus Astartes. They are to the Space Marines as the Emperor is to His Primarchs, and it is rumoured that they were each created by the Master of Mankind personally.</p>\n<p>These warriors have stood in the presence of the immortal Emperor of Mankind since before the time of the Unification Wars. For ten thousand Terran years and more, the Custodians have stood watch over their lord and master, serving as the Emperor's personal heralds and praetorian bodyguard.</p>\n<p>During the Great Crusade, these resplendent warriors guarded the Emperor wherever He went and swore to give their lives to protect His. After His incarceration in the Golden Throne following the Horus Heresy ten millennia ago, they have taken a far more limited role in the Imperium of Man.</p>\n<p>With the birth of the Great Rift in the Era Indomitus, and the resurrection of the Primarch Roboute Guilliman as the Lord Commander of the Imperium, the Adeptus Custodes have been forced to take a more active role in galactic affairs. A force of Custodians has followed Guilliman's Indomitus Crusade out into the galaxy, often serving as the heralds of a Torchbearers fleet.</p>\n<p>As befits such a body of elite warriors, the internal hierarchy of the Adeptus Custodes is remarkably flat. The overall command of the Adeptus Custodes of course lies within the purview of the Emperor directly, but serving as the head of the Order is a single officer; the Captain-General, and due to the importance of the Adeptus Custodes in the governing of the Imperium, since they always stand the closest to the Emperor, the Captain-General often holds a position amongst the ruling High Lords of Terra on the Senatorum Imperialis. The Captain-General commands the Ten Thousand, inheriting a post that has been passed down from one gallant leader to the next ever since the mysterious disappearance of Constantin Valdor. The Captain General has absolute authority over the Custodes, acting as the ritual proxy for the Emperor Himself and speaking with the voice of the Master of Mankind.</p>\n<p>Immediately below the absolute authority of the Captain-General were the two Tribunes, the senior members of the Custodian Tribunate; a senior cadre of ten veteran Custodians, forming the Adeptus Custodes' council of war and policy who acted as advisors to the Captain General. This body has the incomparable privilege of providing their services as counsel to the Emperor Himself should He so desire it, and in the matters of the security of the Imperial Palace's inner sanctums and the person of the Emperor, no higher authority exists. Membership of this body changes periodically to ensure a blend of established wisdom and fresh ideas.</p>\n<p>Below this ruling council can be found the Custodian Prefectorate and the Shield Captains. The title of Prefect is accorded as a reward of veterancy and favour in service by the Emperor, while the rank of Shield Captain indicates an active field command over a particular detachment or deployment of the Custodes. These two ranks fulfil the roles of inspiring leaders, gifted generals, and selfless champions. Their titles vary enormously, from \"Supreme Castellans” and “Aquila Commanders” to “Master Guardians,” often borne in accordance with the specific duties to which they have been assigned. It is Shield-Captains that take charge of the Adeptus Custodes' military engagements; one is typically afforded overall command of an operation, while several others of his rank may lend him their strength and wisdom in a supporting capacity.\_</p>\n<table style=\"width:99.1477%;height:731px\" border=\"1\">\n<tbody>\n<tr style=\"height:17px\">\n<td style=\"width:100.072%;height:17px;text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\">ADEPTUS CUSTODES ARCHETYPES</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px\">Tier</td>\n<td style=\"width:64.6033%;height:17px\">Archetype</td>\n<td style=\"width:22.9595%;height:17px\">Description</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;text-align:center;height:34px\">5</td>\n<td style=\"width:64.6033%;height:34px\">Custodian Guard</td>\n<td style=\"width:22.9595%;height:34px\">The Emperor's personal guard</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:100.072%;height:17px;text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\">ADEPTUS CUSTODES BACKGROUNDS</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.6033%;height:17px\">Origin</td>\n<td style=\"width:22.9595%;height:17px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;height:34px;text-align:center\">1</td>\n<td style=\"width:64.6033%;height:34px\"><strong>Privilege:</strong> You were selected from amongst the wealthy and powerful families of Holy Terra as a small child.</td>\n<td style=\"width:22.9595%;height:34px;text-align:right\">Influence</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;height:34px;text-align:center\">2</td>\n<td style=\"width:64.6033%;height:34px\"><strong>Prophesy:\_</strong>Your place in the Custodian Guard was foretold and you were sough out as a child to ensure that your fate came to pass.</td>\n<td style=\"width:22.9595%;height:34px;text-align:right\">Resolve</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;height:34px;text-align:center\">3</td>\n<td style=\"width:64.6033%;height:34px\"><strong>Provenance:\_</strong>During a Custodes action, you were noticed, and your potential discovered. You were taken away to join the Ten-Thousand.</td>\n<td style=\"width:22.9595%;height:34px;text-align:right\">Determination</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.6033%;height:17px\">Accomplishment</td>\n<td style=\"width:22.9595%;height:17px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;height:51px;text-align:center\">1</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Blood Games Veteran:\_</strong>You have participated in many Blood Games, testing the defences of the Palace with your own skills to discover any flaw that remain.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Max Shock</td>\n</tr>\n<tr style=\"height:68px\">\n<td style=\"width:12.509%;height:68px;text-align:center\">2</td>\n<td style=\"width:64.6033%;height:68px\"><strong>Hetaeron Guard:\_</strong>You spend years of even decades amongst the Companions, one of three hundred custodians guarding the Emperor personally, and have only stepped down because not even the strongest can bear such a burden indefinitely.</td>\n<td style=\"width:22.9595%;text-align:right;height:68px\">Passive Awareness</td>\n</tr>\n<tr style=\"height:68px\">\n<td style=\"width:12.509%;height:68px;text-align:center\">3</td>\n<td style=\"width:64.6033%;height:68px\"><strong>Jailer of the Dark Cells:\_</strong>You watched over the ancient prisons deep beneath the Imperial Palace,standing vigil over terrors that have been caged since before the Imperium. You may even have been charged to hunt down a creature destined for those cells.</td>\n<td style=\"width:22.9595%;text-align:right;height:68px\">Max Shock</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;text-align:center;height:17px\">[[/r d3]]</td>\n<td style=\"width:64.6033%;height:17px\">Goal</td>\n<td style=\"width:22.9595%;text-align:right;height:17px\">Gain +1</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;text-align:center;height:51px\">1</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Vision:\_</strong>You, or another of your order, had a dream-vision sent by the Emperor, revealing some specific objective or purpose that you must fulfil.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Max Shock</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;text-align:center;height:51px\">2</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Threat Identified:\_</strong>Your order's spies and agents have discovered an impending threat to the Throne, and you have been charged with eliminating that threat.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Resolve</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;text-align:center;height:51px\">3</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Torchbearer:\_</strong>You have been placed with the Indomitus Crusade, delivering the Primarch's Gift to distant Astartes Chapters and striking out at the darkness that fills the galaxy.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Influence</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:100.072%;text-align:center;height:17px;background-color:#752322;color:#dddddd\" colspan=\"3\">ADEPTUS CUSTODES OBJECTIVES</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;text-align:center;height:17px\">[[/r d6]]</td>\n<td style=\"width:87.5628%;height:17px\" colspan=\"2\">Objective\_</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;text-align:center;height:34px\">1</td>\n<td style=\"height:34px;width:87.5628%\" colspan=\"2\">Utilise your awe-inspiring presence and status as the Emperor's guardian in a social situation\_</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">2</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Speak of the absolute nature of your duty to the Throne</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">3</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Apply the wisdom of the Emperor or of ancient philosophy to the current situation</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">4</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Dismiss the faith of a servant of the Imperium, or play along with their beliefs to inspire them</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">5</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Express doubt as to the loyalty or spiritual fortitude of a servant of the Emperor</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">6</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Comment on how secure or vulnerable a location is</td>\n</tr>\n</tbody>\n</table>"
