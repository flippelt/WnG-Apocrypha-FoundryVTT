      content: '<p>“He who seizes the moment, he is the right man.” –Fleet Admiral Hawke You’re one of the elite Armsmen of the Imperial Navy, trained for close assaults and formidable defence aboard voidships, orbital stations, and other enclosed environments. Armsmen are crewmembers trusted to carry weapons at all times on board the ship and maintain the contents of the weapons lockers. They keep discipline among the lower ranks and protect the crew as needed. Unlike most Ratings, Armsmen get to move around different decks of the warship in the course of their duties and their loyalties are carefully scrutinised. Armsmen are essentially the Imperial Navy''s equivalent of marines in the most ancient sense of that term.</p><p>Experienced in hazardous boarding actions, these elite Armsmen are aggressive and blunt instruments of their warship’s commander. They wear fully enclosed void armour and wield robust weapons optimised for closeconfines fighting, while some carry more specialised gear for cracking enemy bulkheads.</p><p>These fighting men and women of the Imperial Navy are called upon for many tasks, from garrisoning void ports to escorting the Navigator elite. The bravest and most daring of their ilk are selected for the Breacher teams – the blunt hammer at the head of a Navy boarding assault. Trained in close-quarters combat and equipped with a range of specialist equipment, these bold boarders smash apart anything in their way under a hail of shotgun fire, grenades, and axe blows.</p><p>IMPERIAL NAVY BREACHER</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>NAVY BREACHER</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">54</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">NAVIS IMPERIALIS</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Toughness 3, Agility 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Ballistic Skill 2, Tech 1, Weapon Skill 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.HWtuIfx0nQFKOClm]{Breach and Clear}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.Vpr0zWEalKYdilPA]{Navis Armoured Voidsuit}, @UUID[Item.GQVMRlJAO2g44Slk]{Navis Shotgun (Ranged)}, @UUID[Item.xIjDWcq0cc2B0gdp]{Navis Shotgun (Melee)}, @UUID[Item.6ZFK1e96mBxkifjo]{Navis Hatchet}, @UUID[Item.kDZrG5eB3DJe8s0i]{Apertor}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">2</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 3, Ballistic Skill 4, Leadership 1, Pilot 2, Tech 2, Weapon Skill 4</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.s6OMveAvTlOrsUsO]{Deadshot}, @UUID[Item.HYuKXdU1r5yNyRU1]{Die Hard}, @UUID[Item.h3cX58IYSA7DiKnI]{Overwatch}</td></tr></tbody></table>'
