      content: '<p>‘ILLUMINATE YOUR DEVOTED CHARGES, LET BUILD THE BOLTS, ’TIL THE SACRED ENERGIES COURSE THROUGH VEINS ELECTRIC, AND SEND YOUR SEIZURES OF STATIC STRIKING! I AM BECOME LIGHTNING, AND THIS GIFT I GIVE TO UNBELIEVERS, THAT IN THEIR LAST FLASH-BLINDING THEY MIGHT SEE THE BRIEFEST GLIMPSE OF THE OMNISSIAH HIMSELF.’ —Excerpt from the Chant of Electro-traction</p><p>You are a devotee of the Motive Force that flows through the universe, and it surges within your flesh and augmetics. At a moment’s notice, you can unleash it to discharge into non-believers, searing their unworthiness with resplendent arcs of power. The Corpuscarii Electro-Priests (sing. Corpuscarius) are a rival faction to their Fulgurite brethren. They are devoted to the Motive Force, and it is their desire to share its glory with every creature and machine not already so aligned. On every Forge World there are many different subsects within the factions of Electropriests, each preferring their own rituals and rites to worship the Divine Current.</p><p>within their bodies. Incoming fire sparks off their Voltagheist fields, sending chain reactions of arcing charges crackling outwards. At close range, the blazing fanatics can summon lightning at will, stretching out their electrostatic gauntlets to send jagged bolts of the Machine God''s wrath into the foe. Those struck by these sacred energies are granted the ecstasy of fullbody electrocution. For a brief second before death, the unbelievers see the light, their paroxysms shaking them apart as their bodies burn from the inside out. Such is the generosity of the Corpuscarii, for their duty is to illuminate the galaxy, and to bring the light to nonbelievers.</p><p>The Corpuscarii are truly blessed, for the Motive Force literally runs in their veins. In battle, the Corpuscarii advance, chanting litanies to build up the charges</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>CORPUSCARII ELECTRO-PRIEST (APOCRYPHA VERSION)</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">46</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS MECHANICUS</a>, <a class="keyword">CULT MECHANICUS</a>, <a class="keyword">[FORGE WORLD]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Toughness 3, Willpower 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Ballistic Skill 2, Scholar 1, Tech 2, Weapon Skill 1</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.srhFDa3od1HwPX8a]{Voltaic Fanaticism}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: Luminen Capacitor, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.6bqV6HRbsxMNu2pl]{Electrostatic Gauntlets}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.WOPEbKg4r63ucuBD]{Electrostatic Gauntlets (Melee)}, Voltagheist Field Generator, any two augmetics</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 1, Ballistic Skill 3, Medicae 1, Scholar 2, Tech 2, Weapon Skill 2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.sOuOMmWohMfOEFJv]{Augmetic}, @UUID[Compendium.wng-core.items.Item.UnWnJIE3XhYMVKx3]{Duty Until Death}, @UUID[Compendium.wng-core.items.Item.TLV6c8FJhbKFKKUK]{Tenacious}</td></tr></tbody></table>'
