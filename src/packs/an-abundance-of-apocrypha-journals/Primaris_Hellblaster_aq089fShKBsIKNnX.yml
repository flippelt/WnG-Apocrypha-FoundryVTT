      content: '<p>“A fortress will not stop Space Marines. But it may slow them down." —Proverb You deliver searing wrath to the enemies of the Imperium, scouring the battlefields of foes to aid your brethren and secure triumph, at any cost. Armed to provide heavy fire support to their brethren, Hellblasters are all armed with sophisticated Plasma Incinerators, functioning similarly to the Tactical Support Squads that once fought in the Legiones Astartes. Witnesses have compared the firepower of a Hellblaster squad to that of a solar flare: those caught in their searing, blinding volley are swiftly annihilated, reduced to ash, molten ruin, and acrid smoke. The only real drawback of their lethal barrage is the relative scarcity and instability of their weapons. Thus, Hellblasters are amongst the finest marksmen available, and they will only overcharge their weapons when absolutely necessary. However, such dire circumstances are not uncommon in these dark times, and more than one squad has martyred itself in battle, turning the tide at the cost of their own immolation. Yet for every warrior to suffer such a fiery death, there is another that obliterates its foes amidst searing tempests of star-born nuclear fury.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>PRIMARIS HELLBLASTER</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Primaris Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">228</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTARTES</a>, <a class="keyword">PRIMARIS</a>, <a class="keyword">[CHAPTER]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 4, Initiative 4, Willpower 3, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 4, Stealth 3, Weapon Skill 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.g59l831DsUbj5OCB]{Hellblaster Focus}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.5KNMzZhCTuvCfRHf]{Tacticus Mk X}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.bYzrbZWvnuSTKnuv]{Plasma Incinerator}, @UUID[Compendium.wng-core.items.Item.piwPtkisOSeJ47HV]{Heavy Bolt Pistol}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.4QVBQYWXXLyvFWkj]{Astartes Combat Knife}, @UUID[Compendium.wng-core.items.Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Compendium.wng-core.items.Item.SJ8UaYHEMtF71W1M]{Krak Grenade}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">6</td><td style="text-align:center">6</td><td style="text-align:center">6</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 3, Awareness 4, Ballistic Skill 6, Stealth 4, Tech 1, Weapon Skill 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.s6OMveAvTlOrsUsO]{Deadshot}, @UUID[Compendium.wng-core.items.Item.UnWnJIE3XhYMVKx3]{Duty Until Death}, @UUID[Compendium.wng-core.items.Item.TLV6c8FJhbKFKKUK]{Tenacious}</td></tr></tbody></table>'
