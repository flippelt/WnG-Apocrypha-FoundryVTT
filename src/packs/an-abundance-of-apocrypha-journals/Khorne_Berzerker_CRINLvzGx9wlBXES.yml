      content: '<p>"Your death shall slake my axe''s thirst!" —Avaras of the World Eaters Legion, Skull Taker of Khorne Kill! Maim! Burn! Kill! Maim! Burn! Kill! Maim! Burn! Khorne Berzerkers are Chaos Space Marines dedicated to glorifying the Chaos God Khorne through brutal melee combat. Driven solely by their raging desire to spill blood and take lives, a Berzerker''s sole purpose in life is to destroy their enemies in the name of the Blood God and take life in the most brutal and barbaric fashion imaginable.</p><p>them being unable to form a cohesive and mutually supportive military unit. This inability as well as the Berserkers'' needs to kill using primarily melee weapons often leaves them at a disadvantage when facing opponents who are willing to use basic strategy against the Berserkers'' unreasoning savagery and sheer ferocity.</p><p>Berzerkers refuse to use most forms of ranged weaponry and usually make almost exclusive use of close combat melee weapons, in particular the chainaxe, as the axe is the favoured weapon of Khorne. However, Khornate Berzerkers will use any weapon they can get their hands on, even their own bodies, as long as they can continue to engage in bloodshed. Khorne''s Berzerkers are rightly feared by their allies and their enemies alike. Having sworn their souls to the god of war and murder, Berzerkers find the need to spill "Blood for the Blood God" simply overpowering. Denied the chance to engage in constant slaughter, a Berzerker will become almost uncontrollably enraged and will turn on any living thing whose life can be extinguished to satisfy his sheer need for carnage. Khornate Berzerkers'' sheer bloodthirstiness has earned them a fearsome reputation, yet their uncontrollable urge to slaughter and kill often leaves</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>KHORNE BERZERKER</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center"