      content: '<p>"Everything organic we know of is simply machinery, in one form or another. Tendons replace pistons; flesh in the place of steel; blood is simply biological coolant. To deny this and shun it is more than just Mechanicus orthodoxy – it is idiocy." –Attributed to an unknown Genetor A devotee of the biological sciences, you are a skilled surgeon, geneticist, and bioengineer, crafting and maintaining machines of flesh no less remarkable than the devices of steel that your kin exalt. Essentially geneticists, a Genetor is a high-ranking Adeptus Mechanicus Tech-priest who studies all matters genetic and biological. Sometimes referred to as a Magos Biologis, a Genetor is a member of the Adeptus Mechanicus’ ruling Priesthood, possessing access to knowledge and resources far beyond that of the lesser members.</p><p>same way. The difference is that they are not so quick to judge flesh and blood as inferior to steel and plasma and view living creatures as extremely complex and adaptable machines. Where some are content to make this observation distantly, others embrace it, seeking to improve their forms not with steel, but with better flesh and better blood.</p><p>A Genetor''s obsession with organic life often makes them seem strange to their more mechanically-inclined brethren. For the most part, Genetors differ little from other Tech-priests—they bear the same manner of augmetic implants, venerate information and understanding as the manifestation of divinity, and engage upon the Quest for Knowledge in much the</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>GENETOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">98</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS MECHANICUS</a>, <a class="keyword">CULT MECHANICUS</a>, <a class="keyword">[FORGE WORLD]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Toughness 3, Initiative 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Medicae 3, Scholar 2, Tech 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.JvWDMaY90EQcZPQ8]{Magos Biologis}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.gp881IiZhvjfvLfF]{Omnissian Axe}, @UUID[Compendium.wng-core.items.Item.JZQ0eEkQf7hWxaD5]{Auger Array}, @UUID[Compendium.wng-core.items.Item.eVKhnZo0ekm7DobY]{Diagnostor}, @UUID[Compendium.wng-core.items.Item.oCFca0vTYRuxndzP]{Mechadendrite (Medicae)}, any two augmetic enhancements, any one augmetic implant of up to Availability 7 (Unique), @UUID[Compendium.wng-core.items.Item.jy00ECKFvu0ontTx]{Light Power Armour}, and any one weapon of up to Availability 6 (Very Rare)</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">4</td><td style="text-align:center">8</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Ballistic Skill 2, Investigation 1, Medicae 6, Pilot 2, Scholar 5, Tech 5, Weapon Skill 2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.7f6YZ8n6oolZxXup]{Binary Chatter}, @UUID[Compendium.wng-core.items.Item.VLWzaaUTYv6c3X2A]{Conversational Cogitator}, @UUID[Compendium.wng-core.items.Item.vxsi953ncB48aylK]{Rite of Pure Thought}</td></tr></tbody></table>'
