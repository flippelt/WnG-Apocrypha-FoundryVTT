      content: "<p>The Adeptus Arbites is the Imperial Adepta that serves as the galactic police force of the Imperium of Man, responsible for enforcing Imperial Law (the Lex Imperialis) on all Imperial-controlled worlds. They have been granted the right by the High Lords of Terra to serve as judge, jury, and executioner to any Imperial citizen they discover having broken Imperial law.</p><p>However, in those cases where Imperial law is unclear or the law breaker has committed a truly heinous deed or is of unusually high-ranking stature, the offender will be taken back to an Arbites Precinct House for judgement by a Magistrate or Judge, the sentence to be carried out immediately. Imperial justice is swift and sure, but not always just.</p><p>Only through constant watch and the execution of brutal law can the Imperium survive, and it is the Adeptus Arbites who carry out this function. While the armies of the Astra Militarum struggle to hold back the aggression of alien empires and protect the worlds of Mankind from without, the Adeptus Arbites roots out rebels, recidivists, and threats to the stability of the Imperium from within.</p><p>They operate as they best see fit, using their greater training and weaponry to tackle foes that might be beyond the scope of local Enforcers, or in many cases to deal with a planetary government which has itself become corrupted. Remorseless and singleminded, the Arbites do not forgive or forget any crime, and pursue their quarry relentlessly until the Emperor's Justice has been served.</p><p>The laws of the Imperium of Man are a complex web of tradition, obligation, and local custom. Thus, they can vary from world to world or sector to sector, with each Planetary Governor, local prefect, or headman pronouncing his own laws. Arbitors care little for such trivialities and enforce the serious crimes against the Imperium while leaving such petty matters to local officials. Murder or theft, for example, are considered inconsequential unless they affect the Imperium directly, are perpetrated against Imperial officials, or somehow fundamentally threaten a world’s security or safety.</p><p>Arbitors have little pity or compassion for the transgressions of Imperial citizens. A few might maintain idealistic notions for bringing order to the Imperium, but the realities of endless, sometimes horrific crimes constantly erode such notions. The arrival of an Arbitrator patrol is seldom welcome, given the brutal way in which they operate during their investigations, arrests, and executions, even though it might mean an end to vicious criminal enterprises or corrupt Imperial or planetary officials.</p><p>Arbitors must deal with ineffectual or corrupt local government agencies. These are often an Arbitor’s greatest foes as he must clean up a local situation, taking over the Enforcers of a hive city, orbital station, or even entire planet to purge it of crime and corruption in a series of bloody and unforgiving sweeps.</p><p>On Imperial worlds the Adeptus Arbites are the last, most absolute law, answering only to the Marshalls and Judges of star systems and entire sectors, and not to local authorities. It is a thankless task, for the anonymous, helmeted Arbitrator usually only receives fear and hatred for his actions.</p><p>To ensure their loyalty is to the Imperium and the Law first, foremost, and only, Arbitors never serve on the world upon which they were born. Indeed, they will receive training on one world and then be deployed to another entirely, ensuring that bonds of local familiarity cannot compromise enforcement of the law. This often means that Arbites are well-travelled, with veterans having served on several worlds across multiple sectors during their storied careers.</p><p><strong>Author’s Note:</strong> <em>The Adeptus Arbites as presented in this document are based on the Arbites as depicted in the Shira Calpurnia novels by Matt Farrer, which are available </em><a href=\"https://www.blacklibrary.com/warhammer-40000/novels/enforcer-omnibus-ebook.html\"><em>here</em></a><em>, but using the term Magistrates rather than Judges to describe the legal side of the Arbites.</em></p><table style=\"width:99.1477%;height:1238px\" border=\"1\"><tbody><tr style=\"height:17px\"><td style=\"width:99.5703%;height:17px;text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\">ADEPTUS ARBITES ARCHETYPES</td></tr><tr style=\"height:17px;background-color:#484746;color:#dddddd\"><td style=\"width:12.4642%;height:17px\">Tier</td><td style=\"width:64.294%;height:17px\">Archetype</td><td style=\"width:22.8121%;height:17px\">Description</td></tr><tr style=\"height:68px\"><td style=\"width:12.4642%;text-align:center;height:68px\">1</td><td style=\"width:64.294%;height:68px\">@UUID[JournalEntry.AQGUymqsB8knipBc]{Enforcer}</td><td style=\"width:22.8121%;height:68px\">Local law enforcement, often aligned with or deputised by the Arbites</td></tr><tr style=\"height:68px\"><td style=\"width:12.4642%;height:68px;text-align:center\">2</td><td style=\"width:64.294%;height:68px\">Arbitrator</td><td style=\"width:22.8121%;height:68px\">An armoured enforcer of the Emperor's Law, unyielding in their devotion</td></tr><tr style=\"height:68px\"><td style=\"width:12.4642%;text-align:center;height:68px\">2</td><td style=\"width:64.294%;height:68px\">Magistrate</td><td style=\"width:22.8121%;height:68px\">A scholar of the Law, passing judgement upon the guilty</td></tr><tr style=\"height:68px\"><td style=\"width:12.4642%;text-align:center;height:68px\">3</td><td style=\"width:64.294%;height:68px\">Detective</td><td style=\"width:22.8121%;height:68px\">A specialised investigator, assigned to solve more complex crimes</td></tr><tr style=\"height:51px\"><td style=\"width:12.4642%;text-align:center;height:51px\">3</td><td style=\"width:64.294%;height:51px\">Chastener</td><td style=\"width:22.8121%;height:51px\">A dogged pursuer of those who would flee the Emperor's judgment</td></tr><tr style=\"height:68px\"><td style=\"width:12.4642%;text-align:center;height:68px\">3</td><td style=\"width:64.294%;height:68px\">Verispex Adept</td><td style=\"width:22.8121%;height:68px\">A technician who studies the sceneof crimes to uncover evidence</td></tr><tr style=\"height:31px\"><td style=\"width:99.5703%;height:31px;text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\"><p>ADEPTUS ARBITES BACKGROUNDS</p></td></tr><tr style=\"height:17px;background-color:#484746;color:#dddddd\"><td style=\"width:12.4642%;height:17px;text-align:center\">[[/r d3]]</td><td style=\"width:64.294%;height:17px\">Origin</td><td style=\"width:22.8121%;height:17px;text-align:right\">Gain +1</td></tr><tr style=\"height:51px\"><td style=\"width:12.4642%;height:51px;text-align:center\">1</td><td style=\"width:64.294%;height:51px\"><strong>Progena:\_</strong>Your parents were stalwart servants of the Throne, and after their deaths, you were raised by the Schola Progenium, who identified your talents and groomed you to join the Adeptus Arbites.</td><td style=\"width:22.8121%;height:51px;text-align:right\">Influence</td></tr><tr style=\"height:85px\"><td style=\"width:12.4642%;height:85px;text-align:center\">2</td><td style=\"width:64.294%;height:85px\"><strong>Repentant:</strong> You once lived a life of criminality and desperation before you found the Emperor’s light and saw the error of your ways. You sought out an Arbites Precinct-Fortress and turned yourself over to their judgements, and after your sentence was served, your contrition was rewarded with an opportunity for redemption.</td><td style=\"width:22.8121%;height:85px;text-align:right\">Conviction</td></tr><tr style=\"height:68px\"><td style=\"width:12.4642%;height:68px;text-align:center\">3</td><td style=\"width:64.294%;height:68px\"><strong>Ascended:\_</strong>You served the local Enforcers of your homeworld honourably and dutifully, until you found yourself caught between your loyalty to your home and your loyalty to the Emperor. You chose the Imperium, and the Arbites recruited you in the aftermath.</td><td style=\"width:22.8121%;height:68px;text-align:right\">Resolve</td></tr><tr style=\"height:17px;background-color:#484746;color:#dddddd\"><td style=\"width:12.4642%;height:17px;text-align:center\">[[/r d3]]</td><td style=\"width:64.294%;height:17px\">Accomplishment</td><td style=\"width:22.8121%;height:17px;text-align:right\">Gain +1</td></tr><tr style=\"height:51px\"><td style=\"width:12.4642%;height:51px;text-align:center\">1</td><td style=\"width:64.294%;height:51px\"><strong>Rebellion Quashed:</strong> When a rebellion arose on your last posting, you were instrumental in crushing it and bringing the Emperor’s Justice to the rebels.</td><td style=\"width:22.8121%;text-align:right;height:51px\">Conviction</td></tr><tr style=\"height:102px\"><td style=\"width:12.4642%;height:102px;text-align:center\">2</td><td style=\"width:64.294%;height:102px\"><strong>Subversive Eliminated:</strong> You once lived a life of criminality and desperation before you found the Emperor’s light and saw the error of your ways. You sought out an Arbites Precinct-Fortress and turned yourself over to their judgements, and after your sentence was served, your contrition was rewarded with an opportunity for redemption.</td><td style=\"width:22.8121%;text-align:right;height:102px\">Determination</td></tr><tr style=\"height:68px\"><td style=\"width:12.4642%;height:68px;text-align:center\">3</td><td style=\"width:64.294%;height:68px\"><strong>Frontier Marshal:\_</strong>You served the local Enforcers of your homeworld honourably and dutifully, until you found yourself caught between your loyalty to your home and your loyalty to the Emperor. You chose the Imperium, and the Arbites recruited you in the aftermath.</td><td style=\"width:22.8121%;text-align:right;height:68px\">Max Wounds</td></tr><tr style=\"height:17px;background-color:#484746;color:#dddddd\"><td style=\"width:12.4642%;text-align:center;height:17px\">[[/r d3]]</td><td style=\"width:64.294%;height:17px\">Goal</td><td style=\"width:22.8121%;text-align:right;height:17px\">Gain +1</td></tr><tr style=\"height:51px\"><td style=\"width:12.4642%;text-align:center;height:51px\">1</td><td style=\"width:64.294%;height:51px\"><strong>Fugitive:</strong> One criminal in particular has continued to elude your efforts, and you will stop at nothing to see them Judged.</td><td style=\"width:22.8121%;text-align:right;height:51px\">Determination</td></tr><tr style=\"height:51px\"><td style=\"width:12.4642%;text-align:center;height:51px\">2</td><td style=\"width:64.294%;height:51px\"><strong>Order to the Lawless:</strong> You desire the next great challenge that awaits an Arbitrator – to pacify the criminality and anarchy of places which have fallen from the Emperor’s Light.</td><td style=\"width:22.8121%;text-align:right;height:51px\">Resolve</td></tr><tr style=\"height:51px\"><td style=\"width:12.4642%;text-align:center;height:51px\">3</td><td style=\"width:64.294%;height:51px\"><strong>Cold Case:</strong> An unsolved crime has haunted your precinct, or possibly your career specifically, for longer than anyone is comfortable with. You will solve that case and bring the perpetrator to justice.</td><td style=\"width:22.8121%;text-align:right;height:51px\">Max Shock</td></tr><tr style=\"height:17px;background-color:#484746;color:#dddddd\"><td style=\"width:99.5703%;text-align:center;height:17px;background-color:#752322;color:#dddddd\" colspan=\"3\">ASTRA MILITARUM OBJECTIVES</td></tr><tr style=\"height:17px;background-color:#484746;color:#dddddd\"><td style=\"width:12.4642%;text-align:center;height:17px\">[[/r d6]]</td><td style=\"width:87.1061%;height:17px\" colspan=\"2\">Objective\_</td></tr><tr style=\"height:17px\"><td style=\"width:12.4642%;text-align:center;height:17px\">1</td><td style=\"height:17px;width:87.1061%\" colspan=\"2\">Seek to apply the dictates of the Lex Imperialis to a situation.</td></tr><tr style=\"height:17px\"><td style=\"width:12.4642%;text-align:center;height:17px\">2</td><td style=\"height:17px;width:87.1061%\" colspan=\"2\">Compare your current environment to another world on which you have served.</td></tr><tr style=\"height:34px\"><td style=\"width:12.4642%;text-align:center;height:34px\">3</td><td style=\"height:34px;width:87.1061%\" colspan=\"2\">Interrogate a suspect using threats of violence and punishment while an ally offers leniency in exchange for compliance (or vice versa).</td></tr><tr style=\"height:17px\"><td style=\"width:12.4642%;text-align:center;height:17px\">4</td><td style=\"height:17px;width:87.1061%\" colspan=\"2\">Berate a criminal or other citizen who you have judged as insufficiently law-abiding.</td></tr><tr style=\"height:17px\"><td style=\"width:12.4642%;text-align:center;height:17px\">5</td><td style=\"height:17px;width:87.1061%\" colspan=\"2\">Open a door, or otherwise enter a room, using forceful methods.</td></tr><tr style=\"height:17px\"><td style=\"width:12.4642%;text-align:center;height:17px\">6</td><td style=\"height:17px;width:87.1061%\" colspan=\"2\">Subdue an enemy non-lethally so that they might face proper judgement later.</td></tr></tbody></table>"
