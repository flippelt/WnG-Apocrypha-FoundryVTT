      content: '<p>“We bring only death and leave only carrion. It is a message even a Human can understand.” —Requiel, of the Sons of Fuegan You embody Khaine’s aspect of the destroyer, and the brutal, wanton desolation of warfare. With fire do you scour the battlefield clean of the enemy, and not even within armoured vehicles or behind fortifications are they safe from your fury. The Fire Dragons are one of the forms of Aeldari Aspect Warriors, who represent a different aspect of the Aeldari war god Kaela Mensha Khaine. Embodying the writhing, sinewy dragon of Aeldari myth, Fire Dragons are aggressive and warlike close combat fighters who utilized heat weapons to destroy enemy vehicles and strongpoints.</p><p>Phoenix Lords for the Rhana Dandra, the Final Battle, and be the last one to fall in this epic confrontation. They have an unsurpassed mastery of their chosen and highly dangerous weapons, and they take savage delight in the devastation they create. For this reason, the Aeldari believe that the Fire Dragons are the embodiment of the Aeldari War God Kaela Mensha Khaine''s penchant for pure destruction. It is said that Fire Dragon Exarchs generate a corona of lambent flame around themselves when the battle lust is upon them.</p><p>The founder of the Fire Dragons was Fuegan, the first of the Phoenix Lords who learned the ways of war from Asurmen and established his own Shrines on many Craftworlds to school new pupils in the art of fire and flame. When the Fallen Pheonix Arhra betrayed his fellows and attacked the Shrine of Asur, Fuegan refused to leave and was thought lost when the shrine was destroyed until he reappeared centuries later. Tradition has it that Fuegan will call together the</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>FIRE DRAGON ASPECT WARRIOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Aeldari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">108</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">ASURYANI</a>, <a class="keyword">[CRAFTWORLD]</a>, <a class="keyword">ASPECT WARRIOR</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Toughness 3, Agility 4, Willpower 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 2, Ballistic Skill 5, Tech 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.Rhf5NhHKXeygORmm]{Fiery Destruction}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.KXn7FgD0ly6vLiOK]{Heavy Aspect Armour}, @UUID[Item.f5AZcBo73t94as1X]{Dragon Fusion Gun}, @UUID[Item.ymCGa2JdK8qvqwhr]{Melta Bomb}, @UUID[Item.3X5FaaFcfNmaEod4]{Mono Knife}, @UUID[Item.aIEl2xpESvkqyVEG]{Spirit Stone}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 3, Awareness 3, Ballistic Skill 5, Scholar 2, Survival 3, Tech 4, Weapon Skill 4</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.84j8hJHJSpH31Gon]{Absolute Incineration}, @UUID[Item.HYuKXdU1r5yNyRU1]{Die Hard}, @UUID[Item.zrCkrWGkMDPK1kOg]{Battle Focus}, @UUID[Item.1OzEfrtLvMDY3XgW]{Strike and Fade}</td></tr></tbody></table>'
