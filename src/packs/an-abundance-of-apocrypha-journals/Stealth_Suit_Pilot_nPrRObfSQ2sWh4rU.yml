      content: '<p>See the Gue’la, how they arrogantly stride into our trap. We will punish their belligerence, their ignorant lack of foresight. — O’Sharrek, Commander Darkwind You are an elite warrior of the T’au Empire, a member of the Fire Caste. You have passed your first Trial By Fire and been granted the right to pilot a battlesuit; you have chosen to operate a Stealth Battlesuit, operating secretly behind enemy lines. Equipped with either the XV15 or XV25 Stealthsuit, these teams operate independently from other military formations. In fact, they are not factored directly into Tau battle plans, and so enjoy an unusual degree of freedom within broad mission parameters, with team leaders gaining a reputation of eccentricity as they employ unorthodox tactics. Operating in teams of three to six members, including the team leader, their primary role is to ambush isolated enemies and act in support of friendly units, often ranging far ahead of the main Tau army.</p><p>Page 133</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>STEALTH SUIT PILOT</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Shas T''au</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">76</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">T''AU EMPIRE</a>, <a class="keyword">FIRE CASTE</a>, <a class="keyword">[SEPT]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Toughness 2, Agility 3, Initiative 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 3, Ballistic Skill 3, Pilot 2, Stealth 2, Tech 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.vrYlCCKXV7sT4k3C]{Behind Enemy Lines}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.ixpmzD260YBUtIno]{XV15 Stealth Battlesuit}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 3, Ballistic Skill 4, Stealth 3, Survival 2, Tech 2, Weapon Skill 1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.Cr4n0fqlBRqeY0yY]{Ever Vigilant}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.7UGuNT8yY0OZXQJq]{Dynamic Offensive}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.1OzEfrtLvMDY3XgW]{Strike and Fade}</td></tr></tbody></table>'
