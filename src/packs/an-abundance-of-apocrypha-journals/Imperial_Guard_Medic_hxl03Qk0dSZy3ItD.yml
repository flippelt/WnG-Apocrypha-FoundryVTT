  - name: Imperial Guard Medic
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: '<blockquote><p>Hope for the best but prepare for the worst.</p><p style="text-align:right"><em>—Imperial Guard Tactical Manual</em></p></blockquote><p><strong>You’ve been given the honour and responsibility of keeping your fellow soldiers up and fighting, or at least ensuring that their deaths aren’t too painful.</strong></p><p>Soldiers of the Astra Militarum who have been trained in combat medicine, Medics are responsible for providing first response and front-line medical care to their fellow guardsmen on the battlefield. They are fighting chirurgeons, as comfortable with a medikit kit as with their Lasguns. In battle, they fight shoulder-toshoulder with their comrades, only stopping to treat wounds and, where necessary, administering the Emperor’s Peace.</p><div class="journal-image centered"><img src="modules/wng-apocrypha/assets/images/archetypes/ig-medic.jpg" width="200" height="305" /></div><table style="width:98.9228%;height:234px" border="1"><tbody><tr class="table-header" style="height:16px"><td style="width:92.7291%;height:16px" colspan="8">IMPERIAL GUARD MEDIC</td></tr><tr style="height:16px"><td style="background-color:#484745;color:white;text-align:center;width:26.5674%;height:16px" colspan="2">TIER</td><td style="width:8.3%;height:16px;text-align:center">1</td><td style="background-color:#484745;color:white;width:16.2617%;height:16px;text-align:center" colspan="2">SPECIES</td><td style="width:11.7268%;height:16px;text-align:center">Human</td><td style="background-color:#484745;color:white;width:11.6223%;height:16px;text-align:center">XP Cost</td><td style="width:18.2509%;height:16px;text-align:center">22</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ASTRA MILITARUM</a>, <a class="keyword">[REGIMENT]</a></td></tr><tr style="height:16px;background-color:rgba(0, 0, 0, .2)"><td style="width:92.7291%;height:16px" colspan="8"><strong>ATTRIBUTES</strong>: Intellect 3</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>SKILLS</strong>: Ballistic Skill 2, Medicae 2</td></tr><tr style="height:16px;background-color:rgba(0, 0, 0, .2)"><td style="width:92.7291%;height:16px" colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.KNHgc4QWwFF4lkGn]{Field Medic}</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.fLx8DzWDgWDZIMSK]{Flak Armour}, @UUID[Compendium.wng-core.items.Item.fPgdC7ur85iRGKgh]{Lasgun}, @UUID[Compendium.wng-core.items.Item.drUoIw7l4vPyI9Zm]{Knife}, @UUID[Compendium.wng-core.items.Item.mOWPCO1mNXNKsGNa]{Munitorum issue mess kit}, Grooming kit, @UUID[Compendium.wng-core.items.Item.c6FVoY1JkbSd6iLh]{Uplifting Primer}, 3 @UUID[Compendium.wng-core.items.Item.vsjZCbjBNivbeUhk]{Ration Packs}</td></tr><tr style="height:16px"><td class="table-header" style="width:51.1291%;height:16px;text-align:left" colspan="5"><strong>SUGGESTED ATTRIBUTES</strong></td><td style="background-color:#484745;color:white;text-align:center;width:23.3491%;height:16px" colspan="2">XP Cost</td><td style="width:18.2509%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)">44</td></tr><tr style="font-variant:small-caps;height:16px"><td style="background-color:#484745;color:white;width:14.0674%;height:16px">ATTRITBUTE</td><td style="width:12.5%;height:16px;text-align:center">S</td><td style="width:8.3%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)">T</td><td style="width:5.17241%;height:16px;text-align:center">A</td><td style="width:11.0893%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)">I</td><td style="width:11.7268%;height:16px;text-align:center">Wil</td><td style="width:11.6223%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)">Int</td><td style="wid