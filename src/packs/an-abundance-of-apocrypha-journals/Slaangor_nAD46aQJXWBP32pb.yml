    text:
      format: 1
      content: >-
        <blockquote><p>Gorge and rut, rip and gore. Slake every hunger and
        thirst you possess. The Dark Prince commands it</p><p
        style="text-align:right"><em>—— Mal’grash the Sharp-horned,
        Slaangor</em></p></blockquote><p><strong>You are a servant of the Prince
        of Chaos and blessed to even vaguely resemble the great Keepers of
        Secrets who serve them.</strong></p><p>With sleek fur, gleaming horns,
        and lithe, supple flesh, Slaangor appear almost as if they had been
        perfected. Yet the spittle in their maws and the mania in their eyes
        show that, for all their glorified appearance, they are still the same
        savage creatures. Slaangor are marked as beloved creatures of the Prince
        of Pleasure and given status as protectors and guardians of the cults
        and temples they dwell within; for their status, they are gaudily
        adorned with jewellery and fine fabrics.</p><table
        style="width:98.9228%;height:239px" border="1"><tbody><tr
