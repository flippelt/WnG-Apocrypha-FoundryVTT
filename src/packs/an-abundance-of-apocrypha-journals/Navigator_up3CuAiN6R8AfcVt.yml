      content: '<p>“To gaze into the warp is to look into the abyss. To understand insanity itself is to become insane. Worst of all is the knowledge that while you are gazing upon it, the warp is looking back at you and laughing.” –Kartr Hollis, Nobilite Emissary You are a scion of an ancient family, blessed—or cursed—with an engineered mutation that allows you to gaze upon the Warp and guide vessels through it. Your abilities are invaluable to any who need to travel the stars. Without the Navigator gene and those who bear it, there simply would not be an Imperium of Man. At best, Humanity’s control of the stars would be limited to those planets that could entirely support themselves and a few scattered petty empires. Contact with other worlds would be scant to non-existent, for travel between all but the very closest of star systems would be too ponderous, and too dangerous, to be practicable. Without a Navigator, a vessel is limited to warp jumps of only a few light years at a time, and exact calibration must be undertaken by massive banks of cogitators as even the smallest of errors will have fatal consequences for the vessel and every soul aboard. Without a Navigator, to cross even the smallest of interstellar gulfs without the most detailed and ancient charts is considered a desperate or foolhardy act by most void-farers and suicidal by those who truly understand what horrors lurk beyond the material universe.</p><p>Astronomican, the Emperor-forged and soul-burning beacon that shines across the galaxy from ancient Terra. The life of a Navigator is one of duty and service to his clan, yet many would have it no other way, for they are never truly more alive than when ensconced in their navigation sanctum, gazing into the insane, swirling depths of the Immaterium, pitting their will and their wits against the ravening storm of energy and thought that lurks behind all things that others call real.</p><p>Thanks to their Warp Eye, they are able to pierce the veil between the Materium and the Immaterium, between reality and the nightmarish realms beyond. Able to perceive the warp’s shifting tides and impossible currents, he can guide a vessel by dint of his skill and the immeasurable aid of the light of the</p><p>Page 119</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>NAVIGATOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Navigator</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">66</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">NAVIS NOBILITE</a>, <a class="keyword">[HOUSE]</a>, <a class="keyword">PSYKER</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 3, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 3, Intimidation 2, Leadership 2, Pilot 2, Psychic Mastery 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.4eum881fNmhIsOmq]{Warp Guide}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.Gkvz8V1xP8wrBBk8]{Mesh Armour}, @UUID[Item.cgAJlyCsjH6xdX66]{Master-Crafted Laspistol}, @UUID[Item.9vfkaU0vc61t7hKO]{Force Stave}, @UUID[Item.vZp4dj9eXhFcVwOB]{Nobilite Robes (Clothing)}, @UUID[Item.hm72b4pxq5EzPYSu]{Emperor''s Tarot Deck (Psychic Focus)}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 4, Ballistic Skill 1, Insight 1, Intimidation 2, Leadership 2, Persuasion 3, Pilot 3, Psychic Mastery 3, Scholar 3, Tech 1, Weapon Skill 1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.Cr4n0fqlBRqeY0yY]{Ever Vigilant}, @UUID[Item.iiqjZLMe2IxQMth5]{Noble Peer}</td></tr></tbody></table>'
