      content: '<p>“The universe is not like a puzzle-box that you can take apart and put back together again and so solve its secrets. It is a shifting uncertain thing which changes as you consider it, which is changed by the very act of observation. A powerful man is not a man who dissects the universe like a puzzle-box, examining it piece by piece and measuring each piece with scientific precision. A powerful man has only to look upon the universe to change it.” –Technomagos Gaelos Through mathemantic rite and numerological prophecy, you discern the future from the raw data of today. From data, you glean knowledge. From knowledge, you attain comprehension. From comprehension, you achieve insight. A Logis (plural Logi) is a high-ranking Tech-priest skilled in mathematics and data analysis who serves in the role of a logistician, data analyst, or statistician. Their purpose is to predict future large-scale sociological or demographic trends and make forecasts about the required expenditure or other strategic needs. They are regarded as prophetic figures by the Cult Mechanicus. The skills of a Logis cannot be overstated. Through processing of vast amounts of data, a Logis is able to accurately determine possible futures to a degree of accuracy normally only seen amongst psykers specialising in divination. In conjunction with information gathered by Mechanicus informants across the Imperium, a Logis can discern opportunities and crises before they happen and determine the most effective uses for a Forge World’s resources. Given that a Forge World’s resources include Legions of Skitarii and Titans, many Logi serve as strategists, calculating the doctrine-imperatives that guide the Omnissiah’s forces to victory.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>LOGIS</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">109</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS MECHANICUS</a>, <a class="keyword">CULT MECHANICUS</a>, <a class="keyword">[FORGE WORLD]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Initiative 5</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Investigation 3, Scholar 3, Tech 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.4F1vi2tNHZXnBgbF]{Technoprophet}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.gp881IiZhvjfvLfF]{Omnissian Axe}, @UUID[Item.MRFMxRilqowga5ST]{Calculus Logi Implant}, any 3 augmetics, any one cybernetic of up to Availability 7 (Unique), @UUID[Item.jy00ECKFvu0ontTx]{Light Power Armour}, and any one weapon of up to Availability 6 (Very Rare).</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">4</td><td style="text-align:center">8</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 4, Ballistic Skill 2, Investigation 6, Scholar 4, Tech 5, Weapon Skill 2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.VcmG1mBiqXlqruCw]{Deductive}, @UUID[Item.vxsi953ncB48aylK]{Rite of Pure Thought}, @UUID[Item.MgRO6y7ytpHs03RT]{The Flesh is Weak}</td></tr></tbody></table>'
