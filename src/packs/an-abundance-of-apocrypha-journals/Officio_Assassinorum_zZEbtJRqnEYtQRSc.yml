use Agility instead of Toughness when you roll Determination, and you may roll Determination against Mortal Wounds.</p>\n<table style=\"width:99.1477%\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\">OFFICIO ASSASSINORUM ARCHETYPES</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td>Tier</td>\n<td>Archetype</td>\n<td>Description</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.mJV5p6NfEC21Ytfv]{Adamus Assassin}</td>\n<td>A deadly student of the first of the Assassin Temples.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.zQFDfr4wuKJ5XO94]{Callidus Assassin}</td>\n<td>The perfect infiltrator, able to reach even the most protected target.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.oAsZq4YqdhNieLig]{Culexus Assassin}</td>\n<td>Witch-slayer, wyrd-bane, living nightmare to all psykers.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.t0S6tZywkitZb9Kq]{Eversor Assassin}</td>\n<td>A living weapon altered and engineered to spread terror and death.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.kJ6oOBatTbHDoEIl]{Vanus Assassin}</td>\n<td>Strange assassins who kill with knowledge rather than weapons.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.9XDWDWUyqQVFra42]{Venenum Assassin}</td>\n<td>Masters of poison, able to tailor a unique death for every target.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.6nngMBTGKyZ0qZYq]{Vindicare Assassin}</td>\n<td>A master sniper, able to slay any target, anywhere.</td>\n</tr>\n<tr>\n<td style=\"text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\">OFFICIO ASSASSINORUM BACKGROUNDS</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td style=\"text-align:center\">[[/r d3]]</td>\n<td>Origin</td>\n<td style=\"text-align:right\">Gain +1</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">1</td>\n<td><strong>Progena:</strong> Your parents were stalwart servants of the Throne, and after their deaths, you were raised by the Schola Progenium. There, you demonstrated an aptitude for killing that set you apart.</td>\n<td style=\"text-align:right\">Resolve</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">2</td>\n<td><strong>Cultist:</strong> You were once a member of one of the countless death cults devoted to the God-Emperor's glory. Your existence was, and still is, devoted to slaying the Emperor's foes.</td>\n<td style=\"text-align:right\">Determination</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">3</td>\n<td><strong>Abandoned:</strong> Whatever your life before, at one point it ended, and you were left to fend for yourself. Learning to survive in such inhospitable condition has honed your instincts and hardened you for the duties you now perform.</td>\n<td style=\"text-align:right\">Max Wounds</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td style=\"text-align:center\">[[/r d3]]</td>\n<td>Accomplishment</td>\n<td style=\"text-align:right\">Gain +1</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">1</td>\n<td><strong>Target Eliminated:</strong> After extensive time and effort infiltrating their stronghold, you slew a mighty Champion of Chaos.</td>\n<td style=\"text-align:right\">Conviction</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">2</td>\n<td><strong>Target Eliminated:</strong> After tracking the enemy force across a dozen worlds, you assassinated a powerful Xenos warlord.</td>\n<td style=\"text-align:right\">Resolve</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">3</td>\n<td><strong>Target Eliminated:</strong> After infiltrating the depths of a world in rebellion, you made an example of the witch or demagogue at the heart of a rebellion.</td>\n<td style=\"text-align:right\">Max Shock</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td style=\"text-align:center\">[[/r d3]]</td>\n<td>Goal</td>\n<td style=\"text-align:right\">Gain +1</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">1</td>\n<td><strong>Target Acquired:</strong> You have little ambition beyond the annihilation of your next target in the Emperor's name.</td>\n<td style=\"text-align:right\">Conviction</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">2</td>\n<td><strong>Target Acquired:</strong> A target escaped you once. You cannot permit this failure to stain your service to the Emperor.</td>\n<td style=\"text-align:right\">Determination</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">3</td>\n<td><strong>Target Acquired:</strong> Of all the targets you have slain, one particular foe haunts your thoughts and fills your heart with rage. You crave each opportunity to slay targets that resemble that particular hated foe.</td>\n<td style=\"text-align:right\">Resolve</td>\n</tr>\n<tr style=\"background-color:#752322;color:#dddddd\">\n<td style=\"text-align:center\" colspan=\"3\">OFFICIO ASSASSINORUM OBJECTIVES</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td style=\"text-align:center\">[[/r d6]]</td>\n<td colspan=\"2\">Objective</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">1</td>\n<td colspan=\"2\">Conclude a combat without any surviving witnesses other than your allies.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">2</td>\n<td colspan=\"2\">Extol the superiority of your Temple's methods of dealing death.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">3</td>\n<td colspan=\"2\">Explain the how your assigned mission allows—or prohibits—a particular course of action.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">4</td>\n<td colspan=\"2\">Quote a motto or philosophy of your Temple.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td colspan=\"2\">Refuse to use overt methods to gain access to a location.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">6</td>\n<td colspan=\"2\">Maintain secrecy over your entire operation, refusing to reveal your identity or target to any but your immediate allies.</td>\n</tr>\n</tbody>\n</table>"
