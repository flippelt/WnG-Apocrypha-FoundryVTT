pages:
  - name: Officio Assassinorum
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: "<p>The Officio Assassinorum is a highly secretive agency of the Imperium of Man's government that employs different \"temples\" that train human Assassins to further the goals and protect the security of the Imperium of Man. Although the Inquisition strikes fear in the hearts of all Imperial citizens, loyal and corrupt alike, the deadly disciples of the Officio Assassinorum strike fear in the hearts of even the most savvy, battle-hardened of Imperial warriors.</p>\n<p>Assassins are typically deployed alone wherever feasible, having been trained to operate extensively behind enemy lines with no support. Given the sheer potential political power of this Adepta and the fact that its operatives are known to have been used against rival High Lords of Terra in the past, the authorization to assassinate a target must come from the very highest echelons of Imperial command. For this reason, Assassins are watched very closely to make sure that they are under the control of the Imperium.</p>\n<p><strong>The Emperor's Knives</strong></p>\n<p>The training of an Assassin is a long and arduous business. Almost every recruit is an orphan, taken from the wreckage of their former life among the population of a Death World, feral society, or Hive City, and transported to the Schola Progenium for tutelage. There, they train alongside the youths who will become the foremost agents of the Imperium. Life in the Scholas is extremely hard, a relentless grind of physical and mental challenge where only the strongest thrive. Taught to strive for excellence and obedience in all things, the minds and bodies of the recruits are sharpened to a killing edge whilst their spirit learns to embrace the Emperor as master and immortal father. Most of these intense young men and women go on to train as Militarum Tempestus Scions, Commissars or, in the most unusual cases, Inquisitors. Those of their number who are born killers, however, are instead appropriated by the shadowy figures that haunt each Selection Day. Those recruits are never seen again by their fellows. From that day onwards, their only true friend is death itself.</p>\n<p>Training starts even as the Assassinorum ships return to Terra, with the Officio instructors testing their prospective pupils mercilessly. The recruits must survive on limited food or air for solar days at a time. They must constantly fight each other in armed and unarmed combat, in conditions of total darkness or blinding light, zero gravity or crushing weight, stifling heat, or freezing cold. By the time of their arrival, there may be only a tenth of the prospective Assassins left, or sometimes—if the instructors deem every recruit to be unworthy—none.</p>\n<p>Upon arrival at Terra, the surviving Initiates begin the next stage of their training. Sailing past the space-borne basilicas, immense queues of pilgrim craft and military cordons that congest Terra's outer orbit, they are carried down into the Temples Assassinorum under the most advanced of shrouding protocols. In subterranean safehouses, these new recruits are divided amongst the hidden temples of the Officio Assassinorum. Each temple has its own ancient ways and mysteries, and each specialises in a different aspect of the art of murder. There are many such temples, some of which are known to the others and some that remain completely secret. There, the Initiates train for a full decade, labouring under the auspices of Lord Assassins so harsh they make the Drill Abbots of the Schola Progenium look like kindly uncles by comparison.</p>\n<p>The training procedure becomes ever more rigorous over the years as the temples test each candidate to their utmost limits. Days are spent battling with bone-wrenching exercise engines, fighting in deadly bouts, or mastering their tolerance for pain. Initiates must survive lengthy courses of psycho-indoctrination and aggressive hypnosis, undergo physical tests of ever-escalating severity, and digest vast quantities of information about the Imperium that will soon be their hunting ground. They must train in the most esoteric of weaponry and steel their bodies against the ravages of endless steroids and stimms. Even then, they have only scratched the surface of their temple's potential arsenal. The hidden orders of the Assassinorum conceal masterpieces of destruction, some of which were devised by the Primarchs, Malcador the Sigillite, and even the Emperor Himself. Truly, it is said that each temple houses a thousand deaths and more.</p>\n<p><strong>An Army of One</strong></p>\n<p>Unlike other warriors of the Imperium, who can focus on war and war alone, the Assassin must be truly autonomous. Once an operative is in the field, they must be able to cross the galaxy from one side to the other, by means fair or foul. They must not only master their own lethal calling, but also be proficient in a dozen others. They must know how to drive and sanctify everything from an armoured bike to a small spacecraft, must be able to convince truculent Machine Spirits to do their bidding, and clean, disassemble, and reconsecrate his wargear whenever necessary. They must have a professorial knowledge of the Imperium's history, organisation, and common languages. Their understanding of human anatomy must be complete, and every fact the Imperium has uncovered about the physicality of the xenos is bequeathed to him under oaths of secrecy. Few human minds can process such vast quantities of information, let alone master them. Not all survive the rigours of their training with their spirits intact, and many have fallen into madness at the sheer quantity of the trials they face. Yet an Initiate that joins the ranks of his temple's operatives will have all these skills at his command.</p>\n<p>Key to the uncanny might of the Assassin is the surgery they must undergo during their ten standard years of tutelage. Augmentative nodes are stitched into his brain, and sub-muscular acoustic surgery prepares his body for the punishment that will be visited upon him in the line of duty. The level of arcane technology necessary is perhaps the most advanced the Imperium can provide — for good reason, it is constrained to Holy Terra to minimise the chance of it being captured by the enemies of Humanity. It is well that such ancient techno-magicks are revered so and maintained with such painstaking care. Without them, the polymorphic drugs and reality-shifting devices used by the more esoteric temples would literally tear their operatives apart. Even if an Assassin survives his training, their leash is still held suffocatingly tight. Only by a successful petition to the High Lords of Terra themselves and a two-thirds majority in the subsequent vote can an Assassin be sanctioned and released into the galaxy to complete the task they was born to do.</p>\n<p>The fact that the ultimate luminaries of the Imperium give their direct attention to the deployment of a single individual shows just how exceptional these killers are. The records of the Officio temples are as detailed as they are scrupulous, a source of great pride to the masters that watch over them. Across the millennia, occasions where the despatch of an operative has not resulted in the desired result are extraordinarily few and far between. Be the target man, witch, beast or daemon, the result is the same, for an Imperial Assassin is death incarnate.</p>\n<p><strong>Assassinorum Conditioning</strong></p>\n<p>The extensive, even brutal regimen of training, surgery, chem-enhancement, and other arcane processes turns a human being into a living weapon of incomparable prowess. All @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.5NdLvU8CVlQVdKox]{OFFICIO ASSASSINORUM} characters receive the Assassinorum Conditioning rule, below:</p>\n<p>You add +Rank ED to all damage rolls, and you add +Double Rank to the damage value of your Unarmed Strikes. In addition, so long as you are not immobilised or Restrained, you may use Agility instead of Toughness when you roll Determination, and you may roll Determination against Mortal Wounds.</p>\n<table style=\"width:99.1477%\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\">OFFICIO ASSASSINORUM ARCHETYPES</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td>Tier</td>\n<td>Archetype</td>\n<td>Description</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.mJV5p6NfEC21Ytfv]{Adamus Assassin}</td>\n<td>A deadly student of the first of the Assassin Temples.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.zQFDfr4wuKJ5XO94]{Callidus Assassin}</td>\n<td>The perfect infiltrator, able to reach even the most protected target.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.oAsZq4YqdhNieLig]{Culexus Assassin}</td>\n<td>Witch-slayer, wyrd-bane, living nightmare to all psykers.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.t0S6tZywkitZb9Kq]{Eversor Assassin}</td>\n<td>A living weapon altered and engineered to spread terror and death.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.kJ6oOBatTbHDoEIl]{Vanus Assassin}</td>\n<td>Strange assassins who kill with knowledge rather than weapons.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.9XDWDWUyqQVFra42]{Venenum Assassin}</td>\n<td>Masters of poison, able to tailor a unique death for every target.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td>@UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-journals.JournalEntry.6nngMBTGKyZ0qZYq]{Vindicare Assassin}</td>\n<td>A master sniper, able to slay any target, anywhere.</td>\n</tr>\n<tr>\n<td style=\"text-align:center;background-color:#752322;color:#dddddd\" colspan=\"3\">OFFICIO ASSASSINORUM BACKGROUNDS</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td style=\"text-align:center\">[[/r d3]]</td>\n<td>Origin</td>\n<td style=\"text-align:right\">Gain +1</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">1</td>\n<td><strong>Progena:</strong> Your parents were stalwart servants of the Throne, and after their deaths, you were raised by the Schola Progenium. There, you demonstrated an aptitude for killing that set you apart.</td>\n<td style=\"text-align:right\">Resolve</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">2</td>\n<td><strong>Cultist:</strong> You were once a member of one of the countless death cults devoted to the God-Emperor's glory. Your existence was, and still is, devoted to slaying the Emperor's foes.</td>\n<td style=\"text-align:right\">Determination</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">3</td>\n<td><strong>Abandoned:</strong> Whatever your life before, at one point it ended, and you were left to fend for yourself. Learning to survive in such inhospitable condition has honed your instincts and hardened you for the duties you now perform.</td>\n<td style=\"text-align:right\">Max Wounds</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td style=\"text-align:center\">[[/r d3]]</td>\n<td>Accomplishment</td>\n<td style=\"text-align:right\">Gain +1</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">1</td>\n<td><strong>Target Eliminated:</strong> After extensive time and effort infiltrating their stronghold, you slew a mighty Champion of Chaos.</td>\n<td style=\"text-align:right\">Conviction</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">2</td>\n<td><strong>Target Eliminated:</strong> After tracking the enemy force across a dozen worlds, you assassinated a powerful Xenos warlord.</td>\n<td style=\"text-align:right\">Resolve</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">3</td>\n<td><strong>Target Eliminated:</strong> After infiltrating the depths of a world in rebellion, you made an example of the witch or demagogue at the heart of a rebellion.</td>\n<td style=\"text-align:right\">Max Shock</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td style=\"text-align:center\">[[/r d3]]</td>\n<td>Goal</td>\n<td style=\"text-align:right\">Gain +1</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">1</td>\n<td><strong>Target Acquired:</strong> You have little ambition beyond the annihilation of your next target in the Emperor's name.</td>\n<td style=\"text-align:right\">Conviction</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">2</td>\n<td><strong>Target Acquired:</strong> A target escaped you once. You cannot permit this failure to stain your service to the Emperor.</td>\n<td style=\"text-align:right\">Determination</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">3</td>\n<td><strong>Target Acquired:</strong> Of all the targets you have slain, one particular foe haunts your thoughts and fills your heart with rage. You crave each opportunity to slay targets that resemble that particular hated foe.</td>\n<td style=\"text-align:right\">Resolve</td>\n</tr>\n<tr style=\"background-color:#752322;color:#dddddd\">\n<td style=\"text-align:center\" colspan=\"3\">OFFICIO ASSASSINORUM OBJECTIVES</td>\n</tr>\n<tr style=\"background-color:#484746;color:#dddddd\">\n<td style=\"text-align:center\">[[/r d6]]</td>\n<td colspan=\"2\">Objective</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">1</td>\n<td colspan=\"2\">Conclude a combat without any surviving witnesses other than your allies.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">2</td>\n<td colspan=\"2\">Extol the superiority of your Temple's methods of dealing death.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">3</td>\n<td colspan=\"2\">Explain the how your assigned mission allows—or prohibits—a particular course of action.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">4</td>\n<td colspan=\"2\">Quote a motto or philosophy of your Temple.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td colspan=\"2\">Refuse to use overt methods to gain access to a location.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">6</td>\n<td colspan=\"2\">Maintain secrecy over your entire operation, refusing to reveal your identity or target to any but your immediate allies.</td>\n</tr>\n</tbody>\n</table>"
