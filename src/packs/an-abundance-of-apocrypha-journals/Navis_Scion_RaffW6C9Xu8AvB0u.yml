      content: '<p>“A pleasure to meet you, sir. Allow me to introduce myself. I am your charioteer, your gatekeeper to the stars. These trade conferences are such a bore, don’t you think? We have all week to discuss the trade routes of the Expanse. Would you care to join me in a glass of amasec? Wonderful! A toast—to our endeavours.” –Navigator Gadevellious Obrex, emissary of House Vor’cle Even amongst your rarefied kind, you are an elite scion of the Navigator Houses, wealthy and privileged beyond the imagining of all but the most powerful of the Imperium’s elite. You speak on behalf of your House, an institution that may date back to before the Imperium. Navigators are a fortunate few born into privilege, their politically affluent clans wellsprings of intrigue as grim and convoluted as their mutating bodies. While some Navigator Houses empower agents to act as intermediaries between themselves and Imperial society, others look within, selecting from among their number cunning Navigators who can wield the political influence of the House to greatest effect. Though the Navis Nobilite are a part of the Imperium, each Navigator House possesses great autonomy, and their influence and power is on par with the Imperium’s great Adepta. Thus, it is only natural that many Houses have diplomats and representatives for dealings with the larger Imperium. These Scions of the Navis Nobilite are the faces of the great Houses, groomed to act as diplomats and power brokers, seeing to it that their family’s interests are protected.</p><p>a great deal of attention on their many public outings. Fated to be the centre of attention in virtually any courtly setting, Scions revel in the gawking of onlookers, using their instant fame to woo potential allies and mock known foes. It is rare to see a Navigator in public, and rarer still to see one surrounded by an admiring (or simply curious) crowd. Whether regaling an audience with tales of travel beyond the reaches of the Imperium or wounding a boor’s pride with a witty remark, Navis Scions are exceptionally socially adroit.</p><p>Equally at home in the estates of the Navigator Houses or the courts of the Imperial elite, Navis Scions are masters of conversation and courtly protocol. Often selected from amongst their fellows based on their relative lack of disfiguring mutations as much as their social skills, these Navigators attract Page 177</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>NAVIS SCION</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Navigator</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">170</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">NAVIS NOBILITE</a>, <a class="keyword">[HOUSE]</a>, <a class="keyword">PSYKER</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 4, Intellect 4, Fellowship 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 4, Insight 2, Leadership 3, Persuasion 3, Pilot 2, Psychic Mastery 5</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.pYFwq5qVPEM0oQw0]{Elite Warp Guide}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.2B042fHI5jIAoQv9]{Refractor Field}, @UUID[Item.cgAJlyCsjH6xdX66]{Master-Crafted Laspistol}, @UUID[Item.9vfkaU0vc61t7hKO]{Force Stave}, @UUID[Item.vZp4dj9eXhFcVwOB]{Finest Nobilite Robes (Very Rare Clothing)}, @UUID[Item.hm72b4pxq5EzPYSu]{Emperors Tarot Deck (Psychic Focus)}, Wealth 4</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRI