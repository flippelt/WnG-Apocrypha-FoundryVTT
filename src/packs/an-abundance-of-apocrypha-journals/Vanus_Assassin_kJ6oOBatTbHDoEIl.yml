      content: '<p>"The cleanest kill is one that another performs in your stead, with no knowledge of your incitement." Dictatus Vanus Information is your weapon. With your advanced tools and techniques, you can identify the moments where your target is their most vulnerable, and engineer their demise from afar, without ever picking up a weapon. Like the other temples of the Officio Assassinorum, the Vanus Temple was originally the Vanus Clade, created some time during the Great Crusade in the late 30th Millennium at the behest of Malcador the Sigillite, the Regent of Terra, who was secretly the Grand Master of Assassins, and the clade''s first Director Primus, who was known only as "Sire Vanus" to the clade''s operatives. The Vanus Clade was established in a secret location on Terra at the direction of the Grand Master of Assassins and was tasked, like all of the Assassin clades, with killing those who opposed the formation of the Imperium of Man and the will of the Emperor of Mankind. The Vanus Clade was known for being able to remove the enemies of the Imperium through the manipulation of data rather than outright termination through the use of lethal force. Unknown to anyone outside their temple, the Vanus watched over all of the Imperium''s components, even the other Assassin Temples. Their cogitator-stacks were filled with terabytes of data on all of the temples'' operations and personnel. It was how they maintained their own position within the Officio Assassinorum when their operatives specialised in non-lethal operations -- through blackmail.</p><p>Page 205</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>VANUS ASSASSIN</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">5</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">390</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">OFFICIO ASSASSINORUM</a>, <a class="keyword">TEMPLUM VANUS</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 4, Toughness 4, Agility 5, Initiative 5, Willpower 5, Intellect 5</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 4, Ballistic Skill 4, Investigation 5, Scholar 5, Stealth 4, Tech 5, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.rWDZeJaWm4gRDrwJ]{Noospheric Interloper}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.cgAJlyCsjH6xdX66]{Master-Crafted Laspistol}, @UUID[Item.50gYnTefq7FohjIH]{Assassinorum Bodyglove}, Two Servo-Skulls, @UUID[Item.sEZkmLW7A5DyWqEY]{Augmetic Eye}, @UUID[Item.U768rngg15fmZYNA]{Augmetic Legs}, @UUID[Item.JZQ0eEkQf7hWxaD5]{Auger Array}, @UUID[Item.Ob9MSU52rFLhP7ft]{Cortex Implant}, @UUID[Item.oCFca0vTYRuxndzP]{Mechadendrite}, @UUID[Item.PDQKFWNXfOkCETDt]{Mind Impulse Unit}, @UUID[Item.UNBK7AIOB6DjM35a]{Sympatic Dataspikes}, @UUID[Item.HU5eD95NCrVvHFkj]{Vox-Disruptor Array}, @UUID[Item.PFm1FHjTVio0vo9A]{Auspectre}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">5</td><td style="text-align:center">6</td><td style="text-align:center">5</td><td style="text-align:center">6</td><td style="text-align:center">3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 5, Ballistic Skill 5, Cunning 3, Investigation 4, Pilot 2, Scholar 5, Stealth 4, Tech 6, Weapon Skill 4</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.AXqKMwrgsKMdohOw]{Acute Sense}, @UUID[Item.Mjor56Aijl63tHLs]{Identify Weakness}</td></tr></tbody></table>'
