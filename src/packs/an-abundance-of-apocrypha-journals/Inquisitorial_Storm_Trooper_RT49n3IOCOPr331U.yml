      content: <p>“Valkyrie Beta, begin low altitude insertion, fifty metres elevation. Squad Primus, prepare for low level jump. Last one on the dirt carries my pack!” –Sergeant Marcus Blaine, making his 100th assault drop You are an elite soldier in service to the Inquisition, trained by the Holy Ordos to secure their ships, their facilities, and their operations, and to carry out purges and eliminations. The Inquisition maintains a number of fortresses throughout the galaxy, both secret and known to the inhabitants of the Imperium. Inquisitorial Storm Troopers are used by the Inquisition to guard these fortresses and the Black Ships as they make their purity runs across the Imperium's sectors, as well as to augment an individual Inquisitor's personal forces with reliable and effective soldiers. Many Storm Troopers of particular skill are chosen to become an Inquisitor's Throne Agents. They are recruited from the Schola Progenium as well as certain families with a tradition of service to the Inquisition. They are trained and equipped in a manner similar to Tempestus Scions, albeit lacking the rapid insertion and infiltration skills, as they are not expected to undertake such types of missions. However, they undergo far more rigorous purity and incorruptibility tests prior to their induction, making them far more suitable for the needs of the Inquisition in combating the most insidious and corruping threats.</p>
