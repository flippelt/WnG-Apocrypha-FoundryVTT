      content: <p>“Votann set us amidst the heavens. The Ancestors mastered the void. The darkness between the stars holds no terror for us, for we are as much at home in the vacuum of space as we are with our boots firm upon planetary bedrock.” -</p><p>Grimnyr Yôtunn, before the departure of Jarvemm’s Prospect</p><p>You are revered among your Kin, as a source of wisdom, and a connection to the Ancestor Cores that guide your kind. Your cloneskein was engineered to allow you to operate the barrier-tech that permits you to bend the Warp to your will and commune with the Votann across interstellar distances. A Grimnyr, also known as a Living Ancestor, is a Kin of the Leagues of Votann who has been cloned with a psychoactive cloneskein that allows them to use limited psychic powers and draw on the energies of the Immaterium with the aid of the psychic technology known as barrier-tech. The Grimnyr also serve as the primary interlocutors with the Votann machine intelligences that guide the Leagues of Votann and to which their Ancestors' cerebral data is uploaded.</p><p>are able to rouse the fury of the Immaterium against the Kin's foes, much like other intelligent species' psykers. The Grimnyr are deeply respected for their wisdom and their abilities, and often serve as the leaders of Oathbands in their own right when the Kin go to war.</p><p>Since they are privy to the sacred wisdom of the Votann, they are as close to serving the function of priests or religious leaders in League society as the secular Kin get. Equipped with barrier-tech such as Ancestral Ward Staves and accompanied by two energy-focusing CORV robotic assistants, the Grimnyr</p>
