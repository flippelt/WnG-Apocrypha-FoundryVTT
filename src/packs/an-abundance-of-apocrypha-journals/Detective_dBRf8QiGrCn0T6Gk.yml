      content: <p>"No servant of the Emperor dies unavenged. No enemy of the Emperor escapes unpunished!" –Promise of the Pax Imperialis You are an investigator, a vigilant agent ever-watchful for those who would break the Emperor’s Law. Your gaze, extended through surveillance devices and networks of informants, allows you to find wrongdoers anywhere. The Adeptus Arbites are an extremely visible presence upon any world in the Imperium. Even on worlds where the Arbites are few in number, their facilities, their uniforms, and their actions are carefully designed to ensure that their presence is felt. No-one should feel as if the Arbites are too far away to worry about.</p><p>Some Detectives are skilled spies and infiltrators, operating undercover for long periods to unravel conspiracies. Others are experts in surveillance, utilising pict-captors, vox-thieves, bio-sniffers, and other tools to gather information. Others still cultivate networks of informants and spies, as well as agents provocateur and saboteurs to provoke or disrupt illegal activities.</p><p>This high-visibility presence is only part of the Arbites methodology, however. The organisation is also capable of employing subterfuge and deception to protect the order and stability of the Imperium. Detectives are a major part of this. Existing secretly within the hierarchy of the Adeptus Arbites, Detectives possess no distinctive uniform or common signifier to identify them as such, barring a crimson collar or lanyard which is only worn when amongst other Arbites. The remainder of the time, they are dressed as ordinary citizens or members of other Imperial organisations. They are the eyes and ears of the Law, moving about to see all the things that occur when people believe themselves away from the Arbites’ scrutiny.</p>
