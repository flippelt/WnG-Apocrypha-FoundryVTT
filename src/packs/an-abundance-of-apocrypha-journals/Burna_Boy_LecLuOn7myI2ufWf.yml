      content: '<p>"Look! Look, Nashrak! It’z burnin’ good an’ proppa now!" —Gargutz, Ork Burna Boy You love fire. You love it so much, that you want to share it with everyone you meet.</p><p>They serve a vital secondary role in this regard, cutting up battlefield salvage for later use.</p><p>Burna Boyz are those pyromaniacal Greenskins whose desire to burn and destroy grows to consume them entirely. Often, they join forces with Mekboyz who they depend on to keep them supplied with Promethium fuel and the heavy blow torch/flamethrowers known as Burnas that give them their name. These dedicated arsonists take great delight in setting fire to the enemy (and anybody and anything else they can lay their hands on if no enemy is available) and it takes a strong Warboss or the blackmailing powers of the Meks to keep them in line. However, the benefits of these lunatics in any Ork warband just about outweigh the risks of getting anywhere near them.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>BURNA BOY</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Ork</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">48</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">ORK</a>, <a class="keyword">[CLAN]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Toughness 3, Initiative 2</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Ballistic Skill 2, Tech 1, Weapon Skill 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.9YflQgzI04L6PaN7]{Da Burny Dance}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.BfcIQcvK9NflPkUI]{Burna}, @UUID[Item.YArm2VCihbVlLurI]{Ork Flak}, @UUID[Item.L7E0G56RBAn4Fmlv]{Stikkbomb}, @UUID[Item.L7E0G56RBAn4Fmlv]{Stikkbomb}, @UUID[Item.L7E0G56RBAn4Fmlv]{Stikkbomb}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">1</td><td style="text-align:center">2</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 1, Ballistic Skill 2, Cunning 1, Intimidation 1, Survival 1, Tech 2, Weapon Skill 4</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.3uI0Gw1jMR7J0GG6]{Brutalist}, @UUID[Item.P9uTwYByV17eTfzf]{More Dakka!}, @UUID[Item.bOIcPXwLQWQzDrKZ]{Trademark Weapon}</td></tr></tbody></table>'
