      content: '<p>"Yours is to heed the machine as others heed their kin. Tend to the war spirits all about, but do so in the knowledge that you do the Emperor’s duty. Without your ministrations, no bolt may be fired, and no enemy slain." Extract from the Apocrypha of Eons, Verse III, Chapter CIV You tend to the forms and spirits of the wargear and machines of your Chapter, much as Apothecaries and Chaplains tend to you and your brethren. A Techmarine is an Adeptus Astartes technician and engineer, a fully-initiated member of the Cult Mechanicus, as well as a full Battle-Brother of his Chapter. Space Marine Chapters identify prospective Techmarines from within their own companies, favouring those who show the greatest affinity for machines. These aspirants are then sent to Mars for thirty years of training, where they are taught the lore of the Machine God, how to divine the Runes of Engineering and the Liturgy of Maintenance. The</p><p>rituals, furthermore, have variations to cover every conceivable circumstance in battle. A fully-fledged Techmarine is expected to be able to "feel" the pain of a damaged machine and heal it. Techmarines pledge allegiance to both the Cult Mechanicus and their Chapter, which makes them something of an oddity among their battle-brothers. A Techmarine''s armour is modified to accommodate his cybernetic enhancements and his armour''s backpack is also upgraded with several servo-arms and mechadendrites. His armour bears the rust-red colours of the Adeptus Mechanicus, but his Chapter badge is retained and displayed on one of the shoulder guards, so as not to disrespect the armour''s spirit. PRIMARIS TECHMARINE</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>PRIMARIS TECHMARINE</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">5</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Primaris Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">403</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTARTES</a>, <a class="keyword">[CHAPTER]</a>, <a class="keyword">ADEPTUS MECHANICUS</a>, <a class="keyword">PRIMARIS</a>, <a class="keyword">CULT MECHANICUS</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 6, Toughness 6, Agility 5, Initiative 5, Willpower 3, Intellect 5</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 5, Pilot 2, Scholar 3, Stealth 3, Tech 4, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.rjmmcEJ6Q63W2Xxh]{Hymn of Reforging}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.v7KbIU7uRDRMkdUM]{Artificer Armour}, @UUID[Item.piwPtkisOSeJ47HV]{Heavy Bolt Pistol}, @UUID[Item.gp881IiZhvjfvLfF]{Omnissian Axe}, @UUID[Item.ut6nsTPR0xL4mfET]{Heavy Bolter}, @UUID[Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Item.SJ8UaYHEMtF71W1M]{Krak Grenade}, @UUID[Item.MYkAkn0Dye79EdmW]{Servo Arm}, any 2 augmetics.</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">—</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.qnFSOCg0b29eWJBz]{Armourbane}, @UUID[Item.sOuOMmWohMfOEFJv]{Augmetic}, @UUID[Item.7f6YZ8n6oolZxXup]{Binary Chatter}</td></tr></tbody></table>'
