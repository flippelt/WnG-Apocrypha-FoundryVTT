      content: '<p>“Let not the fear of death stay your hand nor defeat your courage. The warrior who will prevail is the one who conquers death, who becomes one with death as we have.” —Phoenix Lord Maugan Ra, the first Dark Reaper You embody Khaine’s aspect of the precise and inescapable nature of death. With unerring aim and bearing a deadly heavy weapon, there is little that can elude the death you bring. The Dark Reapers are descended from Maugan Ra, the Harvester of Souls, a mighty Phoenix Lord and the founder of their Shrines. It was from him that the Dark Reapers learned that even the mightiest of weapons can be wielded with the precision of a scalpel, and so they take pride in the accuracy with which they use their signature weapon, the Reaper Launcher. Spitting forth a hail of armour-piercing missiles capable of taking down even the best-protected foes, these weapons allow the Dark Reapers to exert total control over the battlefield and destroy targets at will. The Dark Reapers pride themselves on their accuracy. To absorb the recoil of firing the Launcher and maintain a steady firing position, the powered limb supports include lower leg armour and boots fitted with stabilisers and clamps to secure the Dark Reaper to the ground. Their helmet incorporates specialised rangefinding sensor vanes which extends out of the helmet of their Aspect Armour and allows a Dark Reaper to achieve target lock on even fast-moving vehicles.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>DARK REAPER ASPECT WARRIOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Aeldari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">92</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">ASURYANI</a>, <a class="keyword">[CRAFTWORLD]</a>, <a class="keyword">ASPECT WARRIOR</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Toughness 4, Willpower 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 3, Ballistic Skill 5</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.kelQOAC4AERyJyQX]{Inescapable Aim}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.KXn7FgD0ly6vLiOK]{Heavy Aspect Armour}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.j3MWWqJY6noM3eeM]{Reaper Launcher}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.op6w0MLZJCvjOSCv]{Dark Reaper Rangefinder}, @UUID[Compendium.wng-core.items.Item.3X5FaaFcfNmaEod4]{Mono Knife}, @UUID[Compendium.wng-core.items.Item.aIEl2xpESvkqyVEG]{Spirit Stone}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style=