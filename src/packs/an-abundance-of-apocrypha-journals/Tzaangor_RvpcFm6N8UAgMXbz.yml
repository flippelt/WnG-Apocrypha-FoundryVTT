      content: >-
        <blockquote><p>Every abomination is a creation of Tzeentch. Every
        twisted monstrosity a child of the Changer of Ways. If I could, I would
        devour the thoughts of them all, that I too might know the horror of
        their existence. But for me there is a different fate.</p><p
        style="text-align:right"><em>—— Hasophet, Sorcerer and Magister of the
        Mind-Eaters</em></p></blockquote><p>Tzaangors are bright of colouration
        and sharp of intellect. Their beaks clack as they chant blasphemous
        refrains in their dark tongues, gimlet eyes glowing in their aquiline
        skulls. They look to transcend their existences by seeking out the most
        powerful artefacts and priceless relics – in serving sorcerous masters,
        they may earn the chance to elevate themselves. However, a cruel streak
        resides within the soul of every Tzaangor, and their artistic
        pretensions are often set aside in favour of sheer, shocking
        brutality.</p><table style="width:98.9228%;height:239px"
        border="1"><tbody><tr class="table-header"
