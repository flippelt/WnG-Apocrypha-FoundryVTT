      content: >-
        <blockquote><p>It wouldn’t stop. No manner how many shots we put into
        it; we couldn’t bring it down. It just kept braying and bellowing and
        fighting.</p><p style="text-align:right"><em>—— Unknown Guardsman
        [executed], describing a Pestigor</em></p></blockquote><p><strong>You
        are special. Beloved. The Grandfather, the Filthbringer, the Poxmaker…
        he will protect you, give you a home and a purpose, if you protect his
        other children.</strong></p><p>Filthy, disease-ridden creatures,
        Pestigor are Beastmen devoted to Nurgle. Their fur and flesh are
        decaying and filled with parasites, their horns and claws are yellowed
        and deformed, and they are variously wasted or bloated depending on the
        diseases that infest them. Pestigor are often used as the guardians of
        temples and other profane sites devoted to Nurgle, and as bodyguards for
        cult leaders.</p><table style="width:98.9228%;height:239px"
        border="1"><tbody><tr class="table-header"
