      content: '<p>“Vanguard Maniple Rho-531-Theta deploying. Broadcast all-points bulletin to allied forces: radcleansing in progress, ambient radiance may be harmful to unaugmented personnel.” —Vanguard Alpha Primus Gamma-1B4-Epsilon In the Omnissiah’s name, you fight at the forefront of the Quest for Knowledge, armed with lethal and insidious irradiated weaponry which is as hazardous to your own flesh as it is deadly to your enemies. The Skitarii Vanguard, informally known as "Rad Troopers," serve as the front-line shock troops of the Skitarii cohorts of the Adeptus Mechanicus. They are feared throughout the Imperium, for they use the baleful radioactive energies of the Forge Worlds as their weapon and are capable of operating in the galaxy''s most hostile warzones. Equipped with pack generators that bleed potent radioactive by-products, these Omnissian martyrs are so saturated with radiation that even to approach them is to succumb to their peculiar curse. Their baroque carbines fill the air around their foe with harmful emanations, corrupting the atmosphere itself even as they punch hyper-irradiated shot into the flesh of their victims. Should their foes survive the worst of the shooting, critical levels of rad-poisoning may still be achieved by the very proximity of the Skitarii Vanguard, who will look on in silent interest as an enemy that thought the worst was over stumbles, chokes, and dies of radiation poisoning. Over the many civil wars waged by the Cult Mechanicus, the Vanguard have learned to endure and weaponise their lethal radioactive emissions. So much radiation bleeds out from a Skitarii Vanguard''s wargear that foes in close proximity become weakened and fatigued; for non-Skitarii to be stationed in the same barracks is a death sentence. The Vanguard themselves are theoretically safe inside their war plate, but on the rare occasions these warriors unscrew their helmets, the sight of their missing teeth and hairless, sore-pocked skin tells the awful truth. It is a price they willingly pay, for their devotion to the Machine God is absolute.</p><p>Page 130</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>SKITARIUS VANGUARD</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">28</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS MECHANICUS</a>, <a class="keyword">SKITARII</a>, <a class="keyword">[FORGE WORLD]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Toughness 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 0, Ballistic Skill 2, Tech 1</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.2pVq26LE2fDnmGIh]{Irradiated and Augmented}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.zKX9sRpwZgA7VWHG]{Radium Carbine}, @UUID[Item.2tLcmE0mdCXRK2Xs]{Data-Tether}, @UUID[Item.XDOzcaREldkBmek3]{Skitarii Auto-Cuirass}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 1, Awareness 1, Ballistic Skill 4, Medicae 1, Tech 3, Weapon Skill 1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.sOuOMmWohMfOEFJv]{Augmetic}, @UUID[Item.7f6YZ8n6oolZxXup]{Binary Chatter}, @UUID[Item.VLWzaaUTYv6c3X2A]{Conversational Cogitator}, @UUID[Item.xIQ6vW1k0kJoVdJ9]{Protector Imperative}</td></tr></tbody></table>'
