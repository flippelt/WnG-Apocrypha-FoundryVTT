  - name: Harlequins of the Laughing God
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: "<p>A Harlequin, known to their Aeldari kin as Rillietann, is a member of a very distinct sub-group of the Aeldari species who belongs to none of the existing Aeldari factions. They are the keepers of the Black Library and serve the enigmatic Aeldari deity called the Laughing God.</p>\n<p>The Harlequins see no distinction between art and war, and their outlook can best be explained by reference to the legend of the Fall; one of their self-appointed duties is to keep this legend alive through their performances. The central figure of Harlequin belief is Cegorach, the Great Harlequin -- also known as the Laughing God.</p>\n<p>None truly know how this strange being survived the birth of Slaanesh where the other Aeldari gods did not. However, every Harlequin is firm in the belief that Cegorach escaped into the bounds of the Webway, existing there still behind myriad disguises and mocking She Who Thirsts from behind the veil.</p>\n<p>The Laughing God is the only authority that the Harlequins recognise, and their every deed is thought to be in furtherance of his own inscrutable agenda. Harlequins are undeniably part of the Aeldari species, yet they owe no allegiance to any given Craftworld or Kabal.</p>\n<p>These enigmatic warriors are often credited with supernatural powers, and many amongst both Asuryani and Drukhari society believe that the Harlequins know most, if not all, of the secret paths through the endless maze of the Webway.</p>\n<p>They are welcomed by all of the other Aeldari factions, including the Drukhari of Commorragh and the Webway, and are known for their brightly coloured clothing, incredible agility (even for an Aeldari), and use of unusually powerful weapons. Harlequins always organise themselves into groups they call Troupes, which are led by a Troupe Master.</p>\n<h3>Masques &amp; Saedaths</h3>\n<p>Most of the Aeldari live with the bitter knowledge that their gods are gone, having abandoned them or been destroyed in the Fall. Almost unique among their kind, the Harlequins know that Cegorach survived the Fall, and even now plans for the salvation of the Aeldari species. With every passing year more Aeldari are drawn towards the way of the Harlequins, erasing their past identity and taking up the mask and motley of the Laughing God.</p>\n<p>A masque is an army and a company of dramatic players both. It has no formal leaders, being instead a collective of like-minded devotees of Cegorach. All know their duties through their familiarity with the traditional roles of the characters they have adopted. No Harlequin rules their fellows for long, for all possess an equal voice.</p>\n<p>A masque possesses a synergy unmatched in almost any other fighting formation, an instinctive bond grown between the Harlequins as they travel and perform together and unleashed on the battlefield in times of war and strife.</p>\n<p>Since the Fall, a place has traditionally been reserved in a masque's structure should a Solitaire lend their considerable abilities to a cause, but they are otherwise unchanged, centred around three distinct Saedaths: the Light, the Dark, and the Twilight. Each contains a different cast of characters, grouped by outlook and symbolism. This structure ensures that each member is aware their fellows' roles, upon both stage and battlefield.</p>\n<blockquote class=\"sidebar\">\n<h3><em>THE <a class=\"keyword\">[SAEDATH]</a> KEYWORD</em></h3>\n<p><em><a class=\"keyword\">THE DARK</a></em></p>\n<p><em><a class=\"keyword\">THE LIGHT</a></em></p>\n<p><em><a class=\"keyword\">THE TWILIGHT</a></em></p>\n</blockquote>\n<p>\_</p>\n<table style=\"width:99.1477%;height:983px\" border=\"1\">\n<tbody>\n<tr style=\"height:17px\">\n<td style=\"width:100.072%;height:17px;text-align:center;background-color:#1f3864;color:#dddddd\" colspan=\"3\">HARLEQUIN ARCHETYPES</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px\">Tier</td>\n<td style=\"width:64.6033%;height:17px\">Archetype</td>\n<td style=\"width:22.9595%;height:17px\">Description</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;text-align:center;height:51px\">4</td>\n<td style=\"width:64.6033%;height:51px\">Harlequin Player</td>\n<td style=\"width:22.9595%;height:51px\">All worlds are a stage to these enigmatic warrior-troubadours.</td>\n</tr>\n<tr style=\"height:84px\">\n<td style=\"width:12.509%;text-align:center;height:84px\">5</td>\n<td style=\"width:64.6033%;height:84px\">Harlequin Death Jester</td>\n<td style=\"width:22.9595%;height:84px\">The masterful leaders of Harlequin Troupes, enigmatic and deadly.</td>\n</tr>\n<tr style=\"height:67px\">\n<td style=\"width:12.509%;text-align:center;height:67px\">5</td>\n<td style=\"width:64.6033%;height:67px\">Harlequin Shadowseer</td>\n<td style=\"width:22.9595%;height:67px\">Seers who specialise in illusion, misdirection, and performance.</td>\n</tr>\n<tr style=\"height:67px\">\n<td style=\"width:12.509%;text-align:center;height:67px\">5</td>\n<td style=\"width:64.6033%;height:67px\">Harlequin Solitaire</td>\n<td style=\"width:22.9595%;height:67px\">Skull-faced killers with grim humour and deadly aim.</td>\n</tr>\n<tr style=\"height:68px\">\n<td style=\"width:12.509%;text-align:center;height:68px\">5</td>\n<td style=\"width:64.6033%;height:68px\">Harlequin Troupe Master</td>\n<td style=\"width:22.9595%;height:68px\">Accursed, for their soul goes to She Who Thirsts, and terrifyingly deadly.</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:100.072%;height:17px;text-align:center;background-color:#1f3864;color:#dddddd\" colspan=\"3\">HARLEQUIN BACKGROUNDS</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.6033%;height:17px\">Origin</td>\n<td style=\"width:22.9595%;height:17px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;height:34px;text-align:center\">1</td>\n<td style=\"width:64.6033%;height:34px\"><strong>Asuryani:</strong> You once walked the Paths of the Craftworlds, living a life of strict discipline.\_</td>\n<td style=\"width:22.9595%;height:34px;text-align:right\">Resolve</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;text-align:center;height:34px\">2</td>\n<td style=\"width:64.6033%;height:34px\"><strong>Drukhari: </strong>Though no longer, you once preyed upon dread and pain to sustain yourself.\_</td>\n<td style=\"width:22.9595%;text-align:right;height:34px\">Max Shock</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;text-align:center;height:34px\">3</td>\n<td style=\"width:64.6033%;height:34px\"><strong>Exodite:\_</strong>You once sought salvation through hard labour and a return to nature.\_</td>\n<td style=\"width:22.9595%;text-align:right;height:34px\">Determination</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.6033%;height:17px\">Accomplishment</td>\n<td style=\"width:22.9595%;height:17px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;height:34px;text-align:center\">1</td>\n<td style=\"width:64.6033%;height:34px\"><strong>The Dance Without End:</strong> You played a role within the tale of the Fall of the Aeldari and the birth of She Who Thirsts.</td>\n<td style=\"width:22.9595%;height:34px;text-align:right\">Conviction</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;height:51px;text-align:center\">2</td>\n<td style=\"width:64.6033%;height:51px\"><strong>The Black Library:\_</strong>You waylaid those who would seek to exploit or defile the most sacred repository of knowledge.\_</td>\n<td style=\"width:22.9595%;height:51px;text-align:right\">Passive Awareness</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;text-align:center;height:51px\">3</td>\n<td style=\"width:64.6033%;height:51px\"><strong>The War in Heaven:\_</strong>You have performed within the dance of the ancient birth of the Aeldari people, and their conflict with the Bloody-Handed God of War.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Max Wounds</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;height:17px;text-align:center\">[[/r d3]]</td>\n<td style=\"width:64.6033%;height:17px\">Goal</td>\n<td style=\"width:22.9595%;height:17px;text-align:right\">Gain +1</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;height:51px;text-align:center\">1</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Defy She Who Thirsts:</strong> Your eventual purpose is to thwart the machinations of The Great Enemy at some pivotal moment.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Conviction</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;height:51px;text-align:center\">2</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Enlightenment:\_</strong>You are fated to bring vital knowledge to a specific being at a vital time.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Determination</td>\n</tr>\n<tr style=\"height:51px\">\n<td style=\"width:12.509%;height:51px;text-align:center\">3</td>\n<td style=\"width:64.6033%;height:51px\"><strong>Reversal:\_</strong>An ally falls, an enemy is triumphant, and you had a part in it… but everyone knows that such ill-fortune presages a resurgent victory.</td>\n<td style=\"width:22.9595%;text-align:right;height:51px\">Resolve</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:100.072%;text-align:center;height:17px;background-color:#1f3864;color:#dddddd\" colspan=\"3\">HARLEQUIN OBJECTIVES</td>\n</tr>\n<tr style=\"height:17px;background-color:#484746;color:#dddddd\">\n<td style=\"width:12.509%;text-align:center;height:17px\">[[/r d6]]</td>\n<td style=\"width:87.5628%;height:17px\" colspan=\"2\">Objective\_</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">1</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Speak about your purpose or agenda in a cryptic or poetic fashion</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">2</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Compare your current situation to some event in the mythology or history of the Aeldari</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">3</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Challenge a foe to battle with theatrical flourish, including addressing them by the name of a villain from Aeldari legend.</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">4</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Pursue a course of action which seems strange or bizarre to others, purely because your role demands it</td>\n</tr>\n<tr style=\"height:34px\">\n<td style=\"width:12.509%;text-align:center;height:34px\">5</td>\n<td style=\"height:34px;width:87.5628%\" colspan=\"2\">Show mercy to a foe, or act ruthlessly to an ally, because it is your role to do so</td>\n</tr>\n<tr style=\"height:17px\">\n<td style=\"width:12.509%;text-align:center;height:17px\">6</td>\n<td style=\"height:17px;width:87.5628%\" colspan=\"2\">Enter battle with laughter on your lips</td>\n</tr>\n</tbody>\n</table>\n<p>\_</p>"
