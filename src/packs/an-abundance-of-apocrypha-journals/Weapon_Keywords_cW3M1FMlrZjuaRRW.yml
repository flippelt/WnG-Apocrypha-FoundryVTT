      content: >-
        <h4><span class="fontstyle0"><strong>Nurgle's
        Rot</strong></span></h4><p><span class="fontstyle0">Any Weapon with the
        </span><span class="fontstyle2">NURGLE </span><span
        class="fontstyle0">keyword and the </span><span
        class="fontstyle3">Inflict (Poisoned X) </span><span
        class="fontstyle0">Trait is coated in a mixture of virulent diseases and
        deadly warp-toxins. A character </span><span class="fontstyle3">Poisoned
        </span><span class="fontstyle0">by a </span><span
        class="fontstyle2">NURGLE </span><span class="fontstyle0">weapon suffers
        1d3 Mortal Wounds at the start of each of their
        turns.</span></p><p></p><p><span class="fontstyle2">PESTILENT
        </span><span class="fontstyle0">weapons with the Flamer trait do not
        inflict the </span><span class="fontstyle3">On Fire </span><span
        class="fontstyle0">condition. Rather, they inflict the </span><span
        class="fontstyle3">Poisoned 4 </span><span
        class="fontstyle0">condition.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Ancient Weapons</h4><p><span class="fontstyle0">Any Aeldari
        Weapon with the </span><span class="fontstyle2">ANCIENT </span><span
        class="fontstyle0">keyword predates the Fall of the Eldar and is
        normally only borne by the champions of the Asuryani and Anhrathe today.
        They will invariably draw attention to the wielder, especially if the
        wielder is not Aeldari</span>.<br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Ghost Weapons</h4><p><span class="fontstyle0">These mighty
        weapons draw power from the Soulstone of a Ghost Warrior wielder.
        Weapons with the </span><span class="fontstyle2">GHOST </span><span
        class="fontstyle0">keyword may only be wielded by Ghost Warrior
        characters.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Poisoned Weapons</h4><p><span class="fontstyle2">A selection
        of alternative Drukhari poisons is presented in the Reloads and
        Ammunition section, which can be applied to </span><span
        class="fontstyle0" style="color:rgb(112,0,0)">DRUKHARI </span><span
        class="fontstyle2">weapons with the Fleshbane and/or Inflict (Poisoned
        X) traits. Many Drukhari also add the Envenomed Blade upgrade to their
        </span><span class="fontstyle0" style="color:rgb(112,0,0)">BLADE
        </span><span class="fontstyle2">weapons</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Grav Weapons</h4><p><span class="fontstyle0">Grav-weaponry,
        also called Graviton weapons, are devastating graviton-based weapons
        employed by the Adeptus Astartes based on ancient and forgotten
        technology dating back to the time of the Dark Age of Technology.
        Manipulating the very nature of gravity itself, Grav-weaponry turns a
        target's mass against it, crushing it to pulp under its own weight. This
        is especially shocking when used against heavily armoured infantry like
        Terminators, as the hapless warrior is brutally crushed by the bulk of
        their ceramite plates until only a crimson trickle remains. Space Marine
        Chapters are among the few warriors of the Imperium to be gifted with
        the use of Grav-weaponry, and it is considered a sacred honour to wield
        such a potent weapon.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Las Weapons</h4><p><span class="fontstyle0">Laser weaponry
        commonly used by the Imperium comes in numerous small regional
        variations, typically referred to as Patterns. Different Forge Worlds
        and different industrial centres utilise different designs of weapon,
        and while all fundamentally based upon the same central technology.
        Within the Astra Militarum, and other forces that use lasweapons,
        different forces will come to favour different patterns for their rate
        of fire, power output, weight, effective range, and a variety of other
        factors.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Archaic Plasma Weapons</h4><p><span class="fontstyle0">Archaic
        Plasma Weapons: </span><span class="fontstyle2">Plasma weapon technology
        has varied considerably across the history of </span><span
        class="fontstyle3">Warhammer 40,000</span><span class="fontstyle2">.
        This section provides a number of different forms of plasma weapon, that
        reflect different ways that plasma weapons have functioned over the
        years.</span></p><p></p><ul><li><p><span class="fontstyle2">Mark I
        Plasma weapons are based on those introduced in </span><span
        class="fontstyle3">Codex: Chaos </span><span class="fontstyle2">in 1996,
        during </span><span class="fontstyle3">Warhammer 40,000</span><span
        class="fontstyle2">’s second edition. They have a higher rate of fire
        and are more deadly but are </span><span class="fontstyle5">much
        </span><span class="fontstyle2">more dangerous to
        use.</span></p></li><li><p><span class="fontstyle2">Mark II Plasma
        weapons are based on those presented in 2</span><span class="fontstyle2"
        style="font-size:7pt">nd </span><span class="fontstyle2">edition
        </span><span class="fontstyle3">Warhammer 40,000</span><span
        class="fontstyle2">, which could only fire on every other game
        turn.</span></p></li><li><p><span class="fontstyle2">Mark III Plasma
        weapons reflect the way these weapons functioned during 3</span><span
        class="fontstyle2" style="font-size:7pt">rd </span><span
        class="fontstyle2">edition </span><span class="fontstyle3">Warhammer
        40,000 </span><span class="fontstyle2">until the end of 7</span><span
        class="fontstyle2" style="font-size:7pt">th </span><span
        class="fontstyle2">edition.</span></p></li><li><p><span
        class="fontstyle2">The versions in the </span><span
        class="fontstyle3">Wrath &amp; Glory Core Rulebook </span><span
        class="fontstyle2">most closely resemble the plasma weapons seen in
        8</span><span class="fontstyle2" style="font-size:7pt">th </span><span
        class="fontstyle2">edition </span><span class="fontstyle3">Warhammer
        40,000 </span><span class="fontstyle2">onwards.</span>
        </p></li></ul><h4><br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        />Mk I Plasma Weapons</h4><p><span class="fontstyle0">These archaic
        models of plasma weapon were in common use by the Legiones Astartes
        during the Great Crusade and the early Horus Heresy. One a number of
        experimental forms of plasma weapon, this design emphasised lethality
        and destructive power at the expense of the user’s safety, with the
        weapon frequently overheating or losing magnetic containment during
        sustained use. As the Heresy wore on, these weapons fell out of use
        amongst the Loyalist forces, and the loyalist Mechanicum declared them
        </span><span class="fontstyle2">Fabrus Excommunicata</span><span
        class="fontstyle0">, and no longer blessed by the Machine God. However,
        the Traitor Legions continued to use these potent weapons, finding
        kinship with the savage and malevolent weapons’ spirits. In the
        41</span><span class="fontstyle0" style="font-size:7pt">st </span><span
        class="fontstyle0">Millennium, these weapons are no longer produced by
        the Imperium, but they can still be found in the hands of Traitor
        Legionaries.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Mk II Plasma Weapons</h4><p><span class="fontstyle0">During
        the latter years of the Heresy, early plasma weapons issued to Loyalist
        forces often incorporated more cautious, patient machine spirits which
        would prevent the weapon firing if there was risk of overheat. This
        drastically reduced the weapon’s effective fire rate, the weapons’
        firepower was still a valuable resource against Traitor forces, with
        users able to take cover or redeploy while the weapon was locked in a
        cooling cycle.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Special Issue Grenades</h4><p><span class="fontstyle0">A
        character seeking to acquire an </span><span class="fontstyle2">EXOTIC
        </span><span class="fontstyle0">grenade acquires only one such grenade,
        and must attempt a new test each time they wish to obtain more: you
        can’t resupply Vortex Grenades easily.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Splinter Weapons</h4><p><span class="fontstyle0">A selection
        of alternative Drukhari poisons is presented on page 393, which can be
        applied to </span><span class="fontstyle2">SPLINTER </span><span
        class="fontstyle0">weapons and weapons with the </span><span
        class="fontstyle3">Inflict (Poisoned X) </span><span
        class="fontstyle0">trait.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p><h4>Kustom Weapons</h4><p><span class="fontstyle0">MEK
        </span><span class="fontstyle2">weapons with the Supercharge trait are
        always considered to be in Supercharge mode: the firer cannot choose not
        to use it. The additional ED from the trait is included in the weapon’s
        profile.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p>
