      content: '<p>"Bought me a deffblasta off Rotskrag earlier. Nice little killa. Just ask Rotskrag, hur-hur." — Fat Druzka, Flash Git You’ve got the best guns, the best gear, and the shiniest gubbinz! There’s nothing in the universe that can stop you! Flash Gitz are an elite breed of Ork Nobz who are obsessed with their lovingly customised, ostentatiously polished and painted weapons known as Snazzguns that can potentially wipe out entire squads of infantry in a hail of fire. Unlike other Nobz, Flash Gitz prefer "more dakka" to being "stompier," that is to say, they prefer ranged fire over melee combat.</p><p>Many Flash Gitz love to flaunt their powerful weapons to other Orks, and they are often accompanied by welldressed Grots who often boast of their master''s achievements. Flash Gitz are sometimes kicked out of Ork tribes for their wealth and general obnoxious behaviour though, which can lead to them going down the path of a Freebooter.</p><p>They are powerful ranged heavy infantry troops for an Ork WAAAGH! Many Flash Gitz are members of the Bad Moons Clan, where they serve as the clan''s elite infantry. In addition to their powerful armament, Flash Gitz often wear garish armour, adorned with bionic eyes (usually called Gitfindas) and skull trophies mounted on their weapons or upon their back. Due to their hulking size and powerful musculature, which is typical for Ork Nobz, they are still capable close combatants with their Choppa Bayonets and Sluggas. Flash Gitz consider themselves to be at the top of Ork society, having accumulated large numbers of Ork teeth.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>FLASH GIT</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Ork</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">84</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">ORK</a>, <a class="keyword">[CLAN]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 4, Toughness 3, Agility 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Ballistic Skill 3, Cunning 2, Intimidation 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.fXne9x9JE91Sprr3]{Gun-Crazy Show-Off}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.d3GOnuTDuO2iEJwB]{Snazzgun}, @UUID[Compendium.wng-core.items.Item.zCg3aku6t9knvNIe]{Choppa}, @UUID[Compendium.wng-core.items.Item.OxabHaxEOYWyhBuJ]{‘Eavy Armour}, @UUID[Compendium.wng-core.items.Item.L7E0G56RBAn4Fmlv]{Stikkbomb}, @UUID[Compendium.wng-core.items.Item.ESy9otACCHOFVX8v]{Ammo Runt}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">1</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 1, Ballistic Skill 4, Cunning 3, Intimidation 3, Leadership 1, Tech 1, Weapon Skill 5</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.HYuKXdU1r5yNyRU1]{Die Hard}, @UUID[Compendium.wng-core.items.Item.P9uTwYByV17eTfzf]{More Dakka!}, @UUID[Compendium.wng-core.items.Item.bOIcPXwLQWQzDrKZ]{Trademark Weapon}</td></tr></tbody></table>'
