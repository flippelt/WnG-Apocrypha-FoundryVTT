      content: '<p>"''Ere ta blow stuff up!" — Anonymous Tankbusta There is nothing in life quite like the joy of making something explode. And the bigger the thing, the better it is to blow up. Tanks are some of the best things to explode, because they’re big and full of fuel and ammunition that makes the explosion even better! A Tankbusta (pl. Tankbustaz) is an Ork Boy who has become completely addicted to the thrill of destroying the armoured fighting vehicles of his foes. A Tankbusta’s desire to hunt down and slay the biggest, most dangerous tanks they can find echoes the primal instinct of the big game hunter. Indeed, as primitive hunters might claim a gruesome trophy from a fallen beast to better brag of its demise, so Tankbustaz will strip the choicest loot from the wreckage of a ruined tank. Colourful hull plates are hammered into crude armour, internal gubbins worn proudly as warrior jewellery, and the flayed skins of crewmen are draped round the Tankbustaz'' shoulders like pelts. They equip themselves extensively for dealing death to enemy armour—their whistling volleys of Rokkits, and lethal Tankbusta Bomb assaults can spell annihilation for even the heaviest enemy tanks.</p><p>Page 134</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>TANKBUSTA</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Ork</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">48</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">ORK</a>, <a class="keyword">[CLAN]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Toughness 3, Agility 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Ballistic Skill 2, Tech 1</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.ilooZTUfAJ1jdFRB]{Tank Hunter}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.MxPF7AKrctxn9qYw]{Rokkit Launcha}, @UUID[Compendium.wng-core.items.Item.YArm2VCihbVlLurI]{Ork Flak}, @UUID[Compendium.wng-core.items.Item.L7E0G56RBAn4Fmlv]{Stikkbomb}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.ScXqF3oyBi3qmPIQ]{Tankbusta Bomb}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">1</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 1, Ballistic Skill 3, Tech 2, Weapon Skill 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.3uI0Gw1jMR7J0GG6]{Brutalist}, @UU