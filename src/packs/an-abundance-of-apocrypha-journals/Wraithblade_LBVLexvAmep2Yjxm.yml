      content: '<p>"There are reasons why we fear to raise the dead: the rage of ghosts cannot truly die." — Spiritseer Aen-Tilian of the Craftworld Mengau-Tuis You were a warrior in life and must be once more. Your fury is eternal and cannot die while you are denied your mortal slumber. Only the blood of your enemies upon your blades can quiet your anger, and even then, only for a moment. The Wraithguard of the Craftworld Aeldari are not living warriors; they are artificial robotic constructs called Ghost Warriors created from the complex psycho-plastic material crafted by the Asuryani of the craftworlds known as wraithbone. Each Wraithguard has a Spirit Stone containing the soul of an elite Aeldari warrior that was drawn out of the Infinity Circuit of a craftworld. Amongst the most feared of Wraithguard are usually referred to as Wraithblades. Few Asuryani will speak their true name, Klaivaulch, for fear of inciting the wrath of Khaine. Tradition has it that each craftworld keeps these vengeful constructs apart from other ghost warriors so that the immortal anger that pervades their wraithbone shells does not taint those who might one day still attain peace when they are returned to the Infinity Circuit. When the call to war is heard, these beings are awakened by the most gifted Seers. Their Spirit Stones glow hot as the slow-burning anger of the dead flows through their cores. Once kindled, the wrath that animates their wraithbone bodies becomes an unstoppable fury that can only be quenched in the blood of their foe.</p><p>Page 208</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>WRAITHBLADE</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">5</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Asuryani Ghost Warrior</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">358</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">ASURYANI</a>, <a class="keyword">[CRAFTWORLD]</a>, <a class="keyword">WRAITH CONSTRUCT</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 9, Toughness 6, Agility 4, Initiative 5, Willpower 5</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 2, Intimidation 3, Psychic Mastery 2, Scholar 3, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.AiVqSYBRnFHNGOJd]{Deathless Fury}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.ITLQfWGwbXHWLCgq]{Force Shield}, @UUID[Item.HxU0ooYZKjBz87PA]{Ghostsword}, @UUID[Item.RIwnpOyP0thFNgaa]{Ghostaxe}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">9</td><td style="text-align:center">7</td><td style="text-align:center">4</td><td style="text-align:center">6</td><td style="text-align:center">6</td><td style="text-align:center">4</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td