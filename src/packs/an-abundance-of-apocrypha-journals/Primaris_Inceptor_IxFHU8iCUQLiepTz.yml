      content: '<p>“They shall be pure of heart and strong of body, untainted by doubt and unsullied by selfaggrandisement. They will be bright stars on the firmament of battle, Angels of Death whose shining wings bring swift annihilation to the enemies of Man. So it shall be for a thousand times for a thousand years, unto the very end of eternity and the extinction of mortal flesh." —From the foreword of the Codex Astartes You soar above the battlefield, delivering wrath and retribution to the Emperor’s foes, in torrents of bolter shells and plasma blasts. The roaring sound of your jump pack as you descend from the skies like a meteor is an omen for the destruction you will bring. The swiftest Primaris Marines, Inceptors are spearhead troops, arriving in battle from the skies and delivering a massive blow that leaves the enemy reeling as the second wave of troops arrive to drive home the attack. Equipped with heavy jump packs and the sturdy Gravis armour variant, Inceptors are able to withstand reentry from the edge of a planet’s atmosphere, plummeting into battle from far above at break-neck speeds. Many Inceptor squads use this to their advantage, descending within debris from orbital battles to disguise their approach. When they make planetfall, striking the ground with thunderous force, Inceptors unleash a torrent of fire from their twinned Assault Bolters, tearing foes apart in moments before the Inceptors leap to the skies again, seeking a new target.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>PRIMARIS INCEPTOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Primaris Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">230</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">PRIMARIS</a>, <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTARTES</a>, <a class="keyword">[CHAPTER]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 4, Initiative 4, Willpower 3, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 4, Pilot 1, Stealth 3, Weapon Skill 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.h9d4lzhDoNVhcYAF]{Meteoric Descent + Guns Blazing}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.3KXpwHWBLoEvtxrQ]{Gravis Mark X}, @UUID[Compendium.wng-core.items.Item.fYcfZQb8Um0jf6mK]{Jump Pack}, @UUID[Compendium.wng-core.items.Item.1oDvFKX7fVW8ic2R]{Grav-Chute}, @UUID[Compendium.wng-core.items.Item.J0Xgl53Iv9VYMCvl]{Assault Bolter}, @UUID[Compendium.wng-core.items.Item.J0Xgl53Iv9VYMCvl]{Assault Bolter}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.QmxMWePZwTGuhGzA]{Plasma Exterminator}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.QmxMWePZwTGuhGzA]{Plasma Exterminator}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;t