      content: '<p>“I do not love the blade for its form, or its keen edge, but only for that which it defends. Must we pay for existence with our very souls?” —Introspections upon Perfection, Kysaduras the Anchorite You embody Khaine’s aspect of the noble warrior seeking vengeance. You are prepared for battle at a moment’s notice, and you will not yield while your foe lives or while your people are threatened.</p><p>the Dire Avengers spend much of their time at their Aspect Shrine, meditating upon battle, studying the tactics and strategies of their ancestors, and practicing their skills at arms.</p><p>The Dire Avengers trace their lineage back to Asurmen, the first of the Phoenix Lords and founder of the Aspect Shrines. It is because of Asurmen that the Dire Avengers are the most common of the Aspect Warriors, as he founded more Shrines on more Craftworlds than any other Phoenix Lord.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>DIRE AVENGER ASPECT WARRIOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Aeldari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">116</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">ASURYANI</a>, <a class="keyword">[CRAFTWORLD]</a>, <a class="keyword">ASPECT WARRIOR</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Agility 4, Initiative 4, Willpower 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Ballistic Skill 4, Leadership 2, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.yIId8DI4WKuUmwh7]{Defensive Tactics}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.4CN52w3DuI2X6OwJ]{Aspect Armour}, @UUID[Item.XdrB9h9s94POpKJG]{Avenger Shuriken Catapult}, @UUID[Item.n7VOA8ihElkUJKNr]{Targeting Vane}, @UUID[Item.3X5FaaFcfNmaEod4]{Mono Knife}, @UUID[Item.IKeDfOaiJOeHPpK7]{Plasma Grenade}, @UUID[Item.aIEl2xpESvkqyVEG]{Spirit Stone}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 3, Ballistic Skill 5, Deception 1, Insight 1, Leadership 3, Scholar 2, Survival 3, Weapon Skill 5</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.Cr4n0fqlBRqeY0yY]{Ever Vigilant}, @UUID[Item.mhqXwjw4Kot0et9F]{Bladestorm}, @UUID[Item.zrCkrWGkMDPK1kOg]{Battle Focus}, @UUID[Item.1OzEfrtLvMDY3XgW]{Strike and Fade}</td></tr></tbody></table>'
