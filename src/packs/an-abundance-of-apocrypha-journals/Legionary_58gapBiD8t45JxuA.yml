      content: '<p>“Destroy, for the sake of Destruction. Kill, for the sake of Killing.” Unknown You are a traitor to the Imperium, a nightmarish parody of the Emperor’s Angels of Death, driven by the pursuit of revenge, your own ambition, or simple bloodlust to spread death and destruction across the galaxy. Traitor Legionaries, also sometimes called Chaos Space Marines, Renegade Marines, or Heretic Astartes, is a former Loyalist Space Marine of the Imperium of Man who has chosen to abandon the service of the Emperor of Mankind and dedicate himself to the service of Chaos to achieve his own ends. Such corrupt Astartes normally belong to one of the nine original Traitor Legions that betrayed the Emperor during the ancient civil war called the Horus Heresy more than 10,000 standard years ago, while others come from Space Marine Chapters created long after the Heresy ended that have turned Renegade. Chaos can corrupt Astartes of any time and place just as its siren call leads many lesser men to their damnation.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>LEGIONARY</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Adeptus Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">270</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">CHAOS</a>, <a class="keyword">[MARK OF CHAOS]</a>, <a class="keyword">HERETIC ASTARTES</a>, <a class="keyword">[LEGION]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 5, Initiative 5, Willpower 3, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 4, Intimidation 1, Stealth 3, Survival 1, Weapon Skill 5</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.KYpzYjcvI0g9qcHi]{Master of Slaughter}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.7Bp1rDIfKEB2MB9N]{Aquila Mk VII}, @UUID[Item.7b2xcPWBB7up65PM]{Bolt Pistol}, @UUID[Item.I7yC0O7DawbOznUf]{Boltgun}, @UUID[Item.cl2SkggR4PWY2pxi]{Astartes Chainsword}, @UUID[Item.4QVBQYWXXLyvFWkj]{Astartes Combat Knife}, @UUID[Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Item.SJ8UaYHEMtF71W1M]{Krak Grenade}, @UUID[Item.rpau9cBYrZi7Gf1V]{Grisly Trophies}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">—</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.5HchXpu60DlodyV8]{Disturbing Voice}, @UUID[Item.kj8Jm2JKxELokK4X]{Let The Galaxy Burn}, @UUID[Item.Et1