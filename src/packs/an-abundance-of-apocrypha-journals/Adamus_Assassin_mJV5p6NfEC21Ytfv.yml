      content: <p>“There is nothing as decisive as decapitation.” Dictatus Adamus You are the killing strike, the beheading blade. In the Emperor’s Name, you cut off the head of the enemy, leaving your foes leaderless and confused. The Adamus Temple, originally known as the Clade Adamus, was the oldest of the clades of the Officio Assassinorum during the Great Crusade and Horus Heresy. It is unclear whether it survives into the 41st Millennium as one of the Officio Assassinorum's present temples. Clade Adamus Assassins are master swordsmen and melee specialists, drawing on some of the most ancient blade-master traditions of Old Earth. A Clade Adamus Assassin is fast and absolutely lethal in melee, able to go toe-to-toe with almost any foe -- and defeat them with their Nemesii Blade.</p>
