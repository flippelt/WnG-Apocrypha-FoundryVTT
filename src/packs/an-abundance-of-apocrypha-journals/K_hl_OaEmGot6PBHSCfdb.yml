      content: '<p>“There’s three things that matter in this Galaxy: Family; Duty; Hearth. Every Kin lives by this code, and everyone who gets in the way, well, they can die by it just as easily.” You are a wise and skilled commander, charged with leading Oathbands into battle, whether for survival or profit. Your keen insights into the shape and flow of battle allow you to identify the deadliest threats. Kâhls are the commanders of the Oathbands and Expeditions of the Leagues of Votann. They are appointed from Leagues'' most skilled and dependable warriors and the Kâhls are subordinate only to their Kindred''s ruling Votannic Council.</p><p>Kâhl Annôkh of the Starbreaker Kindred</p><p>glance, and from bitter experience can select priority targets with pragmatic efficiency while directing their Kin in war. While the Leagues'' Oathbands are normally led by a Kâhl, a High Kâhl may command one, while also having a Kâhl serving beneath them.</p><p>Kin military doctrine emphasizes a leader''s ability to calmly assess enemy threats in the midst of battle, remaining stoic as they determine which hostiles pose the greatest threats to their efforts. Known as casting the Eye of the Ancestors, this technique allows Kin war leaders to judge at a glance which enemies are the most dangerous, where enemy fortifications are their weakest, and how to balance their resources in countering enemy threats. The greatest of these foes have nonetheless plagued the Kin for generations and have earned a strong Grudge from the Leagues of Votann. Sometimes Grudgebands are formed in order to fight these foes and settle the grudge. Kâhls that have been promoted to their League''s Votannic Council are known as High Kâhls and lead an entire Kindred. These old warriors have fought in countless wars and have witnessed firsthand much of the worst the galaxy has to offer. They are able to appraise the battlefield situation at a</p><p>Page 173</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>KÂHL (IRONKIN)</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Ironkin</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">230</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">LEAGUES OF VOTANN</a>, <a class="keyword">[LEAGUE]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Willpower 4, Intellect 3, Fellowship 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 3, Ballistic Skill 4, Leadership 4, Scholar 3, Tech 2, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.pY9cL3SdhxCrFkYE]{Eye of the Ancestors}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: any two VOTANN weapons with a Value of 7 or less and a Rarity of Very Rare or lower, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.O8YM5TlQrZK4qF3L]{Bastium Void Armour}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.8f3ohDBgzJ52ch3y]{Rampart Crest}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">6</td><td style="text-align:center">6</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">4</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 3, Ballistic Skill 5, Leadership 5, Scholar 4, Tech 3, Weapon Skill 5</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Compendium.wng-core.items.Item.VcmG1mBiqXlqruCw]{Deductive}, @UUID[Compendium.wng-core.items.Item.TLV6c8FJhbKFKKUK]{Tenacious}, @UUID[Compendium.wng-records1.items.Item.Mjor56Aijl63tHLs]{Identify Weakness}</td></tr></tbody></table>'
