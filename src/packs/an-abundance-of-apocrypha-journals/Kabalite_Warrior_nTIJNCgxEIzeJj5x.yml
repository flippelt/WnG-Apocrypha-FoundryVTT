    text:
      format: 1
      content: '<blockquote><p>A flawless shot, surgical in its precision, artistic in its placement, and splendidly sadistic in its timing. The wretched creature could not have known how near death it truly was.</p><p style="text-align:right"><em>—— Sarik Heshaq, commenting on a fellow Kabalite Warrior’s kill-log</em></p></blockquote><p><strong>You are one of the few cruel, deadly, and ruthless enough to have earned your way into the Kabals and get the chance to raid realspace. Your opportunities for glory and advancement have increased exponentially, but so too do the costs of failure</strong></p><p>Kabalite Warriors are the basic soldiers of a Dark Eldar Kabal. They make up the vast majority of the soldiers in a Kabal and perform any and all tasks too important to leave to the slaves.</p><p>The innate danger of simply living in Commorragh gives its citizens training as warriors from birth, their entire lives a constant fight for survival leaving even women and children to be better able to defend themselves than their Craftworld cousins. Kabalite Warriors are those who that have excelled enough to be noticed by a Sybarite. They are then granted increased status and inducted into the warriors of the Kabal. The Kabal furnishes weapons and armour in return for lifetime service to the Kabal. Despite this, the new warrior generally has no loyalty to the Sybarite, seeing them as just another stepping-stone to power in the Kabal.</p><div class="journal-image centered"><img src="modules/wng-apocrypha/assets/images/archetypes/Kabalite_Warriors_battle.webp" width="317" height="421" /></div><table style="width:98.9228%;height:239px" border="1"><tbody><tr class="table-header" style="height:16px;background-color:#7834a4"><td style="width:92.7291%;height:16px" colspan="8">KABALITE WARRIOR</td></tr><tr style="height:16px"><td style="background-color:#484745;color:white;text-align:center;width:26.5674%;height:16px" colspan="2">TIER</td><td style="width:8.3%;height:16px;text-align:center">1</td><td style="background-color:#484745;color:white;width:16.2617%;height:16px;text-align:center" colspan="2">SPECIES</td><td style="width:11.7268%;height:16px;text-align:center">Drukahri</td><td style="background-color:#484745;color:white;width:11.6223%;height:16px;text-align:center">XP Cost</td><td style="width:18.2509%;height:16px;text-align:center">38</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">DRUKHARI</a>, <a class="keyword">KABALITE</a>, <a class="keyword">[KABAL]</a></td></tr><tr style="height:16px;background-color:rgba(0, 0, 0, .2)"><td style="width:92.7291%;height:16px" colspan="8"><strong>ATTRIBUTE</strong>: Agility 3, Strength 2, Initiative 3</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>SKILLS</strong>: Ballistic Skill 2, Cunning 1, Intimidation 2</td></tr><tr style="height:16px;background-color:rgba(0, 0, 0, .2)"><td style="width:92.7291%;height:16px" colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.zzhEqN7W4Ft58HcN]{Innate Cruelty}</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>WARGEAR</strong>: Kabalite warsuit, splinter rifle, @UUID[Compendium.wng-core.items.Item.3X5FaaFcfNmaEod4]{Mono Knife}</td></tr><tr style="height:16px"><td class="table-header" style="width:51.1291%;height:16px;text-align:left;background-color:#7834a4" colspan="5"><strong>SUGGESTED ATTRIBUTES</strong></td><td style="background-color:#484745;color:white;text-align:center;width:23.3491%;height:16px" colspan="2">XP Cost</td><td style="width:18.2509%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)">32</td></tr><tr style="font-variant:small-caps;height:16px"><td style="background-color:#484745;color:white;width:14.0674%;height:16px">ATTRITBUTE</td><td style="width:12.5%;height:16px;