      content: '<p>"Who can truly return to the grace of the God-Emperor without the searing pain which accompanies having one''s sin revealed in His just light? This brand I have here is but a small thing by comparison, but the pain you feel should serve as a sufficient representation. Now, shall we begin?" –Marcus Danturian, Chastener of The Pendulum You are an interrogator, seeking to extract truth from those who transgress. Your methods are invasive, unpleasant, and often painful, and serve as a crucible through which impurity is removed from your subjects. A Chastener is an Arbites specialist who is skilled in psychology and medicine alike, to allow them to subdue and coerce wrongdoers, and to efficiently question them afterwards. Chasteners must be physically adept, skilled in non-lethal methods of combat and restraint, to ensure that they can dominate and control any suspect or prisoner they face, but they must also have keen wits and an iron will, for they must be able to defeat a suspect’s mind as well as their body to ensure that the truth is properly extracted. It would be shameful for a Chastener to cease questioning just because they had received the answers they wanted.</p><p>Beyond merely subduing and questioning suspects, a Chastener must be of a mind to rehabilitate them. While judgement and punishment will inevitably follow any confession, a suspect must come to accept that they have sinned and seek absolution in the judgement they receive. Those who are unrepentant will seek vengeance for their just punishment, but the penitent accepts the punishment as a necessary price to pay.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>CHASTENER</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">110</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ARBITES</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Toughness 3, Willpower 4, Fellowship 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Cunning 1, Insight 3, Intimidation 3, Medicae 1, Persuasion 2, Weapon Skill 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.zfap4vE4y4Cydod4]{Subdue and Interrogate}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.GlC8CChnYkuXUJ7o]{Arbites Carapace}, @UUID[Compendium.wng-core.items.Item.wSJOv4Sre6LbqbBF]{Shock Maul}, @UUID[Compendium.wng-core.items.Item.z8tIAF58HbO2X0ho]{Combat Shotgun}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.Q6W1Qr97wqUXwBi9]{Magnacles}, @UUID[Compendium.wng-core.items.Item.mSS6bpYoQb4KilrW]{Medikit}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.qRC8vHhJWuKSvOrj]{Book of Judgement (Abridged)}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="backgro