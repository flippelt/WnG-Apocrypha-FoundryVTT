  - name: Imperial Guard Officer
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: '<blockquote><p>A good soldier obeys without question. A good officer commands without doubt</p><p style="text-align:right"><em>—Tactica Imperium</em></p></blockquote><p><strong>You have been given the responsibility of commanding a platoon or more of Astra Militarum troopers. Their victories are your triumphs, and their failures are your shame. You must navigate the complex web of considerations – the orders of your superiors, the needs of your soldiers, and the stern gaze of the Commissar ensuring that your every act and word is a loyal one.</strong></p><p>Regimental officers hail from the same world as the troops they command, assuming officer rank at the initial formation of the regiment. Prior to this, they may have help positions of leadership within their world’s PDF, or otherwise had some other status or authority. This ensures that the common rank and file can look up to familiar leaders, which ensures that the regiment is a cohesive unit.</p><p>Lieutenants are the most junior officers on the field, controlling platoons and similarly sized groups. More senior officers—Captains, Majors, Colonels, and their regional equivalents—command increasingly more personnel.</p><p>In its basic form, this archetype represents a Lieutenant or similar junior officer. Ascending the career to higher tiers can be used to create higher-ranking officers.</p><div class="journal-image centered"><img src="modules/wng-apocrypha/assets/images/archetypes/ig-officer.webp" width="200" height="355" /></div><table style="width:98.9228%;height:234px" border="1"><tbody><tr class="table-header" style="height:16px"><td style="width:92.7291%;height:16px" colspan="8">IMPERIAL GUARD OFFICER</td></tr><tr style="height:16px"><td style="background-color:#484745;color:white;text-align:center;width:26.5674%;height:16px" colspan="2">TIER</td><td style="width:8.3%;height:16px;text-align:center">1</td><td style="background-color:#484745;color:white;width:16.2617%;height:16px;text-align:center" colspan="2">SPECIES</td><td style="width:11.7268%;height:16px;text-align:center">Human</td><td style="background-color:#484745;color:white;width:11.6223%;height:16px;text-align:center">XP Cost</td><td style="width:18.2509%;height:16px;text-align:center">22</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ASTRA MILITARUM</a>, <a class="keyword">[REGIMENT]</a></td></tr><tr style="height:16px;background-color:rgba(0, 0, 0, .2)"><td style="width:92.7291%;height:16px" colspan="8"><strong>ATTRIBUTES</strong>: Fellowship 3</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>SKILLS</strong>: Leadership 2, Weapon Skill 2</td></tr><tr style="height:16px;background-color:rgba(0, 0, 0, .2)"><td style="width:92.7291%;height:16px" colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.n1LOaDnxTkl8nl80]{Voice of Command}</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>WARGEAR</strong>: @Item[fLx8DzWDgWDZIMSK]{Flak Armour}, @UUID[Compendium.wng-core.items.Item.2B042fHI5jIAoQv9]{Refractor Field}, @UUID[Compendium.wng-core.items.Item.STrmO2xhRZgClDSR]{Laspistol}, @UUID[Compendium.wng-core.items.Item.rgcz2ZC60MEM8mao]{Chainsword}, @UUID[Compendium.wng-core.items.Item.drUoIw7l4vPyI9Zm]{Knife}, @UUID[Compendium.wng-core.items.Item.mOWPCO1mNXNKsGNa]{Munitorum-Issue Mess Kit}, Blanket, Grooming Kit, @UUID[Compendium.wng-core.items.Item.c6FVoY1JkbSd6iLh]{Uplifting Primer}, @UUID[Compendium.wng-core.items.Item.vsjZCbjBNivbeUhk]{Ration Packs x3}</td></tr><tr style="height:16px"><td class="table-header" style="width:51.1291%;height:16px;text-align:left" colspan="5"><strong>SUGGESTED ATTRIBUTES</strong></td><td style="background-color:#484745;color:white;text-align:center;width:23.3491%;height:16px" colspan="2">XP Cost</td><td style="width:18.2509%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)">36</td></tr><tr style="font-variant:small-caps;height:16px"><td style="background-color:#484745;color:white;width:14.0674%;height:16px">ATTRITBUTE</td><td style="width:12.5%;height:16px;text-align:center">S</td><td style="width:8.3%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)">T</td><td style="width:5.17241%;height:16px;text-align:center">A</td><td style="width:11.0893%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)">I</td><td style="width:11.7268%;height:16px;text-align:center">Wil</td><td style="width:11.6223%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)">Int</td><td style="width:18.2509%;height:16px;text-align:center">Fel</td></tr><tr style="height:16px"><td style="background-color:#484745;color:white;width:14.0674%;height:16px">RATING</td><td style="width:12.5%;height:16px;text-align:center">3</td><td style="width:8.3%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)">2</td><td style="width:5.17241%;height:16px;text-align:center">2</td><td style="width:11.0893%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)">3</td><td style="width:11.7268%;height:16px;text-align:center">2</td><td style="width:11.6223%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)">2</td><td style="width:18.2509%;height:16px;text-align:center">3</td></tr><tr style="height:16px"><td class="table-header" style="width:51.1291%;height:16px;text-align:left" colspan="5"><strong>SUGGESTED SKILLS</strong></td><td style="background-color:#484745;color:white;text-align:center;width:23.3491%;height:16px" colspan="2">XP Cost</td><td style="width:18.2509%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)">12</td></tr><tr style="height:16px"><td style="height:16px;width:92.7291%" colspan="8">Athletics 2, Awareness 1, Ballistic Skill 1, Leadership 2, Survival 1, Weapon Skill 2</td></tr><tr style="height:16px"><td class="table-header" style="width:92.7291%;height:16px" colspan="8">SUGGESTED TALENTS</td></tr><tr style="height:16px"><td style="height:16px;width:92.7291%" colspan="8">@UUID[Compendium.wng-core.items.Item.5HchXpu60DlodyV8]{Disturbing Voice}, @UUID[Compendium.wng-core.items.Item.cjIXYREw9Ar63CXc]{Supplicant}, @UUID[Compendium.wng-core.items.Item.JhtS9OxkxWcjILbK]{In His Name}</td></tr><tr style="height:16px"><td class="table-header" style="width:92.7291%;height:16px" colspan="8">ASTRA MILITARUM OFFICER ORDERS</td></tr><tr style="height:16px"><td style="height:16px;width:92.7291%" colspan="8"><p>All references to Rank in the orders below refer to the Rank of the character giving the order. A character may only benefit from one order at a time, and an order’s effects last only until the start of the officer’s next turn.</p></td></tr><tr style="height:16px;background-color:rgba(0, 0, 0, .2)"><td style="width:92.7291%;height:16px" colspan="8"><strong>TAKE AIM!</strong> The ally may re-roll Double Rank dice on their next aimed ranged attack.</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>BRING IT DOWN!</strong> The officer chooses a single enemy, and the ally adds +Rank ED to their next ranged attack against that target.</td></tr><tr style="height:16px;background-color:rgba(0, 0, 0, .2)"><td style="width:92.7291%;height:16px" colspan="8"><strong>FORWARDS, FOR THE EMPEROR!</strong> The ally may shoot as part of a run action as if their weapon had the Assault trait.</td></tr><tr style="height:16px"><td style="width:92.7291%;height:16px" colspan="8"><strong>MOVE! MOVE! MOVE!</strong> The ally adds +Rank to their Speed if they Run or Sprint in their next turn.</td></tr><tr style="height:16px;background-color:rgba(0, 0, 0, .2)"><td style="width:92.7291%;height:16px" colspan="8"><strong>FIX BAYONETS!</strong> The ally adds +Rank bonus dice to their next melee attack</td></tr></tbody></table>'
      markdown: ''
