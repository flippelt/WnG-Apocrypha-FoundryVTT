      content: '<p>“Burn the heretic from his lair. Put the torch to his foul idols and cast all that he treasures into the flames. Only then, when he realises the true cost of his perfidy, grant unto him the oblivion he deserves." —Zyphan Torl, Aggressor You push relentlessly towards the enemy, unleashing a perpetual storm of fire that few can withstand. Your heavy armour allows you to withstand the heaviest fighting, providing close support where it is needed most. Clad in heavy Gravis power armour, and armed with a fearsome array of weaponry, Primaris Aggressors are warriors armed to unleash overwhelming firepower at close range. They are used to counter-attack against enemy assaults, or to spearhead heavy advances into dense terrain, where the short range of their weaponry is of little detriment. Any who get past the fusillade of shells from the Aggressor’s Boltstorm Gauntlets and grenade launchers are met by the gauntlets themselves – a pair of crackling power fists, that tear through armour and crush flesh and bone with ease.</p><p>as they stride forward, their arms sending sweeping arcs of fire billowing out. Unlike other fire support troops, Aggressors’ armour allows them to fire effectively on the move, making them ideal for battles in confined spaces.</p><p>For especially dense terrain, or when facing foes that cover the ground in great number, Aggressor Squads will instead wear paired Flamestorm Gauntlets. When equipped this way, their armour''s raised shoulder guards protect against the inevitable flame backwash</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>PRIMARIS AGGRESSOR</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">4</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Primaris Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">228</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTARTES</a>, <a class="keyword">PRIMARIS</a>, <a class="keyword">[CHAPTER]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 4, Initiative 4, Willpower 3, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 4, Stealth 3, Weapon Skill 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.ItqbB5Sx0iMZY7em]{Firestorm}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.3KXpwHWBLoEvtxrQ]{Gravis Mark X}, @UUID[Item.Dh1HhVnPaURjpgTR]{Ammo Backpack}, @UUID[Item.2jQy9TaBC7sCVXqR]{Ballistic Appeasement Auto-Reliquary (Absolutis Pattern)}, @UUID[Item.u3MdK3DUuLG3DRBC]{Fragstorm Grenade Launcher}, @UUID[Item.uKOmopvbPBHioG98]{Auto-Boltstorm Gauntlet (Melee)}, @UUID[Item.O3nHflHmV3A3mlkw]{Auto-Boltstorm Gauntlet (Ranged)}, @UUID[Item.uKOmopvbPBHioG98]{Auto-Boltstorm Gauntlet (Melee)}, @UUID[Item.O3nHflHmV3A3mlkw]{Auto-Boltstorm Gauntlet (Ranged)}, @UUID[Item.BwMmcSwewxQApZ3j]{Flamestorm Gauntlet (Melee)}, @UUID[Item.1lQhZ1uzv8yZ9KrK]{Flamestorm Gauntlet (Ranged)}, @UUID[Item.BwMmcSwewxQApZ3j]{Flamestorm Gauntlet (Melee)}, @UUID[Item.1lQhZ1uzv8yZ9KrK]{Flamestorm Gauntlet (Ranged)}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="ba