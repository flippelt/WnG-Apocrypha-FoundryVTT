      content: '<p>Pain and death are illusions of the weak mind. While his gene-seed returns to the Chapter, a Marine cannot die. Without death, pain loses its relevance. He that may fight, heal him. He that may fight no more, give him peace. He that is dead, take from him the Chapter''s due. —Unknown Where your brothers’ duty to the Emperor is to defeat the foes before them, you have the solemn responsibility of guarding the flesh of your brethren and ensuring that their geneseed is preserved. Without your efforts, your Chapter could not endure. The Apothecary''s role is to serve as a field medic and bio-researcher. Along with being highly trained in medicine, they are elite warriors, the better to protect their brothers where the battle is hardest. It is the Apothecary''s duty to harvest from the bodies'' of fallen Marines the two implanted Progenoid glands,</p><p>allowing for the gene-seed material to be cultivated and re-implanted in a Neophyte. Apothecaries are greatly honoured within the Chapter, as they are responsible for maintaining the purity of its gene-seed. If its gene-seed were to become mutated, it could well bring the Chapter''s extinction or its fall to Chaos. Their skills and equipment, when combined with the added organs and resilience of a Space Marine, allow an Apothecary to perform battle surgery with a good chance of success.</p><p>APOTHECARY</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>SPACE MARINE APOTHECARY (APOCRYPHA VERSION)</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Adeptus Astartes</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">276</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS ASTARTES</a>, <a class="keyword">[CHAPTER]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 4, Initiative 5, Willpower 3, Intellect 5</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 3, Medicae 4, Scholar 2, Survival 3, Weapon Skill 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.qizxF6md6L6pX571]{Guard Thy Brethren}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.7Bp1rDIfKEB2MB9N]{Aquila Mk VII}, @UUID[Item.7b2xcPWBB7up65PM]{Bolt Pistol}, @UUID[Item.cl2SkggR4PWY2pxi]{Astartes Chainsword}, @UUID[Item.FnfADO0uOdin1YzG]{Narthecium}, @UUID[Item.guA3KHcdxqlTzvIJ]{Reductor}, @UUID[Item.oDG9YpSKSiSUFLIY]{Frag Grenade}, @UUID[Item.SJ8UaYHEMtF71W1M]{Krak Grenade}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td><td style="text-align:center"></td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED 