        <h4><span class="fontstyle0">DARK GIFTS</span></h4><p><span
        class="fontstyle2">Any item with the </span><span class="fontstyle0"
        style="color:rgb(112,0,0)">DARK GIFT </span><span
        class="fontstyle2">keyword cannot be lost or removed—they are
        permanently bound to the character. When you obtain a </span><span
        class="fontstyle0" style="color:rgb(112,0,0)">DARK GIFT </span><span
        class="fontstyle2">item, you must pass a Corruption Test with a DN equal
        to the Value.</span> <br
        style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"
        /></p>
