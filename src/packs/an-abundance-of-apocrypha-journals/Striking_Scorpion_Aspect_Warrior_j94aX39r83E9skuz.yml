      content: <p>"Attack swiftly, and without warning. This is the mantra of the striking scorpions -- it is the way of all our kind." — Aulriel Doomhand, Striking Scorpions Exarch You are a silent hunter, a predator stalking prey upon battlefields across the galaxy. When you strike, it is against foes who did not suspect you were there. The Striking Scorpions are one of the forms of Aspect Warriors used by the Aeldari, focusing on the close combat aspect of battle. They epitomise the deadly attributes of their namesake, which can sting and kill a creature many times its size. Preferring to stalk their enemy and strike at them from the shadows, they are merciless killers who revel in the hunt and the kill.</p><p>the patience necessary to become consummate hunters. Karandras would be responsible for spreading this new teaching and installing new Aspect Shrines on the Aeldari Craftworlds.</p><p>The history of the Striking Scorpions is shrouded in infamy from their very beginning. The founder of their Aspect Shrine, Arhra, was lured to darkness and betrayed Asurmen and the other, Asurya, by bringing daemons into the First Shrine to wage war upon his fellow Phoenix Lords. Those loyal to Asurmen were defeated and scattered across the stars, but Arhra himself would eventually flee into the Webway, becoming "the Fallen Phoenix who burns with the dark light of Chaos." In his place rose Karandras, Arhra's greatest pupil, who would give the Striking Scorpions their current form by tempering the murderous nature instilled by the former master with</p><p>Page 161</p>
