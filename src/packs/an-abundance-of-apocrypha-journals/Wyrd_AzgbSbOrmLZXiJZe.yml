      content: '<p>“Some call me witch, some call me wyrd, some call me worse things. But they’ve all got coin when they think I’ll give them an edge.” — “Mama” Magritte, local Wyrd outside Fool’s Delving, Hive Primus, Necromunda You can feel the Warp, and it sometimes listens to you. You’re quick to hide when the authorities come looking, but for everyone else your powers are an open secret, denounced in public but fetching a tidy sum in private. With every passing generation of humanity, more and more psykers are born, and not all of them are captured and sent to the Blackships to be tested and carried to Terra. A proportion, growing year by year, stay on their homeworlds, often lending their powers to any who can pay. While humanity has long feared the witch and the sorcerer, greed and desperation can override that fear, and many worlds still maintain ancient, heretical traditions of spirit-talkers, fortune-tellers, mysterious hermits, and wise old crones. Communities often hold these figures at arm’s length, never accepting them, but unwilling to cast them out entirely. Part of this is pragmatism—a wyrd’s powers can be quite useful— but part of it is fear that an outcast witch might return seeking vengeance. Still, such relationships are tenuous at best, and a season’s misfortune for a community can often lead to people casting blame upon a wyrd, with an angry mob following soon after.</p><p>Page 98</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>WYRD</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">1</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">14</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">SCUM</a>, <a class="keyword">PSYKER</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Cunning 1, Psychic Mastery 1</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.gQX1uw6dzoJ6tjg6]{Self-Taught Witchcraft}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.3X5FaaFcfNmaEod4]{Mono Knife}, @UUID[Item.BpQ1EYnjQP61Edvp]{Stubber}, @UUID[Item.STrmO2xhRZgClDSR]{Laspistol}, @UUID[Item.vZp4dj9eXhFcVwOB]{Common Clothing}, @UUID[Item.2gY4DbBLU5UCWmNH]{Spook}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 1, Cunning 2, Deception 1, Insight 1, Intimidation 1, Psychic Mastery 3, Scholar 1, Survival 1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colsp