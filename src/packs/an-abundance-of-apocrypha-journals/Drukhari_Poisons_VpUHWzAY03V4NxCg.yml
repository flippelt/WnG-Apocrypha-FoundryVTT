      content: >-
        <p>These upgrades may be used on any DRUKHARI weapon with the Fleshbane
        trait or with the Inflict (Poisoned X), applying an additional effect
        upon any target who suffers one or more wounds from the weapon. This
        adds the Inflict (Poisoned 3) trait to the weapon, if it does not
        already have that trait or a better version, and applies a specific
        effect determined by the poison.</p>
