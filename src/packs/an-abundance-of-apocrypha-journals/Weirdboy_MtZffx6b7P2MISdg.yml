      content: '<p>"Too much noise! Too much! I fink I''z gunna...I''z gunna...WAAAGH!" — Weirdboy Gazrog Your brain hurts. All the other Orks are boiling over with aggression, and every shout and every thrill of excitement they feel goes straight to your brain, like you’re a lightning rod for all their fury. But that power has to go somewhere, and you’ve learned that when it gets too much, you can make all that power do things… strange things. A Weirdboy is one of the Orks'' psykers, unique in that he acts as a psychic sponge, absorbing and channelling the natural psychic energies constantly emanated by other Orks. Weirdboyz are the most psychically attuned of all Orks. Weirdboyz unconsciously channel the background mental emissions of nearby Greenskins.</p><p>maturity will have learned how to release his powers in a searing energy blast or destructive wave. Though this makes the Weirdboy feel fantastic, it can result in a messy death for anyone in his vicinity. Some Weirdboyz, known as "Warpheads," become addicted to the thrill of spewing WAAAGH! energy, actively seeking out the deadly rush of battle. For whatever reason, unlike normal Weirdboyz, Warpheads have survived enough battles for their minds to become saturated with the power of the Warp, and actually revel in and enjoy the use of their powers.</p><p>Even a close-run Squig-eating contest between two rowdy Boyz will cause waves of energy to pulse through any Weirdboy that strays near. Unless the Weirdboy finds some way to release this pent-up energy his head will explode, detonating the heads of nearby Orks into the bargain. This can prove highly inconvenient. Any Weirdboy lucky enough to reach</p><p>FLASH GIT</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>WEIRDBOY</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">3</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Ork</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">66</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">ORK</a>, <a class="keyword">[CLAN]</a>, <a class="keyword">PSYKER</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Toughness 3, Willpower 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Psychic Mastery 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.azsCeQ3cBMa7erhQ]{The Power of the WAAAGH!}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-core.items.Item.hcBcWZWTv5r4dgfr]{Weirdboy Staff}, @UUID[Compendium.wng-core.items.Item.YArm2VCihbVlLurI]{Ork Flak}, Collection of Jangly Baubles</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">5</td><td style="text-align:center">5</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">6</td><td style="text-align:center">1</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 2, Intimidation 3, Psychic Mastery 5, Survival 2, Weapon Skill 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">—</td></tr></tbody></table>'
