      content: '<p>Intellect is the Understanding of Knowledge —The Fourth Universal Law of the Cult Mechanicus You are a voracious consumer of information, collating and compiling vast quantities of data and processing it within your augmented, highly-trained mind to glean valuable insights from endless facts and figures. There are few things worth knowing that can elude your scrutiny. Calculus Logi are a form of Lexmechanic, a lower order of Tech-Priest devoted to gathering and compiling data so that it can be entered into a central Cogitator repository, noospheric archive, infocrypt, or other store of information. The precise differences between a Lexmechanic and a Calculus Logi are… difficult to describe, at least to any outside the baroque and bewilderingly-complex hierarchies of the Adeptus Mechanicus. Regardless, they work with computer-like speed and accuracy, assembling battle reports, economic statistics, planetary reports, and other masses of necessary if mundane data required to keep the massive bureaucracy of the Imperium functioning from day to day. Outside of the Adeptus Mechanicus, their skills are valued across the Imperium.</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>CALCULUS LOGI</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">44</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">ADEPTUS MECHANICUS</a>, <a class="keyword">[FORGE WORLD]</a>, <a class="keyword">CULT MECHANICUS</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Willpower 2, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Investigation 1, Scholar 3, Tech 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.RHxoqOJP0dNSFs2m]{Infovore}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.QxzWGAgSlRBLa3L7]{Calculus Logi Implant}, @UUID[Item.oCFca0vTYRuxndzP]{Mechadendrite}, One Optical, any two Augmetics, @UUID[Item.Gkvz8V1xP8wrBBk8]{Mesh Armour}, @UUID[Item.STrmO2xhRZgClDSR]{Laspistol}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">1</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">5</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 2, Insight 2, Investigation 2, Scholar 5, Tech 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.sOuOMmWohMfOEFJv]{Augmetic}, @UUID[Item.VLWzaaUTYv6c3X2A]{Conversational Cogitator}, @UUID[Item.l4Fp0OzFPXVY2LdK]{Unremarkable}, @UUID[Item.vxsi953ncB48aylK]{Rite of Pure Thought}