      content: '<p>“Fear me, for I am your apocalypse”. Dictatus Eversor When you are given a target, your role is to turn that target into a cautionary tale for the foes of the Imperium, a crimson example that cannot be ignored. Eversor Assassins are the most gruesome products of the Officio Assassinorum. They are drug crazed killing monsters, enhanced by bio-engineering and experimental surgical procedures. Their state of mind is amplified to turn a mere dislike for the enemy into raging hatred, or the wish to serve the Imperium into suicidal determination. Their main objective on the battlefield is to rip out the heart of an enemy operation in the most unsubtle way. By slaughtering all enemies in the vicinity, they ensure the command structure is entirely destroyed.</p><p>implanted with adrenal ducts, which speed up the brain''s higher functions, allowing the Eversor to make complex calculations and tactical decisions in seconds. The adrenal ducts are also able to feed the brain, allowing the assassin to work briefly in a hard vacuum. In addition, a secondary heart is implanted in order to help the assassin''s body cope with the various changes and to act as a fail-safe in case the primary heart is damaged in combat.</p><p>These berserk killers are trained to be utterly ruthless and completely dedicated to the Imperium. In addition, specialized use of genetic engineering and human biology result in the Eversors'' modification to be more efficient killers making them almost superhuman. Their bodies are modified to make them superb killing machines and include augmentations that strain the limits of their human physiology through the use of bionics and genetic alterations; the assassin is</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>EVERSOR ASSASSIN</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">5</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">320</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">OFFICIO ASSASSINORUM</a>, <a class="keyword">TEMPLUM EVERSOR</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 5, Toughness 5, Agility 5, Initiative 5, Willpower 4</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 2, Ballistic Skill 5, Intimidation 2, Scholar 1, Stealth 4, Survival 3, Tech 1, Weapon Skill 5</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.bo62XgOUuTpis014]{Hyper-Metabolism}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.tvECN1cFLZoS6z8O]{Augmetic Viscera}, @UUID[Item.JqeKArmZ4gqZl8u3]{Cardioproxy}, @UUID[Item.sZjriYwtvnDCpeoC]{Reflex Catalyst}, @UUID[Item.UEhKDQO8DRg9XvTz]{Sinew Armature}, @UUID[Item.T9NUw7WIfBg7EymX]{Executioner Pistol (Bolt)}, @UUID[Item.9m96XdsDMludIdsb]{Executioner Pistol (Needler)}, @UUID[Item.KtsbWNhngqmwKcDN]{Sentinel Array}, @UUID[Item.P3Eo6PH1UsIxuWQT]{Neuro-Gauntlet}, @UUID[Item.yGdYJq6FWVgYE7GA]{Power Sword}, @UUID[Item.ymCGa2JdK8qvqwhr]{Melta Bomb}, @UUID[Item.1HdUYd8P3yCGg54q]{Eversor Combat Drugs}, @UUID[Item.Ajtggkr0puG5wXq1]{Eversor Combat Drugs (Destroyer)}, @UUID[Item.yiuQNXog64W8ff3x]{Eversor Combat Drugs (Fury)}, @UUID[Item.6hN8iCuReOEki61b]{Eversor Combat Drugs (Terminus)}, @UUID[Item.50gYnTefq7FohjIH]{Assassinorum Bodyglove}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="backgrou