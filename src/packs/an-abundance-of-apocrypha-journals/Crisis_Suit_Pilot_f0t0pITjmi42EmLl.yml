      content: '<p>It is not our technology that will enable us to prevail in this galaxy. It is our shared sense of honour and commonality of cause that unites us and will give us the power to defeat our enemies. — Shas''el Sa''cea Or''es, Fire caste commander You are an elite warrior of the T’au Empire, a member of the Fire Caste. You have passed your first Trial By Fire and been granted the right to pilot a Crisis Suit into battle, striking at the heart of the enemy. To the T''au, the XV8 Crisis Battlesuit is more than just a powerful weapon of war; it is also a symbol of great achievement. Being allowed to pilot an XV8 Crisis Battlesuit is considered a high honour by the T''au Fire Caste and is only granted to those Fire Warriors who have earned the rank and privilege required to be granted this responsibility.</p><p>Becoming an XV8 Crisis Battlesuit pilot is one of the first steps to becoming a T''au officer, and those who take that step are experienced warriors who have fought the deadliest of foes and triumphed. Once a Fire Warrior has proven himself ready for more responsibility in a second Trial by Fire, he will then be promoted to the rank of Shas’vre and lead his own XV8 Crisis Battlesuit Team. If he succeeds at that demanding role, he will go on to be assigned to a T''au Commander''s Battlesuit Bodyguard Team, and eventually will become a T''au Commander himself once he attains the rank of Shas''el.</p><p>Such a privilege can only be attained after several Terran years of progressing through the ranks of the Fire Caste as a Fire Warrior. A Fire Warrior will normally follow a standard rate of progression and advancement in the T''au military that is based around an evaluation of their skills called a "Trial by Fire." It is only once a Fire Warrior has proven himself in battle and completed his first Trial by Fire to earn the Fire Caste rank of Shas’ui that he is then given the honour of piloting an XV8 Crisis Battlesuit and becoming a member of the Fire Caste’s elite. This is the aspiration of every Fire caste warrior -- recognition of a mastery of the Code of Fire and noble service to the Greater Good.</p><p>Page 111</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>CRISIS SUIT PILOT</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Shas T''au</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">64</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">T''AU EMPIRE</a>, <a class="keyword">FIRE CASTE</a>, <a class="keyword">[SEPT]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Toughness 2, Agility 3, Initiative 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Awareness 2, Ballistic Skill 3, Pilot 2, Tech 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.SjlZRBSgcNZXlmzY]{A Multitude of Weapons}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.VgEv4bhJtRsfO4V2]{XV8 Crisis Battlesuit}, @UUID[Item.iBMOSMdFZnzZAFiJ]{Burst Cannon}, @UUID[Item.PNuRVySQECjcHkMZ]{T’au Flamer}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align:center">3</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">2</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 3, Ballistic Skill 4, Leadership 1, Pilot 2, Survival 2, Tech 2, Weapon Skill 1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.aX9bq2t854Kb7L0i]{Dual Wield}, @UUID[Item.7UGuNT8yY0OZXQJq]{Dynamic Offensive}, @UUID[Item.1OzEfrtLvMDY3XgW]{Strike and Fade}</td></tr></tbody></table>'
