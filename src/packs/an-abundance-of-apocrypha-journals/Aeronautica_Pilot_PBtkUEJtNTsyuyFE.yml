      content: '<p>“This is Fury Squadron commencing fly-over, don’t worry Colonel, we’ve got you covered.” —Flight Lieutenant Bayde, 104th “Fury” Thunderbolt Squadron Sat in the cockpit of your aircraft, you are a terror for the enemies of the Emperor, descending from the skies to strike down your target. All across the Emperor''s vast interstellar realm, desperate aerial combat is fought; wings of fighters and bombers sally forth from ground bases and void ships in relentless waves, adding their meagre strength to that gone before them, hoping against hope to tip the balance in their favour and gain some miniscule measure of supremacy that might lead to a lasting conquest. No amount of training can prepare a rookie pilot for the reality of what is to come. A pilot can fly many sorties and complete numerous missions in hostile skies, but until they are blooded in combat, they have no comprehension of what aerial warfare truly means. The sheer, breakneck speed and dizzying assault on the senses is something that cannot be experienced in test conditions. Legends can be born or lives lost as a result of decisions made and actions taken in the briefest of moments. Consequently, the one staple, the one unifying trait shared by pilots of any intelligent race, is that their first experience of action may well be their last. Not all pilots face a swift, fiery end, however. For every squadron destined to spin into oblivion, one or two pilots will overcome the dangers and quell their fears. Such natural airborne warriors show an almost preternatural skill, quickly mastering the subtle nuances of their craft, able to jink and dive out of fire arcs and target locks with the grace of a dancer. They develop a sixth sense for danger and a rapacious hunger for the thrill of the kill.</p><p>Page 99</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>AERONAUTICA PILOT</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Human</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">60</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">AERONAUTICA IMPERIALIS</a>, <a class="keyword">NAVIS IMPERIALIS</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Agility 3, Initiative 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Ballistic Skill 3, Pilot 3, Tech 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.r487nQuSKDGSHCPp]{Aerial Hunter}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.STrmO2xhRZgClDSR]{Laspistol}, @UUID[Item.yIIPNHqxXpAkFXUg]{Aeronautica Flight Suit}, @UUID[Item.fqvjyrhVnBm8tqx8]{Survival Kit}, Thunderbolt Fighter (Church of Steel), Lightning Interceptor (Church of Steel)</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Awareness 3, Ballistic Skill 4, Leadership 2, Pilot 4, Scholar 1, Survival 2, Tech 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.qyMPDR7eiJDJzMfW]{Gunnery Crew}, @UUID[Item.fIy3evnEKxFiNV4j]{Gallows Humour}, @UUID[Item.i2iaIBRjeULHMMHD]{Combat Driving}</td></tr></tbody></table>'
