      content: <p>"Red in cog and claw"</p><p>–Common Skitarii Exhortation You are an assassin, a blade turned towards those who would blaspheme against the Machine God. Few who cross you can withstand the sensory onslaught you project, allowing you to easily bypass any obstacles or guards in your path. Heavily augmented into more machine than man, the Sicarian Infiltrators are a hideous, frightening strike force - the height of Adeptus Mechanicus posthuman engineering. When hunting, they emit from their domed helmets a white noise that fills all sensory spectra with static, leaving their foe disorientated and helpless. Enemies fall, deafened and blinded by the scree of a brutally disruptive audiovisual assault; battles are often decided before even a single kill is confirmed. Infiltrator squads can bypass enemy defences with ease, though not because of their stealth but rather their disruptive wavelengths they broadcast when on the move. Regular Skitarii warriors sent to fight alongside Infiltrators are given null-codes that can transmute their disorientated wavelength frequencies, allowing for efficient combined-arms assaults. Every Sicarian was once a Skitarii who was grievously injured in battle, such as losing all their limbs or being extensively burned. If these fallen are judged still fit to serve the Omnissiah, they are not incinerated but instead taken back to be augmented into lethal killing machines. This process can take place as long as a TechPriest possesses a head, torso, and some limb-stumps.</p><p>Page 158</p>
