      content: '<p>"Skaggit! Get back ‘ere, ‘fore I let Chompa ‘ave ya!” —Runtherd Gorskrag, reprimanding a wayward Gretchin</p><p>Most Orks couldn’t care less about grots and snots and other creatures like that. You’re different. You know you can direct and control the little gits, with the right approach and the right mix of rewards and punishments. You figure you could even get the same ideas to work on humans and other species If you got your hands on them. Runtherdz are Ork Oddboyz who exhibit a trait extremely uncommon amongst Orks: patience. Only they have the right mindset to "care" about their smaller Orkoid cousins, the Gretchins and Snotlings, and the patience to perform the task of training them to be more efficient at their tasks. Where the average Ork only yells his orders and beat his underlings if the orders are not fulfilled to his liking, a Runtherd has a more "reasonable" approach of carrot-and-stick treatment. He explains to those under his care what is expected of them, and those that perform efficiently are rewarded, while only those that perform poorly are beaten. The simplest and most menial tasks are undertaken by the tiny Snotlings. Snotlings are not particularly easy to train because they are slow learners and need to be slowly and carefully conditioned to perform even the simplest tricks. Runtherdz train Snotlings to cultivate fungus and tend Squigs and take extraordinary pride in their tiny charges.</p><p>a non-Ork as a challenge to be mastered. When an Ork mob goes to war, the Runtherdz will claim the surviving enemies as their spoils and start training them as slaves. A Runtherd sees barriers of language and behaviour as a challenge to his skill for control and command rather than to his authority and will apply his skills to boosting the production of his hapless charges just as he would with a group of uncooperative Gretchin. Successful Runtherdz can handle Humans, Squats, Tau and most other sentient races of the galaxy (with the exception of Tyranids and Necrons), eventually learning enough of their language, mannerisms and culture to ensure his slaves are always working at peak efficiency.</p><p>The Runtherdz make a good living by selling welltrained Gretchin and Snotling servants and workers to other Orks. Runtherdz often become quite wealthy and naturally invest their earned teef (teeth, the Ork currency) in solid weaponry and other wargear. On the battlefield they tend to either fight alongside the machines crewed by their Gretchin where they can keep a close eye on things, or lead a large mob of Gretchins forward, using the smaller Orkoids as diversion, living shields or living mine detectors for the other bands of Boyz. Most Runtherdz also exhibit curiosity, especially for the other sentient races of the galaxy. Where the average Ork Boy only sees a non-Ork as either a challenge or a nuisance to be killed in either case, the Runtherdz sees</p><p>Page 126</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>RUNTHERD</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">2</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Ork</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">58</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">ORK</a>, <a class="keyword">[CLAN]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 3, Toughness 3, Fellowship 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Intimidation 3, Leadership 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.RBbqkKSE1n3SDulg]{Slaver}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.jyZ8n21b8puAf41z]{Slugga}, @UUID[Item.z6OPYyb0c9OpmuaM]{Grabba Stikk}, @UUID[Item.L7E0G56RBAn4Fmlv]{Stikkbomb}, @UUID[Item.nolJv3alSGFBoVk5]{Grot Prod}, @UUID[Item.YArm2VCihbVlLurI]{Ork Flak}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">3</td><td style="text-align:center">3</td><td style="text-align:center">1</td><td style="text-align:center">4</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Awareness 1, Ballistic Skill 1, Intimidation 4, Leadership 3, Survival 1, Weapon Skill 2</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.CVEfjd9hx4XWLuPM]{Dirty Fighter}, @UUID[Item.5HchXpu60DlodyV8]{Disturbing Voice}, @UUID[Item.7wlAYMJ34fusZfiA]{Supreme Presence [Skill]}</td></tr></tbody></table>'
