      content: <p>Those with superior reach can dictate the terms of battle and impose their will upon their foe. Remember, the first step on the path to victory is often the most important. — Commander Puretide You are a veteran warrior of the T’au Empire, a member of the Fire Caste. You have foregone the typical opportunities to advance by becoming a Battlesuit pilot to remain as an infantry commander. A Cadre Fireblade is the most grizzled and seasoned Tau Fire Warrior of a Hunter Cadre, whose extraordinary skill at the Fire Warrior's art of battle leads him to eschew Tau Battlesuit technology and remain as a leader of the Tau infantry. Cadre Fireblades are excellent field leaders and their long experience at war has taught them exactly where to place shots to maximise damage, and fire with pinpoint accuracy. It is on the firing line that Cadre Fireblades really comes into their own. There, they radiate a steadying calm, directing their Fire Warriors to maintain accurate fire no matter the circumstances, instilling each Tau trooper with the precision and efficiency that is the hallmark of fighting across dozens of battlefields. Whether breaking the impetus of an advancing horde of Ork Greenskins or seeking to bring down the heavily armoured Space Marines of the Imperium, no one knows a Fire Warrior's strength better than a Cadre Fireblade. A Cadre Fireblade will always extol a focus upon what they believe to be the Tau's primary military strength—overwhelming infantry firepower! Theirs is the ability to drive and direct Fire Warriors as they pour volley after volley of merciless pulse fire onto the target. Fireblades will never advance to the ranks of Shas’el or Shas’O, instead taking a position regarded as between Shas’vre and Shas’el, and many take this role— Shas’nel— instead of their rank as part of their name. The workmanlike nature of their role, and the fact that they give up their chance to advance further, means they are often respected as exemplars of the Tau’va for having found and accepted their place in society.</p><p>Page 139</p>
