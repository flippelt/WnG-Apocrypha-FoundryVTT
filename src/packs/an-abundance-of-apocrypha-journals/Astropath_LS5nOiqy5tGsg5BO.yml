      content: '<p>"I am soul-bound to the Emperor, and through His grace, I speak across the voids." —Arradin Vykis, Astropath You were blessed—or cursed—with psychic potential and gathered up by the Black Ships. Your mind was reforged by the Emperor Himself into something that could withstand your powers, so that you could listen and speak across the darkness between the stars, binding the Imperium together. Astropaths are psykers collected by the Imperium''s Black Ships whose powers are considerable, but who lack the mental strength to resist the dangers of the Warp.</p><p>insane during the process. Those who survive are permanently blinded and most of them even suffer from nerve damage, which results in a loss of smell, touch or hearing. Although blinded, Astropaths make up for their sensory lacks with the help of their psychic abilities: they develop a sort of "near-sense", which means that few of them choose to have mechanical eyes implanted.</p>'
