      content: '<p>"All theatres are theatres of war. War needs be theatrical." — Farseer Ro-fhessi of Craftworld Ulthwé, describing a Harlequin performance You died and felt the cold embrace of your Soulstone spare you from facing the hell of the Warp. Yet, necessity has brought you back, your living descendants placing you within an armoured shell to wage war once more. The Wraithguard of the Craftworld Aeldari are not living warriors; they are artificial robotic constructs called Ghost Warriors created from the complex psycho-plastic material crafted by the Asuryani of the craftworlds known as wraithbone. Each Wraithguard has a Spirit Stone containing the soul of an elite Aeldari warrior that was drawn out of the Infinity Circuit of a craftworld.</p><p>Wraithguard can suffer damage that would cripple, or even kill, a living Aeldari warrior and continue to fight, making them useful in situations that would be suicide for living soldiers. They see through the Warp using what is known as "Wraithsight" but as the Warp is a tumultuous place, Wraithguard often have trouble discerning the true nature of realspace and so can find themselves blinded and unable to function effectively. Because of this tendency Wraithguard are often led into battle by Warlocks or Spiritseers who help to guide them.</p><p>Wraithguard are smaller in size than Wraithlords, and carry a weapon known as a Wraithcannon which is a short-range, but potent weapon capable of opening a small rift into the Warp which sucks the target, or pieces of the target, within the Immaterium. When used against infantry, the result is invariably fatal. Due to their wraithbone construction,</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>WRAITHGUARD</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">5</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Asuryani Ghost Warrior</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">358</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">ASURYANI</a>, <a class="keyword">[CRAFTWORLD]</a>, <a class="keyword">WRAITH CONSTRUCT</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 9, Toughness 6, Agility 5, Initiative 4, Willpower 5</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 3, Ballistic Skill 4, Intimidation 2, Psychic Mastery 2, Scholar 3</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.S0UwFtSPGOFUking]{Cutting of the Crone''s Cord}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.IS94YJ3Qy0XOki0c]{D-Scythe}, @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.C8tdHUyIWOSvZ2PK]{Wraithcannon}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">9</td><td style="text-align:center">7</td><td style="text-align:center">6</td><td style="text-align:center">4</td><td style="text-align:center">6</td><td style="text-align:center">4</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 3, Awareness 5, Ballistic Skill 6, Intimidation 2, Psychic Mastery 2, Scholar 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">—</td></tr></tbody></table>'
