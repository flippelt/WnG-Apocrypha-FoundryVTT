      content: "<blockquote><p>Some say that perfection is the enemy of the good. They speak nonsense. Such apathetic thinking is what turns that which is good into bad. We should never cease our striving for greatness, never halt our purpose of bettering ourselves. Anything else is nothing but stagnation, and I have seen enough of the galaxy to know that to stagnate is to wither and die in shameful ignominy.</p><p style=\"text-align:right\"><em>—— Shas’O Arra’kon</em></p></blockquote><p><strong>You are a technician of the T’au Empire, a member of the Earth Caste. Your labours keep the Empire functioning, ensuring that people are fed, armies are well-equipped, and new advances are made to allow the Empire to expand ever-further.\_</strong></p><p>The Earth Caste are the scientists, engineers, physicians, industrialists, and labourers of T’au society, and they outnumber the other castes by far. Most of the routine labour in the T’au Empire is automated, performed by drones, with T’au engineers concerning themselves with challenges that are beyond their AI helpers.</p><p>The lowest rank of the Earth Caste are the technicians, who divide their time between performing maintenance and repairs too precise or demanding for drones to perform and coordinating swarms of technical drones to perform simpler or large-scale tasks.</p><div class=\"journal-image centered\"><img src=\"modules/wng-apocrypha/assets/images/archetypes/Earth-Caste-Technician.jpg\" width=\"302\" height=\"300\" /></div><table style=\"width:98.9228%;height:234px\" border=\"1\"><tbody><tr class=\"table-header\" style=\"background-color:#846404;height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\">EARTH CASTE TECHNICIAN</td></tr><tr style=\"height:16px\"><td style=\"background-color:#846404;color:white;text-align:center;width:26.5674%;height:16px\" colspan=\"2\">TIER</td><td style=\"width:8.3%;height:16px;text-align:center\">1</td><td style=\"background-color:#846404;color:white;width:16.2617%;height:16px;text-align:center\" colspan=\"2\">SPECIES</td><td style=\"width:11.7268%;height:16px;text-align:center\">Fio T'au</td><td style=\"background-color:#846404;color:white;width:11.6223%;height:16px;text-align:center\">XP Cost</td><td style=\"width:18.2509%;height:16px;text-align:center\">22</td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>KEYWORDS</strong>:<a class=\"keyword\">T'AU EMPIRE</a>, <a class=\"keyword\">EARTH CASTE</a>, <a class=\"keyword\">[SEPT]</a></td></tr><tr style=\"height:16px;background-color:rgba(0, 0, 0, .2)\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>ATTRIBUTE</strong>: Intellect 3</td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>SKILLS</strong>:\_Scholar 2, Tech 2</td></tr><tr style=\"height:16px;background-color:rgba(0, 0, 0, .2)\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><p><strong>ARCHETYPE ABILITY</strong>: @UUID[Compendium.wng-apocrypha.an-abundance-of-apocrypha-items.Item.uw1BouEFXLCdEkXq]{State of the Art}</p></td></tr><tr style=\"height:16px\"><td style=\"width:92.7291%;height:16px\" colspan=\"8\"><strong>WARGEAR</strong>: Work Uniform (Clothes), Multi-Tool, Drone Controller</td></tr><tr style=\"height:16px\"><td class=\"table-header\" style=\"width:51.1291%;height:16px;background-color:#846404;text-align:left\" colspan=\"5\"><strong>SUGGESTED ATTRIBUTES</strong></td><td style=\"background-color:#846404;color:white;text-align:center;width:23.3491%;height:16px\" colspan=\"2\">XP Cost</td><td style=\"width:18.2509%;height:16px;text-align:center;background-color:rgba(0, 0, 0, 0.2)\">34</td></tr><tr style=\"font-variant:small-caps;height:16px\"><td style=\"background-color:#846404;color:white;width:14.0674%;height:16px\">ATTRITBUTE</td><td style=\"width:12.5%;height:16px;text-align:center\">S</td><td style=\"width:8.3%;height:16px;text-align:center;background-color:rgba(0, 0, 0, .2)\">T</td><td style=\