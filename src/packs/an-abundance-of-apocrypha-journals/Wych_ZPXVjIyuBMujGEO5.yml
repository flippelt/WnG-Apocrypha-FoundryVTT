      content: '<p>“The caress of cold steel upon warm flesh is a divine gift, a sensation unmatched in all of existence in its purity and simplicity. I have drunk deep of its echoes in more opponents than I care to count but have never felt the sensation myself. Will you be the first to gift me with the experience, or shall you be another through whom I must feel this gift vicariously?” Attributed to Lelith Hesperax, of the Wych Cult of Strife You are a gladiator, a combatant and performer beyond compare—barring maybe the enigmatic Harlequins—who strives for the perfect strike, the perfect wound, the perfect kill, and all the delicious sensations and emotions which accompany the blade’s caress. For the right price, your skills can even be put to use outside the arena. Wyches, also known as Hekatarii are gladiatorial warriors of the Drukhari, they each belong to one of the various Wych Cults of Commoragh. Wyches fight in arenas in duels with one another and with various captured aliens and beasts; few survive their first duel but those who live learn quickly. Ruled over by their Succubi, the Wyches are highly proficient at closequarters combat, practising their skills for their entire lives. Wyches often use a cocktail of combat-enhancing drugs to improve their performance on the battlefield. Because of Drukhari''s unending need to bathe in murderous sensations, the Drukhari have evolved the Hekatarii, known in common parlance as the Wych Cults. Each Wych Cult is a thousands-strong organisation of gladiators that put on nightly displays of the most incredible violence, not only for the edification of the masses, but also for their literal sustenance. Such is the scale of the carnage staged by these armies of warrior-athletes that their audiences leave the arena with the glow of well-fed predators. In this way the populace is kept from full-scale anarchy – at least, those portions of Commorragh wealthy enough to attend the Wych Cults’ nightly performances.</p><p>Page 97</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>WYCH</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">1</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Drukhari</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">52</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">AELDARI</a>, <a class="keyword">DRUKHARI</a>, <a class="keyword">WYCH</a>, <a class="keyword">[CULT]</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 2, Agility 4, Initiative 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 2, Intimidation 2, Weapon Skill 2</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.exawaY9vzynnG5Mw]{Hekatarii Prowess}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.jXwTZehsR4s1js5O]{Wychsuit}, @UUID[Item.RyJDw5aEc5OSzut9]{Hekatarii Blade}, @UUID[Item.smcYrkZOFwBpXHt9]{Splinter Pistol}, @UUID[Item.IKeDfOaiJOeHPpK7]{Plasma Grenade}, @UUID[Item.D94t8tJ06b13Hgoi]{Hekatarii Combat Drugs}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">2</td><td style="text-align:center">2</td><td style="text-align:center">4</td><td style="text-align:center">4</td><td style="text-align:center">2</td><td style="text-align:center">1</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 2, Deception 1, Insight 1, Intimidation 2, Weapon Skill 3</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.6RTgC3gWnsqYdLm5]{Power Through Pain}, @UUID[Item.26UYjRZ4VBoL1EyC]{Blood Must Flow!}, @UUID[Item.kpAn3XZjjS07M0Zi]{Furious Charge}</td></tr></tbody></table>'
