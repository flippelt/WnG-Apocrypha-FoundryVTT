      content: '<p>“That which is unknown and unseen always commands the greatest fear”. Motto of Templum Culexus You are anathema, witch-bane, wyrdslayer, psychic abomination. Your foes dread your presence, desperately hoping that you are a nightmarish figment, for their minds cannot bear to acknowledge the abyss within your soul. The Culexus Assassins are the most sinister, feared, and hated of all Imperial Assassins. They are null-entities in the warp, and their unnatural lack of a presence inspiring a sense of unease even in non-psykers. To psykers their mere presence is terrifying, invoking panic. In the confusion caused by this fear, the assassin can move in on its target and eliminate them. To purely psychic entities like daemons, they are nigh-invisible at best, akin to trying to see a black hole amidst the inky void of space. The Culexus Assassins possess the "Pariah Gene", making them for all intents, "soulless," accounting for their lack of warp-presence. This gene manifests itself very rarely, in a single individual among a billion, or more. This extreme rarity, coupled with the inevitable losses during training, makes the Culexus assassins the rarest of all Imperial assassins. The Culexus temple is known to hunt down and recruit these Pariahs but also to vat-grow them, an arduous and complex process that produces only a few viable candidates a year.</p><p>Page 196</p><table border="1"><tbody><tr class="table-header"><td colspan="8" style="text-align:center"><strong>CULEXUS ASSASSIN</strong></td></tr><tr><td colspan="2" style="background-color:#484745;color:white;text-align:center">TIER</td><td style="text-align:center">5</td><td colspan="2" style="background-color:#484745;color:white;text-align:center">SPECIES</td><td style="text-align:center">Pariah</td><td style="background-color:#484745;color:white;text-align:center">XP Cost</td><td style="text-align:center">308</td></tr><tr><td colspan="8"><strong>KEYWORDS</strong>: <a class="keyword">IMPERIUM</a>, <a class="keyword">OFFICIO ASSASSINORUM</a>, <a class="keyword">TEMPLUM CULEXUS</a></td></tr><tr><td colspan="8"><strong>ATTRIBUTE</strong>: Strength 4, Toughness 4, Agility 5, Initiative 5, Willpower 4, Intellect 3</td></tr><tr><td colspan="8"><strong>SKILLS</strong>: Athletics 3, Awareness 2, Ballistic Skill 4, Medicae 1, Pilot 1, Scholar 1, Stealth 4, Survival 3, Tech 1, Weapon Skill 4</td></tr><tr><td colspan="8"><strong>ARCHETYPE ABILITY</strong>: @UUID[Item.9bbIV29MG50f6Xoo]{Life Drain}</td></tr><tr><td colspan="8"><strong>WARGEAR</strong>: @UUID[Item.puNhmpfvYPkjreST]{Etherium}, @UUID[Item.SXsJ5MHSZSeyl7GQ]{Force Matrix}, @UUID[Item.QMCeV3Nu31ziVE5y]{Animus Speculum}, @UUID[Item.Rs98pBCteVE7y1GS]{Psyk-Out Grenade}, @UUID[Item.50gYnTefq7FohjIH]{Assassinorum Bodyglove}</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED ATTRIBUTES</strong></td></tr><tr><td style="background-color:#484745;color:white;text-align:center">ATTRIBUTE</td><td style="background-color:#484745;color:white;text-align:center">S</td><td style="background-color:#484745;color:white;text-align:center">T</td><td style="background-color:#484745;color:white;text-align:center">A</td><td style="background-color:#484745;color:white;text-align:center">I</td><td style="background-color:#484745;color:white;text-align:center">Wil</td><td style="background-color:#484745;color:white;text-align:center">Int</td><td style="background-color:#484745;color:white;text-align:center">Fel</td></tr><tr><td style="background-color:#484745;color:white;text-align:center">RATING</td><td style="text-align:center">5</td><td style="text-align:center">4</td><td style="text-align:center">6</td><td style="text-align:center">6</td><td style="text-align:center">5</td><td style="text-align:center">3</td><td style="text-align:center">1</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED SKILLS</strong></td></tr><tr><td colspan="8">Athletics 3, Awareness 3, Ballistic Skill 5, Intimidation 2, Medicae 1, Pilot 1, Scholar 1, Stealth 5, Survival 3, Tech 1, Weapon Skill 5</td></tr><tr><td class="table-header" colspan="8" style="text-align:left"><strong>SUGGESTED TALENTS</strong></td></tr><tr><td colspan="8">@UUID[Item.gM1zenlhkmIMBA5C]{Eliminator}, @UUID[Item.GJUeAkAPhh5uYtlP]{Silent}, @UUID[Item.KblllCqaUDvYbDGT]{Anathema}, @UUID[Item.xna1CV43LaHeOtXE]{Witch''s Nightmare}</td></tr></tbody></table>'
