  notes: >-
    <p><span class="fontstyle0"><strong>Value</strong>: </span><span
    class="fontstyle2">5 Rare</span> </p><p><span
    class="fontstyle0">Cyber-Mastiffs are mechanical creatures that resemble a
    metal hound, who are guided by the brain and nervous system of a hunting
    creature after such components have been integrated by members of the
    Adeptus Mechanicus. It is also not uncommon, however, to see purely
    biological canines who have received some form of cybernetic upgrades.
    CyberMastiffs are usually deployed under the control of Adeptus Arbites
    Patrol and Enforcer units for hunting down their prey and to catch criminal
    fugitives who attempt to escape, but they are also found in other units,
    such as Anathema Psykana Pursuer Cadres, and even by underhive bounty
    hunters.</span></p><p></p><p><span class="fontstyle0">Commonly known as
    kill-dogs, razorfangs and rending rovers, Cyber-Mastiffs have an in-built
    hunting and attack instinct and can only respond to the simplest of commands
    from their assigned handler but are still fully capable of defending
    themselves and their masters. They can be fitted with additional sensors,
    such as an Auspex, which are always used on passive.</span> <br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
