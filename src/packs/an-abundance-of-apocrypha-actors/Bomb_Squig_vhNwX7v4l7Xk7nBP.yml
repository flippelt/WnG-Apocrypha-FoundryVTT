  notes: >-
    <p><strong>Value</strong>: 3 Common</p><p>A Squig (short for "Squiggly
    Beast") is the simplest known form of Orkoid life. There are many types of
    Squig, each generally filling some functional or utilitarian role in the Ork
    ecosystem. They currently serve as the Orks' primary food source, much like
    herd animals are for Humans.</p><p><strong>Bomb Squigs</strong> are little
    more than common Squigs with explosives strapped to their sides or gripped
    firmly in their teeth. When properly goaded, they run headlong at their
    master's desired target, detonating their explosive payload when in close
    proximity.</p>
