  notes: >-
    <p><strong>Value</strong>: 5 Uncommon</p><p>Chapter serfs are the normal
    human bondsmen and servants of a Space Marine Chapter. The Space Marines
    themselves are too few in number to manage all the tasks required to
    maintain all the aspects of the Chapter, its fleet, fortress, and other
    myriad aspects. It is the serfs who perform most of these vital
    functions.</p><p>A Chapter's fortress-monastery is home to a large
    population of these hereditary servants. Although they occupy a humble
    position, they are loyal members of the Chapter. They are generally
    descended from individuals selected as potential recruits to the Chapter,
    but in the end, judged unfit to become actual Space Marines.</p><p>The serfs
    are still inducted into the Chapter cult, and do not begrudge the status
    they could have obtained. They are generally well treated within the
    Chapter, are educated and trained to a much higher standard than most other
    servants of the Imperium and have access to a better range of equipment.
    Many serfs were unsuccessful aspirants who failed to become Adeptus
    Astartes, and many more are descended from the failed aspirants of
    generations past.</p><p>Chapter Serfs are known by a wide variety of names
    and titles depending on the Chapter they serve and the role they perform
    within their Chapter. They are sometimes referred to as thralls, menials,
    helots, or serviles, and they can be found in almost every part of a
    Chapter, assisting everyone from the Chapter Master to the Librarians and
    Tech-Marines, to the ordinary Battle Brothers.</p>
