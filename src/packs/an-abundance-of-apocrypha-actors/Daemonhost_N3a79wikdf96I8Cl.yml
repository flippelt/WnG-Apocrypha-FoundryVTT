    system:
      dn: '3'
      type: ''
      specification: ''
      description: >-
        <p>You can sense the presence of the Warp pressing in against the
        material world. Existing or imminent distortions of the barrier between
        Materium and Immaterium in your immediate presence may betray themselves
        in the flicker of shadows, a brief chill on the flesh, or in a thousand
        other ways.</p>

        <p>You can attempt to detect the presence of Warp phenomena within range
        and line of sight, including sustained psychic powers, psychic powers
        being activated, and similar effects as decided by the GM.</p>

        <p>This won&rsquo;t show the source of any such phenomenon, only that it
        is present within the restrictions, nor does it detect any Psykers. It
        does, however, provide enough information to activate Deny the
        Witch.</p>

        <p>If you attempt to activate this power and fail, the mysteries of the
        Warp assail your mind. You are automatically under the effects of
        Fear.</p>

        <p>As it is not considered a psychic power, Psyniscience can&rsquo;t
        trigger the @UUID[RollTable.7LR1oOovQa0iqcJu]{Perils of the Warp}.</p>
