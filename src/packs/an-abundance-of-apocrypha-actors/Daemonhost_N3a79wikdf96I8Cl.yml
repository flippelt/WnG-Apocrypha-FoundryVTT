    system:
      dn: ''
      type: ''
      specification: ''
      description: >-
        <p>You can unravel another psyker&rsquo;s attempt to manipulate the
        Warp.</p>

        <p>All characters with the <a class="keyword">PSYKER</a> keyword can
        attempt to prevent the activation of a psychic power within range, or
        nullify an already active Sustained or timed duration psychic power.
        Your character must be aware that a power is being used in order to Deny
        the Witch.</p>

        <p>The DN for Deny the Witch is 2 + the DN of the psychic power you are
        trying to deny. If the power you are trying to deny has increased
        potency from shifting an Exalted Icon, the DN is increased by +1 for
        each Exalted Icon shifted.</p>

        <p>If Deny the Witch succeeds, the power fails to activate or
        immediately stops working.</p>

        <p>*Unlike other Actions, this can be used to deny a power occurring
        before your Turn, but this uses your Combat Action for the Round. If you
        have used your Action for the Round then you can&rsquo;t Deny the
        Witch.</p>
