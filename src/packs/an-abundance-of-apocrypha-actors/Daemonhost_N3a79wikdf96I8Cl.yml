  - name: Bound Daemon
    type: talent
    _id: y6vy4SKnXBYx6zBn
    img: modules/wng-core/assets/icons/talents/talent.webp
    system:
      effect: ''
      cost: 0
      requirements: ''
      description: >-
        <p>The Daemonhost’s abilities depend on how strongly the daemon is bound
        into the host. </p><ul><li><p><strong>Thrice-Bound</strong>: The
        Daemonhost’s profile is unchanged.
        </p></li><li><p><strong>Twice-Bound</strong>: The Daemonhost’s AR, the
        DN of its Fear Test, the ED of its attacks, and its Intimidation,
        Scholar, and Psychic Mastery skills all increase by +1. The Daemonhost
        has a Flight speed of 6, and it knows one additional psychic power.
        </p></li><li><p><strong>Once-Bound</strong>: The Daemonhost’s AR, the DN
        of its Fear Test, the ED of its attacks, and its Intimidation, Scholar,
        and Psychic Mastery skills all increase by +2. The Daemonhost has a
        Flight speed of 7, and it knows two additional psychic powers.
        </p></li><li><p><strong>Unbound</strong>: The Daemonhost’s AR, the DN of
        its Fear Test, the ED of its attacks, and its Intimidation, Scholar, and
        Psychic Mastery skills all increase by +3. The Daemonhost has a Flight
        speed of 8, and it knows three additional psychic powers.</p></li></ul>
      display: true
    effects: []
    folder: null
    sort: 0
    ownership:
      default: 0
      iqIIJEvwgrLX4V4E: 3
    flags: {}
    _stats:
      systemId: wrath-and-glory
