  notes: >-
    <p><strong>Value</strong>: 8 Unique</p><p>A Daemonhost is an unholy creation
    of foul and dangerous rituals in which a powerful Daemon of Chaos is bound
    into a living Human or other mortal host body and enslaved to its creator's
    will. An utterly foul act, the creation of a Daemonhost condemns the soul of
    the host body to eternal torment and provides a lasting home in the material
    universe for a Daemon to work its malignant evil. Daemons do not rest easily
    under the will of any mortal, and to earn the enmity of such a creature is
    to gain an immortal enemy, so a Daemonhost's creator is faced with a
    dangerous conundrum: the more powerful the Daemonhost created, the weaker
    the bindings of the Daemon.</p><p>When first acquired, a Daemonhost is
    Thrice-Bound</p>
