  notes: >-
    <p><strong>Value</strong>: 6 Rare</p><p><span class="fontstyle0"><strong>You
    may only acquire a Black Templars Neophyte if you are an
    </strong></span><span class="fontstyle2"><strong>ADEPTUS ASTARTES
    </strong></span><span class="fontstyle0"><strong>character (including
    </strong></span><span class="fontstyle2"><strong>PRIMARIS
    </strong></span><span class="fontstyle0"><strong>Astartes) of the
    </strong></span><span class="fontstyle2"><strong>BLACK TEMPLARS
    </strong></span><span
    class="fontstyle0"><strong>Chapter.</strong></span></p><p><br style="
    font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p><p>Unlike other Space Marine Chapters,
    the Black Templars have no dedicated Scout Company in which its aspirants
    are trained. Should a survivor of the trials impress one of the assembled
    battle-brothers, an Initiate may take it upon himself to personally mentor
    the neophyte in the art of war.</p><p>From that point on, the Initiate takes
    sole responsibility for his pupil's training and conduct. He swears an oath
    to prepare the neophyte for his entry into the brotherhood that is the
    Chapter, teach him of its history, and guide him through its holy rites of
    worship to the Emperor.</p><p>In return, the neophyte pledges obedience to
    his master and vows never to bring dishonour to his name. Neophytes also act
    as servants to their mentors, waiting on them at the great banquets and
    seeing to their day-to-day requirements. The crusade's Chaplains oversee
    this training and make sure the neophyte learns the history of the Chapter
    and watch for any signs of weakness in the neophyte's faith.</p><p>The
    neophyte will also accompany his Initiate into combat, and should his master
    fall, another brother will take up his training. The bond between the
    Initiate and his neophyte pupil is strong, and if the neophyte meets his
    end, the Initiate will swear a death oath to avenge his apprentice or die
    trying.</p><p>It is the Initiate's prerogative to say when his apprentice's
    training is complete. Once he has proven his valour and skill, a Black
    Templars neophyte submits to the Chapter's Chaplains to undergo the final
    trials of purity before, in a ceremony of great reverence, he is elevated
    into the ranks of a full battle-brother of Initiate status and honoured with
    a suit of Power Armour. He is now truly a Black Templar, possessed of great
    power, and sworn to use it in the Emperor's service unto death.<br></p>
