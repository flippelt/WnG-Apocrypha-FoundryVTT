  notes: >-
    <p><strong>Value</strong>: 5 Uncommon</p><p>Medicae Servitors are often used
    to supplement trained medicae personnel in manufactorums and other dangerous
    environments. Some are fixed in place, mounted into a wall alcove with their
    legs removed, providing care to anyone brought to them. Others roam their
    designated area or follow a designated owner. When supporting a trained
    chirurgeon, they function as nurses and orderlies.</p>
