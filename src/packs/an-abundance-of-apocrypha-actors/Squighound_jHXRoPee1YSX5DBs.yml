  notes: >-
    <p><strong>Value</strong>: 3 Common</p><p>A Squig (short for "Squiggly
    Beast") is the simplest known form of Orkoid life. There are many types of
    Squig, each generally filling some functional or utilitarian role in the Ork
    ecosystem. They currently serve as the Orks' primary food source, much like
    herd animals are for Humans.</p><p><strong>Squighounds</strong>, commonly
    known as "Growlers," are a variation of the Attack Squig, used by Ork
    Runtherdz to help them keep the Gretchins and slaves from other races in
    line, some have four legs, although two-legged varieties certainly exist.
    "Growlers" are also often kept as a form of pet by other Orks, as they are
    roughly the size of a small dog, hairy, and particularly vicious.</p>
