  notes: >-
    <p><strong>Value</strong>: 6 Rare</p><p>A psy-bonded (or "psyber") Familiar
    is a living creature bonded to its master by arcane technology. Cybernetic
    neural interface circuitry implanted in the minds of both Familiar and
    master (called a "psyber-lure") allows the creature to be directly and
    precisely controlled, with the master having access to the sensory
    experiences of the creature and able to give it instantaneous commands at
    great distance.</p><p></p><p>Owing to the idiosyncrasies of the little
    understood technology, usually only small, non-sapient creatures can become
    psy-bonded to a Human master.</p><p></p><p>Psyber-Eagles are genetically and
    cybernetically enhanced familiars created as gifts from the Adeptus
    Mechanicus to the grandees of the Imperium. They are often utilised by
    psykers to extend and channel their powers.</p><p></p><p>The same profile
    can also be used for Psyber-Ravens, and similar augmented avian familiars.
    <br></p>
