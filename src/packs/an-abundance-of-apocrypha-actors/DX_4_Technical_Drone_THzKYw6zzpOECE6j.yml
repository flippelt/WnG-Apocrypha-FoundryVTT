  notes: >-
    <p><strong>Value</strong>: 4 Uncommon</p><p>The DX-4 Technical Drone is used
    by T’au commanders and Fire Warrior teams on the battlefield as a mobile
    engineering unit or a sentry, and by Earth caste engineers and technicians
    as an assistant. In place of weaponry each Technical Drone carries repair
    and sensor equipment and can be used to fix damaged or destroyed equipment
    in the field.</p>
