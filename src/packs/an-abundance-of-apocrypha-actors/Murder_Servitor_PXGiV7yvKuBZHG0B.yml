  notes: >-
    <p><strong>Value</strong>: 6 Rare</p><p>Commonly used aboard starships to
    supplement boarding parties and raiding forces, murder servitors are
    ghoulish, skull-masked killing machines. The most common patterns take the
    form of a hunched, predatory monster, driven by sadistic and aggressive
    machine spirits. Mono-talons and viscerator-limbs allow them to tear apart
    most living foes, while meltacutters allow them to burn through bulkheads
    and destroy equipment. Designed to intimidate as much as to kill, murder
    servitors are consummate hunters, stalking their prey and moving with
    inhuman speed. If not ordered otherwise, they spend hours hunting any living
    creature not programmed into their spoor-targeters, undeterred by any
    obstruction and unhindered by fear or humanity.</p>
