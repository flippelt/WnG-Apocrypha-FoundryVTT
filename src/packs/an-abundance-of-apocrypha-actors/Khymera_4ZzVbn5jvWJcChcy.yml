  notes: >-
    <p><strong>Value</strong>: 5 Uncommon</p><p>A Khymera (pl. Khymerae), are
    terrifying creatures, literally born from an intelligent being's nightmares.
    They spawn in the Warp or on Daemon Worlds, coalescing into existence like
    malignant cysts around the psychic energies that fear and terror leaves in
    the Immaterium. They do not form at the whim of the Chaos Gods nor do they
    appear to be fragments of these powers. Khymerae lack a proper corporeal
    form, allowing them to flicker between realspace and the Sea of Souls at
    whim, appearing momentarily before a foe and then vanishing suddenly to
    launch an attack from an unexpected direction.</p>
