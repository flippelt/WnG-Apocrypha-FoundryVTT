  notes: >-
    <p><strong>Value</strong>: 4 Uncommon</p><p>Servo-skulls are drone-like
    robotic devices that are Human skulls outfitted with electronic and
    cybernetic components that utilise embedded anti-gravity field generators to
    allow them to hover and drift bodiless through the air. They are fashioned
    using added robotic components from the skulls and preserved brain tissue of
    loyal adepts of the Adeptus Terra and other pious Imperial servants so that
    they may continue their work for the Emperor of Mankind even after death.
    Presumably, to have one's skull chosen to serve as a Servo-skull is a great
    honour in the Imperium. Servo-skulls fill an important niche in Imperial
    work, serving as everything from auto-scribes that copy down important
    conversations and confessions of prisoners, to simple moving torches,
    hovering about their charge with electro-candles and lumen-globes to
    illuminate the area. Servo-skulls are used throughout all the different
    organisations of the Imperium, and each is built to perform a certain task.
    In many governmental buildings, they can be found buzzing through the air in
    their dozens, carrying out minor tasks, or carrying out routine surveillance
    on the people below.</p>
