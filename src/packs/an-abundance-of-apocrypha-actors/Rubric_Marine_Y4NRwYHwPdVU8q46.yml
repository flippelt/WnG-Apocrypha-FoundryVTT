  notes: >-
    <p><strong>Value</strong>: 6 Rare</p><p><strong>You may only acquire a
    Rubric Marine if you are an HERETIC ASTARTES PSYKER of the THOUSAND SONS
    Legion.</strong></p><p>Rubric Marines were created shortly after the
    Thousand Sons Legion fled to the Eye of Terror. Having dealt with sorcerous
    practices and energies for decades and now under the sway of Chaos, mutation
    ran wild within the Legion.[4a] In order to put an end to this warping
    process, a mighty spell called the Rubric of Ahriman was cast upon them.
    However, the powers unleashed reduced all Marines without psychic abilities
    to ash, sealing every clasp and joint of their armour and trapping their
    souls within. </p><p>These living suits are still capable of fighting and
    receiving orders from their masters, and with no fear and no will of their
    own, they make perfect bodyguards and guardians. Without an Aspiring
    Sorcerer to guide them, Rubric Marines tend to fall into inactivity; in
    combat, however, their battle-hunger returns and so they tend to move more
    like their former living selves. </p><p>A single Sorcerer is capable of
    controlling a whole squad and will use his powers to enchant their bolters
    and turn their ammunition into explosive Inferno Bolts. These magical shots
    are able to ignore mundane armour and burn the souls of sentient beings.
    </p><p>When a Rubric Marine dies, the dried remains of his material form
    pour from his rent armour and are scattered to all winds of the battlefield.
    After this, only the most powerful sorcerers could re-collect this dust,
    reseal the armour, and through a complicated ritual reanimate the Rubric
    Marine to a new "life". The sorcery required for this deed are very
    dangerous and just one syllable misspelled could drive the Sorcerer insane -
    or kill him outright.</p>
