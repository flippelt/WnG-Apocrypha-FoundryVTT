  notes: >-
    <p><span class="fontstyle0"><strong>Value</strong>: </span><span
    class="fontstyle2">4 Uncommon</span> <br style=" font-style: normal;
    font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px;
    "></p><p><span class="fontstyle0">The servitors known as Cherubim are of
    uncertain origin, but they are one of the few permitted examples of such
    bio-sculpted homunculi allowed within the Imperium. Taking the form most
    commonly resembling that of somewhat corpulent and unwholesome looking
    genderless children, they are also often implanted with augmetic feathery
    wings (and a grav generator) allowing limited flight. Cherubim are not truly
    alive at all and their synthesised, bloodless and waxen flesh needs neither
    to eat nor sleep and is fed from their internal power-cell. They are
    controlled by an augmented cortex and nervous system usually harvested from
    some lesser creature such as a simian, bird, swine or felid, and implanted
    with a set of programmed commands that allows them to perform some simple
    task such as copying text, fetching and carrying small items or tirelessly
    singing the Emperor’s praises with augmetic vocal
    cords.</span></p><p></p><p><span class="fontstyle0">Outside the rarefied
    noble houses and Imperial hierarchy (most notably the Ecclesiarchy) where
    they are used, most citizens view Cherubim with a degree of distaste and
    superstitious fear. This is not entirely without cause as it is a matter of
    record that in rare instances Cherubim have been known to “devolve” allowing
    some corrupted and mangled version of their organic cortex to take over
    their behaviour with unpleasant consequences.</span></p><p></p><p><span
    class="fontstyle0">These servitors are not purely functional in nature as
    their small chubby appearances are not suited for combat, maintenance,
    labour or any other such tasks. Their role was determined by the adept
    involved in their creation. Purposefully built as symbols of purity, they
    also serve as a form of decoration.</span></p><p></p><p><span
    class="fontstyle0">Though not suited for combat roles, there are other more
    subtle tasks that a Cherub can be suited for such as spying, bearing weapons
    or equipment, being sycophants to their master and singing devotional hymns.
    Others possess integrated power generators allowing them to protect their
    master with an energy shield or anti-psychic equipment of use against
    psykers.</span> <br style=" font-style: normal; font-variant: normal;
    font-weight: normal; letter-spacing: normal; line-height: normal; orphans:
    2; text-align: -webkit-auto; text-indent: 0px; text-transform: none;
    white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-size-adjust:
    auto; -webkit-text-stroke-width: 0px; "></p>
