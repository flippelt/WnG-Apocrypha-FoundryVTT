  notes: >-
    <p><strong>Value</strong>: 5 Rare</p><p><span class="fontstyle0">Although
    most commonly employed by the Arbites, Grapplehawks are also used by some
    bounty hunters, Rogue Traders, Adeptus Mechanicus Magi, and the Pursuer
    Squads of the Anathema Psykana.</span></p><p></p><p><span
    class="fontstyle0">Grapplehawks are technically a type of servitor and take
    the form of elegant shining steel hawks. Their glittering crania contain the
    transplanted instincts of avians trained to seize moving targets without
    damaging them. These instincts, transferred to mechanical constructs fitted
    with powerful suspensors and talons capable of tearing through cast-iron,
    enable handlers to detain suspects quickly (if brutally) on the streets of
    hive cities or wherever their prey may run.</span> <br style=" font-style:
    normal; font-variant: normal; font-weight: normal; letter-spacing: normal;
    line-height: normal; orphans: 2; text-align: -webkit-auto; text-indent: 0px;
    text-transform: none; white-space: normal; widows: 2; word-spacing: 0px;
    -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px; "></p>
