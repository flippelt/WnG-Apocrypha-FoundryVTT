  notes: >-
    <p><strong>Value</strong>: 5 Rare</p><p>A Gyrinx resembles a large cat, with
    very thick and fluffy ginger or orange fur and bright blue eyes. They can
    grow to as much as a metre in length. Gyrinx are not intelligent as such,
    but they have an astounding ability to empathize with other creatures,
    forming a mental bond with their owner which is comparable to true
    friendship. This bond is of great benefit to the creature's owner, whose own
    speed of thought and action are actually improved while the Gyrinx is in
    close proximity. What benefit the Gyrinx obtains from the relationship is
    unclear, but there is plainly some deepseated need being fulfilled, because
    an owner-less Gyrinx will actively seek out and adopt another creature.
    Oddly enough, Gyrinx show a slow metabolic change so that they can come to
    resemble their owner physically, temperamentally and in habit.</p>
