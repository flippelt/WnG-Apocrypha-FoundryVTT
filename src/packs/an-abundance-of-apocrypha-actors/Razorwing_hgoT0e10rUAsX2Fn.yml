  notes: >-
    <p><strong>Value</strong>: 4 Uncommon</p><p>Razorwings are large birds of
    prey with a wingspan of nearly thirteen feet. They drift along on thermal
    currents until they have a prey in sight, at which point they dive with such
    speeds that escape is impossible. Though usually just considered a bird of
    prey, they have been observed utilizing great intelligence and military
    tactics while hunting. Such is their rumored intelligence that some have
    claimed they can set races against one another and communicate. Razorwings
    have an insatiable hunger for bone and are incredibly swift. They attack in
    flocks, surrounding their prey in a deadly hurricane of knife-like feathers
    and razor-sharp beaks that strip their victim's flesh from their bones.</p>
