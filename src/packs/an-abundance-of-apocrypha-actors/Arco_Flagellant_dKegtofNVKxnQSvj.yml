  notes: >-
    <p><strong>Value</strong>: 4 Uncommon</p><p>For those heretics found guilty
    of heresies of insufficient severity to warrant immediate execution, there
    is another fate in store: arco-flagellation. An arco-flagellant undergoes an
    extended program of surgical modification, including muscle grafts, combat
    drug injections, and cybernetically implanted weaponry. At the same time,
    the subject’s mind is reconditioned to turn him into a berserk killing
    machine who seeks only to destroy enemies of the
    Emperor.</p><p></p><p>Normally, an arco-flagellant is kept calm through the
    use of a sealed pacifier helmet. The helmet floods the arco-flagellant’s
    senses with sacred images and songs, which renders the arco-flagellant
    virtually unresponsive to outside stimuli. However, once the proper
    activation word is given, the sensory input stops and a cocktail of combat
    drugs and stimulants are pumped in the arco-flagellant’s body, turning the
    once passive cyborg into a frightening and fearless combatant that exists
    only to destroy everything it sees. The use of a deactivation word will
    cause the arco-flagellant to shut down and resume its passive state.<br></p>
