  notes: >-
    <p><strong>Value</strong>: 4 Uncommon</p><p>A species of avian
    raptor—hunting bird—found on Aeldari worlds and bred in captivity on
    Asuryani craftworlds and Anhrathe vessels alike, Faolchú are named for the
    great falcon of Aeldari myth, who bore the sword Anaris from Vaul to the
    hero Eldanesh, that he might defend the Aeldari people from Khaine’s fury.
    These birds are commonly kept as pets and hunting animals by Aeldari, and
    some Anhrathe carry their Faolchú into battle to serve as scouts. The innate
    psychic abilities of the Aeldari allow them to form close bonds with their
    animal companions, without the clumsy augmetic devices used by humans, or
    the brutal ‘discipline’ of Orks.</p>
