  notes: >-
    <p><strong>Value</strong>: 6 Very Rare</p><p>The massive Fenrisian Wolf is a
    fearsome semi-sentient predator and an enduring symbol of the Space Wolves
    Space Marine Chapter's frozen homeworld of Fenris.</p><p>The Space Wolves,
    in the ancient tradition of their Primarch Leman Russ, often befriend and
    train Fenrisian Wolves (in so much as such a feral being can truly be
    trained). Fenrisian Wolves will fight ferociously beside their master
    against his foes.</p><p>Fenrisian Wolves are simple, brutal beasts, loyal
    only to their master and remorseless against their enemies. As a follower, a
    Fenrisian Wolf will trail behind the battle brother wherever he goes,
    whining if forced to stay behind, and attack his enemies with a gesture or a
    word.</p><p>Fenrisian Wolves aid Space Wolves in numerous ways during
    battle. Their speed makes them a great flanking unit with which to harry the
    Space Wolves' enemies and pick off smaller units. They are also used as a
    fastmoving distraction to the main battleline, leaving the Space Wolves'
    opponents guessing at their next move. They will also stay by the side of
    the battle-brother if he falls, protecting his body and maybe even pulling
    him to safety.<br></p>
