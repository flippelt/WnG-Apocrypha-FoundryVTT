items:
  - _id: rV0yq8cwemTZjAZl
    name: SPACE WOLVES
    type: keyword
    img: modules/wng-core/assets/factions/adeptus-astartes.svg
    effects: []
    flags:
      wng-core:
        initialization-folder: Chapters
        sort: 0
      core:
        sourceId: Compendium.wng-core.items.Item.NJkVGpye6Oz4SZ62
    system:
      description: "<p>Courageous and savage, the Space Wolves embrace the bold and brash warrior traditions of their homeworld Fenris. Inheriting the fierce charisma and aggressive mindset of their Primarch Leman Russ, the Space Wolves place great value in their ritualistic traditions, hunting glory in battle to build a heroic legacy. Though utterly loyal to the Imperium they have little taste for its conservative strictures, preferring the feral practices of their icy homeworld.\_</p><h4>Hunters Unleashed</h4><p>The Chapters kinship with wolves extends to enhanced senses and an almost feral fighting style replete with savage grace.\_</p><p>You have the @UUID[Compendium.wng-core.items.AXqKMwrgsKMdohOw]{Acute Sense} Talent and the @UUID[Compendium.wng-core.items.aX9bq2t854Kb7L0i]{Dual Wield} Talent.\_</p><h4>Savage Within (Gene-seed)</h4><p>Headstrong in their pursuit of valour, Space Wolves do not back down from death in glorious melee combat.\_</p><p>You cannot @UUID[JournalEntry.FWVnJvg0Gy7IMzO7.JournalEntryPage.7bbKOHV6ZpMmidxi#fall-back]{Fall Back}.\_</p><p>\_</p>"
