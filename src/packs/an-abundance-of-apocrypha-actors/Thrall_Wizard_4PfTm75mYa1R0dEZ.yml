      description: "<p>You are a Psyker, capable of channeling the raw energies of the Warp. If you have this Keyword, you:\_</p><ul><li>Know the @UUID[JournalEntry.PA2r8GQau2kyGwCO.JournalEntryPage.a3kO9CDWpBUWHtEr#universal-psychic-discipline]{Universal Psyker Abilities}.</li><li>Can spend XP to learn psychic powers.</li><li>Can spend XP to improve your Psychic Mastery Skill.</li></ul><p>None truly know how an individual becomes a Psyker. Some are born with this twisted gift, others are cursed through exposure to the Warp. Becoming a Psyker will dramatically change your character, making them a powerful, feared, and potentially illegal citizen of the Imperium. Talk to your GM and your group before choosing this Keyword.</p>"
