    <p><strong>Value</strong>: 5 Uncommon</p><p>A Thrall Wizard is a human
    servant of Tzeentch who serves a Heretic Astartes Sorcerer. Many of them
    serve the Thousand Sons Legion, drawn from the mortal population of the
    Planet of the Sorcerers, but it is rare to encounter a Chaos Sorcerer who
    does not aspire to have minions and thralls to serve their whims.</p>
