  notes: >-
    <p><span class="fontstyle0"><strong>Value</strong>: </span><span
    class="fontstyle2">4 Uncommon</span> </p><p><span
    class="fontstyle0">Cyber-Altered Task units ("CATs") are mechanical drones
    designed to perform simple tasks, like inorganic servitors. Programmed with
    a set of very simple instructions, they are occasionally used by the Adeptus
    Mechanicus, the Imperial Navy, and even some chapters of the Adeptus
    Astartes as remote probes and retrieval units. Though they do not possess
    any biological components, their extremely limited programming prevents them
    from being classified as examples of Abominable
    Intelligence.</span></p><p></p><p><span class="fontstyle0">The drones
    utilise a simple short-ranged Vox transceiver which receives instructions
    from the user and relays data and pict-captures back to the user’s control
    unit. The drone’s ability to traverse environments independently is limited
    and relies more on simple trial-and-error than problem-solving
    ability.</span></p><p></p><p><span class="fontstyle0">CATs have been in
    service across the Imperium for millennia, though their utility is limited
    compared to even a simple monotask servitor. Nevertheless, constructing CATs
    is a popular activity for Mechanicus Adepts and Techmarines, who claim that
    the activity is a useful meditative exercise, and CATs are frequently
    underfoot at any shrine to the Omnissiah, performing simple tasks for their
    masters and creators. In fact, some suspicious members of the Inquisition
    have observed that their creators seem to treat their CATs almost like pets,
    though the Mechanicum claims to be above such emotional attachments.</span>
    <br style=" font-style: normal; font-variant: normal; font-weight: normal;
    letter-spacing: normal; line-height: normal; orphans: 2; text-align:
    -webkit-auto; text-indent: 0px; text-transform: none; white-space: normal;
    widows: 2; word-spacing: 0px; -webkit-text-size-adjust: auto;
    -webkit-text-stroke-width: 0px; "></p>
