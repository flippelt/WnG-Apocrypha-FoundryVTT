    system:
      quantity: 1
      rarity: rare
      description: >-
        <p><span class="fontstyle0">Derived from the same principles, and even
        the same STC designs as Imperial bolt weaponry, the Leagues of Votann
        have a distinct pattern of boltguns, bolt pistols, and combi-bolters.
        Autoch-pattern weapons are comparable to Imperial bolt weapons in most
        regards, but better made, constructed of superior materials, and have
        been refined over countless millennia of careful innovation. The
        greatest improvement is the fitting of a HunTR module, an advanced
        targeting system applied to most Leagues of Votann weaponry, providing
        haptic feedback and grav-pulse adjustments on every shot, ensuring that
        the weapon is stable and steady for every shot.</span> <br style="
